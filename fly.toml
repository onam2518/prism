# fly.toml · Prism 상시 서버(Fly.io) 구성
# 원칙(HANDOFF 2026-07-06): 학습 반영 스케줄러가 상시 돌아야 하므로 머신을 재우지 않는다.
# 배포: fly deploy · 검증: curl https://prism-item.fly.dev/config (backend supabase · configured true)

app = 'prism-item'
primary_region = 'nrt'            # 도쿄(한국 팀 지연 최소) · 생성 기본값 iad 에서 교정

[build]

[env]
  PRISM_CONFIG = '/data/config.json'   # 컨테이너 재시작에도 설정(퀘스트 일시 등) 보존
  PRISM_BACKEND = 'supabase'           # 운영 백엔드 강제: 시크릿 유실 시 조용한 sqlite 폴백 대신 시작 실패(main sys.exit → 머신 unhealthy)

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8765              # serve 기본 포트(Dockerfile EXPOSE 와 일치 · 8080이면 502)
  force_https = true
  auto_stop_machines = 'off'        # 스케줄러 상시 필요: 머신 수면 금지
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  # 헬스체크: /config(공개 GET)가 200 이어야 정상. 백엔드 미가용이면 main 이 종료 → 머신 unhealthy 로
  # 감지되고 이전 릴리스가 유지된다(장애 배포 무중단 롤백 · 2026-07-15 장애 재발방지).
  [[http_service.checks]]
    interval = '15s'
    timeout = '4s'
    grace_period = '30s'          # 부팅(supabase 연결확인·스케줄러 시작) 여유 · 오탐 배포실패 방지
    method = 'GET'
    path = '/config'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
