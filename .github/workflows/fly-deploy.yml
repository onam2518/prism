# main 머지 = 배포: 테스트 통과 시에만 Fly.io(prism-item)로 자동 배포.
# 로컬 세션의 수동 배포를 대체한다(CLAUDE.md 규칙 5의 기계 강제).
# 사전 조건: 저장소 Secret FLY_API_TOKEN (fly tokens create deploy -a prism-item)
name: Fly Deploy

on:
  push:
    branches: [main]
    paths-ignore:            # 문서만 바뀐 머지는 배포 생략(런타임 무관)
      - "**.md"
      - "docs/**"
  workflow_dispatch: {}      # 필요 시 Actions 탭에서 수동 배포(문서 생략분 포함)

concurrency:
  group: fly-deploy          # 머지가 몰려도 배포는 순차(경합 방지)
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 전체 테스트 (의존성 0 · stdlib unittest)
        run: python3 -m unittest discover tests

  deploy:
    needs: test              # 테스트 실패 시 배포 중단
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 실행 중 배치 대기 (최대 10분 · 배포가 배치를 끊지 않게)
        # 공개 /config 의 ingesting 플래그로 판정한다. (구: /ingest-status 는 supabase 모드에서
        # 401 이라 curl -sf 가 빈값 → 항상 '배치 없음' 오판 → 큐 보호가 무력화됐음 · 2026-07-16 수정)
        run: |
          failures=0
          for i in $(seq 1 40); do
            if ! response=$(curl -fs --max-time 10 https://prism-item.fly.dev/config); then
              failures=$((failures + 1))
              echo "::warning::배포 전 /config HTTP 조회 실패 · 제한 재시도 ($failures/3)"
            else
              state=$(printf '%s' "$response" | python3 scripts/deploy_checks.py ingesting)
              case "$state" in
                idle)
                  echo "실행 중 배치 없음 → 배포 진행"
                  exit 0
                  ;;
                busy)
                  failures=0
                  echo "배치 실행 중 · 15초 후 재확인 ($i/40)"
                  sleep 15
                  continue
                  ;;
                *)
                  failures=$((failures + 1))
                  echo "::warning::배포 전 /config 응답이 유효하지 않음 · 제한 재시도 ($failures/3)"
                  ;;
              esac
            fi
            if [ "$failures" -ge 3 ]; then
              echo "::error::배포 전 /config 조회를 3회 연속 확인하지 못해 배포를 중단합니다"
              exit 1
            fi
            sleep 15
          done
          echo "::error::10분을 기다려도 배치가 끝나지 않아 배포를 중단합니다 · 배치 종료 후 Actions 탭에서 이 워크플로를 재실행하세요"
          exit 1
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Fly.io 배포 (원격 빌더)
        # BUILD_NO = 이 워크플로 누적 실행 번호 → 앱 버전 v1.N (수동 관리 없는 단조 증가)
        run: flyctl deploy --remote-only --config fly.toml --build-arg BUILD_NO=${{ github.run_number }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: 배포 사후 검증 (/config · backend supabase · configured true)
        run: |
          expected_build="v1.${{ github.run_number }}"
          for i in $(seq 1 12); do
            sleep 10
            if ! response=$(curl -fs --max-time 10 https://prism-item.fly.dev/config); then
              echo "::warning::배포 후 /config HTTP 조회 실패 · 검증 대기 ($i/12)"
              continue
            fi
            if printf '%s' "$response" | python3 scripts/deploy_checks.py deployment "$expected_build"; then
              echo "배포 검증 통과: build=$expected_build · forcedMock=false · backend=supabase · configured=true"
              exit 0
            fi
            echo "검증 대기 ($i/12) · 목표 빌드가 아직 준비되지 않음"
          done
          echo "::error::배포 후 /config 검증 실패(목표 build·forcedMock=false·backend supabase·configured true 아님) · 백엔드 확인"
          exit 1
