name: tests
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.8 = README 최소 지원 버전(하한 검증) · 3.12 = 운영 기준
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run stdlib unit tests (dependency-0)
        run: python -m unittest discover -s tests -v
      - name: pyflakes lint
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install --quiet pyflakes
          python -m pyflakes prism/ scripts/make_demo.py
