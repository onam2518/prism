name: tests
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run stdlib unit tests (dependency-0)
        run: python -m unittest discover -s tests -v
      - name: pyflakes lint
        run: |
          python -m pip install --quiet pyflakes
          python -m pyflakes prism/ scripts/make_demo.py
