name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 의존성 0: 표준 라이브러리만 사용 · pytest 는 러너 실행기로만 설치
      - run: pip install pytest
      # node 는 러너 기본 제공 → 데모 인라인 JS 구문 회귀(test_demo_js)도 함께 실행
      - run: python -m pytest tests/ -q
