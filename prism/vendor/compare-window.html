<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>모델 비교 · 백그라운드 큐</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/vendor/app-bundle.css">
<link rel="icon" href="/vendor/prism-favicon.svg">
<style>
  /* 프리즘 디자인 시스템(app-bundle.css) 위에 이 창만의 배치 몇 줄 */
  .cw-wrap{max-width:920px;margin:0 auto;padding:18px 20px 32px;display:grid;gap:14px}
  .cw-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .cw-top .meta{margin-left:auto}
  .cw-row{display:grid;grid-template-columns:minmax(160px,220px) 1fr 96px 64px;gap:12px;align-items:center;padding:7px 0;border-top:1px solid var(--ds-hairline-soft)}
  .cw-row:first-of-type{border-top:0}
  .cw-row .ds-progress__track{height:8px}
  .cw-empty{padding:34px 0;text-align:center}
  .cw-actions{margin-left:auto;display:flex;gap:6px}
  .cw-res{margin-top:12px}
</style></head><body>
<div class="cw-wrap">
  <div class="cw-top">
    <span class="ds-badge ds-badge--intent">백그라운드 큐</span><b style="font-size:16px">모델 비교 진척</b>
    <span class="meta text-xs text-muted" id="hint">이 창은 닫아도 비교는 계속 돕니다 · 2초마다 갱신</span>
  </div>
  <div id="list"><div class="panel"><div class="panel-bd cw-empty text-muted">불러오는 중…</div></div></div>
</div>
<script>
(function () {
  var focusId = parseInt(new URLSearchParams(location.search).get('id') || '0', 10);
  var opened = {}, results = {}, lastRunning = null;
  function tok() { try { return localStorage.getItem('prism_token') || ''; } catch (e) { return ''; } }
  function get(p) { return fetch(p, { headers: tok() ? { Authorization: 'Bearer ' + tok() } : {} }).then(function (r) { return r.json(); }); }
  function pct(v) { return v == null ? '·' : Math.round(v * 100) + '%'; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function when(ts) { var d = new Date(ts * 1000); return (d.getMonth() + 1) + '.' + d.getDate() + ' ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  function dur(a, b) { var s = Math.max(0, Math.round((b || Date.now() / 1000) - a)); return s < 60 ? s + '초' : Math.floor(s / 60) + '분 ' + (s % 60) + '초'; }
  function stName(s) { return { queued: '대기', running: '실행 중', done: '완료', failed: '실패', budget_stop: '예산 중단' }[s] || s; }
  function stBadge(s) { return { queued: 'ds-badge--neutral', running: 'ds-badge--intent', done: 'ds-badge--success', failed: 'ds-badge--error', budget_stop: 'ds-badge--warning' }[s] || 'ds-badge--neutral'; }
  function fillCls(s) { return s === 'done' ? 'ds-progress__fill--success' : s === 'failed' ? 'ds-progress__fill--error' : 'ds-progress__fill--primary'; }
  function resultTable(r) {
    var h = '<div class="cw-res overflow-auto"><table class="ds-table"><thead><tr><th>모델</th><th>종합</th><th>게이트</th><th>등급</th><th>인텐트</th><th>카테고리</th><th>엔티티</th><th>리드문</th><th>비용($)</th><th>보통 속도</th></tr></thead><tbody>';
    (r.models || []).forEach(function (m) {
      h += '<tr><td>' + (m.model === r.best ? '<span class="ds-badge ds-badge--success">★ best</span> ' : '') + '<b>' + esc(m.model) + '</b></td>'
        + '<td class="tnum"><b>' + pct(m.overall) + '</b></td><td><span class="ds-badge ' + (m.passed ? 'ds-badge--success' : 'ds-badge--warning') + '">' + (m.passed ? '통과' : '미달 ' + (m.gate_fails || []).length) + '</span></td>'
        + '<td class="tnum">' + pct(m.grade_accuracy) + '</td><td class="tnum">' + (m.intent_n ? pct(m.intent_f1) : '·') + '</td>'
        + '<td class="tnum">' + (m.cat_n ? pct(m.cat_hf1) : '·') + '</td><td class="tnum">' + (m.ent_n ? pct(m.ent_f1) : '·') + '</td>'
        + '<td class="tnum">' + (m.summary_n ? pct(m.summary_sim) : '·') + '</td>'
        + '<td class="tnum">' + (m.cost_usd != null ? ('$' + Math.round(m.cost_usd * 10000) / 10000) : '·') + '</td>'
        + '<td class="tnum">' + (m.latency_p50_ms != null ? (m.latency_p50_ms >= 1000 ? (Math.round(m.latency_p50_ms / 100) / 10) + '초' : Math.round(m.latency_p50_ms) + 'ms') : '·') + '</td></tr>';
    });
    h += '</tbody></table></div><div class="text-xs text-muted" style="margin-top:8px">정답 ' + r.golden_n + '건 · 하나라도 틀린 건 ' + (r.miss_n || 0) + ' · 모델끼리 갈린 건 ' + (r.split_n || 0)
      + (r.cheapest_passing ? ' · 합격 최저 비용 <b>' + esc(r.cheapest_passing) + '</b>' : '') + ' · 건별 비교표와 개선 루프는 메인 화면에서 봅니다</div>';
    return h;
  }
  function render(jobs) {
    var el = document.getElementById('list');
    if (!jobs.length) { el.innerHTML = '<div class="panel"><div class="panel-bd cw-empty text-muted">진행 중이거나 최근에 끝난 비교가 없습니다 · 메인 화면 › 평가 › 모델별 비교에서 시작합니다</div></div>'; return; }
    el.innerHTML = jobs.map(function (j) {
      var ms = Object.keys(j.models);
      var doneN = ms.filter(function (m) { return j.models[m].status === 'done'; }).length;
      var h = '<section class="panel"><div class="panel-hd"><b>#' + j.id + '</b><span class="ds-badge ' + stBadge(j.status) + '">' + stName(j.status) + '</span>'
        + '<span class="meta">' + when(j.ts) + ' · 정답 ' + j.golden_n + '건 · ' + (j.scope === 'eval' ? '평가용 홀드아웃' : '전체') + ' · 모델 ' + doneN + '/' + ms.length + ' 완료 · ' + (j.status === 'running' ? '경과 ' : '소요 ') + dur(j.ts, j.finished) + '</span>';
      if (j.status === 'done' || j.status === 'budget_stop') h += '<span class="cw-actions"><button type="button" class="ds-btn ds-btn--primary ds-btn--s-sm" data-open="' + j.id + '">' + (opened[j.id] ? '결과 접기' : '결과 보기') + '</button><button type="button" class="ds-btn ds-btn--secondary ds-btn--s-sm" data-main="' + j.id + '">메인 화면에서 자세히</button></span>';
      if (j.status === 'failed') h += '<span class="cw-actions text-xs text-muted">' + esc(j.error) + '</span>';
      h += '</div><div class="panel-bd">';
      if (j.spent_usd != null) h += '<p class="text-xs text-muted">' + (j.budget_stop ? '예산 중단 · 부분 결과 · 모델 추천 보류 · ' : '') + '비용 $' + esc(j.spent_usd) + ' · 미실행 ' + esc(j.budget_skipped || 0) + '건(모델×콘텐츠)</p>';
      ms.forEach(function (m) {
        var p = j.models[m]; var w = p.total ? Math.max(p.done / p.total * 100, p.status === 'queued' ? 0 : 2) : 0;
        h += '<div class="cw-row"><span title="' + esc(p.route || '') + '"><b>' + esc(m) + '</b><div class="text-xs text-muted">' + esc(p.route || '') + '</div></span>'
          + '<div class="ds-progress"><div class="ds-progress__track"><div class="ds-progress__fill ' + fillCls(p.status) + '" style="width:' + w + '%"></div></div></div>'
          + '<span class="tnum" style="text-align:right">' + p.done + ' / ' + p.total + '</span><span class="ds-badge ' + stBadge(p.status) + '">' + stName(p.status) + '</span></div>';
      });
      (j.skipped || []).forEach(function (s) { h += '<div class="text-xs text-muted" style="margin-top:6px">비교 제외: ' + esc(s.model) + ' (' + esc(s.reason) + ')</div>'; });
      if (opened[j.id] && results[j.id]) h += resultTable(results[j.id]);
      return h + '</div></section>';
    }).join('');
    el.querySelectorAll('[data-open]').forEach(function (b) { b.onclick = function () { var id = +b.dataset.open; opened[id] = !opened[id]; if (opened[id] && !results[id]) load(id).then(tick); else tick(); }; });
    el.querySelectorAll('[data-main]').forEach(function (b) { b.onclick = function () {
      try { if (window.opener && !window.opener.closed) { window.opener.postMessage({ type: 'prism-compare-done', id: +b.dataset.main }, location.origin); window.opener.focus(); return; } } catch (e) {}
      window.open('/', '_blank');
    }; });
  }
  function load(id) { return get('/compare-status?id=' + id).then(function (r) { if (r.ok && r.job && r.job.result) results[id] = r.job.result; }); }
  function tick() {
    get('/compare-jobs').then(function (r) {
      if (!r.ok) { document.getElementById('list').innerHTML = '<div class="panel"><div class="panel-bd cw-empty text-muted">' + esc(r.error || '불러오지 못했습니다 · 메인 화면에 로그인돼 있어야 합니다') + '</div></div>'; return; }
      var jobs = r.jobs || [];
      var running = jobs.some(function (j) { return j.status === 'running'; });
      var f = jobs.find(function (j) { return j.id === focusId; });
      if (f && (f.status === 'done' || f.status === 'budget_stop') && (lastRunning === null || lastRunning) && opened[focusId] == null) opened[focusId] = true;   // 지켜보던 잡이 끝나면 결과를 바로 펼친다
      var pending = jobs.filter(function (j) { return (j.status === 'done' || j.status === 'budget_stop') && opened[j.id] && !results[j.id]; }).map(function (j) { return load(j.id); });
      Promise.all(pending).then(function () { render(jobs); });
      lastRunning = running;
      document.getElementById('hint').textContent = running ? '이 창은 닫아도 비교는 계속 돕니다 · 2초마다 갱신 · 막대는 8건마다 움직입니다' : '진행 중인 비교 없음 · 새 비교는 메인 화면에서 시작합니다';
    }).catch(function () {});
  }
  tick(); setInterval(tick, 2000);
})();
</script></body></html>
