<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>모델 비교 · 백그라운드 큐</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body{margin:0;font:14px/1.5 -apple-system,"Pretendard",system-ui,sans-serif;color:#1c1c1e;background:#f6f7f9}
  header{padding:14px 18px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:10px}
  header b{font-size:15px} header .muted{color:#6b7280;font-size:12px;margin-left:auto}
  main{padding:14px 18px;display:grid;gap:12px}
  .job{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:12px 14px}
  .job__hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .badge{font-size:11px;padding:2px 8px;border-radius:999px;background:#eef0f3;color:#374151}
  .badge.run{background:#e0ecff;color:#1d4ed8}.badge.done{background:#dcfce7;color:#166534}.badge.fail{background:#fee2e2;color:#991b1b}
  .m{display:grid;grid-template-columns:200px 1fr 90px 70px;gap:10px;align-items:center;margin-top:8px;font-size:13px}
  .track{height:8px;background:#eef0f3;border-radius:999px;overflow:hidden}.fill{height:100%;background:#2563eb;transition:width .4s}
  .fill.done{background:#16a34a}.fill.fail{background:#dc2626}
  .num{font-variant-numeric:tabular-nums;color:#374151;text-align:right}
  button{font:inherit;font-size:12px;padding:5px 10px;border-radius:7px;border:1px solid #d1d5db;background:#fff;cursor:pointer}
  button.primary{background:#2563eb;border-color:#2563eb;color:#fff} button:disabled{opacity:.5;cursor:default}
  table{border-collapse:collapse;width:100%;margin-top:10px;font-size:12px}th,td{padding:6px 8px;border-bottom:1px solid #eef0f3;text-align:left;white-space:nowrap}
  th{color:#6b7280;font-weight:600} td.num{text-align:right} .best{color:#166534;font-weight:700}
  .muted{color:#6b7280;font-size:12px} .empty{padding:30px;text-align:center;color:#6b7280}
</style></head><body>
<header><b>모델 비교 · 백그라운드 큐</b><span class="muted" id="hint">이 창은 닫아도 비교는 계속 돕니다 · 2초마다 갱신</span></header>
<main id="list"><div class="empty">불러오는 중…</div></main>
<script>
(function () {
  var focusId = parseInt(new URLSearchParams(location.search).get('id') || '0', 10);
  var opened = {};                                    // 결과를 펼친 잡 id
  var results = {};                                   // id → result(완료분 캐시)
  function tok() { try { return localStorage.getItem('prism_token') || ''; } catch (e) { return ''; } }
  function get(p) { return fetch(p, { headers: tok() ? { Authorization: 'Bearer ' + tok() } : {} }).then(function (r) { return r.json(); }); }
  function pct(v) { return v == null ? '·' : Math.round(v * 100) + '%'; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function when(ts) { var d = new Date(ts * 1000); return (d.getMonth() + 1) + '.' + d.getDate() + ' ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  function stName(s) { return { queued: '대기', running: '실행 중', done: '완료', failed: '실패' }[s] || s; }
  function resultTable(r) {
    var h = '<table><thead><tr><th>모델</th><th>종합</th><th>게이트</th><th>등급</th><th>인텐트</th><th>카테고리</th><th>엔티티</th><th>리드문</th><th>비용($)</th><th>p50</th></tr></thead><tbody>';
    (r.models || []).forEach(function (m) {
      h += '<tr><td class="' + (m.model === r.best ? 'best' : '') + '">' + (m.model === r.best ? '★ ' : '') + esc(m.model) + '</td>'
        + '<td class="num">' + pct(m.overall) + '</td><td>' + (m.passed ? '통과' : '미달 ' + (m.gate_fails || []).length) + '</td>'
        + '<td class="num">' + pct(m.grade_accuracy) + '</td><td class="num">' + (m.intent_n ? pct(m.intent_f1) : '·') + '</td>'
        + '<td class="num">' + (m.cat_n ? pct(m.cat_hf1) : '·') + '</td><td class="num">' + (m.ent_n ? pct(m.ent_f1) : '·') + '</td>'
        + '<td class="num">' + (m.summary_n ? pct(m.summary_sim) : '·') + '</td>'
        + '<td class="num">' + (m.cost_usd != null ? (Math.round(m.cost_usd * 10000) / 10000) : '·') + '</td>'
        + '<td class="num">' + (m.latency_p50_ms != null ? Math.round(m.latency_p50_ms) + 'ms' : '·') + '</td></tr>';
    });
    h += '</tbody></table><div class="muted" style="margin-top:6px">정답 ' + r.golden_n + '건 · 하나라도 틀린 건 ' + (r.miss_n || 0) + ' · 모델끼리 갈린 건 ' + (r.split_n || 0)
      + (r.cheapest_passing ? ' · 합격 최저 비용 ' + esc(r.cheapest_passing) : '') + '</div>';
    return h;
  }
  function render(jobs) {
    var el = document.getElementById('list');
    if (!jobs.length) { el.innerHTML = '<div class="empty">진행 중이거나 최근에 끝난 비교가 없습니다</div>'; return; }
    el.innerHTML = jobs.map(function (j) {
      var ms = Object.keys(j.models);
      var doneN = ms.filter(function (m) { return j.models[m].status === 'done'; }).length;
      var h = '<div class="job" id="job' + j.id + '"><div class="job__hd"><b>#' + j.id + '</b><span class="badge ' + (j.status === 'running' ? 'run' : j.status === 'done' ? 'done' : 'fail') + '">' + stName(j.status) + '</span>'
        + '<span class="muted">' + when(j.ts) + ' · 정답 ' + j.golden_n + '건 · ' + (j.scope === 'eval' ? '평가용 홀드아웃' : '전체') + ' · 모델 ' + doneN + '/' + ms.length + ' 완료</span>';
      if (j.status === 'done') h += '<span style="margin-left:auto"><button class="primary" data-open="' + j.id + '">' + (opened[j.id] ? '결과 접기' : '결과 보기') + '</button> <button data-main="' + j.id + '">메인 화면에서 자세히</button></span>';
      if (j.status === 'failed') h += '<span class="muted" style="margin-left:auto">' + esc(j.error) + '</span>';
      h += '</div>';
      ms.forEach(function (m) {
        var p = j.models[m]; var w = p.total ? Math.max(p.done / p.total * 100, p.status === 'queued' ? 0 : 2) : 0;
        h += '<div class="m"><span title="' + esc(p.route || '') + '">' + esc(m) + '</span><div class="track"><div class="fill ' + (p.status === 'done' ? 'done' : p.status === 'failed' ? 'fail' : '') + '" style="width:' + w + '%"></div></div>'
          + '<span class="num">' + p.done + ' / ' + p.total + '</span><span class="muted">' + stName(p.status) + '</span></div>';
      });
      (j.skipped || []).forEach(function (s) { h += '<div class="muted" style="margin-top:4px">제외: ' + esc(s.model) + ' (' + esc(s.reason) + ')</div>'; });
      if (opened[j.id] && results[j.id]) h += resultTable(results[j.id]);
      return h + '</div>';
    }).join('');
    el.querySelectorAll('[data-open]').forEach(function (b) { b.onclick = function () { var id = +b.dataset.open; opened[id] = !opened[id]; if (opened[id] && !results[id]) load(id).then(tick); else tick(); }; });
    el.querySelectorAll('[data-main]').forEach(function (b) { b.onclick = function () {
      try { if (window.opener && !window.opener.closed) { window.opener.postMessage({ type: 'prism-compare-done', id: +b.dataset.main }, location.origin); window.opener.focus(); return; } } catch (e) {}
      window.open('/', '_blank');
    }; });
  }
  function load(id) { return get('/compare-status?id=' + id).then(function (r) { if (r.ok && r.job && r.job.result) results[id] = r.job.result; }); }
  var lastRunning = null;
  function tick() {
    get('/compare-jobs').then(function (r) {
      if (!r.ok) { document.getElementById('list').innerHTML = '<div class="empty">' + esc(r.error || '불러오지 못했습니다 · 메인 화면에 로그인돼 있어야 합니다') + '</div>'; return; }
      var jobs = r.jobs || [];
      var running = jobs.some(function (j) { return j.status === 'running'; });
      if (focusId && !opened[focusId] && lastRunning === null) { var f = jobs.find(function (j) { return j.id === focusId; }); if (f && f.status === 'done') { opened[focusId] = true; } }
      var pending = jobs.filter(function (j) { return j.status === 'done' && opened[j.id] && !results[j.id]; }).map(function (j) { return load(j.id); });
      Promise.all(pending).then(function () { render(jobs); });
      if (lastRunning && !running && focusId) { opened[focusId] = true; }   // 방금 끝난 잡은 결과를 바로 펼친다
      lastRunning = running;
      document.getElementById('hint').textContent = running ? '이 창은 닫아도 비교는 계속 돕니다 · 2초마다 갱신' : '진행 중인 비교 없음 · 새 비교는 메인 화면에서 시작합니다';
    }).catch(function () {});
  }
  tick(); setInterval(tick, 2000);
})();
</script></body></html>
