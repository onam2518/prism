      <!-- ═══ 모듈: 콘텐츠 조회 · 검수 지정 ═══
           사내망 수집기가 올린 발행분(스테이징)을 조건으로 보고, 고른 건만 검수 대상으로 지정한다.
           지정 = 발행 메타를 모델 초안으로 복사 인입(재추출 없음) → 이후 검수 흐름은 기존 그대로.
           지정하지 않은 행은 선택 삭제 또는 TTL(기본 7일) 자동 정리 · 검수 콘텐츠와 분리 저장.
           메타베이스 직접 조회(source=metabase)는 사내망에서 프리즘을 띄운 경우에만 유효. -->
      <template x-if="mod === 'metaq'">
        <div class="w-full" x-init="mqLoad()">

        <!-- 조회 · 지정 -->
        <section class="panel">
          <div class="panel-hd"><b>콘텐츠 조회</b><span class="meta">수집기가 올린 발행분을 조건으로 봅니다 · 고른 건만 검수 대상이 됩니다</span>
            <span class="ml-auto text-xs text-muted tnum" x-show="mqStatus &amp;&amp; mqStatus.staged &gt;= 0" x-cloak
                  x-text="'수집분 ' + mqStatus.staged + '건 · ' + mqStatus.stageTtlDays + '일 뒤 자동 정리'"></span>
            <span class="ds-badge ds-badge--neutral" style="margin-left:8px" x-show="mqStatus &amp;&amp; mqStatus.mock &amp;&amp; mqSource === 'metabase'" x-cloak data-tip="모의 모드 · 예시 데이터로 흐름만 확인" data-tip-pos="top">모의</span>
          </div>
          <div class="panel-bd">
            <div class="filterbar">
              <select class="field" style="width:auto" x-model="mqSource" x-show="mqStatus &amp;&amp; mqStatus.configured" x-cloak data-tip="수집분 = 사내망 수집기가 올린 행(기본) · 메타베이스 직접 = 서버가 호출(사내망에서만)" data-tip-pos="top">
                <option value="stage">수집분</option><option value="metabase">메타베이스 직접</option>
              </select>
              <input class="field" style="width:130px" placeholder="서비스 (예: 뉴스)" x-model="mqService" x-on:keydown.enter="mqSearch()">
              <select class="field" style="width:auto" x-model="mqGrade">
                <option value="">등급 전체</option><option value="G">G</option><option value="R">R</option>
              </select>
              <input class="field" style="width:200px" placeholder="제목·본문 키워드" x-model="mqKeyword" x-on:keydown.enter="mqSearch()">
              <input class="field" style="width:150px" type="date" x-model="mqFrom" data-tip="발행 시작일(포함)" data-tip-pos="top">
              <input class="field" style="width:150px" type="date" x-model="mqTo" data-tip="발행 종료일(미포함)" data-tip-pos="top">
              <button type="button" class="ds-btn ds-btn--primary" style="height:30px;padding:0 16px" x-bind:disabled="mqBusy" x-on:click="mqSearch()" x-text="mqBusy ? '조회 중…' : '조회'"></button>
              <span class="text-xs text-muted tnum" x-show="mqRows.length" x-text="mqRows.length + '건'"></span>
            </div>

            <div class="overflow-auto" style="max-height:52vh" x-show="mqRows.length" x-cloak>
              <table class="ds-table"><thead><tr>
                <th style="width:34px"><input type="checkbox" x-on:change="mqToggleAll()" x-bind:checked="mqSelCount &amp;&amp; mqRows.filter(r =&gt; mqSelectable(r)).every(r =&gt; mqSel[r.hash])" data-tip="전체 선택/해제 (수집분에서는 인입된 행도 삭제용으로 선택 가능)" data-tip-pos="top"></th>
                <th style="width:90px">서비스</th><th>콘텐츠</th><th style="width:52px">등급</th>
                <th style="width:140px">인텐트</th><th style="width:180px">카테고리</th>
                <th style="width:120px">발행</th><th style="width:80px">상태</th>
              </tr></thead><tbody>
                <template x-for="r in mqRows" x-bind:key="r.hash">
                  <tr x-bind:style="r.registered ? 'opacity:.55;cursor:pointer' : 'cursor:pointer'" x-on:click="mqToggle(r)">
                    <td><input type="checkbox" x-bind:checked="!!mqSel[r.hash]" x-bind:disabled="!mqSelectable(r)" x-on:click.stop="mqToggle(r)"></td>
                    <td x-text="r.service"></td>
                    <td><div class="text-ink" style="font-weight:600" x-text="r.title"></div>
                      <div class="text-xs text-muted" style="max-width:520px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" x-text="r.summary || ''"></div></td>
                    <td><span class="ds-badge" x-bind:class="r.grade === 'R' ? 'ds-badge--error' : 'ds-badge--success'" x-text="r.grade || '-'"></span></td>
                    <td class="text-xs" x-text="Array.isArray(r.intent) ? r.intent.join(' · ') : (r.intent || '')"></td>
                    <td class="text-xs" x-text="Array.isArray(r.category) ? r.category.join(' · ') : (r.category || '')"></td>
                    <td class="text-xs text-muted tnum" x-text="(r.published_at || '').slice(0, 16).replace('T', ' ')"></td>
                    <td><span class="ds-badge ds-badge--neutral" x-show="r.registered" data-tip="이미 프리즘에 인입된 콘텐츠 · 다시 지정되지 않습니다" data-tip-pos="top">인입됨</span></td>
                  </tr>
                </template>
              </tbody></table>
            </div>
            <div class="ds-empty" style="border:0;padding:20px 8px" x-show="mqSearched &amp;&amp; !mqRows.length" x-cloak>
              <div class="ds-empty__desc">조건에 맞는 콘텐츠가 없습니다 · 조건을 바꿔 다시 조회해 보세요</div>
            </div>
            <div class="ds-empty" style="border:0;padding:20px 8px" x-show="!mqSearched" x-cloak>
              <div class="ds-empty__desc">조건을 정하고 <b class="text-ink">조회</b>를 누르면 수집기가 올린 발행 콘텐츠가 여기에 나타납니다</div>
            </div>

            <div class="filterbar" style="margin-top:10px" x-show="mqRows.length" x-cloak>
              <button type="button" class="copybtn" x-bind:disabled="mqBusy" x-on:click="mqMore()">더 가져오기</button>
              <button type="button" class="copybtn" x-show="mqSource === 'stage'" x-cloak x-bind:disabled="!mqSelCount || mqBusy" x-on:click="mqDelete()" data-tip="선택한 행을 수집분 목록에서 지웁니다 · 이미 지정된 검수 콘텐츠는 영향 없음" data-tip-pos="top" x-text="'목록에서 삭제' + (mqSelCount ? (' ' + mqSelCount + '건') : '')"></button>
              <span class="ml-auto" style="display:flex;align-items:center;gap:8px">
                <span class="text-xs text-muted tnum" x-text="mqSelCount + '건 선택'"></span>
                <select class="field" style="width:auto" x-model="mqPurpose" data-tip="검수용 = 팀 검수 대상 · 평가용 = 검수에서 빼고 평가 전용 보존" data-tip-pos="top">
                  <option value="review">검수용</option><option value="eval">평가용</option>
                </select>
                <button type="button" class="ds-btn ds-btn--primary" style="height:30px;padding:0 16px" x-bind:disabled="!mqSelCount || mqBusy" x-on:click="mqRegister()" x-text="'검수 대상으로 지정' + (mqSelCount ? (' ' + mqSelCount + '건') : '')"></button>
              </span>
            </div>
            <div class="text-xs" style="margin-top:6px" aria-live="polite" x-text="mqMsg"></div>
            <ul class="ds-bullets" style="margin-top:10px">
              <li>지정하면 콘텐츠와 발행 메타가 프리즘으로 복사되고, 발행 메타가 그대로 모델 초안이 됩니다(다시 추출하지 않음).</li>
              <li>같은 콘텐츠는 두 번 인입되지 않습니다 · 이미 인입된 행은 <b class="text-ink">인입됨</b>으로 표시됩니다.</li>
              <li>수집분은 검수 콘텐츠가 아닙니다 · 지정하지 않은 행은 <b class="text-ink">목록에서 삭제</b>하거나 두면 정리 기한 뒤 자동으로 지워집니다.</li>
            </ul>
          </div>
        </section>

      </div>
      </template>
