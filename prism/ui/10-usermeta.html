                  <div class="flex items-center gap-2" style="border-top:1px solid var(--ds-hairline);margin-top:16px;padding-top:13px;margin-bottom:8px"><b class="text-ink" style="display:inline-flex;align-items:center;gap:8px"><span class="stepline__no">3</span>활용 제안</b></div>

                    <template x-for="(s, si) in (demoData.conclusion.scenarios || [])" x-bind:key="'dsc'+si">

                  <div>
                    <div class="flex flex-wrap gap-1.5">
                      <template x-for="f in (demoData.conclusion.memory.files || [])" x-bind:key="'dmf'+f">

                    <div class="text-xs text-muted" style="margin-top:6px">파일 수정 · 삭제와 주입 미리보기는 [생성 과정] 탭에서 합니다.</div>
                  </div>

                  <div class="text-xs text-muted" style="border-top:1px solid var(--ds-hairline);margin-top:16px;padding-top:11px">운영 정책: 사용자 정보 입력 없이 소비만으로 시작하고, 같은 판정이 운영 행동 로그로 사용자마다 자동 산출됩니다 · 실명 · 연락처 등 식별 정보는 어떤 경로로도 수집 · 기록하지 않습니다.</div>

        <!-- ═══ 생성 과정: 파일 기반 메모리(자동 기록 확인 + 수동 조작 + 주입) ═══ -->
        <div x-show="labUserView==='gen'" x-cloak class="space-y-4" id="user-panel-gen" role="tabpanel" aria-labelledby="user-tab-gen">
          <div class="panel"><div class="panel-hd"><b>생성 과정</b><span class="meta">파일 기반 메모리</span>
              <span class="meta tnum" x-text="memData ? ('파일 ' + memData.files.length + '/' + memData.limits.max_files) : ''"></span>
              <button type="button" class="ds-iconbtn ds-iconbtn--bordered ml-auto" x-on:click="loadMem()" data-tip="새로고침" data-tip-pos="bottom" aria-label="메모리 새로고침"><svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M20 11a8 8 0 1 0-.9 4.5M20 5v6h-6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
            <div class="panel-bd">
              <ul class="ds-bullets hintbox" style="padding:14px 16px;margin-bottom:12px">
                <li><b>생성 1 · 자동 기록</b>: [시연] 탭에서 소비하면 <b>그 턴에</b> <code class="text-violet">/topics/주제.md</code> 파일로 기록됩니다(파일시스템 기반).</li>
                <li><b>생성 2 · 확인 · 조작</b>: 파일을 눌러 읽기 · 전체 쓰기(버전 토큰 확인) · 끝에 추가([stated]) · 삭제(확인 후)를 직접 해봅니다.</li>
                <li><b>생성 3 · 주입</b>: 새 대화가 시작되면 파일 목록이 자동 주입됩니다 · [주입 미리보기]로 실제 블록을 확인하세요.</li>
              </ul>
              <div>
                <div class="flex items-center" style="margin-bottom:6px">
                  <span class="selctl__lbl">생성된 파일</span>
                  <button type="button" class="ds-btn ds-btn--secondary ds-btn--s-sm ml-auto" x-on:click="memInject = !memInject" x-text="memInject ? '주입 미리보기 닫기' : '주입 미리보기'"></button>
                </div>
                <div x-show="memLog.length" class="stack-1" style="margin-bottom:8px">
                  <template x-for="(w, wi) in memLog" x-bind:key="'ml'+wi">
                    <div class="text-xs" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><span x-show="wi===0" class="ds-badge ds-badge--success"><span class="ds-badge__dot"></span>방금</span> <b class="text-ink" x-text="'/' + w.path"></b> <span class="text-muted" x-text="'← ' + w.line"></span></div>
                  </template>
                </div>
                <pre x-show="memInject" class="tbox" style="white-space:pre-wrap;font-size:12px;margin-bottom:8px" x-text="memData ? memData.injection : ''"></pre>
                <div class="text-xs text-muted" x-show="memData && !memData.files.length" style="margin-bottom:8px">현재 이 계정의 메모리는 비어 있는 상태 · [시연] 탭에서 콘텐츠를 소비하거나 아래에서 파일을 만들어 보세요.</div>
                <div class="stack-2" style="max-height:240px;overflow:auto;padding-right:2px">
                  <template x-for="f in ((memData && memData.files) || [])" x-bind:key="'mf'+f.path">
                    <div class="tbox" style="cursor:pointer" x-bind:style="(memSel===f.path ? 'border-color:var(--ds-primary);' : '') + (memFlash===f.path ? 'background:var(--ds-surface);' : '')" x-on:click="memOpen(f.path)">
                      <div class="flex items-center gap-1.5">
                        <b class="text-ink text-sm" x-text="'/' + f.path"></b>
                        <span x-show="memFlash===f.path" class="ds-badge ds-badge--success"><span class="ds-badge__dot"></span>방금 기록됨</span>
                        <span class="meta tnum ml-auto" x-text="'v' + f.ver + ' · ' + f.bytes + 'B'"></span>
                      </div>
                      <div class="text-xs text-muted" x-show="f.desc" x-text="f.desc"></div>
                    </div>
                  </template>
                </div>
                <div class="flex items-center gap-2" style="margin-top:8px">
                  <select aria-label="메모리 유형" x-model="memNew.kind" class="field" style="width:150px">
                    <option value="profile.md">/profile.md</option>
                    <option value="preferences.md">/preferences.md</option>
                    <option value="topics">/topics/…</option>
                    <option value="areas">/areas/…</option>
                    <option value="people">/people/…</option>
                  </select>
                  <input aria-label="메모리 이름" x-model="memNew.name" class="field" style="flex:1;min-width:0" placeholder="이름 (한글·영문·숫자·-_)" x-show="memNew.kind!=='profile.md' && memNew.kind!=='preferences.md'" x-on:keydown.enter="memCreate()">
                  <button type="button" class="ds-btn ds-btn--secondary ds-btn--s-sm" x-bind:disabled="memBusy" x-on:click="memCreate()">새 파일</button>
                </div>
                <div class="text-xs text-muted" style="margin-top:4px" x-show="memMsg" x-text="memMsg"></div>
              </div>
              <!-- 선택 파일 편집기: 읽기 · 전체 쓰기(버전 토큰 검사) · 끝에 추가([stated]) · 삭제(확인 후) -->
              <div x-show="memSel" x-cloak style="margin-top:12px">
                <div class="flex items-center gap-2" style="margin-bottom:6px">
                  <b class="text-ink text-sm" x-text="'/' + memSel"></b>
                  <span class="ds-badge ds-badge--neutral tnum" style="cursor:help" data-tip="버전 토큰 · 저장 시 서버 버전과 일치해야 덮어씁니다 (그 사이 파일이 바뀌었으면 충돌 안내)" data-tip-pos="top" x-text="'버전 v' + memVer"></span>
                  <span class="ml-auto flex items-center gap-1">
                    <button type="button" class="ds-btn ds-btn--primary ds-btn--s-sm" x-bind:disabled="memBusy" x-on:click="memSave()">저장 (전체 쓰기)</button>
                    <button type="button" class="ds-btn ds-btn--outline ds-btn--c-danger ds-btn--s-sm" x-bind:disabled="memBusy" x-on:click="memDelete()">삭제</button>
                    <button type="button" class="ds-btn ds-btn--secondary ds-btn--s-sm" x-on:click="memSel=''">닫기</button>
                  </span>
                </div>
                <textarea aria-label="메모리 내용" x-model="memDraft" class="field" spellcheck="false" style="width:100%;min-height:170px;resize:vertical;font-size:12.5px"></textarea>
                <div class="flex items-center gap-2" style="margin-top:6px">
                  <input aria-label="사용자가 말한 사실" x-model="memLine" class="field" style="flex:1" placeholder="사용자가 직접 말한 사실 한 줄 · [stated] 태그가 자동으로 붙습니다" x-on:keydown.enter="memAppendLine()">
                  <button type="button" class="ds-btn ds-btn--secondary ds-btn--s-sm" x-bind:disabled="memBusy" x-on:click="memAppendLine()">끝에 추가</button>
                </div>
              </div>
              <!-- 설계 명세: 폴더 구조(콘텐츠 사용자 기준) + 파일 형식 · 조작 · 저장 제외 · 한계 -->
              <div style="margin-top:14px">
                <div class="overflow-auto"><table class="ds-table"><thead><tr><th style="width:200px">폴더 구조</th><th>담는 내용</th></tr></thead><tbody>
                  <tr><td><code class="text-violet">/profile.md</code></td><td>연령대 · 주 이용 시간대 등 수개월 후에도 유효한 기본 정보 (실명 · 연락처는 담지 않음)</td></tr>
                  <tr><td><code class="text-violet">/topics/주제.md</code></td><td>관심 주제 · 소비 습관 · 반복 소비 기록 (예: 반도체.md, 야구.md) · 시연이 자동 기록하는 곳</td></tr>
                  <tr><td><code class="text-violet">/areas/이름.md</code></td><td>기간이 있는 관심사 · 따라가는 중인 사건 (예: 이사준비.md, 월드컵.md)</td></tr>
                  <tr><td><code class="text-violet">/people/이름.md</code></td><td>관심 인물 · 팀 · 크리에이터 (예: 손흥민.md)</td></tr>
                  <tr><td><code class="text-violet">/preferences.md</code></td><td>콘텐츠 보기 취향 (심층 / 훑기 · 텍스트 / 영상 · 알림 방식 등)</td></tr>
                </tbody></table></div>
                <div style="margin-top:12px">
                  <div class="drow"><div class="k">파일 형식</div><div class="v text-sm text-body">상단에 메타데이터(파일명 · 한 줄 설명 · 출처 · 별칭)를 두고, 본문은 사용자가 직접 말한 사실만 <code class="text-violet">[stated]</code> 태그로 한 줄씩 기록합니다 · 소비 관찰 자동 기록은 <code class="text-violet">[observed]</code> 태그로 구분합니다(추론 · 검색 결과 · 제안은 저장 대상이 아님).</div></div>
                  <div class="drow"><div class="k">조작 방식</div><div class="v text-sm text-body">읽기 · 전체 쓰기 · 부분 수정 · 끝에 추가 · 삭제 5종 · 삭제는 명시적 요청이 있을 때만 실행하며, 수정 시에는 기존 파일을 먼저 읽고 버전 토큰을 확인한 뒤 덮어씁니다(위 편집기가 그대로 구현).</div></div>
                  <div class="drow"><div class="k">저장 제외</div><div class="v text-sm text-body">건강 정보 · 정치 성향 · 가족 실명 · 주소 · 금융 정보 등 민감 정보는 직접 말해도 기록하지 않습니다.</div></div>
                  <div class="drow"><div class="k">한계</div><div class="v text-sm text-body">텍스트 요약 수준이라 대화 전체 맥락은 보존되지 않음 · 파일당 크기 제한(4,000바이트)이 있어 한도에 닿으면 저장이 거절됨 · 진술을 검증 없이 기록하므로 오래되거나 틀린 정보가 남을 수 있음.</div></div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- ═══ 정책: 이 화면이 실제로 남기는 로그 체계(PAST)와 측정 · 판정 · 기록 정책 ═══ -->
        <div x-show="labUserView==='policy'" x-cloak class="space-y-4" id="user-panel-policy" role="tabpanel" aria-labelledby="user-tab-policy">
          <div class="panel"><div class="panel-hd"><b>로그 체계</b><span class="meta">PAST · 다음 전용 경량 사용자 행동 로그</span></div>
            <div class="panel-bd">
              <ul class="ds-bullets hintbox" style="padding:14px 16px;margin-bottom:12px">
                <li>시연 · 운영의 행동 수집은 <b>PAST</b>(다음 전용 경량 로그 수집 체계 · TIARA 계약 만료 대비 신규 전환 · 총 60필드 12그룹으로 약 78% 축소) 체계를 따릅니다 · 12월 홈탭 · MY 콘텐츠 탭 우선 적용 뒤 점진 확장, TIARA 병행 후 완전 전환.</li>
                <li>아래 표는 이 화면이 <b>실제로 남기는 로그</b>와 PAST 표준(행동 유형 4종 · 표준 행동 분류 16종)의 매핑입니다 · 추후 실사용자 로그도 같은 체계로 들어옵니다.</li>
                <li>자세한 정의는 <a href="https://daumcorp.atlassian.net/wiki/spaces/pplan/pages/335381293" target="_blank" rel="noopener" class="text-violet" style="text-decoration:underline">1. PAST 기획 문서</a>에서 확인하세요.</li>
              </ul>
              <div class="overflow-auto"><table class="ds-table"><thead><tr><th style="width:170px">행동 유형(action_type)</th><th>정의 · 수집 시점</th><th style="width:220px">이 화면에서</th></tr></thead><tbody>
                <tr><td><code class="text-violet">Pageview</code></td><td>사용자가 하나의 화면을 볼 때 · 화면 진입 시 1회(팝업 · 오버레이 제외 · 한 화면 = 조회 1건)</td><td>읽기 화면 · 검색 결과 화면 진입</td></tr>
                <tr><td><code class="text-violet">Event</code></td><td>클릭 · 피드백 등 사용자가 직접 취한 행동 · 발생 시점 기록</td><td>카드 탭 · 검색 · 감정 반응 · 댓글</td></tr>
                <tr><td><code class="text-violet">ViewImp</code></td><td>화면에 <b>실제로 보인</b> 콘텐츠의 노출(예: 영역 50% 이상) · 개별 전송 금지, <code class="text-violet">viewimp_contents[]</code> 로 30개 미만 묶음 전송 → CTR 분모</td><td>시연 단순화: 피드 진입 시 카탈로그 일괄 기록(중복 무시) · 실서비스는 실노출만 집계</td></tr>
                <tr><td><code class="text-violet">Usage</code></td><td>페이지 이탈 시 1회 · <b>체류시간 + 스크롤 도달 비율</b> 동시 전송 · 상한은 개발 검토 항목 ②(10분 vs 3시간) 확정 전 <b>10분 클램프</b> 유지</td><td>읽기 종료 시 체류 · 스크롤 기록(10분 클램프 동일 적용)</td></tr>
              </tbody></table></div>
              <div class="overflow-auto" style="margin-top:12px"><table class="ds-table"><thead><tr><th style="width:190px">시연 행동</th><th style="width:230px">PAST 매핑</th><th>수집 값</th></tr></thead><tbody>
                <tr><td>피드 진입(노출)</td><td>ViewImp</td><td><code class="text-violet">viewimp_contents[].id · type</code>(노출 로그 필수) · 클릭률 · 소비율의 분모로만 사용</td></tr>
                <tr><td>콘텐츠 찾기(프롬프트 검색)</td><td>Event · <code class="text-violet">Search</code> + 결과 화면 Pageview · <code class="text-violet">ViewSearchResults</code></td><td>검색어(<code class="text-violet">search.search_term</code>)는 개인정보 취급 → <b>분리 저장 · 별도 권한</b> · 직접 선언이라 메모리 <code class="text-violet">[stated]</code> 병행 기록</td></tr>
                <tr><td>카드 탭</td><td>Event · <code class="text-violet">ClickContent</code> (+ 읽기 화면 Pageview · <code class="text-violet">ViewContent</code>)</td><td><code class="text-violet">content.id · type</code> 동반 필수 · 이후 해당 콘텐츠 가중 ×2.0 · 부가 정보는 로그가 아닌 아이템 메타 조인</td></tr>
                <tr><td>나가기(읽기 종료)</td><td>Usage · <code class="text-violet">UsagePage</code></td><td><code class="text-violet">usage.duration</code>(체류) · <code class="text-violet">usage.scroll_percent</code>(스크롤) · 체류 30초 이상=정독, 미만=훑기 자동 판정</td></tr>
                <tr><td>감정 반응(추천 · 좋아요 · 감동 · 화나요 · 슬퍼요)</td><td>Event · 긍정=<code class="text-violet">Like</code> · 부정=<code class="text-violet">Dislike</code> (피드백 계열 · <b>유실 금지</b> 등급)</td><td>감정 상세는 <code class="text-violet">custom_props</code> 에 기록 · 쌍따봉(DoubleLike) · 찜(AddToWishList)은 시연 화면에 해당 UI 없어 미사용 · 메모리 [observed]</td></tr>
                <tr><td>댓글 등록</td><td>Event · 표준 분류 없음 → 행동 이름 <code class="text-violet">기사상세_댓글등록_완료</code>(화면_액션 규칙)</td><td>본문은 로그에 수집하지 않음(사용자 입력 텍스트 금지 · 검색어만 예외) · <b>직접 발화</b>라 메모리 <code class="text-violet">[stated]</code> 로만 기록</td></tr>
              </tbody></table></div>
              <div style="margin-top:12px"><div class="selctl__lbl" style="margin-bottom:6px">전 로그 필수 11필드 · 누락 시 정상 적재 거부(격리 보관)</div>
                <div class="overflow-auto"><table class="ds-table"><thead><tr><th style="width:110px">그룹</th><th>필드</th></tr></thead><tbody>
                  <tr><td>공통</td><td><code class="text-violet">log_unique_id</code>(중복 제거 키 · UUID v7) · <code class="text-violet">access_timestamp</code>(Unix ms) · <code class="text-violet">service_id</code>(등록제 화이트리스트) · <code class="text-violet">deployment</code>(production / sandbox) · <code class="text-violet">sdk_type</code>(WEB / AA / IA / SERVER)</td></tr>
                  <tr><td>식별(3키)</td><td><code class="text-violet">uuid</code>(기기) · <code class="text-violet">suid</code>(세션 · 서버 발급) · <code class="text-violet">islogin</code> · 로그인 시 <code class="text-violet">user_id + user_id_type</code> 조건부 추가</td></tr>
                  <tr><td>행동</td><td><code class="text-violet">action_type</code>(4종) · <code class="text-violet">action_name</code>(화면_액션 규칙 · 접미 _클릭 / _완료 / _페이지뷰)</td></tr>
                  <tr><td>화면</td><td><code class="text-violet">page</code>(서비스 내 유일 · 영숫자와 _ 만)</td></tr>

              </div>
              <div class="overflow-auto" style="margin-top:12px"><table class="ds-table"><thead><tr><th style="width:170px">수집 필드(시연 · 업로드 계약)</th><th style="width:210px">PAST 대응</th><th>정의</th></tr></thead><tbody>
                <tr><td><code class="text-violet">user_id</code></td><td><code class="text-violet">user.uuid</code>(3키 중 시연 단순화 1키)</td><td>사용자 구분 키 · 실명 · 연락처 등 식별 정보는 어떤 경로로도 수집하지 않음</td></tr>
                <tr><td><code class="text-violet">content_id</code></td><td><code class="text-violet">content.id</code></td><td>추출 순서(0부터) · 조인 우선순위는 인덱스 → 외부 id → 제목</td></tr>
                <tr><td><code class="text-violet">event</code></td><td><code class="text-violet">action_type + action_kind</code></td><td>impression · search · click · read · skim · react · comment (PAST 매핑은 위 표)</td></tr>
                <tr><td><code class="text-violet">dwell_sec</code> · <code class="text-violet">scroll_pct</code></td><td><code class="text-violet">usage.duration</code> · <code class="text-violet">usage.scroll_percent</code></td><td>체류 초(10분 클램프) · 스크롤 %(0~100)</td></tr>
                <tr><td><code class="text-violet">ts</code></td><td><code class="text-violet">access_timestamp</code></td><td>이벤트 시각 · 시간대 신호(버스트 · 주야 이중 · 드리프트) 산출에 사용</td></tr>
              </tbody></table></div>
              <div style="margin-top:12px"><div class="selctl__lbl" style="margin-bottom:6px">저장 · 품질 규칙 (개발 스펙)</div>
                <div class="drow"><div class="k">저장 분리</div><div class="v text-sm text-body">일반 로그(<code class="text-violet">events_raw</code> · 유실 허용 · 즉시 응답) · 피드백(<code class="text-violet">feedback</code> · Like 계열 · 브로커 확인 후 응답, 실패 시 재전송 요구) · 검색어(<code class="text-violet">search_terms</code> · 개인정보 · 별도 권한) · 위반 격리(<code class="text-violet">dlq</code> · 원본 보관, 피드백은 폐기 금지) 4테이블</div></div>
                <div class="drow"><div class="k">위반 처리</div><div class="v text-sm text-body">필수 필드 위반은 건 단위 격리(배치 전체 거부 없음) · 선택 필드 위반은 그 필드만 버리고 로그는 정상 적재</div></div>
                <div class="drow"><div class="k">중복 제거</div><div class="v text-sm text-body">재전송 시 같은 <code class="text-violet">log_unique_id</code> 유지 → 번호로 중복 판별(같은 밀리초의 진짜 노출 여러 건과 구분)</div></div>
                <div class="drow"><div class="k">값 규칙</div><div class="v text-sm text-body">참/거짓은 true/false 통일 · 무효값("" · null · - · unknown)은 필드 자체를 생략 · 파생값(날짜 분해 · UA 파싱)은 수집하지 않고 처리단 계산</div></div>
              </div>
              <div style="margin-top:12px"><div class="selctl__lbl" style="margin-bottom:6px">프롬프트 별도 수집체계</div>
                <div class="text-xs text-muted" style="margin-bottom:6px">콘텐츠 찾기 프롬프트는 PAST 검색 로그(Event · Search)와 <b>별개로</b> 원문과 응답 결과를 상세 보존합니다 · 검색어 분리 저장 원칙과 같은 취급(개인정보 · 별도 권한) · 프롬프트에 우리 콘텐츠가 응답했는지(커버리지)가 핵심 지표입니다.</div>
                <div class="overflow-auto"><table class="ds-table"><thead><tr><th style="width:150px">필드</th><th>정의</th></tr></thead><tbody>
                  <tr><td><code class="text-violet">q</code> · <code class="text-violet">t</code></td><td>프롬프트 원문 · 시각 (직접 발화라 메모리 [stated] 병행 기록)</td></tr>
                  <tr><td><code class="text-violet">results_n</code> · <code class="text-violet">cats</code></td><td>응답한 콘텐츠 수 · 매칭된 주제 목록</td></tr>
                  <tr><td><code class="text-violet">zero</code></td><td>무결과 여부 · <b>공급 갭</b>(수요는 있는데 콘텐츠가 없음) 신호</td></tr>
                  <tr><td><code class="text-violet">clicked</code></td><td>프롬프트 → 결과 소비 전환 여부</td></tr>
                </tbody></table></div>
                <div class="text-xs text-muted" style="margin-top:6px">집계 지표: 응답률(커버리지) · 소비 전환율 · 공급 갭 목록 · 자주 쓴 표현 · [시연] 탭의 프롬프트 분석 패널에서 확인.</div>

                <a href="https://daumcorp.atlassian.net/wiki/spaces/pplan/pages/434307387" target="_blank" rel="noopener" class="text-violet">12. 수집 데이터 정의</a> ·
                <a href="https://daumcorp.atlassian.net/wiki/spaces/pplan/pages/433947067" target="_blank" rel="noopener" class="text-violet">13. 실측 로그 관찰</a> · 개발:
                <a href="https://daumcorp.atlassian.net/wiki/spaces/~712020cd2bd01af1a0494f8eda1fe935c0d5b9/pages/442302648" target="_blank" rel="noopener" class="text-violet">수집 테이블 구조</a> ·

                <a href="https://daumcorp.atlassian.net/wiki/spaces/~712020cd2bd01af1a0494f8eda1fe935c0d5b9/pages/441942349" target="_blank" rel="noopener" class="text-violet">log_unique_id</a></div>

          <div class="panel"><div class="panel-hd"><b>측정 · 판정 · 기록 정책</b><span class="meta">시연과 운영이 같은 계산</span></div>
            <div class="panel-bd">
              <div class="drow"><div class="k">가중치 공식</div><div class="v text-sm text-body">체류초 ÷ 30 × 클릭가중(클릭 2.0 · 비클릭 1.0) → 카테고리 · 맥락(인텐트)별 합산 → 상대 등급(저 / 중 / 고)</div></div>
              <div class="drow"><div class="k">호응 가중</div><div class="v text-sm text-body">반응 +1.0 · 댓글 +1.5 를 카테고리 · 맥락 선호에 합산(강도를 거쳐 판정에도 반영) · 감정은 긍정(추천 · 좋아요 · 감동) / 부정(화나요 · 슬퍼요) 분포로 별도 집계 · 콘텐츠와 주제에 대한 호응 판단의 핵심 신호</div></div>
              <div class="drow"><div class="k">깊이 판정</div><div class="v text-sm text-body">평균 체류 45초 이상 + 스크롤 60% 이상 = <b>몰입</b> · 15초 미만 = <b>훑기</b> · 그 사이 = 혼합</div></div>
              <div class="drow"><div class="k">판정 순서</div><div class="v text-sm text-body">명시 신호(버스트 · 주야 이중 · 드리프트 · 주말 편중 · 출퇴근 훑기 · 엔티티 집중) 우선 → 없으면 깊이 · 강도 · 폭 근접 매칭 · 소비 5건 미만은 <b>잠정</b> 배정 후 로그가 쌓이면 자동 재판정</div></div>
              <div class="drow"><div class="k">메모리 기록</div><div class="v text-sm text-body">소비 관찰은 <code class="text-violet">[observed]</code> · 검색어와 댓글 등 직접 말한 것은 <code class="text-violet">[stated]</code> 로 구분 기록 · 파일당 4,000바이트 · 64개 제한 · 삭제는 명시 요청이 있을 때만</div></div>
              <div class="drow"><div class="k">개인정보</div><div class="v text-sm text-body">건강 · 정치 성향 · 가족 실명 · 주소 · 금융 등 민감 정보는 기록하지 않음 · 위치정보는 PAST 수집 대상에서 제외(별도 파이프라인 격리) · 사용자 입력 텍스트는 수집하지 않음(검색어만 분리 저장 예외)</div></div>
              <div style="margin-top:10px"><div class="selctl__lbl" style="margin-bottom:6px">판정 기준 · 기본 페르소나 8종</div>
                <div class="overflow-auto"><table class="ds-table"><thead><tr><th style="width:190px">페르소나</th><th>특징</th></tr></thead><tbody>
                  <template x-for="pd in ((demoData && demoData.personas) || [])" x-bind:key="'ppd'+pd.name">
                    <tr><td class="text-ink" x-text="pd.full"></td><td x-text="pd.desc"></td></tr>
                  </template>
                </tbody></table></div>
                <div class="text-xs text-muted" style="margin-top:6px">페르소나는 배타 분류가 아니라 <b>중복 매칭</b>을 허용합니다 · 여러 기준에 걸치면 1순위 · 2순위를 병행 표기하고, 경계가 좁으면 신뢰도를 낮춰 표시합니다.</div>
              </div>
            </div>
          </div>
        </div>

        <!-- ═══ 로그뷰어: PAST 로그 검증 도구(기획 13) · 뷰어가 아니라 "맞게 심어졌는지" 판정 ═══ -->
        <div x-show="labUserView==='viewer'" x-cloak class="space-y-4" id="user-panel-viewer" role="tabpanel" aria-labelledby="user-tab-viewer">
          <!-- 이 화면의 지위(기획 131 배치 검토): 결론은 3안 독립 신설이고 Prism 배치는 부적합
               (실 로그를 외부 인프라로 반출 불가 · 합성 데이터 원칙과 충돌). 그 문서가 Prism 에
               남긴 조기 시범 범위가 "판정 규칙 시뮬레이터"라 화면이 스스로를 본 도구로 오인하지
               않게 범위를 먼저 못 박는다. -->
          <div class="panel"><div class="panel-hd"><b>이 화면의 범위</b><span class="meta">기획 131 배치 검토 결론 반영</span></div>
            <div class="panel-bd">
              <ul class="ds-bullets hintbox" style="padding:14px 16px">
                <li>본 검증 도구의 배치 결론은 <b>독립 신설</b>입니다 · 실 로그에 기기·사용자 식별자가 있어 사내 인프라에서만 취급하고, 판정은 수집 서버 거부 로직과 일치해야 합니다.</li>
                <li>따라서 이 화면은 도구 본체가 아니라 <b>판정 규칙 시뮬레이터</b>(실 로그 없이 규칙만 검증)와 <b>시연 세션 기반 판정 시범</b>까지입니다 · 여기 데이터는 전부 합성입니다.</li>
                <li>대상 주소·기기 연결(QR)·증적 리포트·회귀 검증·위반율 지표는 <b>독립 신설 범위</b>로 여기서 다루지 않습니다.</li>
              </ul>
            </div>
          </div>

          <!-- 판정 규칙 시뮬레이터: 기획 131 이 Prism 에 조기 시범 배치로 권고한 유일한 범위.
               붙여넣은 표본만 판정하고 저장하지 않는다(POST /usermeta-logcheck). -->
          <div class="panel" data-fn><div class="panel-hd"><b>판정 규칙 시뮬레이터</b><span class="meta">샘플 로그 붙여넣기 검사 · 저장하지 않습니다</span>
              <span class="ml-auto flex items-center gap-2"><span class="text-xs" x-show="lvSimMsg" x-bind:style="lvSim ? 'color:var(--ds-muted)' : 'color:var(--ds-error)'" x-text="lvSimMsg"></span>
              <button type="button" class="copybtn" x-on:click="lvSimSample()" data-tip="정상 1건 + 위반 2건 예시를 채웁니다" data-tip-pos="bottom">예시 채우기</button>
              <button type="button" class="ds-btn ds-btn--secondary ds-btn--s-sm" x-show="lvSimText" x-cloak x-on:click="lvSimClear()">비우기</button>
              <button type="button" class="ds-btn ds-btn--primary ds-btn--s-sm" x-bind:disabled="lvSimBusy || !lvSimText.trim()" x-on:click="lvSimRun()" x-text="lvSimBusy ? '판정 중…' : '판정'"></button></span></div>
            <div class="panel-bd">
              <ul class="ds-bullets hintbox" style="padding:14px 16px;margin-bottom:12px">
                <li>실 로그를 반출하지 않고 <b>규칙만</b> 확인하는 용도입니다 · 붙여넣은 표본은 판정 후 버려집니다(서버 저장 없음).</li>
                <li>JSON 배열 · 단건 객체 · 줄당 1건(JSONL) 모두 받습니다 · 그룹 표기(<code class="text-violet">common.page</code> · <code class="text-violet">action.type</code>)는 판정 키로 자동 정렬합니다.</li>
                <li>판정 규칙은 스트림과 같은 원천입니다 · 정본은 11. 정책 및 운영 · 12. 수집 데이터 정의이고 도구 안에 사본을 두지 않습니다.</li>
              </ul>
              <textarea aria-label="PAST 로그" class="field w-full" style="min-height:150px;font-family:var(--ds-font-mono,ui-monospace),monospace;font-size:12px" placeholder='PAST 로그를 붙여넣으세요 · 예: [{"log_unique_id":"a1","common":{"page":"home_tab"},"action":{"type":"Event","name":"홈탭_기사_클릭","kind":"ClickContent"}}]' x-model="lvSimText"></textarea>
              <template x-if="lvSim">
                <div style="margin-top:12px">
                  <div class="flex flex-wrap items-center gap-2" style="margin-bottom:8px">
                    <span class="text-sm text-body tnum" x-text="'판정 ' + lvSim.n + '건'"></span>
                    <template x-for="v in ['fail','warn','info','pass']" x-bind:key="'lvst'+v">
                      <span class="ds-badge" x-bind:class="lvBadge(v)" x-show="lvSim.tally[v]"><span x-text="lvLabel(v)"></span><span class="tnum" style="margin-left:4px" x-text="lvSim.tally[v]"></span></span>
                    </template>
                    <span class="text-xs text-muted" x-show="lvSim.truncated" x-cloak x-text="'표시 상한 초과 ' + lvSim.truncated + '건 생략'"></span>
                  </div>
                  <div class="overflow-auto" style="max-height:340px"><table class="ds-table"><thead><tr><th>로그</th><th style="width:70px">판정</th><th>사유 · 위반 필드 · 규칙</th></tr></thead><tbody>
                    <template x-for="(l, li) in lvSim.logs" x-bind:key="'lvsl'+li">
                      <tr style="cursor:pointer" x-bind:style="lvSimSel===li ? 'background:var(--ds-surface)' : ''" x-on:click="lvSimSel = lvSimSel===li ? -1 : li">
                        <td><code class="text-violet" x-text="l.title"></code></td>
                        <td><span class="ds-badge" x-bind:class="lvBadge(l.verdict)" x-text="lvLabel(l.verdict)"></span></td>
                        <td class="text-xs"><template x-for="(v, vi) in l.violations" x-bind:key="'lvsv'+li+'_'+vi">
                            <div><span x-text="v[1]"></span>
                              <code class="text-violet" x-show="v[2]" style="margin-left:4px" x-text="v[2]"></code>
                              <span class="ds-badge ds-badge--neutral" x-show="v[3]" style="margin-left:4px" x-text="v[3]"></span></div>
                          </template><span x-show="!l.violations.length" class="text-muted">· 규칙 위반 없음</span></td>

                  <div x-show="lvSimSel >= 0" x-cloak style="margin-top:10px">
                    <div class="flex items-center gap-2" style="margin-bottom:6px"><b class="text-ink text-sm" x-text="lvSimLog(lvSimSel) ? lvSimLog(lvSimSel).title : ''"></b>
                      <button type="button" class="ds-btn ds-btn--secondary ds-btn--s-sm ml-auto" x-on:click="lvSimSel=-1">닫기</button></div>
                    <div class="overflow-auto"><table class="ds-table"><thead><tr><th style="width:220px">필드</th><th>값</th><th style="width:100px">수집 등급</th></tr></thead><tbody>
                      <template x-for="(f, fi) in ((lvSimLog(lvSimSel) && lvSimLog(lvSimSel).fields) || [])" x-bind:key="'lvsf'+fi">

                          <td><span class="ds-badge" x-bind:class="f[2]==='필수' ? 'ds-badge--reason' : 'ds-badge--neutral'" x-text="f[2]"></span></td></tr>

                  </div>

                    <ul class="ds-bullets"><template x-for="(e, ei) in lvSim.errors" x-bind:key="'lvse'+ei"><li x-text="e"></li></template></ul>
                  </div>
                </div>
              </template>
            </div>
          </div>

          <div class="panel"><div class="panel-hd"><b>검증 세션</b><span class="meta">시연 세션 = 기기 식별자(uuid) 분리 1인 세션</span>
              <span class="ml-auto flex items-center gap-2"><span class="text-xs" style="color:var(--ds-primary)" x-show="lvMsg" x-text="lvMsg"></span>
              <button type="button" class="ds-btn ds-btn--secondary ds-btn--s-sm" x-bind:disabled="lvBusy" x-on:click="lvOps(lv && lv.bad_on ? 'clear' : 'inject')" x-text="lv && lv.bad_on ? '위반 예시 제거' : '위반 예시 주입'"></button>
              <button type="button" class="ds-iconbtn ds-iconbtn--bordered" x-on:click="loadLogViewer()" data-tip="새로고침" data-tip-pos="bottom" aria-label="로그뷰어 새로고침"><svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M20 11a8 8 0 1 0-.9 4.5M20 5v6h-6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button></span></div>
            <div class="panel-bd">
              <ul class="ds-bullets hintbox" style="padding:14px 16px;margin-bottom:12px">
                <li>이 화면은 로그가 <b>보이는지</b>가 아니라 <b>맞게 심어졌는지</b>를 판정하는 <b>PAST 로그 검증 도구</b> 시연입니다 · 기대 로그와의 대조로 누락 · 중복까지 잡는 것이 뷰어와의 차이.</li>
                <li>검증 세션은 기기 식별자(uuid) 기준 본인 로그만 분리합니다 · 시연이 그 자체로 1인 세션이라 [시연] 탭에서 행동하면 여기 판정 스트림에 그대로 쌓입니다(새로고침으로 반영).</li>
                <li>판정 규칙의 정본은 12. 수집 데이터 정의(스키마) · 11. 정책 및 운영(정책)입니다 · [위반 예시 주입]을 누르면 실측에서 발견된 대표 위반(무효값 · 무맥락 이름 · 광고 혼입 · 중복 전송 · 필수 누락)의 판정을 볼 수 있습니다.</li>
              </ul>
              <div class="overflow-auto"><table class="ds-table"><thead><tr><th>기기(uuid)</th><th>세션(suid)</th><th style="width:100px">service_id</th><th style="width:100px">deployment</th><th style="width:80px">sdk_type</th></tr></thead><tbody>
                <tr class="tnum"><td><code class="text-violet" x-text="lv ? lv.session.uuid : '·'"></code></td><td><code class="text-violet" x-text="lv ? lv.session.suid : '·'"></code></td><td x-text="lv ? lv.session.service_id : '·'"></td><td x-text="lv ? lv.session.deployment : '·'"></td><td x-text="lv ? lv.session.sdk_type : '·'"></td></tr>
              </tbody></table></div>
            </div>
          </div>

          <div class="panel"><div class="panel-hd"><b>실시간 판정 스트림</b><span class="meta">판정 ① 로그 단위(형식) · 행을 누르면 필드 단위 상세</span>
              <span class="meta tnum ml-auto" x-text="lv ? ('로그 ' + lv.n + '건' + (lvShown().length !== lv.n ? ' · 표시 ' + lvShown().length + '건' : '')) : ''"></span></div>
            <div class="panel-bd">
              <!-- 필터·검색(R8): 현행 2축(행동 유형·서비스)에서 판정 결과 축과 필드값 검색을 더한다.
                   R8 수용 기준 = 판정 결과 기준 필터로 불합격 항목만 즉시 확인. -->
              <div class="filterbar" style="margin:0 0 10px">
                <input aria-label="로그 검색" class="field" placeholder="필드명·값·사유 검색" x-model="lvQ">
                <select aria-label="행동 유형" class="field" style="width:auto" x-model="lvType"><option value="">행동 유형 전체</option><template x-for="t in lvTypes()" x-bind:key="'lvt'+t"><option x-bind:value="t" x-text="t"></option></template></select>
                <template x-for="f in [['','전체'],['fail','불합격'],['warn','경고'],['info','정보'],['pass','합격']]" x-bind:key="'lvf'+f[0]">
                  <button type="button" class="srcfilter__chip" x-bind:class="lvFilter===f[0] ? 'sel' : ''" x-on:click="lvFilter=f[0]; lvSel=-1"><span x-text="f[1]"></span><span x-show="f[0]" class="tnum" x-text="lvTally(f[0])"></span></button>
                </template>
              </div>
              <div class="overflow-auto" style="max-height:380px"><table class="ds-table"><thead><tr><th style="width:80px">시각</th><th>로그</th><th style="width:70px">판정</th><th>사유 · 위반 필드 · 규칙</th></tr></thead><tbody>
                <template x-for="s in lvShown()" x-bind:key="'lvl'+s.i">
                  <tr style="cursor:pointer" x-bind:style="lvSel===s.i ? 'background:var(--ds-surface)' : ''" x-on:click="lvSel = lvSel===s.i ? -1 : s.i">
                    <td class="tnum" x-text="s.l.t"></td>
                    <td><code class="text-violet" x-text="s.l.title"></code>
                      <span x-show="s.l.feedback" class="ds-badge ds-badge--entity" style="margin-left:4px;cursor:help" data-tip="피드백 계열 · 유실 금지 등급(브로커 확인 후 응답 · 실패 시 재전송)" data-tip-pos="top">피드백</span>
                      <span x-show="s.l.injected" class="ds-badge ds-badge--neutral" style="margin-left:4px" x-text="s.l.label"></span></td>
                    <td><span class="ds-badge" x-bind:class="lvBadge(s.l.verdict)" x-text="lvLabel(s.l.verdict)"></span></td>
                    <!-- R2 수용 기준: 불합격 사유에 위반 필드명 · 판정 근거 규칙 항목을 로그별로 확인 -->
                    <td class="text-xs"><template x-for="(v, vi) in s.l.violations" x-bind:key="'lvv'+s.i+'_'+vi">
                        <div><span x-text="v[1]"></span>
                          <code class="text-violet" x-show="v[2]" style="margin-left:4px" x-text="v[2]"></code>
                          <span class="ds-badge ds-badge--neutral" x-show="v[3]" style="margin-left:4px" x-text="v[3]"></span></div>
                      </template><span x-show="!s.l.violations.length" class="text-muted">· 규칙 위반 없음</span></td>
                  </tr>
                </template>
              </tbody></table></div>
              <div class="text-xs text-muted" x-show="lv && !lv.logs.length">아직 로그가 없습니다 · [시연] 탭에서 콘텐츠를 소비하면 판정 대상이 쌓입니다.</div>
              <div class="text-xs text-muted" x-show="lv && lv.logs.length && !lvShown().length">이 조건에 맞는 로그가 없습니다 · 필터를 바꿔 보세요.</div>
              <!-- 로그 상세 보기(R3 승계): 필드 단위 수집값 · 수집 등급(12. 수집 데이터 정의 기준) -->
              <div x-show="lvSel >= 0" x-cloak style="margin-top:10px">
                <div class="flex items-center gap-2" style="margin-bottom:6px"><b class="text-ink text-sm" x-text="lvLog(lvSel) ? lvLog(lvSel).title : ''"></b>
                  <template x-for="r in lvRules(lvLog(lvSel))" x-bind:key="'lvr'+r"><span class="ds-badge ds-badge--reason" x-text="r"></span></template>
                  <button type="button" class="ds-btn ds-btn--secondary ds-btn--s-sm ml-auto" x-on:click="lvSel=-1">닫기</button></div>
                <div class="overflow-auto"><table class="ds-table"><thead><tr><th style="width:220px">필드</th><th>값</th><th style="width:100px">수집 등급</th></tr></thead><tbody>
                  <template x-for="(f, fi) in ((lvLog(lvSel) && lvLog(lvSel).fields) || [])" x-bind:key="'lvf'+fi">
                    <tr><td><code class="text-violet" x-text="f[0]"></code></td><td class="tnum" style="word-break:break-all" x-text="f[1]"></td>
                      <td><span class="ds-badge" x-bind:class="f[2]==='필수' ? 'ds-badge--reason' : 'ds-badge--neutral'" x-text="f[2]"></span></td></tr>
                  </template>
                </tbody></table></div>
                <!-- 필수 누락은 값 자체가 없어 위 표에 행이 생기지 않는다 → 따로 세운다(R3 수용 기준) -->
                <div x-show="lvLog(lvSel) && lvLog(lvSel).violations.some(v => v[3]==='필수 11필드')" style="margin-top:8px">
                  <div class="selctl__lbl" style="margin-bottom:6px">필수 누락 필드</div>
                  <div class="flex flex-wrap gap-1">
                    <template x-for="v in (lvLog(lvSel) ? lvLog(lvSel).violations.filter(v => v[3]==='필수 11필드') : [])" x-bind:key="'lvm'+v[2]">
                      <span class="ds-badge ds-badge--error"><code x-text="v[2]"></code></span>
                    </template>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="panel"><div class="panel-hd"><b>기대 로그 체크리스트</b><span class="meta">판정 ② 행동 단위 · ③ 시나리오 단위(커버리지)</span></div>
            <div class="panel-bd">
              <div class="drow"><div class="k">행동 단위(②)</div><div class="v text-sm text-body tnum" x-text="lv ? ('1회 조작 = 로그 1건 원칙 · 시연 조작 ' + lv.behavior.ops + '건 → 로그 ' + lv.behavior.logs + '건 · 동일 log_unique_id 중복 ' + lv.behavior.dup + '건') : ''"></div></div>
              <!-- R4 수용 기준: 기대 있음·발생 0건 = 누락 / 기대 정확히 1건·발생 2건 이상 = 중복 -->
              <div class="flex items-center gap-2" style="margin-top:10px">
                <span class="text-sm text-body tnum" x-text="lv ? ('진행 ' + lv.checklist.done + '/' + lv.checklist.total + ' · 합격률 ' + lv.checklist.pass_rate + '%') : ''"></span>
                <button type="button" class="srcfilter__chip ml-auto" x-bind:class="lvOnlyMiss ? 'sel' : ''" x-on:click="lvOnlyMiss = !lvOnlyMiss" data-tip="누락·중복 항목만 추려 봅니다" data-tip-pos="top">미달만 보기</button>
              </div>
              <div class="overflow-auto" style="margin-top:8px"><table class="ds-table"><thead><tr><th style="width:170px">기대 로그</th><th style="width:190px">PAST 매핑</th><th style="width:90px">기대</th><th style="width:64px">발생</th><th style="width:70px">판정</th></tr></thead><tbody>
                <template x-for="it in lvChecklist()" x-bind:key="'lvc'+it.key">
                  <tr><td x-text="it.label"></td><td><code class="text-violet" x-text="it.map"></code></td>
                    <td class="text-xs text-muted" x-text="it.expect"></td><td class="tnum" x-text="it.n + '건'"></td>
                    <td><span class="ds-badge" x-bind:class="lvStateBadge(it.state)" x-text="lvStateLabel(it.state)"></span></td></tr>
                </template>
              </tbody></table></div>
              <div class="text-xs text-muted" x-show="lvOnlyMiss && !lvChecklist().length" style="margin-top:8px">미달 항목이 없습니다 · 전 항목 기대대로 발생했습니다.</div>
              <div class="text-sm text-body tnum" style="margin-top:8px" x-text="lv ? ((lv.checklist.missing.length ? '누락: ' + lv.checklist.missing.join(' · ') : '누락 없음') + (lv.checklist.dups.length ? ' · 중복: ' + lv.checklist.dups.join(' · ') : '')) : ''"></div>
              <!-- 피드백 바이패스 확인(R7): 값의 의미는 판정하지 않고 존재·형식·연결만 본다 -->
              <div style="margin-top:14px" x-show="lv" x-cloak>
                <div class="selctl__lbl" style="margin-bottom:6px">피드백 바이패스 확인 · 존재와 형식만 판정</div>
                <div class="overflow-auto"><table class="ds-table"><thead><tr><th style="width:230px">확인 항목</th><th style="width:110px">결과</th><th>비고</th></tr></thead><tbody>
                  <tr><td>커스텀 속성 <code class="text-violet">tesla_</code> 접두 전달</td>
                    <td class="tnum" x-text="lv ? (lv.bypass.tesla + '건') : ''"></td>
                    <td class="text-xs text-muted">PAST 는 값을 검증하지 않고 전달만 함 · 존재만 확인</td></tr>
                  <tr><td>노출 추가 정보 JSON 문자열 형식</td>

                    <td class="text-xs text-muted">파싱 불가 문자열은 불합격 · 값의 의미는 판정 대상 아님</td></tr>
                  <tr><td>노출 · 클릭 연결 키 일치</td>
                    <td><span class="ds-badge" x-bind:class="lv && lv.bypass.link_miss.length ? 'ds-badge--warning' : 'ds-badge--success'" x-text="lv ? (lv.bypass.link_miss.length ? '불일치 ' + lv.bypass.link_miss.length + '건' : '일치 ' + lv.bypass.link_ok + '건') : ''"></span></td>
                    <td class="text-xs text-muted">클릭한 <code class="text-violet">content.id</code> 가 앞선 노출 집합에 있어야 이어짐 · 노출 <span class="tnum" x-text="lv ? lv.bypass.imp_ids : ''"></span>종</td></tr>
                </tbody></table></div>
              </div>
              <div style="margin-top:12px"><div class="selctl__lbl" style="margin-bottom:6px">판정 기준 범례</div>
                <div class="overflow-auto"><table class="ds-table"><thead><tr><th style="width:70px">판정</th><th>대상</th></tr></thead><tbody>
                  <tr><td><span class="ds-badge ds-badge--error">불합격</span></td><td>필수 11필드 누락 · 무효값 전송 · 행동 유형(4종) · 표준 분류(16종) 정의 외 값 → 수집 거부(격리) 대상</td></tr>
                  <tr><td><span class="ds-badge ds-badge--warning">경고</span></td><td>명명 규칙 위반(화면_액션 미준수 · 무맥락 이름) · 광고 계측 혼입 · 중복 전송 · 커스텀 속성 미등록 키 → 수집되나 시정 필요</td></tr>

                <a href="https://daumcorp.atlassian.net/wiki/spaces/pplan/pages/443646328" target="_blank" rel="noopener" class="text-violet">131. 요구사항 및 화면 설계</a> ·
                <a href="https://daumcorp.atlassian.net/wiki/spaces/pplan/pages/434176333" target="_blank" rel="noopener" class="text-violet">11. 정책 및 운영</a> ·
                <a href="https://daumcorp.atlassian.net/wiki/spaces/pplan/pages/434307387" target="_blank" rel="noopener" class="text-violet">12. 수집 데이터 정의</a> ·
                <a href="https://daumcorp.atlassian.net/wiki/spaces/pplan/pages/433947067" target="_blank" rel="noopener" class="text-violet">실측 로그 관찰</a></div>
            </div>
          </div>

          <!-- 요구사항 대응(기획 131 R1~R10): 어디까지 시범 구현이고 어디부터 독립 신설 범위인지
               화면 안에서 바로 대조할 수 있게 둔다. 문서와 도구의 불일치는 결함으로 취급한다는
               비기능 요구를 지키려면 이 표가 화면에 있어야 한다. -->
          <div class="panel"><div class="panel-hd"><b>요구사항 대응</b><span class="meta">131. 요구사항 및 화면 설계 · R1~R10</span></div>
            <div class="panel-bd">
              <div class="overflow-auto"><table class="ds-table"><thead><tr><th style="width:44px">R</th><th style="width:170px">요구사항</th><th style="width:110px">우선순위 · 구분</th><th style="width:100px">이 화면</th><th>비고</th></tr></thead><tbody>
