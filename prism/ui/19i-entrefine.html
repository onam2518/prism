      <!-- 실험실 › 핵심 키워드 / 문장(운영자 전용) · labTab==='entref' · 06-quality-lab 탭 바에 의존
           1차 추출 뒤 두 재가공 호출: ① 핵심 키워드(엔티티 재처리 · 구독 키워드 3개) ② 핵심 문장(구독 카드·알림용 1문장)
           STEP 1 모델·프롬프트(호출별 모델·규칙 저장 · 출력 형식은 코드 고정) → STEP 2 실행(단건 | 다건 선택) · 로직 prism/entrefine.py -->
      <template x-if="mod === 'lab'">
        <div x-show="labTab === 'entref'" x-cloak class="w-full dc-body">

        <section class="panel">
          <div class="panel-hd"><b>핵심 키워드 / 문장</b><span class="meta">발행 메타로 구독·콘텐츠 묶음·검색용 키워드와 문장을 만드는 두 호출</span><span class="ds-badge ds-badge--neutral ml-auto">운영자 전용</span></div>
          <div class="panel-bd dc-body">
            <ul class="ds-bullets">
              <li>입력은 <b>발행된 메타(리드문·엔티티·인텐트·카테고리)뿐</b>입니다 · 제목·본문은 쓰지 않고, 키워드 근거 확인도 메타 안에서 합니다</li>
              <li><b>핵심 키워드</b> 최대 3개 · 기본 선정 비중은 구독 40%·클러스터링 40%·검색 의도 20%입니다<ul><li>메타가 뒷받침하는 후보에서 선정합니다 · 조합형(엔티티를 포함한 명사구)과 단일형(엔티티 또는 주제어)은 형태와 관계없이 선정 순서를 유지합니다</li><li>비중은 프롬프트의 판단 기준이며 실측 점수가 아닙니다 · 비교 기준인 지금 방식은 확신도 상위 3개입니다</li></ul></li>
              <li><b>핵심 문장</b>: 핵심 키워드가 나온 뒤 그 키워드와 메타로 다시 씁니다 · 키워드가 실패하면 메타만으로 쓰고 표시합니다</li>
              <li>프롬프트는 호출·모델별로 저장합니다 · Solar 모델에는 Upstage 쿡북을 바탕으로 만든 입출력 예시를 자동으로 붙입니다</li>
            </ul>
            <p class="ds-hint" x-text="erCfgLine()"></p>
            <p class="ds-hint" x-show="erCfg && (erCfg.keyword.custom || erCfg.sentence.custom)" x-cloak>저장한 사용자 프롬프트를 사용 중입니다. 새 기본 기준을 적용하려면 각 호출에서 ‘기본 프롬프트로 되돌리기’를 누른 뒤 저장하세요.</p>
          </div>
        </section>

        <!-- ── STEP 1 · 모델·프롬프트 (콘텐츠 관리와 같은 stepline 머리줄) ── -->
        <div class="stepline"><span class="stepline__no">STEP 1</span><b>모델·프롬프트</b><span class="meta">호출별 모델과 프롬프트를 정하고 저장합니다</span></div>
        <template x-for="c in [['keyword', '핵심 키워드 호출', 'erKwModel'], ['sentence', '핵심 문장 호출', 'erStModel']]" x-bind:key="c[0]">
          <section class="panel">
            <div class="panel-hd"><b x-text="c[1]"></b><span class="ds-badge ml-auto" x-bind:class="(erCfg && erRules[c[0]].trim() !== erCfg.defaults[c[0]].trim()) ? 'ds-badge--warning' : 'ds-badge--neutral'" x-text="(erCfg && erRules[c[0]].trim() !== erCfg.defaults[c[0]].trim()) ? '수정한 프롬프트' : '기본 프롬프트'"></span></div>
            <div class="panel-bd dc-body">
              <div>
                <label class="ds-label" x-bind:for="'er-rules-' + c[0]">프롬프트 · 규칙</label>
                <textarea class="ds-field" rows="14" x-bind:id="'er-rules-' + c[0]" x-model="erRules[c[0]]" x-bind:disabled="erSaving || !erCfg"></textarea>
                <p class="ds-hint" x-text="(erRules[c[0]] || '').length + '자 · 8,000자 이하'"></p>
              </div>
              <div>
                <span class="ds-label">출력 형식(고정 · 프롬프트 뒤에 자동으로 붙습니다)</span>
                <pre class="ds-code" x-text="(erCfg && erCfg.schemas) ? erCfg.schemas[c[0]] : ''"></pre>
                <details x-show="erCfg"><summary>적용 프롬프트 보기 · 마지막 저장 기준</summary><pre class="ds-code" x-text="erCfg ? erCfg[c[0]].system : ''"></pre></details>
              </div>
              <div class="flex items-center gap-2">
                <button type="button" class="ds-btn ds-btn--ghost ds-btn--s-sm" x-bind:disabled="erSaving || !erCfg" x-on:click="erRules[c[0]] = erCfg.defaults[c[0]]">기본 프롬프트로 되돌리기</button>
              </div>
            </div>
          </section>
        </template>
        <section class="panel">
          <div class="panel-hd"><b>호출별 모델 · 저장</b><span class="meta">기본 설정 모델 = 시스템 기본 텍스트 모델</span></div>
          <div class="panel-bd dc-body">
            <div class="dc-row">
              <div><label class="ds-label">핵심 키워드 모델</label><x-modelpick key="erk" value="erKwModel" set="erSelectModel('keyword',$v)" groups="textGroups" first-label="기본 설정 모델" first-value="" width="260px" tip="핵심 키워드 호출에 쓰는 모델 · 직접(Solar)·라우터 전체에서 고름 · 미연결 제공자는 키 등록 후 선택 · 목록이 오래됐으면 '모델 새로고침'"></x-modelpick></div>
              <div><label class="ds-label">핵심 문장 모델</label><x-modelpick key="ers" value="erStModel" set="erSelectModel('sentence',$v)" groups="textGroups" first-label="기본 설정 모델" first-value="" width="260px" tip="핵심 문장 호출에 쓰는 모델 · 직접(Solar)·라우터 전체에서 고름 · 미연결 제공자는 키 등록 후 선택 · 목록이 오래됐으면 '모델 새로고침'"></x-modelpick></div>
              <button type="button" class="ds-btn ds-btn--solid ds-btn--c-primary ds-btn--s-sm ml-auto" x-bind:disabled="erSaving || !erCfg" x-on:click="erSaveCfg()" x-text="erSaving ? '저장 중…' : '모델·프롬프트 저장'"></button>
            </div>
            <p class="ds-hint" x-bind:class="erCfgErr ? 'ds-hint--error' : ''" x-show="erCfgMsg" x-cloak x-text="erCfgMsg"></p>
            <button type="button" class="ds-btn ds-btn--outline ds-btn--s-sm" x-show="!erCfg && erCfgErr" x-cloak x-on:click="erLoadCfg()">설정 다시 불러오기</button>
          </div>
        </section>

        <!-- ── STEP 2 · 실행 · 단건/다건 선택은 머리줄 칩(콘텐츠 관리 수동/자동 추가와 같은 방식) ── -->
        <div class="stepline"><span class="stepline__no">STEP 2</span><b>실행</b><span class="meta">STEP 1 에 저장한 모델·프롬프트로 돌립니다</span>
          <span class="panel-hd__controls control-row ml-auto">
            <button type="button" class="srcfilter__chip" x-bind:class="erMode === 'one' ? 'sel' : ''" x-on:click="erMode = 'one'">단건</button>
            <button type="button" class="srcfilter__chip" x-bind:class="erMode === 'batch' ? 'sel' : ''" x-on:click="erMode = 'batch'">다건 · 정답셋 일괄</button>
          </span>
        </div>
        <section class="panel" x-show="erMode === 'one'">
          <div class="panel-hd"><b>단건</b><span class="meta">정답셋 해시를 넣거나 메타를 직접 입력</span></div>
          <div class="panel-bd dc-body">
            <div><label class="ds-label" for="er-hash">정답셋 콘텐츠 해시</label><input id="er-hash" class="ds-field" x-model="erHash" placeholder="비우면 아래 직접 입력을 씁니다"></div>
            <div x-show="!erHash" x-cloak class="dc-body">
              <div><label class="ds-label" for="er-sum">리드문</label><input id="er-sum" class="ds-field" x-model="erSum1"></div>
              <div><label class="ds-label" for="er-ents">엔티티(쉼표로 구분 · 발행 순서대로)</label><input id="er-ents" class="ds-field" x-model="erEnts" placeholder="예: 한국은행, 기준금리, 이창용"></div>
              <div class="dc-row">
                <div><label class="ds-label" for="er-int">인텐트(쉼표)</label><input id="er-int" class="ds-field" x-model="erInt" placeholder="예: 속보·단신"></div>
                <div><label class="ds-label" for="er-cat">카테고리(쉼표)</label><input id="er-cat" class="ds-field" x-model="erCat" placeholder="예: Business and Finance / Economy"></div>
              </div>
              <div><label class="ds-label" for="er-title">제목·본문(지금 방식 확신도 계산용 · 재가공 입력에는 쓰지 않음)</label><input id="er-title" class="ds-field" x-model="erTitle" placeholder="제목"><textarea id="er-body" class="ds-field" rows="3" x-model="erBody" placeholder="본문" style="margin-top:var(--ds-space-2)"></textarea></div>
            </div>
            <div class="flex items-center gap-3">
              <button type="button" class="ds-btn ds-btn--solid ds-btn--c-primary ds-btn--s-sm" x-bind:disabled="erTrying || !erCfg" x-on:click="erTry()" x-text="erTrying ? '재가공 중…' : '재가공해 보기'"></button>
              <p class="ds-hint ds-hint--error" x-show="erOneErr" x-cloak x-text="erOneErr"></p>
            </div>
            <template x-if="erOne">
              <div class="dc-body">
                <div class="layout-grid--two">
                  <section class="fn" aria-label="기존 메타 리드문"><div class="flex items-center gap-2 flex-wrap"><b class="fn__title">기존 메타 · 리드문</b><span class="ds-hint tnum" x-show="(erOne.sentence || {}).base" x-text="Array.from((erOne.sentence || {}).base || '').length + '자 · 공백 포함'"></span></div><p class="tbox" x-text="(erOne.sentence || {}).base || '기존 리드문이 없습니다'"></p></section>
                  <section class="fn" aria-label="핵심 문장 결과">
                  <div class="flex items-center gap-2 flex-wrap"><b class="fn__title">핵심 문장 · 재가공</b><span class="ds-hint tnum" x-show="erSentenceText(erOne.sentence)" x-text="erSentenceLength(erOne.sentence) + '자 · 공백 포함'"></span><span class="ds-badge ds-badge--error" x-show="(erOne.sentence || {}).draft">검사 미통과 · 생성 초안</span></div>
                  <p class="tbox" x-text="erSentenceText(erOne.sentence) || '생성된 문장이 없습니다'"></p>
                  <p class="ds-hint" x-show="erSentenceText(erOne.sentence) && !erOne.sentence.from_keywords">키워드 없이 메타만으로 생성</p>
                  <p class="ds-hint ds-hint--error" x-show="(erOne.sentence || {}).error" x-text="(erOne.sentence || {}).error"></p>
                </section>
                </div>
                <dl class="ds-deflist">
                  <div class="ds-fieldrow"><dt class="ds-fieldrow__label">키워드 · 지금 방식</dt><dd class="ds-fieldrow__value ds-fieldrow__chips"><template x-for="b in (erOne.base || [])" x-bind:key="b.name"><span class="ds-badge ds-badge--entity" x-text="b.name + ' ' + Math.round(b.conf * 100)"></span></template></dd></div>
                  <div class="ds-fieldrow"><dt class="ds-fieldrow__label">키워드 · 재가공</dt><dd class="ds-fieldrow__value">
                    <div class="ds-fieldrow__chips" x-show="erOne.refined"><template x-for="k in ((erOne.refined || {}).keywords || [])" x-bind:key="k.text"><span class="ds-badge" x-bind:class="k.kind === 'combo' ? 'ds-badge--category' : 'ds-badge--entity'" x-text="k.text + (k.kind === 'combo' ? ' · 조합형' : ' · 단일형')"></span></template></div>
                    <p class="ds-hint ds-hint--error" x-show="erOne.error" x-text="erOne.error"></p></dd></div>
                  <div class="ds-fieldrow"><dt class="ds-fieldrow__label">모델 · 지연</dt><dd class="ds-fieldrow__value tnum" x-text="erOneMeta()"></dd></div>
                </dl>
                <table class="ds-table ds-table--compact w-full" x-show="erOne.refined">
                  <thead><tr><th>엔티티</th><th>정식명</th><th>유형</th><th class="tnum">관련도</th><th>키워드 후보</th></tr></thead>
                  <tbody><template x-for="e in ((erOne.refined || {}).entities || [])" x-bind:key="e.name">
                    <tr><td x-text="e.name"></td><td x-text="e.canonical === e.name ? '·' : e.canonical"></td><td x-text="e.type || '·'"></td><td class="tnum" x-text="e.relevance"></td><td x-text="e.keep ? '예' : '제외'"></td></tr>
                  </template></tbody>
                </table>
                <div class="flex items-center gap-2 flex-wrap" x-show="erOne.hash && erOne.refined">
                  <span class="ds-label">구독·콘텐츠 묶음에 적합하고 검색 의도에도 맞는 키워드는 어느 쪽인가요?</span>
                  <template x-for="p in erPicks" x-bind:key="p[0]"><button type="button" class="ds-btn ds-btn--outline ds-btn--s-sm" x-bind:disabled="erOne._voted" x-on:click="erVote(erOne, p[0])" x-text="p[1]"></button></template>
                  <span class="ds-hint" x-show="erOne._voted" x-cloak>기록했습니다</span>
                </div>
              </div>
            </template>
          </div>
        </section>

        <section class="panel" x-show="erMode === 'batch'" x-cloak>
          <div class="panel-hd"><b>다건 · 정답셋 일괄</b><span class="meta">카테고리별 무작위 선정 · 키워드 생성 후 문장 생성 · 콘텐츠 4건씩</span></div>
          <div class="panel-bd dc-body">
            <div class="dc-row">
              <div><label class="ds-label" for="er-n">건수</label><input id="er-n" class="ds-field dc-num" type="number" min="1" max="300" x-model.number="erN"></div>
              <p class="ds-hint" x-text="erVotesTxt()"></p>
              <button type="button" class="ds-btn ds-btn--solid ds-btn--c-primary ds-btn--s-sm ml-auto" x-bind:disabled="erRunning || !erCfg" x-on:click="erRun()" x-text="erRunning ? '재가공 중…' : '일괄 재가공 실행'"></button>
            </div>
            <ul class="ds-bullets"><li>엔티티가 있는 정답을 대분류별로 고르게 뽑습니다<ul><li>카테고리가 없으면 인텐트로 나누며, 실행할 때마다 다시 선정합니다</li></ul></li></ul>
            <div class="ds-progress" x-show="erRunning" x-cloak>
              <div class="ds-progress__head"><span class="ds-progress__label">진행</span><span class="ds-progress__pct" x-text="erDone + ' / ' + erTotal"></span></div>
              <div class="ds-progress__track"><div class="ds-progress__fill" x-bind:style="'width:' + (erTotal ? Math.round(erDone * 100 / erTotal) : 0) + '%'"></div></div>
              <p class="ds-hint" x-text="erPhase"></p>
            </div>
            <ul class="ds-bullets" x-show="erMsg" x-cloak><template x-for="(s,i) in sents(erMsg)" x-bind:key="i"><li><span x-bind:class="erErr ? 'ds-hint ds-hint--error' : ''" x-text="s"></span></li></template></ul>
            <template x-if="erSum && (erSum.n || erSum.sent_n)">
            <div class="ds-stat-grid">
              <div class="ds-stat"><div class="ds-stat__value tnum" x-text="(erSum.overlap_avg ?? '·') + ' / 3'"></div><div class="ds-stat__label">지금 방식과 겹친 키워드</div></div>
              <div class="ds-stat"><div class="ds-stat__value tnum" x-text="erSum.dropped_share != null ? Math.round(erSum.dropped_share * 100) + '%' : '·'"></div><div class="ds-stat__label">후보에서 뺀 엔티티</div></div>
              <div class="ds-stat"><div class="ds-stat__value tnum" x-text="erSum.combo_share != null ? Math.round(erSum.combo_share * 100) + '%' : '·'"></div><div class="ds-stat__label">조합형 키워드 비율</div></div>
              <div class="ds-stat"><div class="ds-stat__value tnum" x-text="erSum.sent_len_avg != null ? erSum.sent_len_avg + '자' : '·'"></div><div class="ds-stat__label">성공 문장 평균 길이</div></div>
              <div class="ds-stat"><div class="ds-stat__value tnum" x-text="(erSum.fails || 0) + ' · ' + (erSum.sent_fails || 0)"></div><div class="ds-stat__label">실패(키워드 · 문장)</div></div>
              <div class="ds-stat"><div class="ds-stat__value tnum" x-text="erSum.empty || 0"></div><div class="ds-stat__label">키워드 없음 · 검토 필요</div></div>
            </div>
            </template>
            <div x-show="erItems.length" x-cloak>
              <template x-for="it in erPageItems()" x-bind:key="it.hash">
                <article class="content-section fn-stack" x-bind:aria-label="it.title || it.hash">
                  <header class="content-section__head" style="margin-bottom:0;padding-bottom:var(--ds-space-4);border-bottom:1px solid var(--ds-hairline-soft)"><h3 class="content-section__title" x-text="it.title || it.hash"></h3><button type="button" class="ds-btn ds-btn--secondary ds-btn--s-sm ml-auto" x-show="it.content" x-on:click="erOpenContent(it)">콘텐츠 상세</button></header>
                  <div class="layout-grid--two">
                  <section class="fn" aria-label="기존 메타 리드문"><div class="flex items-center gap-2 flex-wrap"><b class="fn__title">기존 메타 · 리드문</b><span class="ds-hint tnum" x-show="(it.sentence || {}).base" x-text="Array.from((it.sentence || {}).base || '').length + '자 · 공백 포함'"></span></div><p class="tbox" x-text="(it.sentence || {}).base || '기존 리드문이 없습니다'"></p></section>
                  <section class="fn" aria-label="핵심 문장 결과">
                    <div class="flex items-center gap-2 flex-wrap"><b class="fn__title">핵심 문장 · 재가공</b><span class="ds-hint tnum" x-show="erSentenceText(it.sentence)" x-text="erSentenceLength(it.sentence) + '자 · 공백 포함'"></span><span class="ds-badge ds-badge--error" x-show="(it.sentence || {}).draft">검사 미통과 · 생성 초안</span></div>
                    <p class="tbox" x-text="erSentenceText(it.sentence) || '생성된 문장이 없습니다'"></p>
                    <p class="ds-hint" x-show="erSentenceText(it.sentence) && !it.sentence.from_keywords">키워드 없이 메타만으로 생성</p>
                    <p class="ds-hint ds-hint--error" x-show="(it.sentence || {}).error" x-text="(it.sentence || {}).error"></p>
                  </section>
                </div>
                  <dl class="ds-deflist">
                    <div class="ds-fieldrow"><dt class="ds-fieldrow__label">키워드 · 재가공</dt><dd class="ds-fieldrow__value">
                      <div class="ds-fieldrow__chips" x-show="!it.error"><template x-for="k in ((it.refined || {}).keywords || [])" x-bind:key="k.text"><span class="ds-badge" x-bind:class="k.kind === 'combo' ? 'ds-badge--category' : 'ds-badge--entity'" x-text="k.text"></span></template></div>
                      <span class="ds-hint" x-show="!it.error && !((it.refined || {}).keywords || []).length">선정된 키워드 없음</span><span class="ds-hint ds-hint--error" x-show="it.error" x-text="it.error"></span>
                    </dd></div>
                    <div class="ds-fieldrow"><dt class="ds-fieldrow__label">키워드 · 지금 방식</dt><dd class="ds-fieldrow__value ds-fieldrow__chips"><template x-for="b in (it.base || [])" x-bind:key="b.name"><span class="ds-badge ds-badge--entity" x-text="b.name"></span></template></dd></div>
                  </dl>
                  <div class="control-row control-row--compact"><span class="ds-label">키워드 비교</span><div class="flex gap-2 flex-wrap" x-show="!it.error && !it._voted"><template x-for="p in erPicks" x-bind:key="p[0]"><button type="button" class="ds-btn ds-btn--ghost ds-btn--s-sm" x-on:click="erVote(it, p[0])" x-text="p[1]"></button></template></div><span class="ds-hint" x-show="it._voted" x-text="'기록 · ' + erPickKo(it._voted)"></span></div>
                </article>
              </template>
            </div>
            <nav class="ds-pagination control-row" aria-label="핵심 키워드 결과 페이지" x-show="erItems.length" x-cloak>
              <span class="ds-hint" x-text="erPageLine()"></span>
              <label class="ds-label" for="er-page-size">페이지당 결과</label>
              <select id="er-page-size" class="ds-field dc-num" x-model.number="erPageSize" x-on:change="erPage = 1"><option value="10">10건</option><option value="20">20건</option><option value="50">50건</option></select>
              <button type="button" class="ds-btn ds-btn--outline ds-btn--s-sm ml-auto" x-bind:disabled="erPage <= 1" x-on:click="erPage--">이전</button>
              <span class="tnum" aria-live="polite" x-text="erPage + ' / ' + erPageCount()"></span>
              <button type="button" class="ds-btn ds-btn--outline ds-btn--s-sm" x-bind:disabled="erPage >= erPageCount()" x-on:click="erPage++">다음</button>
            </nav>
          </div>
        </section>

        </div>
      </template>
