      <!-- 실험실 › 엔티티 재처리(운영자 전용) · labTab==='entref' · 06-quality-lab 탭 바에 의존
           1차 엔티티를 서비스(구독) 키워드 용도로 다시 정리하는 추가 호출 시험 · 지금 방식(확신도 상위 3)과 나란히 ·
           투표가 키워드 정답 라벨로 쌓인다 · 로직 prism/entrefine.py · 디자인 시스템 컴포넌트만 사용 -->
      <template x-if="mod === 'lab'">
        <div x-show="labTab === 'entref'" x-cloak class="w-full dc-body">

        <section class="panel">
          <div class="panel-hd"><b>엔티티 재처리 · 구독 키워드 3개</b><span class="meta">1차 엔티티를 한 번 더 정리해 구독할 만한 키워드를 고르는 추가 호출</span><span class="ds-badge ds-badge--neutral ml-auto">운영자 전용</span></div>
          <div class="panel-bd dc-body">
            <ul class="ds-bullets">
              <li>지금 확신도는 정답과 비교하면 모델 순서와 판별력이 같습니다(AUC 0.64) · 확신도 상위 3개는 사실상 모델이 앞에 낸 3개입니다<ul><li>정답셋 엔티티는 초안과 87%가 그대로라 '본문에 있는 이름인가'만 확인됩니다 · 구독 키워드로 좋은지는 아래 비교 투표로 라벨을 쌓아 잽니다</li></ul></li>
              <li>재처리 결과는 두 종류입니다<ul><li><b>엔티티 키워드</b>: 1차 엔티티에서 고르고 사전 정식명으로 맞춥니다 · <b>주제 키워드</b>: 엔티티로 주제가 안 잡힐 때만, 제목·본문에 그대로 나오는 말</li></ul></li>
            </ul>
            <div class="dc-row">
              <div>
                <label class="ds-label">재처리 모델</label>
                <x-modelpick key="erf" value="erModel" set="erModel=$v" options="availableModels" width="260px" tip="재처리 호출에 쓰는 모델 · 비우면 기본 모델"></x-modelpick>
              </div>
              <p class="ds-hint" x-text="erVotesTxt()"></p>
            </div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-hd"><b>한 건 시험</b><span class="meta">정답셋 해시를 넣거나 제목·본문·엔티티를 직접 입력</span></div>
          <div class="panel-bd dc-body">
            <div>
              <label class="ds-label" for="er-hash">정답셋 콘텐츠 해시</label>
              <input id="er-hash" class="ds-field" x-model="erHash" placeholder="비우면 아래 직접 입력을 씁니다">
            </div>
            <div x-show="!erHash" x-cloak class="dc-body">
              <div><label class="ds-label" for="er-title">제목</label><input id="er-title" class="ds-field" x-model="erTitle"></div>
              <div><label class="ds-label" for="er-body">본문</label><textarea id="er-body" class="ds-field" rows="4" x-model="erBody"></textarea></div>
              <div><label class="ds-label" for="er-ents">1차 엔티티(쉼표로 구분 · 모델이 낸 순서대로)</label><input id="er-ents" class="ds-field" x-model="erEnts" placeholder="예: 한국은행, 기준금리, 이창용"></div>
            </div>
            <div class="flex items-center gap-3">
              <button type="button" class="ds-btn ds-btn--solid ds-btn--c-primary ds-btn--s-sm" x-bind:disabled="erTrying" x-on:click="erTry()" x-text="erTrying ? '재처리 중…' : '재처리해 보기'"></button>
              <p class="ds-hint ds-hint--error" x-show="erOneErr" x-cloak x-text="erOneErr"></p>
            </div>
            <template x-if="erOne">
              <div class="dc-body">
                <dl class="ds-deflist">
                  <div class="ds-fieldrow"><dt class="ds-fieldrow__label">지금 방식</dt><dd class="ds-fieldrow__value ds-fieldrow__chips"><template x-for="b in erOne.base" x-bind:key="b.name"><span class="ds-badge ds-badge--entity" x-text="b.name + ' ' + Math.round(b.conf * 100)"></span></template></dd></div>
                  <div class="ds-fieldrow"><dt class="ds-fieldrow__label">재처리</dt><dd class="ds-fieldrow__value ds-fieldrow__chips"><template x-for="k in erOne.refined.keywords" x-bind:key="k.text"><span class="ds-badge" x-bind:class="k.kind === 'concept' ? 'ds-badge--intent' : 'ds-badge--entity'" x-text="k.text + (k.kind === 'concept' ? ' · 주제' : '')"></span></template></dd></div>
                  <div class="ds-fieldrow"><dt class="ds-fieldrow__label">지연 · 토큰</dt><dd class="ds-fieldrow__value tnum" x-text="erOne.latency_ms + 'ms · 입력 ' + ((erOne.tokens || {}).in || 0) + ' · 출력 ' + ((erOne.tokens || {}).out || 0)"></dd></div>
                </dl>
                <table class="ds-table ds-table--compact w-full">
                  <thead><tr><th>1차 엔티티</th><th>정식명</th><th>유형</th><th class="tnum">관련도</th><th>키워드 후보</th></tr></thead>
                  <tbody><template x-for="e in erOne.refined.entities" x-bind:key="e.name">
                    <tr><td x-text="e.name"></td><td x-text="e.canonical === e.name ? '·' : e.canonical"></td><td x-text="e.type || '·'"></td><td class="tnum" x-text="e.relevance"></td><td x-text="e.keep ? '예' : '제외'"></td></tr>
                  </template></tbody>
                </table>
                <div class="flex items-center gap-2 flex-wrap" x-show="erOne.hash">
                  <span class="ds-label">어느 쪽이 구독 키워드로 낫나요?</span>
                  <template x-for="p in erPicks" x-bind:key="p[0]"><button type="button" class="ds-btn ds-btn--outline ds-btn--s-sm" x-bind:disabled="erOne._voted" x-on:click="erVote(erOne, p[0])" x-text="p[1]"></button></template>
                  <span class="ds-hint" x-show="erOne._voted" x-cloak>기록했습니다</span>
                </div>
              </div>
            </template>
          </div>
        </section>

        <section class="panel">
          <div class="panel-hd"><b>정답셋 일괄 시험</b><span class="meta">엔티티가 3개 이상인 정답에서 · 동시 4건</span></div>
          <div class="panel-bd dc-body">
            <div class="dc-row">
              <div><label class="ds-label" for="er-n">건수</label><input id="er-n" class="ds-field dc-num" type="number" min="1" max="300" x-model.number="erN"></div>
              <button type="button" class="ds-btn ds-btn--solid ds-btn--c-primary ds-btn--s-sm ml-auto" x-bind:disabled="erRunning" x-on:click="erRun()" x-text="erRunning ? '재처리 중…' : '일괄 재처리 실행'"></button>
            </div>
            <div class="ds-progress" x-show="erRunning" x-cloak>
              <div class="ds-progress__head"><span class="ds-progress__label">진행</span><span class="ds-progress__pct" x-text="erDone + ' / ' + erTotal"></span></div>
              <div class="ds-progress__track"><div class="ds-progress__fill" x-bind:style="'width:' + (erTotal ? Math.round(erDone * 100 / erTotal) : 0) + '%'"></div></div>
            </div>
            <p class="ds-hint" x-bind:class="erErr ? 'ds-hint--error' : ''" x-show="erMsg" x-cloak x-text="erMsg"></p>
            <template x-if="erSum && erSum.n">
            <div class="ds-stat-grid">
              <div class="ds-stat"><div class="ds-stat__value tnum" x-text="erSum.n"></div><div class="ds-stat__label">재처리 성공</div></div>
              <div class="ds-stat"><div class="ds-stat__value tnum" x-text="erSum.overlap_avg + ' / 3'"></div><div class="ds-stat__label">지금 방식과 겹친 키워드</div></div>
              <div class="ds-stat"><div class="ds-stat__value tnum" x-text="Math.round(erSum.dropped_share * 100) + '%'"></div><div class="ds-stat__label">후보에서 뺀 엔티티</div></div>
              <div class="ds-stat"><div class="ds-stat__value tnum" x-text="Math.round(erSum.concept_share * 100) + '%'"></div><div class="ds-stat__label">주제 키워드 비율</div></div>
              <div class="ds-stat"><div class="ds-stat__value tnum" x-text="erSum.renamed"></div><div class="ds-stat__label">사전 정식명으로 바뀜</div></div>
            </div>
            </template>
            <table class="ds-table ds-table--compact w-full" x-show="erItems.length" x-cloak>
              <thead><tr><th>콘텐츠</th><th>지금 방식(확신도 상위 3)</th><th>재처리</th><th>어느 쪽이 낫나요</th></tr></thead>
              <tbody><template x-for="it in erItems" x-bind:key="it.hash">
                <tr>
                  <td x-text="it.title || it.hash"></td>
                  <td><div class="ds-fieldrow__chips"><template x-for="b in (it.base || [])" x-bind:key="b.name"><span class="ds-badge ds-badge--entity" x-text="b.name"></span></template></div></td>
                  <td><div class="ds-fieldrow__chips" x-show="!it.error"><template x-for="k in ((it.refined || {}).keywords || [])" x-bind:key="k.text"><span class="ds-badge" x-bind:class="k.kind === 'concept' ? 'ds-badge--intent' : 'ds-badge--entity'" x-text="k.text"></span></template></div><span class="ds-hint ds-hint--error" x-show="it.error" x-text="it.error"></span></td>
                  <td><div class="flex gap-2 flex-wrap" x-show="!it.error && !it._voted"><template x-for="p in erPicks" x-bind:key="p[0]"><button type="button" class="ds-btn ds-btn--ghost ds-btn--s-sm" x-on:click="erVote(it, p[0])" x-text="p[1]"></button></template></div><span class="ds-hint" x-show="it._voted" x-text="'기록 · ' + erPickKo(it._voted)"></span></td>
                </tr>
              </template></tbody>
            </table>
          </div>
        </section>

        </div>
      </template>
