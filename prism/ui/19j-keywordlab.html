<template x-if="mod === 'lab'"><template x-if="labTab === 'entref' && ['run','prompts','improve','sheet'].includes(kwTab)">
<div x-show="labTab === 'entref' && ['run','prompts','improve','sheet'].includes(kwTab)" x-cloak class="w-full dc-body kw-workspace" x-on:beforeunload.window="kwBeforeUnload($event)">
  <div class="control-row"><label class="selctl"><span class="selctl__lbl">실험 대상</span><select class="field" aria-label="실험 대상" x-bind:value="kwTarget" x-bind:disabled="kwBusy" x-on:change="kwTargetChange($event.target.value);$event.target.value=kwTarget"><option value="keyword">핵심 키워드</option><option value="sentence">핵심 문장</option></select></label><span class="meta" x-text="kwTarget==='sentence' ? '문장 검수·정답셋·프롬프트 개선' : '키워드별 검수·정답셋·프롬프트 개선'"></span></div>
  <ul class="ds-bullets" role="alert" x-show="kwError" x-data="{ lines: [] }" x-effect="lines=sents(kwError)">
        <li x-bind:class="kwError ? 'ds-hint--error' : ''"><span x-text="lines[0]"></span><ul x-show="lines.length>1"><template x-for="(line,i) in lines.slice(1)" x-bind:key="i"><li x-bind:class="kwError ? 'ds-hint--error' : ''" x-text="line"></li></template></ul></li>
      </ul>
  <ul class="ds-bullets" role="status" x-show="kwMessage" x-data="{ lines: [] }" x-effect="lines=sents(kwMessage)">
        <li><span x-text="lines[0]"></span><ul x-show="lines.length>1"><template x-for="(line,i) in lines.slice(1)" x-bind:key="i"><li x-text="line"></li></template></ul></li>
      </ul>


  <section role="tabpanel" id="kw-panel-run" aria-labelledby="kw-tab-run" x-show="kwTab==='run'" class="dc-body">
    <div class="stepline"><span class="stepline__no">STEP 1</span><b>테스트 방식</b><span class="meta">단일 모델 테스트 또는 비교 실험 선택</span></div>
    <section class="panel">
      <div class="panel-bd dc-body">
        <fieldset class="kw-mode-options" x-bind:disabled="kwBusy"><legend class="sr-only">테스트 방식 선택</legend>
          <div class="ds-segmented" role="group" aria-label="테스트 방식">
            <button type="button" class="ds-segmented__item" x-bind:aria-pressed="kwMode==='single' ? 'true' : 'false'" x-on:click="kwChooseMode('single')">단일 모델 테스트</button>
            <button type="button" class="ds-segmented__item" x-bind:aria-pressed="kwMode==='compare' ? 'true' : 'false'" x-on:click="kwChooseMode('compare')">모델·버전 비교 실험</button>
          </div>
        </fieldset>
        <ul class="ds-bullets" x-show="!kwMode"><li>단일 모델 테스트는 모델 1개로 콘텐츠 1~100건을 확인합니다</li><li>비교 실험은 동일한 콘텐츠에서 모델·프롬프트 버전 2~3개를 비교합니다</li></ul>
        <div x-show="kwMode==='compare'" class="control-row">
          <label class="selctl"><span class="selctl__lbl">비교 조합</span><select class="field" aria-label="비교 조합" x-model.number="kwCount"><option value="2">2개 조합</option><option value="3">3개 조합</option></select></label>
          <label class="kw-check"><input type="checkbox" x-model="kwBlind">모델·버전 가리고 검수</label>
        </div>
        <ul class="ds-bullets" x-show="kwMode==='compare'"><li>같은 모델의 다른 프롬프트 버전도 비교할 수 있습니다</li><li x-show="kwBlind">결과를 A·B·C로 섞어 보여주고, 각 결과를 검수한 뒤 모델·버전을 공개합니다</li></ul>
      </div>
    </section>
    <div class="stepline" x-show="kwMode"><span class="stepline__no">STEP 2</span><b>모델·프롬프트 설정</b><span class="meta" x-text="kwMode==='single' ? '모델 1개와 프롬프트 버전 선택' : kwCount+'개 조합의 모델·프롬프트 버전 선택'"></span></div>
    <section class="panel" x-show="kwMode">
      <div class="panel-bd dc-body">
        <div class="overflow-auto"><table class="ds-table model-compare-table kw-settings-table" x-bind:style="'--compare-model-count:'+kwCount">
          <colgroup><col class="model-compare-label"><template x-for="(s,i) in kwSlots.slice(0,kwCount)" x-bind:key="i"><col></template></colgroup>
          <thead><tr><th scope="col">설정 항목</th><template x-for="(s,i) in kwSlots.slice(0,kwCount)" x-bind:key="i"><th scope="col" x-text="kwMode==='single' ? '테스트 모델' : '조합 '+(i+1)"></th></template></tr></thead>
          <tbody>
            <tr><th scope="row">모델</th><template x-for="(s,i) in kwSlots.slice(0,kwCount)" x-bind:key="i"><td><div class="control-row kw-model-control"><x-modelpick key="kwslot" value="s.model" set="kwModel(s,$v)" groups="textGroups" first-label="모델 선택" first-value="" width="0" tip="이 조합의 실행 모델"></x-modelpick></div></td></template></tr>
            <tr><th scope="row">프롬프트 버전</th><template x-for="(s,i) in kwSlots.slice(0,kwCount)" x-bind:key="i"><td><div class="control-row kw-version-control"><select class="field" x-model="s.version_id" x-bind:disabled="!s.model || !kwVersions(s.model).length" x-bind:aria-label="'조합 '+(i+1)+' 프롬프트 버전'"><option value="" x-text="!s.model ? '모델을 먼저 선택하세요' : kwVersions(s.model).length ? '버전 선택' : '저장된 버전 없음'"></option><template x-for="v in kwVersions(s.model)" x-bind:key="v.id"><option x-bind:value="v.id" x-bind:selected="s.version_id===v.id" x-text="kwVersionLabel(v)"></option></template></select></div></td></template></tr>
            <tr><th scope="row">버전 관리</th><template x-for="(s,i) in kwSlots.slice(0,kwCount)" x-bind:key="i"><td><button type="button" class="ds-btn ds-btn--ghost ds-btn--s-sm" x-on:click="kwCreateVersion(i)" x-bind:disabled="kwBusy || !kwCatalog?.can_manage">새 버전 만들기</button></td></template></tr>
          </tbody>
        </table></div>
        <p class="meta" role="status" x-show="!kwCatalog || !kwCatalog.can_manage" x-text="!kwCatalog ? '실험 설정을 불러오는 중입니다. 실패하면 새로고침을 눌러 주세요.' : '새 버전 저장과 실험 실행에는 운영 권한이 필요합니다.'"></p>
        <ul class="ds-bullets"><li>선택한 모델에 저장된 프롬프트 버전만 표시합니다</li><li>‘새 버전 만들기’에서 모델과 규칙을 선택하고 저장하면 해당 조합에 연결됩니다</li></ul>
      </div>
    </section>
    <div class="stepline" x-show="kwMode"><span class="stepline__no">STEP 3</span><b>콘텐츠 선택</b><span class="meta" x-text="kwMode==='single' ? '테스트할 콘텐츠와 건수 선택' : '모든 조합에 동일한 콘텐츠·입력 메타 적용'"></span></div>
    <section class="panel" x-show="kwMode">
      <div class="panel-bd dc-body">
        <div class="control-row"><label class="selctl"><span class="selctl__lbl">입력 방식</span><select class="field" aria-label="콘텐츠 입력 방식" x-model="kwSource" x-on:change="kwSourceChanged()"><option value="direct">메타 직접 입력</option><option value="excel" x-bind:disabled="kwTarget!=='keyword'">엑셀 업로드</option><option value="sample">콘텐츠 정답셋에서 샘플</option><option value="hash">콘텐츠 정답셋 해시 지정</option><option value="reuse">기존 실험의 입력 재사용</option></select></label></div>
        <div x-show="kwSource==='direct'" class="fn-stack">
          <label class="fn"><span class="ds-label">콘텐츠 이름 · 선택</span><input class="field" x-model="kwTitle" placeholder="실험 기록에 표시할 이름"></label>
          <label class="fn"><span class="ds-label">리드문 · 필수</span><textarea class="field" rows="3" x-model="kwLead" placeholder="발행된 리드문을 입력하세요"></textarea></label>
          <div class="layout-grid--two">
            <label class="fn"><span class="ds-label" x-text="kwTarget==='keyword' ? '엔티티 · 필수' : '엔티티 · 선택'"></span><input class="field" x-model="kwEntities" placeholder="쉼표로 구분"></label>
            <label class="fn"><span class="ds-label">인텐트 · 선택</span><input class="field" x-model="kwIntents" placeholder="쉼표로 구분"></label>
          </div>
          <label class="fn"><span class="ds-label">카테고리 · 선택</span><input class="field" x-model="kwCategories" placeholder="쉼표로 구분"></label>
        </div>
        <div x-show="kwSource==='excel'" class="dc-body">
          <div class="control-row"><button type="button" class="ds-btn ds-btn--outline ds-btn--s-sm" x-on:click="kwExcelTemplate()">엑셀 양식 받기</button></div>
          <label class="dropzone" x-bind:class="kwXlsDrag ? 'drag' : ''" x-on:dragover.prevent="kwXlsDrag=true" x-on:dragleave.prevent="kwXlsDrag=false" x-on:drop.prevent="kwXlsDrag=false;kwExcelPick($event.dataTransfer.files[0])">
            <span class="name" x-text="kwXlsDrag ? '여기에 놓기' : ((kwExcel ? kwExcel.name : '선택된 파일 없음')+' · 끌어다 놓기 가능')"></span>
            <span class="pick"><svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 21h14"/></svg>엑셀 업로드</span>
            <input type="file" accept=".xlsx,.csv" class="sr-only" x-bind:disabled="kwBusy" x-on:change="kwExcelPick($event.target.files[0]);$event.target.value=''">
          </label>
          <ul class="ds-bullets"><li>열: 콘텐츠 이름 · 리드문(필수) · 엔티티(필수) · 인텐트 · 카테고리<ul><li>값이 여러 개면 쉼표로 구분합니다</li><li>한 번에 최대 100건 · 2MB 이하 xlsx·csv</li></ul></li></ul>
          <template x-if="kwExcel"><section class="dc-body" aria-live="polite">
            <p class="ds-label" x-text="'반영 결과 · 반영 '+kwExcel.rows.length+'건 · 제외 '+kwExcel.rejected.length+'건'"></p>
            <div class="overflow-auto" style="max-height:320px"><table class="ds-table"><thead><tr><th>행</th><th>콘텐츠 이름</th><th>리드문</th><th>엔티티</th><th>상태</th></tr></thead><tbody>
              <template x-for="r in kwExcelRows()" x-bind:key="'xr'+r.row"><tr>
                <td class="text-muted tnum" x-text="r.row"></td>
                <td class="text-ink" x-text="r.title || '·'"></td>
                <td class="text-muted"><p class="kwl-ellipsis" x-bind:title="r.meta.summary" x-text="r.meta.summary || '·'"></p></td>
                <td class="text-muted" x-text="r.meta.entities.join(' · ') || '·'"></td>
                <td><span class="ds-badge" x-bind:class="r.reason ? 'ds-badge--warning' : 'ds-badge--success'" x-text="r.reason ? '제외 · '+r.reason : '반영'"></span></td>
              </tr></template>
              <tr x-show="!kwExcelRows().length"><td colspan="5" class="text-xs text-muted">읽을 수 있는 행이 없습니다</td></tr>
            </tbody></table></div>
          </section></template>
        </div>
        <div x-show="kwSource==='sample'" class="dc-body">
          <div class="control-row"><label for="kw-sample" class="ds-label">샘플 수</label><input id="kw-sample" type="number" min="1" max="100" class="field kw-count-field" x-model.number="kwSample"><span class="meta">최대 100건</span></div>
          <ul class="ds-bullets"><li>엔티티가 있는 콘텐츠 정답셋에서 입력한 수만큼 가져옵니다</li></ul>
        </div>
        <label x-show="kwSource==='hash'" class="fn"><span class="ds-label" x-text="'콘텐츠 해시 · 최대 100개'"></span><textarea class="field" x-model="kwHashes" rows="2" placeholder="줄바꿈 또는 쉼표로 구분"></textarea></label>
        <label x-show="kwSource==='reuse'" class="fn"><span class="ds-label">입력을 재사용할 실험</span><select class="field" x-model="kwReuse" x-on:change="kwLoadInputRun(kwReuse)"><option value="">실험 선택</option><template x-for="r in kwReusableRuns()" x-bind:key="r.id"><option x-bind:value="r.id" x-text="kwTargetLabel(r.target || 'keyword')+' · '+kwDate(r.created_at)+' · 콘텐츠 '+r.n+'건'" x-bind:selected="String(r.id) === String(kwReuse)"></option></template></select></label>
        <div x-show="kwTarget==='sentence'" class="content-section dc-body">
          <b class="fn__title">문장에 사용할 핵심 키워드</b>
          <ul class="ds-bullets" x-show="kwSource==='reuse' && kwInputRun?.target==='sentence'"><li>기존 문장 실험의 입력 키워드를 그대로 사용합니다</li></ul>
          <div class="dc-body" x-show="!(kwSource==='reuse' && kwInputRun?.target==='sentence')">
            <label class="fn"><span class="ds-label">키워드 입력 방식</span><select class="field" x-model="kwKeywordSource"><option value="manual" x-bind:disabled="kwSource!=='direct'">직접 입력 · 단일 콘텐츠</option><option value="gold">콘텐츠별 키워드 정답 사용</option><option value="run" x-bind:disabled="kwSource!=='reuse'">선택한 키워드 실험 결과 사용</option><option value="none">키워드 없이 메타만 사용</option></select></label>
            <label class="fn" x-show="kwKeywordSource==='manual'"><span class="ds-label">입력 키워드 · 최대 3개</span><input class="field" x-model="kwSentenceKeywords" placeholder="쉼표로 구분"></label>
            <label class="fn" x-show="kwKeywordSource==='run'"><span class="ds-label">사용할 키워드 결과 조합</span><select class="field" x-model="kwKeywordSlot"><option value="">조합 선택</option><template x-for="s in (kwInputRun?.revealed && (kwInputRun.target || 'keyword')==='keyword' ? kwInputRun.slots : [])" x-bind:key="s.label"><option x-bind:value="s.label" x-text="s.label+' · '+s.version.model+' · '+kwVersionLabel(s.version)" x-bind:selected="String(s.label) === String(kwKeywordSlot)"></option></template></select></label>
          </div>
          <ul class="ds-bullets"><li>비교할 모든 모델에 같은 키워드와 메타를 전달합니다</li><li>입력 키워드도 실행 기록과 문장 정답에 함께 보관합니다</li></ul>
        </div>
      </div>
    </section>
    <div class="stepline" x-show="kwMode"><span class="stepline__no">STEP 4</span><b>실행·결과 확인</b></div>
    <section class="panel" x-show="kwMode">
      <div class="panel-bd dc-body">
        <ul class="ds-bullets"><li x-text="kwMode==='single' ? '모델 1개로 선택한 콘텐츠를 테스트합니다' : '모델·프롬프트 '+kwCount+'개 조합으로 같은 콘텐츠를 비교합니다'"></li><li x-show="kwInputIssue()" x-text="kwInputIssue()"></li></ul>
        <div class="control-row"><button type="button" class="ds-btn ds-btn--solid ds-btn--c-primary" x-bind:disabled="!kwReady() || !kwCatalog?.can_manage" x-on:click="kwStart()" x-text="kwBusy ? '실행 준비 중…' : kwMode==='single' ? '단일 모델 테스트 실행' : kwCount+'개 조합 비교 실행'"></button></div>
      </div>
    </section>
  <div class="control-row kw-history" x-show="kwTab==='prompts'">
    <label for="kw-history" class="ds-label">실험 기록</label>
    <select id="kw-history" class="field" x-bind:disabled="kwBusy" x-bind:value="kwRunId" x-on:change="kwOpenRun($event.target.value).then(()=>{$event.target.value=kwRunId})"><option value="">실험 선택</option><template x-for="r in kwRuns()" x-bind:key="r.id"><option x-bind:value="r.id" x-bind:selected="kwRunId===r.id" x-text="kwDate(r.created_at)+' · 콘텐츠 '+r.n+'개 · '+r.slots+'조합'"></option></template></select>
    <button class="ds-btn ds-btn--ghost ds-btn--s-sm" x-on:click="kwLoad()">새로고침</button><button type="button" class="ds-btn ds-btn--ghost ds-btn--s-sm" x-show="kwTab==='run'" x-bind:disabled="!kwRunData || kwRunData.status==='running'" x-on:click="kwDownloadXlsx()" data-tip="콘텐츠 × 조합 한 행 · 현재 값만 · 최종 확정이면 확정값, 아니면 모델 결과" data-tip-pos="bottom">엑셀 받기</button><button type="button" class="ds-btn ds-btn--ghost ds-btn--s-sm" x-show="kwTab==='run'" x-bind:disabled="!kwRunData || kwRunData.status==='running'" x-on:click="kwDownloadCsv()" data-tip="콘텐츠 × 조합 한 행 · 제목·본문·엔티티·핵심 키워드·핵심 문장·검수 결과" data-tip-pos="bottom">CSV 받기</button><button type="button" class="ds-btn ds-btn--outline ds-btn--c-danger ds-btn--s-sm" x-show="kwTab==='run' && kwCatalog?.can_manage" x-bind:disabled="!kwRunData || kwRunData.status==='running' || kwBusy" x-on:click="kwDeleteRun()" data-tip="정답셋 반영·버전 채택에 쓰인 실험은 삭제할 수 없습니다" data-tip-pos="bottom">기록 삭제</button>
  </div>
  <div class="stepline" x-show="kwTab==='run'"><span class="stepline__no">STEP 5</span><b>실험 기록</b><span class="meta">지난 실험을 골라 결과를 확인하고 검수합니다</span></div>
  <section class="panel" x-show="kwTab==='run'" aria-label="실험 기록">
    <div class="panel-hd"><b>실험 기록</b><span class="meta tnum" x-text="kwRuns().length+'건 · 행을 누르면 아래에 실행 결과가 열립니다'"></span><span class="ml-auto control-row"><button class="ds-btn ds-btn--ghost ds-btn--s-sm" x-on:click="kwLoad()">새로고침</button><button type="button" class="ds-btn ds-btn--ghost ds-btn--s-sm" x-show="kwTab==='run'" x-bind:disabled="!kwRunData || kwRunData.status==='running'" x-on:click="kwDownloadXlsx()" data-tip="콘텐츠 × 조합 한 행 · 현재 값만 · 최종 확정이면 확정값, 아니면 모델 결과" data-tip-pos="bottom">엑셀 받기</button><button type="button" class="ds-btn ds-btn--ghost ds-btn--s-sm" x-show="kwTab==='run'" x-bind:disabled="!kwRunData || kwRunData.status==='running'" x-on:click="kwDownloadCsv()" data-tip="콘텐츠 × 조합 한 행 · 제목·본문·엔티티·핵심 키워드·핵심 문장·검수 결과" data-tip-pos="bottom">CSV 받기</button><button type="button" class="ds-btn ds-btn--outline ds-btn--c-danger ds-btn--s-sm" x-show="kwTab==='run' && kwCatalog?.can_manage" x-bind:disabled="!kwRunData || kwRunData.status==='running' || kwBusy" x-on:click="kwDeleteRun()" data-tip="정답셋에 반영된 실험은 삭제할 수 없습니다" data-tip-pos="bottom">기록 삭제</button></span></div>
    <div class="panel-bd dc-body">
      <div class="overflow-auto" style="max-height:320px"><table class="ds-table"><thead><tr><th>실행 일시</th><th>콘텐츠</th><th>조합</th><th>상태</th></tr></thead><tbody>
        <template x-for="r in kwRuns()" x-bind:key="'kr'+r.id"><tr class="kwl-row" role="button" tabindex="0" x-bind:class="kwRunId===r.id ? 'is-sel' : ''" x-bind:aria-current="kwRunId===r.id ? 'true' : 'false'" x-on:click="kwBusy || kwOpenRun(r.id)" x-on:keydown.enter.prevent="kwBusy || kwOpenRun(r.id)">

      </tbody></table></div>
    </div>
  </section>
  <section class="panel" x-show="kwRunData && kwTab==='run'" x-data="{ query:'', category:'', state:'', rows:[] }" x-effect="rows=kwResultRows(query,category,state)" aria-label="실행 결과 콘텐츠 목록">
    <div class="panel-hd"><b>실행 결과</b><span class="meta" x-text="kwRunData ? kwState(kwRunData) : ''"></span><button class="ds-btn ds-btn--outline ds-btn--s-sm ml-auto" x-show="kwRunData && !kwRunData.revealed && kwCatalog?.can_manage" x-on:click="kwReveal()">모델·버전 공개</button></div>
    <div class="panel-bd dc-body"><p role="status" x-show="kwRunData?.error" x-text="kwRunData?.error || ''"></p>
      <div class="control-row" role="status" x-show="kwRunData?.sheet"><span class="meta tnum" x-text="kwSheetSummary()"></span><span class="ds-hint--error" x-show="kwRunData?.sheet?.write_error" x-text="kwRunData?.sheet?.write_error || ''"></span></div>

          <section class="fpop" x-data="{ fpOpen:false, fpBox:{} }" x-on:keydown.escape="fpOpen=false" x-on:click.outside="fpOpen=false" x-on:scroll.window="fpOpen=false" x-on:resize.window="fpOpen=false">
            <button type="button" class="fpop__btn" x-bind:class="{ 'is-open':fpOpen, 'is-on':Boolean(category)+Number(Boolean(state)) }" x-on:click="fpOpen=!fpOpen; if(fpOpen) fpBox=mpMenuBox($el)" x-bind:aria-expanded="fpOpen" aria-haspopup="dialog" aria-label="실행 결과 필터">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
              필터 <span class="fpop__n tnum" x-show="Boolean(category)+Number(Boolean(state))" x-text="Boolean(category)+Number(Boolean(state))"></span>
            </button>
            <section class="fpop__panel" x-show="fpOpen" x-cloak x-bind:style="fpBox" x-on:click.stop role="dialog" aria-label="실행 결과 필터 조건">
              <label class="fpop__row"><span class="fpop__lbl">카테고리</span><select class="field" x-model="category" aria-label="실행 결과 카테고리"><option value="">전체</option><template x-for="name in kwContentCategories((kwRunData?.items || []))" x-bind:key="name"><option x-bind:value="name" x-bind:selected="category===name" x-text="catKo(name)"></option></template></select></label>
              <label class="fpop__row"><span class="fpop__lbl">검수 상태</span><select class="field" x-model="state" aria-label="실행 결과 검수 상태"><option value="">전체</option><template x-for="name in ['대기','미검수','검수 중','판정됨','확정','실패']" x-bind:key="name"><option x-bind:value="name" x-bind:selected="state===name" x-text="name"></option></template></select></label>
              <footer class="fpop__ft"><button type="button" class="copybtn" x-bind:disabled="!query &amp;&amp; !(Boolean(category)+Number(Boolean(state)))" x-on:click="query='';category='';state=''">필터 초기화</button><button type="button" class="ds-btn ds-btn--primary ds-btn--s-sm" x-on:click="fpOpen=false">닫기</button></footer>
            </section>
          </section>
          <span class="text-xs text-muted tnum" role="status" x-text="rows.length+' / '+(kwRunData?.items || []).length+'건'"></span>
          <span class="ds-badge ds-badge--neutral">입력순</span>
        </section>
      <section class="overflow-auto kwl-wrap" tabindex="0" aria-label="실행 결과 표 · 가로·세로 스크롤"><table class="ds-table kwl-table"><thead><tr><th scope="col" class="kwl-state">상태</th><th scope="col">콘텐츠</th><th scope="col">카테고리</th>
        <template x-for="s in (kwRunData?.slots || [])" x-bind:key="'kh'+s.label"><th><span x-text="'조합 '+s.label"></span><p class="meta kwl-ellipsis" x-text="kwRunData.revealed ? s.version.model+' · '+kwVersionLabel(s.version) : '판정 후 공개'" x-bind:title="kwRunData.revealed ? s.version.model+' · '+kwVersionLabel(s.version) : ''"></p></th></template>
        <th class="kwl-act">검수</th></tr></thead><tbody>
        <template x-for="item in rows" x-bind:key="item.key"><tr role="button" tabindex="0" class="kwl-row" x-data="{ st: [] }" x-effect="st = kwItemState(item)" x-bind:class="kwReview && kwReview.item.key===item.key ? 'is-sel' : ''" x-on:click="kwOpenItem(item)" x-on:keydown.enter="kwOpenItem(item)">
          <td><span class="ds-badge" x-bind:class="st[1]" x-text="st[0]"></span></td>
          <td class="kwl-content text-ink"><span x-text="item.title"></span><p class="meta" x-show="kwPriorReviews(item).length" x-text="kwPriorReviews(item).length ? '기존 검수 '+kwPriorReviews(item).length+'건 · 최초 '+kwPriorReviews(item)[0].first_by : ''"></p><p class="meta" x-text="kwMetaList(item.meta.entities).join(' · ') || '엔티티 없음'"></p></td>
          <td class="kwl-category"><template x-for="c in kwMetaList(item.meta?.content_category)" x-bind:key="c"><span class="ds-badge ds-badge--category" x-bind:data-tip="termDef('category',c)" data-tip-pos="top" x-text="catKo(c)"></span></template><span class="text-xs text-muted" x-show="!kwMetaList(item.meta?.content_category).length">·</span></td>
          <template x-for="s in kwRunData.slots" x-bind:key="item.key+s.label"><td class="kwl-value" x-on:click.stop="kwReviewable(kwCell(item,s)) && kwEnterReview(item,s)" x-bind:class="kwReviewable(kwCell(item,s)) ? 'kwl-cell' : ''">
            <span class="ds-badge" x-bind:class="kwSlotBadge(kwCell(item,s))" x-text="kwSlotState(kwCell(item,s))"></span>
            <span class="ds-badge ds-badge--warning" x-show="kwCell(item,s)?.mock">모의</span>
            <p class="kwl-kw" x-bind:title="kwCandidates(kwCell(item,s)).map(k=>k.text).join(' · ')" x-text="kwCell(item,s)?.error && !kwReviewable(kwCell(item,s)) ? kwCell(item,s).error : (kwCandidates(kwCell(item,s)).map(k=>k.text).join(' · ') || (kwCell(item,s) ? kwTargetLabel()+' 없음' : '실행 대기 중…'))"></p>
          </td></template>
          <td x-on:click.stop><button type="button" class="ds-btn ds-btn--primary ds-btn--s-sm" x-show="['미검수','검수 중'].includes(st[0])" x-on:click="kwOpenItem(item)">검수하기</button><span class="text-xs text-muted kwl-done" x-show="['판정됨','확정'].includes(st[0])" x-on:click="kwOpenItem(item)" data-tip="상세에서 판정을 다시 보거나 수정" data-tip-pos="top" x-text="'✓ '+st[0]"></span></td>
        </tr></template>
        <tr x-show="!rows.length"><td x-bind:colspan="(kwRunData?.slots.length || 1)+4" class="text-xs text-muted" x-text="kwRunData?.items.length ? '검색·필터 조건에 맞는 콘텐츠가 없습니다' : '결과가 없습니다'"></td></tr>
      </tbody></table></section>
      <details class="dve__fold kwl-metrics"><summary>평가 항목 · 조합별 지표</summary><div class="overflow-auto"><table class="ds-table model-compare-table" x-bind:style="'--compare-model-count:'+(kwRunData?.slots.length || 1)"><thead><tr><th class="model-compare-label">평가 항목</th><template x-for="m in (kwRunData?.metrics || [])" x-bind:key="m.slot"><th x-text="m.slot"></th></template></tr></thead><tbody>
        <template x-for="row in [['완료 / 실패', m=>m.completed+' / '+m.failed],['적합 / 수정 / 제외',m=>kwRate(m,'accept')+' / '+kwRate(m,'edit')+' / '+kwRate(m,'exclude')],['키워드 구성 완전 일치 / 평가 콘텐츠',m=>m.exact_matches+' / '+m.exact_total],['빈 결과',m=>m.empty],['평균 소요 시간',m=>!kwRunData.revealed ? '판정 후 공개' : m.avg_ms==null ? '대기' : (m.avg_ms/1000).toFixed(1)+'초'],['토큰 / 비용',m=>!kwRunData.revealed ? '판정 후 공개' : m.tokens+' / '+kwMoney(m.cost_usd)]]" x-bind:key="row[0]"><tr><th x-text="row[0]"></th><template x-for="m in (kwRunData?.metrics || [])" x-bind:key="m.slot"><td x-text="row[1](m)"></td></template></tr></template>
      </tbody></table></div><ul class="ds-bullets"><li>적합·수정·제외 비율은 최종 확정한 판단 기준입니다. 완전 일치는 실행 당시 평가용 정답과 키워드 표기·구성이 모두 같은 콘텐츠 수입니다. 순서는 무관하며 추가·누락·표기 차이·실행 실패는 불일치입니다.</li></ul></details>
    </div>
  </section>
  <!-- 실행 결과 상세 · 검수: 콘텐츠 상세(detailview)와 같은 구성 · 좌 입력 메타 · 우 조합별 결과와 판정 -->
  <div class="ds-dialog-backdrop" x-show="kwTab==='run' && Boolean(kwReview)" x-cloak x-transition.opacity x-on:mousedown.self="kwCloseReview()" x-on:keydown.window="kwReviewKey($event)" style="z-index:74">
    <template x-if="kwReview"><div class="detailview detailview--wide" role="dialog" aria-modal="true" aria-label="실험 결과 상세" x-on:input="kwReview.final=null">
      <div class="detailview__hd">
        <span class="control-row control-row--compact"><b>실험 결과 상세 · 검수</b><span class="text-xs text-muted tnum" x-text="(kwReviewIndex()+1)+' / '+kwRunData.items.length"></span></span>
        <span class="control-row control-row--compact">
          <span class="text-xs text-muted" data-tip="← → 이전/다음 콘텐츠 · Esc 닫기" data-tip-pos="bottom">⌨ 단축키</span>
          <button type="button" class="ds-iconbtn ds-iconbtn--sm" x-bind:disabled="kwBusy || kwReviewIndex()<=0" x-on:click="kwReviewGo(-1)" aria-label="이전 콘텐츠"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button type="button" class="ds-iconbtn ds-iconbtn--sm" x-bind:disabled="kwBusy || kwReviewIndex()>=kwRunData.items.length-1" x-on:click="kwReviewGo(1)" aria-label="다음 콘텐츠"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button type="button" class="ds-iconbtn ds-iconbtn--sm" x-on:click="kwCloseReview()" aria-label="닫기"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
        </span>
      </div>
      <div class="detailview__body" x-bind:inert="kwBusy">
        <div class="detailview__content">
          <!-- 원문 링크가 있으면 '입력 메타 ↔ 원문 페이지' 탭(콘텐츠 상세와 같은 구성 · 배율은 dvcZoom 공유) -->
          <div class="dvc__viewtabs" x-show="kwSourceUrl()"><div class="ds-segmented" role="group" aria-label="보기 전환">
            <button type="button" class="ds-segmented__item" x-bind:aria-pressed="kwReviewView!=='web' ? 'true' : 'false'" x-on:click="kwReviewView='meta'">입력 메타</button>
            <button type="button" class="ds-segmented__item" x-bind:aria-pressed="kwReviewView==='web' ? 'true' : 'false'" x-on:click="kwReviewView='web'">원문 페이지</button>
          </div>
          <div class="ds-segmented ml-auto" role="group" aria-label="배율" x-show="kwReviewView==='web'"><template x-for="o in [{z:50,t:'작게'},{z:75,t:'보통'},{z:100,t:'크게'}]" x-bind:key="'kz'+o.z"><button type="button" class="ds-segmented__item" x-bind:aria-pressed="dvcZoom===o.z ? 'true' : 'false'" x-on:click="setDvcZoom(o.z)" x-text="o.t"></button></template></div></div>
          <h2 class="dvc__title" x-text="kwReview.item.title"></h2>
          <template x-if="kwReviewView==='web' && kwSourceUrl()"><div class="dvc__webwrap">
            <div class="dvc__webbox"><iframe class="dvc__web" x-bind:src="kwSourceUrl()" x-bind:style="'transform:scale('+(dvcZoom/100)+');width:'+(10000/dvcZoom)+'%;height:'+(10000/dvcZoom)+'%'" sandbox="allow-scripts allow-popups allow-forms" referrerpolicy="no-referrer" title="원문 페이지"></iframe></div>
            <ul class="ds-bullets hintbox kwd-gap-sm"><li>화면이 비어 보이면 이 사이트가 내장 표시를 차단한 것입니다</li><li><a x-bind:href="kwSourceUrl()" target="_blank" rel="noopener noreferrer" style="color:var(--ds-primary);font-weight:600">원문 바로가기 ↗</a>로 새 탭에서 확인하세요</li></ul>
          </div></template>
          <div x-show="kwReviewView!=='web' || !kwSourceUrl()">
            <div class="dve__lbl kwd-gap">리드문</div><div class="dvc__bodytext kwd-flush" x-text="kwReview.item.meta.summary || '·'"></div>
            <div class="dve__lbl kwd-gap">엔티티 · 발행 순서</div>
            <div class="flex flex-wrap gap-1"><template x-for="e in kwMetaList(kwReview.item.meta.entities)" x-bind:key="'ke'+e"><span class="ds-badge ds-badge--entity" x-text="e"></span></template></div>
            <div class="dve__lbl kwd-gap">인텐트</div>
            <div class="flex flex-wrap gap-1"><template x-for="e in kwMetaList(kwReview.item.meta.intent)" x-bind:key="'ki'+e"><span class="ds-badge ds-badge--intent" x-text="e"></span></template><span class="text-xs text-muted" x-show="!kwMetaList(kwReview.item.meta.intent).length">·</span></div>
            <div class="dve__lbl kwd-gap">카테고리</div>
            <div class="flex flex-wrap gap-1"><template x-for="e in kwMetaList(kwReview.item.meta.content_category)" x-bind:key="'kc'+e"><span class="ds-badge ds-badge--category" x-text="e"></span></template><span class="text-xs text-muted" x-show="!kwMetaList(kwReview.item.meta.content_category).length">·</span></div>
            <template x-if="kwReview.target==='sentence'"><div><div class="dve__lbl kwd-gap">입력 핵심 키워드</div>
              <div class="flex flex-wrap gap-1"><template x-for="k in (kwReview.item.keywords || [])" x-bind:key="'kk'+k.text"><span class="ds-badge ds-badge--neutral" x-text="k.text"></span></template><span class="text-xs text-muted" x-show="!(kwReview.item.keywords || []).length">없음 · 메타만 사용</span></div></div></template>
            <div class="dvc__note">모델에는 제목·본문을 전달하지 않습니다 · 제목은 검수자 식별용입니다</div>
          </div>
        </div>
        <section class="detailview__eval" aria-label="기존 검수와 현재 결과">
          <section x-show="kwPriorReviews(kwReview.item).length" aria-label="먼저 저장된 검수 결과">
            <h3 class="dve__lbl">기존 검수 결과</h3>
            <ul class="ds-bullets"><li>먼저 저장된 검수부터 확인하세요<ul><li>같은 입력으로 저장한 검수입니다 · 현재 조합의 판정에는 자동 반영되지 않습니다</li><li>최초 검수자와 최신 저장 내용을 표시합니다 · 저장 전 작업 여부는 표시되지 않습니다</li></ul></li></ul>
            <template x-for="(r,idx) in kwPriorReviews(kwReview.item)" x-bind:key="r.run_id+r.cell_id">
              <details class="dve__fold" x-bind:open="idx===0">
                <summary><span x-text="'최초 '+r.first_by+' · '+kwDate(r.first_at)"></span> <span class="ds-badge" x-bind:class="r.final ? 'ds-badge--success' : 'ds-badge--neutral'" x-text="r.final ? '확정' : '임시 저장'"></span></summary>
                <p class="meta" x-text="'최신 저장 '+r.by+' · '+kwDate(r.at)"></p>
                <p class="text-sm" x-text="r.answers.map(k=>k.text).join(' · ') || (r.no_keywords ? '적합한 결과 없음' : '확정 가능한 결과 없음')"></p>
                <ul class="ds-bullets"><template x-for="(j,ji) in r.judgments" x-bind:key="ji"><li><span x-text="j.original+' · '+({accept:'적합',edit:'수정',exclude:'제외',hold:'보류'}[j.verdict] || j.verdict)+(j.verdict==='edit' ? ' → '+j.corrected : '')"></span><ul x-show="j.reason"><li x-text="j.reason"></li></ul></li></template><template x-for="(a,ai) in r.additions" x-bind:key="'add'+ai"><li><span x-text="'추가 · '+a.text"></span><ul><li x-text="a.reason"></li></ul></li></template></ul>
                <p class="text-sm kwl-note" x-show="r.note" x-text="r.note"></p>
                <details class="dve__fold"><summary x-text="'변경 이력 '+r.history.length+'건'"></summary>
                  <ol class="ds-bullets"><template x-for="h in r.history" x-bind:key="h.id"><li>
                    <span x-text="h.by+' · '+kwDate(h.at)+(h.was_final ? ' · 확정' : ' · 저장')"></span>
                    <ul><li x-text="kwAnswers(h).map(k=>k.text).join(' · ') || '적합한 결과 없음'"></li><template x-for="(j,hi) in h.judgments" x-bind:key="hi"><li x-text="j.original+' · '+({accept:'적합',edit:'수정',exclude:'제외',hold:'보류'}[j.verdict] || j.verdict)+(j.corrected && j.verdict==='edit' ? ' → '+j.corrected : '')+(j.reason ? ' · '+j.reason : '')"></li></template><template x-for="(a,ai) in (h.additions || [])" x-bind:key="'ha'+ai"><li x-text="'추가 · '+a.text+' · '+a.reason"></li></template><li x-show="h.note" x-text="h.note"></li></ul>
                  </li></template></ol>
                </details>
                <button type="button" class="copybtn" x-show="r.run_id!==kwRunId || r.cell_id!==kwReview.cell_id" x-bind:disabled="kwBusy" x-on:click="kwViewPriorReview(r)">이 검수 결과 열기</button>
              </details>
            </template>
          </section>
          <section x-show="kwReview.readOnly" aria-label="검수 시작 안내">
            <ul class="ds-bullets"><li>기존 검수가 있어 읽기 전용으로 열었습니다<ul><li>추가 검수가 필요한 경우 담당자와 확인한 뒤 시작하세요</li></ul></li></ul>
            <button type="button" class="ds-btn ds-btn--outline ds-btn--s-sm" x-bind:disabled="kwBusy" x-on:click="kwEnableReview()">기존 결과 확인 후 현재 조합 검수</button>
          </section>
          <fieldset class="dc-body" x-bind:disabled="kwBusy || kwReview.readOnly" aria-label="결과 검수 입력">
          <div>
            <div class="dve__lbl">비교 조합 <span class="kwd-sub" x-text="kwRunData.revealed ? '· 모델·버전 공개됨' : '· 블라인드 · 모델·버전은 판정 후 공개'"></span></div>
            <div class="ds-segmented" role="group" aria-label="비교 조합"><template x-for="s in kwRunData.slots" x-bind:key="'ks'+s.label">
              <button type="button" class="ds-segmented__item" x-bind:aria-pressed="kwReview.slot===s.label ? 'true' : 'false'" x-bind:disabled="!kwReviewable(kwCell(kwReview.item,s))" x-on:click="kwEnterReview(kwReview.item,s)" x-bind:data-tip="kwRunData.revealed ? s.version.model+' · '+kwVersionLabel(s.version) : null" data-tip-pos="bottom">조합 <b x-text="s.label"></b><span x-text="kwSlotState(kwCell(kwReview.item,s))"></span></button>
            </template></div>
          </div>
          <p role="status" class="dve__hint" x-show="kwReviewCell()?.error" x-text="kwReviewCell()?.error"></p>
          <div class="kwd-split" x-bind:class="kwReviewCell()?.refined ? '' : 'kwd-split--one'">
            <div>
              <div class="dve__lbl"><span x-text="kwReview.target==='sentence' ? '핵심 문장' : '핵심 키워드 · 선정 순서'"></span> <span class="kwd-sub">· 항목마다 판정</span></div>
              <div class="fn-stack">
                <template x-for="(j,i) in kwReview.judgments" x-bind:key="'kj'+i"><div class="dve__axis" role="group" x-bind:aria-label="j.original+' 판정'">
                  <div x-show="kwReview.target!=='sentence'" class="flex flex-wrap items-center gap-1"><span class="text-xs text-muted tnum" x-text="i+1"></span><b x-text="j.original"></b><span class="ds-badge ds-badge--neutral" x-text="j.kind==='combo' ? '조합형' : '단일형'"></span></div>
                  <template x-if="kwReview.target==='sentence'"><div><div class="dve__lead" x-text="j.original"></div><div class="text-xs text-muted tnum kwd-flush" x-text="j.original.length+'자 · 기준 40~80자'"></div></div></template>
                  <div class="dve__axis-btns kwd-gap-sm"><template x-for="v in [['accept','적합','good'],['edit','수정','bad'],['exclude','제외','bad']]" x-bind:key="v[0]"><button type="button" class="verdictbtn" x-bind:class="'verdictbtn--'+v[2]+(j.verdict===v[0] ? ' is-on' : '')" x-bind:aria-pressed="j.verdict===v[0]" x-on:click="j.verdict=v[0];kwReview.final=null"><span class="verdictbtn__dot"></span><span x-text="v[1]"></span></button></template></div>
                  <div class="dve__form kwd-gap-sm" x-show="j.verdict && j.verdict!=='accept'">
                    <label class="dve__field" x-bind:class="j.verdict==='edit' ? '' : 'dve__field--wide'"><span class="dve__lbl">사유 · 필수</span><select class="field field--compact" x-model="j.reason"><option value="">사유 선택</option><template x-for="r in (kwCatalog?.reasons || [])" x-bind:key="r"><option x-bind:value="r" x-bind:selected="j.reason===r" x-text="r"></option></template></select></label>
                    <label class="dve__field" x-show="j.verdict==='edit'" x-bind:class="kwReview.target==='sentence' ? 'dve__field--wide' : ''"><span class="dve__lbl" x-text="'수정 '+kwTargetLabel(kwReview.target)"></span><textarea class="field" x-bind:rows="kwReview.target==='sentence' ? 3 : 1" x-bind:maxlength="kwReview.target==='sentence' ? 120 : 30" x-model="j.corrected"></textarea></label>
                  </div>
                </div></template>
                <p class="dve__hint" x-show="!kwReview.judgments.length" x-text="'선정된 '+kwTargetLabel(kwReview.target)+' 없음 · 아래에서 누락을 추가하거나 적합한 결과 없음을 선택하세요'"></p>
              </div>
            </div>
            <!-- 판정 근거 열: 확신도 상위 3 · 엔티티 판정 · 탈락 후보 · 같은 격자로 정렬 · 넘치면 말줄임·접기 -->
            <template x-if="kwReviewCell()?.refined"><div class="kwd-side">
              <div class="dve__lbl">엔티티 확신도 상위 3</div>
              <template x-for="(b,i) in (kwReviewCell().base || [])" x-bind:key="'kb'+b.name"><div>
                <div class="kwd-row"><span class="text-xs text-muted tnum" x-text="i+1"></span><span class="ds-badge ds-badge--entity kwd-name" x-bind:title="b.name"><span x-text="b.name"></span></span><span></span><span class="text-xs tnum kwd-val" x-text="Number(b.conf).toFixed(2)"></span></div>
                <div class="kwd-row" x-show="!kwInKeywords(b.name)"><span></span><span class="dve__hint">핵심 키워드에 없음</span></div>
              </div></template>
              <p class="dve__hint" x-show="!(kwReviewCell().base || []).length">없음</p>
              <div class="dve__lbl kwd-gap">엔티티 판정 <span class="kwd-sub">· 관련도</span></div>
              <template x-for="(e,i) in kwReviewCell().refined.entities.slice(0, kwSideOpen.ents ? undefined : 3)" x-bind:key="'kn'+e.name">
                <div class="kwd-row" x-bind:class="e.keep ? '' : 'kwd-row--off'"><span class="text-xs text-muted tnum" x-text="i+1"></span><span class="ds-badge ds-badge--entity kwd-name" x-bind:title="e.canonical!==e.name ? e.name+' → '+e.canonical : e.name"><span x-text="e.canonical || e.name"></span></span><span class="text-xs text-muted" x-text="e.type"></span><span class="text-xs tnum kwd-val" x-text="e.keep ? e.relevance : '제외'"></span></div>
              </template>
              <button type="button" class="copybtn" x-show="kwReviewCell().refined.entities.length>3" x-on:click="kwSideOpen.ents=!kwSideOpen.ents" x-text="kwSideOpen.ents ? '접기' : (kwReviewCell().refined.entities.length-3)+'개 더 보기'"></button>
              <div class="dve__lbl kwd-gap">탈락 후보</div>
              <template x-for="(x,i) in (kwReviewCell().refined.rejected || []).slice(0, kwSideOpen.rej ? undefined : 3)" x-bind:key="'kr'+i">
                <div class="kwd-row"><span class="text-xs text-muted tnum" x-text="i+1"></span><b class="text-xs kwd-wide kwd-ellipsis" x-bind:title="x.text" x-text="x.text"></b><span></span><span class="dve__hint kwd-wide" x-text="x.reason"></span></div>
              </template>
              <button type="button" class="copybtn" x-show="(kwReviewCell().refined.rejected || []).length>3" x-on:click="kwSideOpen.rej=!kwSideOpen.rej" x-text="kwSideOpen.rej ? '접기' : (kwReviewCell().refined.rejected.length-3)+'개 더 보기'"></button>
              <p class="dve__hint" x-show="!(kwReviewCell().refined.rejected || []).length">없음</p>
            </div></template>
          </div>
          <div class="dve__verdict">
            <div class="dve__lbl kwd-head"><span x-text="'검수 마무리 · 조합 '+kwReview.slot"></span><label class="chk-inline kwd-sub ml-auto"><input type="checkbox" x-model="kwAutoNext"> 완료 후 다음 미검수로</label></div>
            <div class="fn-stack" x-show="kwReview.target==='keyword'">
              <template x-for="(a,i) in kwReview.additions" x-bind:key="'ka'+i"><div class="dve__form">
                <label class="dve__field"><span class="dve__lbl">추가 키워드</span><input class="field field--compact" maxlength="30" x-model="a.text"></label>
                <label class="dve__field"><span class="dve__lbl">추가 사유</span><input class="field field--compact" maxlength="1000" x-model="a.reason"></label>
                <button type="button" class="copybtn" x-on:click="kwReview.additions.splice(i,1);kwReview.final=null">추가 취소</button>
              </div></template>
              <button type="button" class="copybtn" x-bind:disabled="kwReview.additions.length>=3" x-on:click="kwReview.additions.push({text:'',reason:'',kind:'single'});kwReview.final=null">＋ 누락 키워드 추가</button>
            </div>
            <label class="chk-inline text-xs kwd-gap-sm"><input type="checkbox" x-model="kwReview.no_keywords"><span x-text="kwReview.target==='sentence' ? ' 이 콘텐츠에 적합한 문장이 없음' : ' 이 콘텐츠에 적합한 키워드가 없음'"></span></label>
            <div class="dve__form kwd-gap-sm">
              <label class="dve__field dve__field--wide"><span class="dve__lbl">검수 메모</span><input class="field field--compact" maxlength="1000" x-model="kwReview.note" placeholder="선택"></label>
            </div>
            <fieldset class="kwd-gap-sm" x-bind:disabled="kwBusy" aria-label="정답셋 용도">
              <legend class="dve__lbl">정답셋 용도 · 필수</legend>
              <label class="kw-check"><input type="radio" name="kw-gold-partition" value="development" x-model="kwReview.partition">개선용 · 프롬프트 튜닝에 사용</label>
              <label class="kw-check"><input type="radio" name="kw-gold-partition" value="evaluation" x-model="kwReview.partition">평가용 · 결과 측정에만 사용</label>
              <p class="dve__hint">개선에 사용한 콘텐츠는 평가용으로 바꿀 수 없습니다.</p>
            </fieldset>
            <section class="kwd-gap-sm" aria-label="정답 미리보기">
              <h4 class="dve__lbl">저장할 정답</h4>
              <p class="text-sm" x-text="kwGoldPreview().join(' · ') || (kwReview.no_keywords ? '적합한 결과 없음' : '판단 후 정답이 표시됩니다')"></p>
              <p class="dve__hint" x-show="kwCurrentGold() && !kwCompletionDone()" x-text="'기존 정답: '+kwAnswers(kwCurrentGold()).map(k=>k.text).join(' · ')+' · 완료 시 위 정답으로 갱신'"></p>
            </section>
            <p id="kw-review-status" tabindex="-1" x-bind:role="kwError ? 'alert' : 'status'" class="dve__hint kwd-gap-sm" x-show="kwError || kwMessage || kwReviewDirty() || kwCompletionDone()" x-text="kwError || kwMessage || (kwCompletionDone() ? '검수 완료 · 정답셋 저장 확인' : '저장하지 않은 변경이 있습니다. 정답셋 용도와 정답을 확인하고 검수를 완료하세요.')"></p>
            <section class="control-row control-row--compact dve__actions kwd-gap-sm" aria-label="검수 저장">
              <button type="button" class="copybtn" x-show="kwReviewDirty()" x-bind:disabled="kwBusy" x-on:click="kwDiscardReview()">입력 취소</button>
              <button type="button" class="ds-btn ds-btn--outline ds-btn--s-sm" x-bind:disabled="kwBusy || !kwReviewDirty()" x-on:click="kwSaveReview()">임시 저장</button>
              <button type="button" class="ds-btn ds-btn--solid ds-btn--c-primary ds-btn--s-sm" x-bind:disabled="kwBusy || !kwCatalog?.can_final || !kwReview.partition || kwCompletionDone()" x-on:click="kwCompleteReview()" x-text="kwBusy ? '저장 중…' : kwCompletionDone() ? '정답셋 저장 완료' : '검수 완료·정답셋 저장'"></button>
              <button type="button" class="ds-btn ds-btn--outline ds-btn--s-sm" x-show="kwReview.final" x-bind:disabled="kwBusy || !kwCatalog?.can_final" x-on:click="kwCancelFinal()">최종 확정 취소</button>
            </section>
            <p class="dve__hint" x-show="!kwCatalog?.can_final">최종 검수 권한이 필요합니다. 임시 저장 후 최종 검수자에게 완료를 요청하세요.</p>
          </div>
          </fieldset>
        </section>
      </div>
    </div></template>
  </div>
  </section>
  <section role="tabpanel" id="kw-panel-prompts" aria-labelledby="kw-tab-prompts" x-show="kwTab==='prompts'" class="dc-body">
    <section class="panel"><div class="panel-hd"><b>프롬프트 관리</b><span class="meta">모델별 이력 · 저장한 버전은 불변</span></div><div class="panel-bd dc-body">
      <label class="ds-label">저장한 버전<select class="field" x-on:change="kwViewVersion($event.target.value)"><option value="">버전 선택</option><template x-for="v in kwAllVersions()" x-bind:key="v.id"><option x-bind:value="v.id" x-text="v.model+' · '+kwVersionLabel(v)"></option></template></select></label>
      <template x-if="kwVersion"><div class="dc-body"><b x-text="kwVersion.model+' · '+kwVersionLabel(kwVersion)"></b><pre class="ds-code" x-text="kwVersion.rules"></pre><details><summary>실제 호출 프롬프트·검사 규칙</summary><pre class="ds-code" x-text="kwVersion.system+'\n\n'+kwVersion.review_system"></pre><p class="meta" x-text="kwVersion.fingerprint"></p></details><div class="control-row"><button class="ds-btn ds-btn--outline" x-on:click="kwCloneVersion()">복제하여 새 버전 작성</button><button type="button" class="ds-btn ds-btn--outline ds-btn--c-danger" x-show="kwCatalog?.can_manage" x-bind:disabled="kwBusy || kwAdopted(kwVersion)" x-bind:data-tip="kwAdopted(kwVersion) ? '채택 중인 버전은 삭제할 수 없습니다' : '실행한 실험 기록·정답셋은 유지됩니다'" data-tip-pos="top" x-on:click="kwDeleteVersion()">버전 삭제</button></div></div></template>
      <div class="fn" id="kw-version-draft" tabindex="-1"><b class="fn__title">새 버전</b><label class="ds-label">대상 모델</label><x-modelpick key="kwdraft" value="kwDraft.model" set="kwDraft.model=$v;kwDraft.parent_id='';kwDraft.proposal_id=''" groups="textGroups" first-label="모델 선택" first-value="" width="260px" tip="프롬프트가 적용될 모델"></x-modelpick><label class="ds-label">버전 이름<input class="field" maxlength="100" x-model="kwDraft.title"></label><label class="ds-label">프롬프트 규칙<textarea class="field" rows="16" maxlength="8000" x-model="kwDraft.rules"></textarea></label><label class="ds-label">변경 이유<textarea class="field" rows="3" maxlength="2000" x-model="kwDraft.note"></textarea></label><button class="ds-btn ds-btn--solid ds-btn--c-primary" x-bind:disabled="kwBusy || !kwDraft.model || !kwDraft.title.trim() || !kwCatalog?.can_manage" x-on:click="kwSaveVersion()">새 버전 저장</button></div>
    </div></section>
  </section>
  <section role="tabpanel" id="kw-panel-sheet" aria-labelledby="kw-tab-sheet" x-show="kwTab==='sheet'" class="dc-body">
    <section class="panel"><div class="panel-hd"><b>구글 시트 연동</b><span class="meta">시트에서 실행 · 실험 기록과 검수는 실행·비교 탭</span></div><div class="panel-bd dc-body">
      <div class="control-row">
        <a class="ds-btn ds-btn--outline ds-btn--s-sm" x-bind:href="kwCatalog?.sheet?.template_url || null" target="_blank" rel="noopener noreferrer">템플릿 사본 만들기</a>
        <button type="button" class="ds-btn ds-btn--outline ds-btn--s-sm" x-bind:disabled="kwBusy || !kwCatalog?.can_manage" x-on:click="kwSheetIssue()" x-text="kwCatalog?.sheet?.connected ? '연결 코드 다시 만들기' : '연결 코드 만들기'"></button>
      </div>
      <p class="meta" x-text="kwCatalog?.sheet?.connected ? '연결됨 · 발급 '+kwDate(kwCatalog.sheet.issued_at) : '연결 안 됨'"></p>
      <label class="fn" x-show="kwSheetCode"><span class="ds-label">연결 코드 · 지금만 보입니다</span><input class="field" type="text" readonly x-bind:value="kwSheetCode" x-on:focus="$event.target.select()"></label>
      <ul class="ds-bullets"><li>연결 코드는 인증만 합니다 · 다시 만들면 이전 코드는 바로 막힙니다</li></ul>
      <b>시트에서 쓰는 순서</b>
      <ol class="ds-bullets"><li>템플릿 사본에서 시트 메뉴 프리즘 › 양식 만들기</li><li>프리즘 › 연결 설정에 연결 코드 붙여 넣기</li><li>설정 탭에서 원천 메타 모델·핵심키워드 프롬프트 고르기</li><li>프리즘 › 실행(원천 메타)·실행(핵심키워드)·실행(둘 다)</li><li>끝나면 프리즘 › 결과 받기로 행에 적기 · 키워드 실행은 실행·비교 탭 실험 기록에 남고 검수도 그곳에서 합니다</li></ol>
    </div></section>
  </section>
  <section role="tabpanel" id="kw-panel-improve" aria-labelledby="kw-tab-improve" x-show="kwTab==='improve'" class="dc-body">
    <div class="stepline"><span class="stepline__no">STEP 1</span><b>개선 대상</b><span class="meta">개선할 버전과 메타컴파일러 모델 선택</span></div>
    <section class="panel" aria-label="개선 대상">
      <fieldset class="panel-bd dc-body" x-bind:disabled="kwBusy || kwCatalog?.tuning?.status==='running'">
      <legend class="sr-only">개선 대상 선택</legend>
      <label class="ds-label">개선할 프롬프트 버전<select class="field" x-model="kwLoopVersion" x-bind:disabled="kwBusy"><option value="">버전 선택</option><template x-for="v in kwAllVersions()" x-bind:key="v.id"><option x-bind:value="v.id" x-text="v.model+' · '+kwVersionLabel(v)" x-bind:selected="String(v.id) === String(kwLoopVersion)"></option></template></select></label>
      <section><label class="ds-label">메타컴파일러 모델</label><x-modelpick key="kwcompiler" value="kwCompiler" set="kwCompiler=$v" groups="textGroups" first-label="모델 선택" first-value="" width="260px" tip="개선안을 작성할 모델"></x-modelpick></section>
      </fieldset>
    </section>
    <div class="stepline"><span class="stepline__no">STEP 2</span><b>개선용 정답</b><span class="meta" x-text="'개선안 작성에 쓸 정답 · '+kwTraining.length+' / 20개 선택'"></span></div>
    <section class="panel" aria-label="개선용 정답">
      <fieldset class="panel-bd dc-body" x-bind:disabled="kwBusy || kwCatalog?.tuning?.status==='running'">
        <legend class="sr-only">개선에 사용할 정답 · 최대 20개</legend>
        <ul class="ds-bullets"><li>선택한 정답과 판단 사유를 개선안 작성에 사용합니다<ul><li>최대 20개까지 선택할 수 있습니다</li><li x-show="!kwDevelopmentGold().length">실행 결과를 검수하고 개선용 정답으로 저장하세요</li></ul></li></ul>
        <section class="kwl-browser" x-data="{ query:'', category:'', selectedOnly:false, rows:[] }" x-effect="rows=kwGoldRows('development',query,category,selectedOnly)" aria-label="개선용 정답 목록">
        <section class="filterbar control-row" aria-label="개선용 정답 검색·필터">
          <input class="field" style="flex:0 1 240px" type="search" aria-label="개선용 정답 검색" placeholder="제목·카테고리·정답 검색" x-model.debounce.150ms="query">
          <section class="fpop" x-data="{ fpOpen:false, fpBox:{} }" x-on:keydown.escape="fpOpen=false" x-on:click.outside="fpOpen=false" x-on:scroll.window="fpOpen=false" x-on:resize.window="fpOpen=false">
            <button type="button" class="fpop__btn" x-bind:class="{ 'is-open':fpOpen, 'is-on':Boolean(category)+Number(selectedOnly) }" x-on:click="fpOpen=!fpOpen; if(fpOpen) fpBox=mpMenuBox($el)" x-bind:aria-expanded="fpOpen" aria-haspopup="dialog" aria-label="개선용 정답 필터">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
              필터 <span class="fpop__n tnum" x-show="Boolean(category)+Number(selectedOnly)" x-text="Boolean(category)+Number(selectedOnly)"></span>
            </button>
            <section class="fpop__panel" x-show="fpOpen" x-cloak x-bind:style="fpBox" x-on:click.stop role="dialog" aria-label="개선용 정답 필터 조건">
              <label class="fpop__row"><span class="fpop__lbl">카테고리</span><select class="field" x-model="category" aria-label="개선용 정답 카테고리"><option value="">전체</option><template x-for="name in kwContentCategories(kwDevelopmentGold())" x-bind:key="name"><option x-bind:value="name" x-bind:selected="category===name" x-text="catKo(name)"></option></template></select></label>
              <label class="fpop__chk" x-bind:class="selectedOnly ? 'is-on' : ''"><input type="checkbox" x-model="selectedOnly"><span>선택한 정답만 보기</span></label>

            <button type="button" class="ds-btn ds-btn--outline ds-btn--c-danger ds-btn--s-sm" x-show="kwCatalog?.can_manage" x-bind:disabled="kwBusy || !kwEvaluation.length || kwCatalog?.tuning?.status==='running'" x-on:click="kwDeleteGold('evaluation')" x-text="'선택 삭제'+(kwEvaluation.length ? ' '+kwEvaluation.length+'개' : '')"></button>

        <section class="overflow-auto kwl-wrap" tabindex="0" aria-label="평가용 정답 표 · 가로·세로 스크롤">
          <table class="ds-table kwl-table"><thead><tr><th scope="col" class="kwl-select">선택</th><th scope="col">콘텐츠</th><th scope="col">카테고리</th><th scope="col" x-text="'확정 '+kwTargetLabel()"></th><th scope="col">확정자 · 일시</th></tr></thead><tbody>
            <template x-for="g in rows" x-bind:key="g.item_key"><tr x-bind:class="kwEvaluation.includes(g.item_key) ? 'is-sel' : ''">

          <li x-show="kwTarget!=='keyword'" x-text="'개선용 정답 '+kwTraining.length+'개로 개선안 작성'"></li>

        </ul>
        <ul class="ds-bullets" id="kw-improve-status" tabindex="-1" x-bind:role="kwError ? 'alert' : 'status'" x-show="kwError || kwImproving || kwMessage" x-data="{ lines: [] }" x-effect="lines=sents(kwError || (kwImproving==='manual' ? (kwTarget==='keyword' ? '단건 개선을 시작하고 있습니다.' : '선택한 정답으로 개선안을 작성하고 있습니다.') : kwImproving==='auto' ? '반복 개선을 시작하고 있습니다.' : kwMessage))">
          <li x-bind:class="kwError ? 'ds-hint--error' : ''"><span x-text="lines[0]"></span><ul x-show="lines.length>1"><template x-for="(line,i) in lines.slice(1)" x-bind:key="i"><li x-bind:class="kwError ? 'ds-hint--error' : ''" x-text="line"></li></template></ul></li>

          <ul class="ds-bullets" x-show="kwTuning().reason"><li x-text="kwTuning().reason"></li></ul>
          <button type="button" class="ds-btn ds-btn--outline" x-show="kwTuning().status==='running'" x-bind:disabled="kwBusy || kwTuning().stop_requested || !kwCatalog.can_manage" x-on:click="kwStopTuning()" x-text="kwTuning().stop_requested ? '중지 요청됨' : '실행 중지'"></button>
          <table class="ds-table" x-show="kwTuning().history.length"><thead><tr><th>회차</th><th>완전 일치 / 평가 콘텐츠</th><th>결과</th><th>검수</th></tr></thead><tbody>
            <template x-for="h in kwTuning().history" x-bind:key="h.round"><tr><td x-text="h.round===0 ? '개선 전' : (kwTuning().max_rounds===1 ? '개선안' : h.round+'회')"></td><td x-text="h.matched+' / '+h.total+' ('+Math.round(h.matched/h.total*100)+'%)'"></td><td x-text="h.round===0 ? '기준' : h.version_id===kwTuning().best?.version_id ? '최고 후보' : h.improved ? '향상' : '향상 없음'"></td><td><button type="button" class="copybtn" x-on:click="kwOpenTuningCandidate(h)">결과 검수</button></td></tr></template>

          <details><summary>적용 쿡북</summary><pre class="ds-code" x-text="kwProposal.cookbook.text"></pre></details>
        </section></template>

    <section class="panel" x-show="(kwTuning() &amp;&amp; kwTuning().status!=='running') || (kwTarget!=='keyword' &amp;&amp; kwProposal)" aria-label="프롬프트 저장">

            <ul class="ds-bullets" x-show="kwSaveTarget().version.draft &amp;&amp; !kwSaveTarget().improved"><li>개선 전보다 점수가 오르지 않은 개선안입니다</li></ul>
