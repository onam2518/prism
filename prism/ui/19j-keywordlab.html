<template x-if="mod === 'lab'">
<div x-show="labTab === 'entref' && ['run','prompts'].includes(kwTab)" x-cloak class="w-full dc-body kw-workspace">
  <div class="control-row"><label class="selctl"><span class="selctl__lbl">실험 대상</span><select class="field" aria-label="실험 대상" x-bind:value="kwTarget" x-bind:disabled="kwBusy" x-on:change="kwTargetChange($event.target.value)"><option value="keyword">핵심 키워드</option><option value="sentence">핵심 문장</option></select></label><span class="meta" x-text="kwTarget==='sentence' ? '문장 검수·정답셋·프롬프트 개선' : '키워드별 검수·정답셋·프롬프트 개선'"></span></div>
  <p role="alert" class="ds-hint ds-hint--error" x-show="kwError" x-text="kwError"></p>
  <p role="status" class="ds-hint" x-show="kwMessage" x-text="kwMessage"></p>
  <section role="tabpanel" id="kw-panel-run" aria-labelledby="kw-tab-run" x-show="kwTab==='run'" class="dc-body">
    <div class="stepline"><span class="stepline__no">STEP 1</span><b>테스트 방식</b><span class="meta">단건 테스트 또는 비교 실험 선택</span></div>
    <section class="panel">
      <div class="panel-bd dc-body">
        <fieldset class="kw-mode-options" x-bind:disabled="kwBusy"><legend class="sr-only">테스트 방식 선택</legend>
          <label class="pickchip" x-bind:class="kwMode==='single' ? 'on' : ''"><input type="radio" name="kw-mode" value="single" x-bind:checked="kwMode==='single'" x-on:change="kwChooseMode('single')">단일 모델 · 단건 테스트</label>
          <label class="pickchip" x-bind:class="kwMode==='compare' ? 'on' : ''"><input type="radio" name="kw-mode" value="compare" x-bind:checked="kwMode==='compare'" x-on:change="kwChooseMode('compare')">모델·버전 비교 실험</label>
        </fieldset>
        <ul class="ds-bullets" x-show="!kwMode"><li>단건 테스트는 모델 1개로 콘텐츠 1건을 확인합니다</li><li>비교 실험은 동일한 콘텐츠에서 모델·프롬프트 버전 2~3개를 비교합니다</li></ul>
        <div x-show="kwMode==='compare'" class="control-row">
          <label class="selctl"><span class="selctl__lbl">비교 조합</span><select class="field" aria-label="비교 조합" x-model.number="kwCount"><option value="2">2개 조합</option><option value="3">3개 조합</option></select></label>
          <label class="kw-check"><input type="checkbox" x-model="kwBlind">모델·버전 가리고 검수</label>
        </div>
        <ul class="ds-bullets" x-show="kwMode==='compare'"><li>같은 모델의 다른 프롬프트 버전도 비교할 수 있습니다</li><li x-show="kwBlind">결과를 A·B·C로 섞어 보여주고, 각 결과를 검수한 뒤 모델·버전을 공개합니다</li></ul>
      </div>
    </section>
    <div class="stepline" x-show="kwMode"><span class="stepline__no">STEP 2</span><b>모델·프롬프트 설정</b><span class="meta" x-text="kwMode==='single' ? '모델 1개와 프롬프트 버전 선택' : kwCount+'개 조합의 모델·프롬프트 버전 선택'"></span></div>
    <section class="panel" x-show="kwMode">
      <div class="panel-bd dc-body">
        <div class="overflow-auto"><table class="ds-table model-compare-table kw-settings-table" x-bind:style="'--compare-model-count:'+kwCount">
          <colgroup><col class="model-compare-label"><template x-for="(s,i) in kwSlots.slice(0,kwCount)" x-bind:key="i"><col></template></colgroup>
          <thead><tr><th scope="col">설정 항목</th><template x-for="(s,i) in kwSlots.slice(0,kwCount)" x-bind:key="i"><th scope="col" x-text="kwMode==='single' ? '테스트 모델' : '조합 '+(i+1)"></th></template></tr></thead>
          <tbody>
            <tr><th scope="row">모델</th><template x-for="(s,i) in kwSlots.slice(0,kwCount)" x-bind:key="i"><td><div class="control-row kw-model-control"><x-modelpick key="kwslot" value="s.model" set="kwModel(s,$v)" groups="textGroups" first-label="모델 선택" first-value="" width="0" tip="이 조합의 실행 모델"></x-modelpick></div></td></template></tr>
            <tr><th scope="row">프롬프트 버전</th><template x-for="(s,i) in kwSlots.slice(0,kwCount)" x-bind:key="i"><td><div class="control-row kw-version-control"><select class="field" x-model="s.version_id" x-bind:disabled="!s.model || !kwVersions(s.model).length" x-bind:aria-label="'조합 '+(i+1)+' 프롬프트 버전'"><option value="" x-text="!s.model ? '모델을 먼저 선택하세요' : kwVersions(s.model).length ? '버전 선택' : '저장된 버전 없음'"></option><template x-for="v in kwVersions(s.model)" x-bind:key="v.id"><option x-bind:value="v.id" x-bind:selected="s.version_id===v.id" x-text="kwVersionLabel(v)"></option></template></select></div></td></template></tr>
            <tr><th scope="row">버전 관리</th><template x-for="(s,i) in kwSlots.slice(0,kwCount)" x-bind:key="i"><td><button type="button" class="ds-btn ds-btn--ghost ds-btn--s-sm" x-on:click="kwCreateVersion(i)" x-bind:disabled="!s.model || !kwCatalog?.can_manage">새 버전 만들기</button></td></template></tr>
          </tbody>
        </table></div>
        <ul class="ds-bullets"><li>선택한 모델에 저장된 프롬프트 버전만 표시합니다</li><li>저장된 버전이 없으면 ‘새 버전 만들기’에서 규칙을 확인하고 저장하세요</li></ul>
      </div>
    </section>
    <div class="stepline" x-show="kwMode"><span class="stepline__no">STEP 3</span><b>콘텐츠 선택</b><span class="meta" x-text="kwMode==='single' ? '콘텐츠 1건' : '모든 조합에 동일한 콘텐츠·입력 메타 적용'"></span></div>
    <section class="panel" x-show="kwMode">
      <div class="panel-bd dc-body">
        <div class="control-row"><label class="selctl"><span class="selctl__lbl">입력 방식</span><select class="field" aria-label="콘텐츠 입력 방식" x-model="kwSource" x-on:change="kwSourceChanged()"><option value="direct">메타 직접 입력</option><option value="sample">콘텐츠 정답셋에서 샘플</option><option value="hash">콘텐츠 정답셋 해시 지정</option><option value="reuse">기존 실험의 입력 재사용</option></select></label></div>
        <div x-show="kwSource==='direct'" class="fn-stack">
          <label class="fn"><span class="ds-label">콘텐츠 이름 · 선택</span><input class="field" x-model="kwTitle" placeholder="실험 기록에 표시할 이름"></label>
          <label class="fn"><span class="ds-label">리드문 · 필수</span><textarea class="field" rows="3" x-model="kwLead" placeholder="발행된 리드문을 입력하세요"></textarea></label>
          <div class="layout-grid--two">
            <label class="fn"><span class="ds-label" x-text="kwTarget==='keyword' ? '엔티티 · 필수' : '엔티티 · 선택'"></span><input class="field" x-model="kwEntities" placeholder="쉼표로 구분"></label>
            <label class="fn"><span class="ds-label">인텐트 · 선택</span><input class="field" x-model="kwIntents" placeholder="쉼표로 구분"></label>
          </div>
          <label class="fn"><span class="ds-label">카테고리 · 선택</span><input class="field" x-model="kwCategories" placeholder="쉼표로 구분"></label>
        </div>
        <div x-show="kwSource==='sample'" class="dc-body">
          <div class="control-row" x-show="kwMode==='compare'"><label for="kw-sample" class="ds-label">샘플 수</label><input id="kw-sample" type="number" min="1" max="30" class="field kw-count-field" x-model.number="kwSample"><span class="meta">최대 30건</span></div>
          <ul class="ds-bullets"><li x-text="kwMode==='single' ? '엔티티가 있는 콘텐츠 정답셋에서 1건을 가져옵니다' : '엔티티가 있는 콘텐츠 정답셋에서 선택한 수만큼 가져옵니다'"></li></ul>
        </div>
        <label x-show="kwSource==='hash'" class="fn"><span class="ds-label" x-text="kwMode==='single' ? '콘텐츠 해시 1개' : '콘텐츠 해시 · 최대 30개'"></span><textarea class="field" x-model="kwHashes" rows="2" x-bind:placeholder="kwMode==='single' ? '콘텐츠 해시 1개를 입력하세요' : '줄바꿈 또는 쉼표로 구분'"></textarea></label>
        <label x-show="kwSource==='reuse'" class="fn"><span class="ds-label">입력을 재사용할 실험</span><select class="field" x-model="kwReuse" x-on:change="kwLoadInputRun(kwReuse)"><option value="">실험 선택</option><template x-for="r in kwReusableRuns()" x-bind:key="r.id"><option x-bind:value="r.id" x-text="kwTargetLabel(r.target || 'keyword')+' · '+kwDate(r.created_at)+' · 콘텐츠 '+r.n+'건'"></option></template></select></label>
        <div x-show="kwTarget==='sentence'" class="content-section dc-body">
          <b class="fn__title">문장에 사용할 핵심 키워드</b>
          <ul class="ds-bullets" x-show="kwSource==='reuse' && kwInputRun?.target==='sentence'"><li>기존 문장 실험의 입력 키워드를 그대로 사용합니다</li></ul>
          <div class="dc-body" x-show="!(kwSource==='reuse' && kwInputRun?.target==='sentence')">
            <label class="fn"><span class="ds-label">키워드 입력 방식</span><select class="field" x-model="kwKeywordSource"><option value="manual" x-bind:disabled="kwSource!=='direct'">직접 입력 · 단일 콘텐츠</option><option value="gold">콘텐츠별 키워드 정답 사용</option><option value="run" x-bind:disabled="kwSource!=='reuse'">선택한 키워드 실험 결과 사용</option><option value="none">키워드 없이 메타만 사용</option></select></label>
            <label class="fn" x-show="kwKeywordSource==='manual'"><span class="ds-label">입력 키워드 · 최대 3개</span><input class="field" x-model="kwSentenceKeywords" placeholder="쉼표로 구분"></label>
            <label class="fn" x-show="kwKeywordSource==='run'"><span class="ds-label">사용할 키워드 결과 조합</span><select class="field" x-model="kwKeywordSlot"><option value="">조합 선택</option><template x-for="s in (kwInputRun?.revealed && (kwInputRun.target || 'keyword')==='keyword' ? kwInputRun.slots : [])" x-bind:key="s.label"><option x-bind:value="s.label" x-text="s.label+' · '+s.version.model+' · '+kwVersionLabel(s.version)"></option></template></select></label>
          </div>
          <ul class="ds-bullets"><li>비교할 모든 모델에 같은 키워드와 메타를 전달합니다</li><li>입력 키워드도 실행 기록과 문장 정답에 함께 보관합니다</li></ul>
        </div>
      </div>
    </section>
    <div class="stepline" x-show="kwMode"><span class="stepline__no">STEP 4</span><b>실행·결과 확인</b></div>
    <section class="panel" x-show="kwMode">
      <div class="panel-bd dc-body">
        <ul class="ds-bullets"><li x-text="kwMode==='single' ? '모델 1개 · 콘텐츠 1건으로 테스트합니다' : '모델·프롬프트 '+kwCount+'개 조합으로 같은 콘텐츠를 비교합니다'"></li><li x-show="kwInputIssue()" x-text="kwInputIssue()"></li></ul>
        <div class="control-row"><button type="button" class="ds-btn ds-btn--solid ds-btn--c-primary" x-bind:disabled="!kwReady() || !kwCatalog?.can_manage" x-on:click="kwStart()" x-text="kwBusy ? '실행 준비 중…' : kwMode==='single' ? '단건 테스트 실행' : kwCount+'개 조합 비교 실행'"></button></div>
      </div>
    </section>
  <div class="control-row kw-history" x-show="kwTab==='run' || kwTab==='prompts'">
    <label for="kw-history" class="ds-label">실험 기록</label>
    <select id="kw-history" class="field" x-bind:disabled="kwBusy" x-model="kwRunId" x-on:change="kwReview=null; kwOpenRun(kwRunId)"><option value="">실험 선택</option><template x-for="r in kwRuns()" x-bind:key="r.id"><option x-bind:value="r.id" x-bind:selected="kwRunId===r.id" x-text="kwDate(r.created_at)+' · 콘텐츠 '+r.n+'개 · '+r.slots+'조합'"></option></template></select>
    <button class="ds-btn ds-btn--ghost ds-btn--s-sm" x-on:click="kwLoad()">새로고침</button>
  </div>
  <section class="panel" x-show="kwRunData && kwTab==='run'">
    <div class="panel-hd"><b>실행 결과</b><span class="meta" x-text="kwRunData ? kwState(kwRunData) : ''"></span><button class="ds-btn ds-btn--outline ds-btn--s-sm ml-auto" x-show="kwRunData && !kwRunData.revealed" x-on:click="kwReveal()">모델·버전 공개</button></div>
    <div class="panel-bd dc-body"><p role="status" x-text="kwRunData?.error || ''"></p>
      <div class="overflow-auto"><table class="ds-table model-compare-table" x-bind:style="'--compare-model-count:'+(kwRunData?.slots.length || 1)"><thead><tr><th class="model-compare-label">콘텐츠</th><template x-for="s in (kwRunData?.slots || [])" x-bind:key="s.label"><th><b x-text="s.label"></b><p class="meta" x-text="kwRunData.revealed ? s.version.model+' · '+kwVersionLabel(s.version) : '판정 후 공개'"></p></th></template></tr></thead><tbody>
        <template x-for="item in (kwRunData?.items || [])" x-bind:key="item.key"><tr><th><b x-text="item.title"></b><details><summary>입력 메타</summary><pre class="ds-code" x-text="kwInputText(item)"></pre></details></th><template x-for="s in kwRunData.slots" x-bind:key="s.label"><td>
          <template x-if="!kwCell(item,s)"><span>실행 대기 중…</span></template>
          <template x-if="kwCell(item,s)"><div class="dc-body"><span x-show="kwCell(item,s).mock" class="ds-badge ds-badge--warning">모의 실행</span><p role="status" x-show="kwCell(item,s).error" x-text="kwCell(item,s).error"></p><ul class="ds-bullets"><template x-for="k in kwCandidates(kwCell(item,s))" x-bind:key="k.text"><li x-text="k.text"></li></template></ul><p x-show="kwCell(item,s).status==='done' && !kwCandidates(kwCell(item,s)).length" x-text="kwTargetLabel()+' 결과 없음'"></p><details><summary x-text="kwTarget==='sentence' ? '문장 생성 정보' : '검사 근거'"></summary><pre class="ds-code" x-text="JSON.stringify(kwCell(item,s).sentence || kwCell(item,s).refined,null,2)"></pre></details><button class="ds-btn ds-btn--outline ds-btn--s-sm" x-bind:disabled="!kwReviewable(kwCell(item,s))" x-on:click="kwOpenReview(item,s)" x-text="kwCell(item,s).final ? '확정 결과 보기' : kwTargetLabel()+' 검수'"></button></div></template>
        </td></template></tr></template>
      </tbody></table></div>
      <div class="overflow-auto"><table class="ds-table model-compare-table" x-bind:style="'--compare-model-count:'+(kwRunData?.slots.length || 1)"><thead><tr><th class="model-compare-label">평가 항목</th><template x-for="m in (kwRunData?.metrics || [])" x-bind:key="m.slot"><th x-text="m.slot"></th></template></tr></thead><tbody>
        <template x-for="row in [['완료 / 실패', m=>m.completed+' / '+m.failed],['적합 / 수정 / 제외',m=>kwRate(m,'accept')+' / '+kwRate(m,'edit')+' / '+kwRate(m,'exclude')],['평가 정답 일치 / 전체',m=>m.gold_matches+' / '+m.gold_total],['빈 결과',m=>m.empty],['평균 소요 시간',m=>m.avg_ms==null ? '대기' : (m.avg_ms/1000).toFixed(1)+'초'],['토큰 / 비용',m=>m.tokens+' / '+kwMoney(m.cost_usd)]]" x-bind:key="row[0]"><tr><th x-text="row[0]"></th><template x-for="m in (kwRunData?.metrics || [])" x-bind:key="m.slot"><td x-text="row[1](m)"></td></template></tr></template>
      </tbody></table></div><ul class="ds-bullets"><li>적합·수정·제외 비율은 최종 확정한 판단 기준입니다. 평가 정답 일치는 실행 당시 평가용 정답의 표기 일치 수이며, 전체 품질 점수는 아닙니다.</li></ul>
    </div>
  </section>
  <section x-show="kwTab==='run' && kwReview" class="dc-body" x-ref="kwReviewEditor" aria-label="실행 결과 검수">
    <template x-if="kwReview"><section class="panel" x-on:input="kwReview.final=null"><div class="panel-hd"><b x-text="kwReview.item.title+' · '+kwReview.slot"></b><span class="meta">판단 → 최종 확정 → 대상별 정답셋 반영</span></div><div class="panel-bd dc-body">
      <details open><summary>판단할 입력 메타</summary><pre class="ds-code" x-text="kwInputText(kwReview.item)"></pre></details>
      <template x-for="(j,i) in kwReview.judgments" x-bind:key="i"><div class="fn"><b class="fn__title" x-text="j.original"></b><div class="control-row"><template x-for="v in [['accept','적합','good'],['edit','수정','bad'],['exclude','제외','bad'],['hold','보류','hold']]" x-bind:key="v[0]"><button class="verdictbtn" x-bind:class="'verdictbtn--'+v[2]+(j.verdict===v[0] ? ' is-on' : '')" x-bind:aria-pressed="j.verdict===v[0]" x-on:click="j.verdict=v[0];kwReview.final=null" x-text="v[1]"></button></template></div><label class="fn" x-show="j.verdict==='edit'"><span class="ds-label" x-text="'수정 '+kwTargetLabel(kwReview.target)"></span><textarea class="field" x-bind:rows="kwReview.target==='sentence' ? 3 : 1" x-bind:maxlength="kwReview.target==='sentence' ? 120 : 30" x-model="j.corrected"></textarea></label><label class="ds-label" x-show="j.verdict && j.verdict!=='accept'">판단 사유 · 필수<textarea class="field" rows="2" maxlength="1000" x-model="j.reason" placeholder="어떤 근거로 수정·제외·보류했는지 입력하세요"></textarea></label></div></template>
      <div class="fn" x-show="kwReview.target==='keyword'"><b class="fn__title">누락 키워드</b><template x-for="(a,i) in kwReview.additions" x-bind:key="i"><div class="dc-body"><label class="ds-label">추가 키워드<input class="field" maxlength="30" x-model="a.text"></label><label class="ds-label">추가 사유<textarea class="field" maxlength="1000" rows="2" x-model="a.reason"></textarea></label><button class="ds-btn ds-btn--ghost ds-btn--s-sm" x-on:click="kwReview.additions.splice(i,1);kwReview.final=null">추가 취소</button></div></template><button class="ds-btn ds-btn--outline ds-btn--s-sm" x-bind:disabled="kwReview.additions.length>=3" x-on:click="kwReview.additions.push({text:'',reason:'',kind:'single'});kwReview.final=null">누락 키워드 추가</button></div>
      <label><input type="checkbox" x-model="kwReview.no_keywords"><span x-text="' 이 콘텐츠에 적합한 '+kwTargetLabel(kwReview.target)+'이 없음'"></span></label>
      <label class="ds-label">검수 메모<textarea class="field" rows="2" maxlength="1000" x-model="kwReview.note"></textarea></label>
      <label class="ds-label">정답셋 용도<select class="field" x-model="kwReview.partition"><option value="development">개선용 · 프롬프트 개선에 사용</option><option value="evaluation">평가용 · 개선 입력에서 제외</option></select></label>
      <div class="control-row"><button class="ds-btn ds-btn--outline" x-bind:disabled="kwBusy" x-on:click="kwSaveReview(false)">판단 저장</button><button class="ds-btn ds-btn--solid ds-btn--c-primary" x-bind:disabled="kwBusy || !kwCatalog?.can_final" x-on:click="kwSaveReview(true)">최종 확정</button><button class="ds-btn ds-btn--outline" x-bind:disabled="kwBusy || !kwReview.final || !kwCatalog?.can_final" x-on:click="kwSaveGold()" x-text="kwTargetLabel(kwReview.target)+' 정답셋에 반영'"></button><button class="ds-btn ds-btn--ghost" x-on:click="kwReview=null">검수 닫기</button></div>
      <details x-show="kwCurrentGold()"><summary x-text="'현재 '+kwTargetLabel(kwReview.target)+' 정답 · 반영 시 교체'"></summary><pre class="ds-code" x-text="JSON.stringify(kwCurrentGold(),null,2)"></pre></details>
      <ul class="ds-bullets"><li>키워드·문장 정답셋을 각각 분리해 저장합니다. 판단 저장만으로 정답이 되지는 않습니다.</li><li>보류 항목을 해결한 뒤 최종 확정하세요. 입력 메타 자체에 문제가 있으면 확정하지 말고 보류 사유에 남겨주세요.</li></ul>
    </div></section></template>
  </section>
  </section>
  <section role="tabpanel" id="kw-panel-prompts" aria-labelledby="kw-tab-prompts" x-show="kwTab==='prompts'" class="dc-body">
    <section class="panel"><div class="panel-hd"><b>프롬프트 관리</b><span class="meta">모델별 이력 · 저장한 버전은 불변</span></div><div class="panel-bd dc-body">
      <label class="ds-label">저장한 버전<select class="field" x-on:change="kwViewVersion($event.target.value)"><option value="">버전 선택</option><template x-for="v in kwAllVersions()" x-bind:key="v.id"><option x-bind:value="v.id" x-text="v.model+' · '+kwVersionLabel(v)"></option></template></select></label>
      <template x-if="kwVersion"><div class="dc-body"><b x-text="kwVersion.model+' · '+kwVersionLabel(kwVersion)"></b><pre class="ds-code" x-text="kwVersion.rules"></pre><details><summary>실제 호출 프롬프트·검사 규칙</summary><pre class="ds-code" x-text="kwVersion.system+'\n\n'+kwVersion.review_system"></pre><p class="meta" x-text="kwVersion.fingerprint"></p></details><button class="ds-btn ds-btn--outline" x-on:click="kwCloneVersion()">복제하여 새 버전 작성</button></div></template>
      <div class="fn"><b class="fn__title">새 버전</b><label class="ds-label">대상 모델</label><x-modelpick key="kwdraft" value="kwDraft.model" set="kwDraft.model=$v;kwDraft.parent_id='';kwDraft.proposal_id=''" groups="textGroups" first-label="모델 선택" first-value="" width="260px" tip="프롬프트가 적용될 모델"></x-modelpick><label class="ds-label">버전 이름<input class="field" maxlength="100" x-model="kwDraft.title"></label><label class="ds-label">프롬프트 규칙<textarea class="field" rows="16" maxlength="8000" x-model="kwDraft.rules"></textarea></label><label class="ds-label">변경 이유<textarea class="field" rows="3" maxlength="2000" x-model="kwDraft.note"></textarea></label><button class="ds-btn ds-btn--solid ds-btn--c-primary" x-bind:disabled="kwBusy || !kwDraft.model || !kwDraft.title.trim() || !kwCatalog?.can_manage" x-on:click="kwSaveVersion()">새 버전 저장</button></div>
    </div></section>
    <section class="panel"><div class="panel-hd"><b>프롬프트 개선 루프</b><span class="meta">확정 검수 → 쿡북 기반 개선안 → 새 버전 → 비교 → 채택</span></div><div class="panel-bd dc-body">
      <ul class="ds-bullets"><li>개선용 정답과 판단 사유를 대상 모델의 쿡북 지침에 함께 전달합니다. 평가용 정답은 전달하지 않습니다.</li><li>개선안은 자동 적용되지 않습니다. 내용을 검토하고 새 버전으로 저장한 뒤 같은 콘텐츠에서 비교하세요.</li></ul>
      <label class="ds-label">개선할 프롬프트 버전<select class="field" x-model="kwLoopVersion"><option value="">버전 선택</option><template x-for="v in kwAllVersions()" x-bind:key="v.id"><option x-bind:value="v.id" x-text="v.model+' · '+kwVersionLabel(v)"></option></template></select></label>
      <div><label class="ds-label">메타컴파일러 모델</label><x-modelpick key="kwcompiler" value="kwCompiler" set="kwCompiler=$v" groups="textGroups" first-label="모델 선택" first-value="" width="260px" tip="개선안을 작성할 모델"></x-modelpick></div>
      <div class="fn"><b class="fn__title">개선에 사용할 정답 · 최대 20개</b><p class="ds-hint" x-show="!kwDevelopmentGold().length">실행 결과를 검수하고 개선용 정답으로 반영하세요.</p><template x-for="g in kwDevelopmentGold()" x-bind:key="g.item_key"><label class="control-row"><input type="checkbox" x-model="kwTraining" x-bind:value="g.item_key"><span x-text="g.title+' · '+kwAnswers(g).map(k=>k.text).join(', ')"></span></label></template></div>
      <button class="ds-btn ds-btn--solid ds-btn--c-primary" x-bind:disabled="kwBusy || !kwLoopVersion || !kwCompiler || !kwTraining.length || !kwCatalog?.can_manage" x-on:click="kwCompile()" x-text="kwBusy ? '개선안 작성 중…' : '쿡북 기반 개선안 작성'"></button>
      <template x-if="kwProposal"><div class="dc-body"><b>프롬프트 개선안</b><ul class="ds-bullets"><template x-for="(c,i) in kwProposal.changes" x-bind:key="i"><li x-text="c.reason+' · '+c.change"></li></template></ul><pre class="ds-code" x-text="kwProposal.rules"></pre><details><summary>적용 쿡북</summary><pre class="ds-code" x-text="kwProposal.cookbook.text"></pre></details><button class="ds-btn ds-btn--outline" x-on:click="kwUseProposal()">새 버전으로 검토·저장</button></div></template>
      <div class="fn"><b class="fn__title">비교 후 채택</b><ul class="ds-bullets"><li>채택 근거로 사용할 비교 실험을 선택하세요. 모델·버전을 공개하고 해당 버전의 모든 결과를 최종 확정해야 채택할 수 있습니다.</li></ul><label class="ds-label">비교 실험<select class="field" x-bind:disabled="kwBusy" x-model="kwRunId" x-on:change="kwReview=null;kwOpenRun(kwRunId)"><option value="">실험 선택</option><template x-for="r in kwRuns()" x-bind:key="r.id"><option x-bind:value="r.id" x-bind:selected="kwRunId===r.id" x-text="kwDate(r.created_at)+' · 콘텐츠 '+r.n+'건 · '+r.slots+'조합'"></option></template></select></label><select class="field" aria-label="채택할 버전" x-model="kwAdoptVersion"><option value="">채택할 버전 선택</option><template x-for="s in (kwRunData?.revealed ? kwRunData.slots : [])" x-bind:key="s.label"><option x-bind:value="s.version.id" x-text="s.version.model+' · '+kwVersionLabel(s.version)"></option></template></select><button class="ds-btn ds-btn--outline" x-bind:disabled="kwBusy || !kwAdoptVersion || !kwCatalog?.can_manage" x-on:click="kwAdopt()">검수한 버전 채택</button></div>
    </div></section>
  </section>
</div>
</template>
