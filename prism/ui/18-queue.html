      <!-- ═══ 모듈: 실행 큐 (단일 위젯) · 실제 실행 상태 ═══ -->
      <template x-if="mod === 'content'">
        <div class="w-full" style="margin:18px 0 12px">
        <div class="stepline"><span class="stepline__no">STEP 3</span><b>실행 큐 · 이력</b><span class="meta">진행 중 작업의 진척도와 완료 이력 · 완료 작업을 누르면 해당 콘텐츠를 봅니다</span></div>
      </div>
      </template>
      <template x-if="mod === 'content'">
        <div class="w-full">
        <section class="panel"><div class="panel-hd"><b>실행 큐 · 이력</b><span class="meta" x-text="(runningCount ? (runningCount + ' 실행중') : '대기 없음')"></span>
          <!-- 자동/수동 구분 필터 -->
          <span class="ml-auto" style="display:flex;gap:6px">
            <button type="button" class="srcfilter__chip" x-bind:class="queueTrig==='' ? 'sel' : ''" x-on:click="queueTrig=''">전체</button>
            <button type="button" class="srcfilter__chip" x-bind:class="queueTrig==='auto' ? 'sel' : ''" x-on:click="queueTrig='auto'">자동</button>
            <button type="button" class="srcfilter__chip" x-bind:class="queueTrig==='manual' ? 'sel' : ''" x-on:click="queueTrig='manual'">수동</button>
          </span>
        </div>
          <div class="panel-bd">
            <template x-for="j in filteredJobs" x-bind:key="j.id">
              <div class="w-run" x-bind:style="(j.hashes||[]).length ? 'cursor:pointer' : ''" x-on:click="jobContents(j)" x-bind:data-tip="(j.hashes||[]).length ? '해당 작업의 콘텐츠 보기' : null" data-tip-pos="top"><span class="w-run__av"><img src="/vendor/daesik-batter.svg" alt=""></span><div style="flex:1;min-width:0">
                <div class="w-run__t"><b class="text-ink" x-text="j.name"></b> · <span x-text="(j.kind || '자동 인입') + (j.running ? ' 중' : ' 완료')"></span> <span class="ds-badge" x-bind:class="j.trigger==='auto' ? 'ds-badge--intent' : 'ds-badge--entity'" style="cursor:help" data-tip="트리거 · 자동=스케줄 폴링, 수동=관리자 실행" data-tip-pos="top" x-text="j.trigger==='auto' ? '자동' : '수동'"></span>
                  <span class="text-xs text-muted tnum" x-show="j.total" x-text="j.done + ' / ' + j.total + '건' + (j.total ? (' · ' + Math.round((j.done/j.total)*100) + '%') : '')"></span>
                  <span class="text-xs text-muted tnum" x-show="j.running && j.eta_s != null" x-text="'· 남은 예상 ' + fmtEta(j.eta_s) + ' (건당 ' + ((j.per_item_ms||0)/1000).toFixed(1) + '초)'"></span>
                  <span class="ds-badge ds-badge--error" x-show="j.failed" x-text="'실패 ' + j.failed"></span></div>
                <div class="text-xs text-muted" x-text="j.last_msg || j.endpoint"></div>
                <div class="ds-progress" x-show="j.running" x-bind:class="j.total ? '' : 'ds-progress--indeterminate'" style="margin-top:5px"><div class="ds-progress__track"><div class="ds-progress__fill ds-progress__fill--primary" x-bind:style="j.total ? ('width:' + Math.round((j.done/j.total)*100) + '%') : ''"></div></div></div>
              </div></div>
            </template>
            <div x-show="!runningCount" class="ds-empty" style="border:0;padding:20px 8px">
              <div class="ds-empty__desc">진행 중인 작업이 없습니다 · STEP 1에서 추가하고 <b class="text-ink">STEP 2 실행</b>을 누르면 여기에 진척도가 표시되고, 완료 작업은 이력으로 남습니다</div>
            </div>
          </div>
        </section>
      </div>
      </template>
      <!-- ⚠ x-bind:disabled 에 객체 인덱스(rerunBusy[hash])를 그대로 쓰면 안 된다.
           Alpine 3.14 는 '없는 키' 접근 결과를 falsy 로 안 보고 disabled 를 걸어버려서,
           한 번도 누르지 않은 버튼이 처음부터 잠긴다(2026-07-28 · 재실행 버튼 전건 비활성).
           !! 로 불린 변환해서 넘긴다. -->
      <!-- 메타 생성 실패 콘텐츠: 단일 목록표(종류·콜 = 열) · 건별 재실행 · 빈 목록도 상시 노출
           30일 집계(top·by_*)는 /fail-rollup 응답에 유지(화면 미노출 · 필요 시 재노출) -->
      <template x-if="mod === 'content'">
        <div x-show="failData" x-cloak class="w-full" style="margin-top:14px">
        <section class="panel" data-fn x-init="loadFails()"><div class="panel-hd"><b>메타 생성 실패 콘텐츠</b><span class="meta">최근 30일 · 모델 실행이 실패한 콘텐츠 목록 · 재실행이 성공하면 자동으로 사라집니다</span>
          <span class="ds-badge ds-badge--error tnum ml-auto" x-show="((failData&&failData.recent)||[]).length" x-text="((failData&&failData.recent)||[]).length + '건'"></span>
        </div>
          <div class="panel-bd">
            <!-- 원인별로 갈라 보고 한 번에 다시 돌린다 · 실패가 한 종류로 몰릴 때(예: 잔액 부족 402 전건) 유용 -->
            <div class="filterbar" x-show="failAll.length" x-cloak>
              <select class="field" style="width:auto" x-model="failKind" x-on:change="pickFailKind($event.target.value)">
                <option value="">실패 종류 전체</option>
                <template x-for="k in failKindOpts" x-bind:key="'fko'+k"><option x-bind:value="k" x-text="failKindKr(k)"></option></template>
              </select>
              <select class="field" style="width:auto" x-show="failModelOpts.length > 1" x-model="failModel" x-on:change="pickFailModel($event.target.value)">
                <option value="">모델 전체</option>
                <template x-for="m in failModelOpts" x-bind:key="'fmo'+m"><option x-bind:value="m" x-text="m"></option></template>
              </select>
              <button type="button" class="ds-btn ds-btn--outline" style="height:28px;padding:0 12px;font-size:12px" x-bind:disabled="!failPicked.length || failBusy" x-on:click="rerunFailPicked()" x-text="failBusy ? '재실행 중…' : ('선택 재실행' + (failPicked.length ? (' ' + failPicked.length + '건') : ''))" data-tip="체크한 콘텐츠를 STEP 2의 사용 모델로 다시 실행합니다 · 성공하면 목록에서 사라집니다 · 건당 비용 발생" data-tip-pos="top"></button>
              <button type="button" class="copybtn" x-show="failPicked.length" x-cloak x-on:click="clearFailPick()">선택 해제</button>
              <span class="text-xs text-muted tnum" x-text="failRows.length + ' / ' + failAll.length + '건'"></span>
              <!-- 잔액 부족은 재실행으로 못 푼다 · '눌러도 안 사라진다'는 오해를 먼저 끊는다 -->
              <span class="ds-badge ds-badge--error" style="cursor:help" x-show="failBillingN" x-cloak data-tip="API 크레딧이 소진돼 실패한 건입니다 · 충전하기 전에는 재실행해도 같은 오류로 다시 등재됩니다" data-tip-pos="top" x-text="'크레딧 부족 ' + failBillingN + '건 · 충전 필요'"></span>
              <!-- 402 의 다른 갈래: 크레딧은 남아 있는데 프로젝트 지출 한도에 걸린 경우 · 조치가 다르다 -->
              <span class="ds-badge ds-badge--error" style="cursor:help" x-show="failQuotaN" x-cloak data-tip="크레딧이 아니라 이 키가 속한 프로젝트의 지출 한도에 걸린 건입니다 · 라우터 콘솔에서 한도를 올려야 재실행이 통과합니다" data-tip-pos="top" x-text="'지출 한도 초과 ' + failQuotaN + '건 · 한도 상향 필요'"></span>
            </div>
            <div class="overflow-auto" style="max-height:280px" x-show="failRows.length"><table class="ds-table"><thead><tr><th style="width:34px"><input type="checkbox" x-bind:checked="failAllOn" x-on:change="toggleFailPickAll()" data-tip="보이는 행 전체 선택" data-tip-pos="right" aria-label="보이는 행 전체 선택"></th><th>콘텐츠</th><th style="width:100px">서비스</th><th style="width:160px">모델</th><th style="width:150px">실패 종류</th><th style="width:130px">콜</th><th style="width:60px">일자</th><th style="width:96px"></th></tr></thead><tbody>
              <template x-for="f in failRows" x-bind:key="'fr'+f.hash">
                <tr>
                  <td><input type="checkbox" x-bind:checked="!!failSel[f.hash]" x-on:change="toggleFailPick(f.hash)" x-bind:aria-label="(f.title || '콘텐츠') + ' 선택'"></td>
                  <td class="text-ink" x-text="f.title || '(제목 없음)'"></td>
                  <td class="text-muted" x-text="f.service || '·'"></td>
                  <td class="text-muted" x-text="f.model || '·'"></td>
                  <!-- 툴팁 = 예외 원문(details) · 종류 배지만으로는 타임아웃인지 응답 형식 문제인지 못 가린다 -->
                  <td><template x-for="k in (f.kinds||[])" x-bind:key="'frk'+f.hash+k"><span class="ds-badge ds-badge--reason" style="cursor:help;margin:1px" x-bind:data-tip="failTip(f, k)" data-tip-pos="top" x-text="failKindKr(k)"></span></template></td>
                  <td><template x-for="c in (f.calls||[])" x-bind:key="'frc'+f.hash+c"><span class="ds-badge ds-badge--neutral" style="margin:1px" x-text="c"></span></template><span class="text-muted" x-show="!(f.calls||[]).length">·</span></td>
                  <td class="tnum text-muted" x-text="(f.day||'').slice(5).replace('-','/')"></td>
                  <td><button type="button" class="ds-btn ds-btn--outline" style="height:26px;padding:0 10px;font-size:11px" x-bind:disabled="!!rerunBusy[f.hash]" x-on:click="rerunFail(f)" x-text="rerunBusy[f.hash] ? '재실행 중…' : '재실행'" data-tip="STEP 2의 사용 모델로 이 콘텐츠만 초안 재생성 · 건당 비용 발생" data-tip-pos="left"></button></td>
                </tr>
              </template>
            </tbody></table></div>
            <div class="text-xs text-muted" x-show="!failRows.length" x-text="failAll.length ? '이 조건에 맞는 실패 콘텐츠가 없습니다 · 필터를 바꿔 보세요' : '최근 30일 메타 생성에 실패한 콘텐츠가 없습니다 · 실패가 생기면 여기에 등재되고, 재실행이 성공하면 자동으로 사라집니다'"></div>
          </div>
        </section>
      </div>
      </template>
      <!-- 추가된 콘텐츠 · 용도: 실행 큐 아래(맥락: 추가 → 실행 → 큐 → 결과 용도 관리) -->
      <template x-if="mod === 'content'">
        <div class="w-full space-y-4" style="margin-top:14px">
        <section class="panel" data-fn id="added-contents"><div class="panel-hd"><b>추가된 콘텐츠 · 용도</b><span class="meta">평가용은 검수 목록에서 제외되어 평가 전용으로 보존됩니다</span>
          <button type="button" class="srcfilter__chip sel" x-show="jobFilter" x-cloak x-on:click="jobFilter = null" x-text="jobFilter ? (jobFilter.name + ' 결과 ' + contentRows.length + '건 · 전체 보기 ×') : ''"></button>
          <button type="button" class="ds-iconbtn ds-iconbtn--bordered ml-auto" x-on:click="loadDash()" data-tip="새로고침" data-tip-pos="bottom" aria-label="콘텐츠 목록 새로고침"><svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M20 11a8 8 0 1 0-.9 4.5M20 5v6h-6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </div>
          <!-- 모델 필터 + 다중 선택 재실행: 특정 모델로 뽑힌 초안만 골라 한 번에 다시 돌린다 -->
          <div class="filterbar">
            <select class="field" style="width:auto" x-model="contentModel" x-on:change="pickModel($event.target.value)">
              <option value="">모델 전체</option>
              <option value="(미실행)">미실행(초안 없음)</option>
              <template x-for="m in contentModels" x-bind:key="'cm'+m"><option x-bind:value="m" x-text="m"></option></template>
            </select>
            <button type="button" class="ds-btn ds-btn--outline" style="height:28px;padding:0 12px;font-size:12px" x-bind:disabled="!pickedHashes.length || pickBusy" x-on:click="rerunPicked()" x-text="pickBusy ? '재실행 중…' : ('선택 재실행' + (pickedHashes.length ? (' ' + pickedHashes.length + '건') : ''))" data-tip="체크한 콘텐츠를 STEP 2의 사용 모델로 다시 실행합니다 · 기존 초안은 이력 보존 · 건당 비용 발생" data-tip-pos="top"></button>
            <button type="button" class="copybtn" x-show="pickedHashes.length" x-cloak x-on:click="clearPick()">선택 해제</button>
            <span class="text-xs text-muted tnum" x-text="contentRows.length + ' / ' + (((dashData||{}).contents||[]).length) + '건'"></span>
            <span class="ds-badge ds-badge--neutral" style="cursor:help" data-tip="이 표는 최신 200건만 보여 줍니다 · 그보다 오래된 콘텐츠는 필터·선택 대상에 들어오지 않습니다" data-tip-pos="top">최신 200건</span>
          </div>
          <div class="overflow-auto" style="max-height:320px"><table class="ds-table"><thead><tr><th style="width:34px"><input type="checkbox" x-bind:checked="pickAllOn" x-on:change="togglePickAll()" data-tip="보이는 행 전체 선택" data-tip-pos="right" aria-label="보이는 행 전체 선택"></th><th>콘텐츠</th><th style="width:110px">서비스</th><th style="width:170px">모델</th><th style="width:70px">버전</th><th style="width:90px">용도</th><th style="width:240px"></th></tr></thead><tbody>
            <template x-for="c in contentRows" x-bind:key="'pp'+c.hash">
              <tr>
                <td><input type="checkbox" x-bind:checked="!!pickSel[c.hash]" x-on:change="togglePick(c.hash)" x-bind:aria-label="(c.title || '콘텐츠') + ' 선택'"></td>
                <td class="text-ink"><span x-text="c.title || '(제목 없음)'"></span> <span class="ds-badge ds-badge--warning" x-show="srcGone(c)" style="cursor:help" data-tip="원문이 삭제·비공개로 확인 불가 표시된 콘텐츠(검수 상세의 원문 페이지 탭에서 신고·해제)" data-tip-pos="top">원문 소실</span></td>
                <td class="text-muted" x-text="c.service || '·'"></td>
                <td class="text-muted" x-text="c.model || '·'"></td>
                <td><span x-show="c.model" class="tnum" x-text="'v' + (c.version || 1)"></span><span x-show="!c.model" class="ds-badge ds-badge--warning" style="cursor:help" data-tip="STEP 2 모델 실행에서 초안을 생성하세요" data-tip-pos="top">미실행</span></td>
                <td><span class="ds-badge" x-bind:class="c.purpose === 'eval' ? 'ds-badge--warning' : 'ds-badge--neutral'" x-text="c.purpose === 'eval' ? '평가용' : '검수용'"></span></td>
                <td><div class="flex items-center gap-1.5">
                  <button type="button" class="ds-btn ds-btn--outline" style="height:26px;padding:0 10px;font-size:11px" x-on:click="togglePurpose(c)" x-text="c.purpose === 'eval' ? '검수용 전환' : '평가용 전환'"></button>
                  <button type="button" class="ds-btn ds-btn--outline" style="height:26px;padding:0 10px;font-size:11px" x-bind:disabled="!!rerunBusy[c.hash]" x-on:click="rerunOne(c)" x-text="rerunBusy[c.hash] ? '재실행 중…' : '재실행'" data-tip="STEP 2의 사용 모델로 이 콘텐츠만 초안 재생성 · 이전 초안은 이력 보존 · 건당 비용 발생" data-tip-pos="left"></button>
                  <button type="button" class="ds-btn ds-btn--outline ds-btn--c-danger" style="height:26px;padding:0 10px;font-size:11px" x-on:click="removeContent(c)" x-text="delArm === c.hash ? '삭제 확인' : '삭제'" data-tip="검수 목록·결과 비교(초안)·피드백까지 함께 삭제됩니다" data-tip-pos="left"></button>
                </div></td>
              </tr>
            </template>
          </tbody></table></div>
          <div x-show="!contentRows.length" class="text-xs text-muted" style="margin:0 16px 14px" x-text="jobFilter ? '이 작업의 콘텐츠가 목록에 없습니다(삭제되었을 수 있음)' : (contentModel ? ('이 모델로 실행된 콘텐츠가 최신 200건 안에 없습니다 · ' + contentModel) : '아직 추가된 콘텐츠가 없습니다 · 위에서 수동·자동으로 추가하세요')"></div>
        </section>
      </div>
      </template>
