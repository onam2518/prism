      <!-- ═══ 모듈: 토픽 스튜디오 (클러스터링 체계를 자연어로 설계·실험) ═══ -->
      <!-- ═══ 모듈: 스튜디오 · 설계 도구 묶음(프롬프트 + 토픽 · 실험실에서 승격) ═══ -->
      <template x-if="mod === 'studio'">
        <div class="w-full" style="margin-bottom:10px">
        <div class="evaltabs">
          <button type="button" x-bind:class="studioTab==='prompt'?'sel':''" x-on:click="studioTab='prompt'">프롬프트</button>
          <button type="button" x-bind:class="studioTab==='topic'?'sel':''" x-on:click="studioTab='topic'; loadTopics()">토픽</button>
        </div>
      </div>
      </template>
      <template x-if="mod === 'studio'">
        <div x-show="studioTab === 'topic'" x-cloak class="w-full space-y-4">
        <ul class="ds-bullets hintbox" style="padding:var(--ds-space-3) var(--ds-space-4)">
          <li><b>토픽 스튜디오</b>는 클러스터링 체계(어떤 콘텐츠를 어떻게 묶을지)를 <b>자연어</b>로 정의하고 즉시 실험하는 공간입니다.</li>
          <li>원하는 묶음을 문장으로 설명하면 조건값이 자동으로 채워집니다 · 채워진 조건값은 직접 켜고 끌 수 있습니다.</li>
          <li>토픽을 만들고 활성으로 볼지 정하는 기준은 품질 통과(<b>G</b>) 콘텐츠입니다<span x-show="qexN()"> · 현재 <b class="tnum" x-text="qexN()"></b>건이 유통 불가</span>. 유통 불가 콘텐츠도 조건이 맞으면 <b>편입</b>돼 사안 규모로 보이지만(표의 <b>편입</b> 수) 활성 판정과 대표 콘텐츠에는 들어가지 않습니다 · 어울리지 않는 콘텐츠는 토픽을 열어 개별 <b>제외</b>할 수 있습니다.</li>
        </ul>
        <template x-if="!topicData || !topicData.n_contents"><div class="empty">아직 토픽을 만들 결과가 없습니다 <b class="text-body">실행 · 추출</b>에서 여러 건(엑셀 일괄)을 추출하세요</div></template>
        <div x-show="topicData && topicData.n_contents" class="space-y-4">
          <div class="tiles" style="grid-template-columns:repeat(3,1fr)">
            <div class="tile"><div class="n tnum" x-text="topicData?(topicData.summary.custom||0):0"></div><div class="t">내 토픽(수동)</div></div>
            <div class="tile"><div class="n tnum" x-text="topicData?(topicData.summary.single||0):0"></div><div class="t">엔티티형(자동)</div></div>
            <div class="tile"><div class="n tnum" x-text="topicData?(topicData.summary.composite||0):0"></div><div class="t">사건형(자동)</div></div>
          </div>

          <!-- 토픽 생성하기: 수동(4단계 스텝) | 자동(묶기 기준) 탭 -->
          <div class="panel">
            <!-- 타이틀은 정적 텍스트 유지(헤드 데코레이터가 b.textContent 를 복사하므로 x-text 는 빈 타이틀이 된다) -->
            <div class="panel-hd"><b>토픽 생성하기</b><span class="meta">직접 정의하거나 자동 묶기 기준을 조절합니다</span>
              <span class="ds-badge ds-badge--status" x-show="studio.editId" x-cloak>수정 중</span>
              <span style="margin-left:auto;display:inline-flex;gap:6px;align-items:center">
                <button type="button" class="srcfilter__chip" x-bind:class="topicGenTab==='manual'&&!studioManual?'sel':''" x-on:click="topicGenTab='manual';studioManual=false">말로 만들기</button>
                <button type="button" class="srcfilter__chip" x-bind:class="topicGenTab==='manual'&&studioManual?'sel':''" x-on:click="topicGenTab='manual';studioManual=true">조건 직접 손보기</button>
                <button type="button" class="srcfilter__chip" x-bind:class="topicGenTab==='auto'?'sel':''" x-on:click="topicGenTab='auto'">자동 생성</button>
              </span>
              <span class="meta tnum" x-show="topicGenTab==='manual' && studioManual" x-text="tStepDone()+' / 4 단계'"></span>
              <span class="tprog" x-show="topicGenTab==='manual' && studioManual"><i x-bind:style="'width:'+(tStepDone()/4*100)+'%'"></i></span>
              <span class="meta tnum" x-show="topicGenTab==='auto'" x-cloak x-text="'엔티티형 '+(topicData.summary&&topicData.summary.single||0)+' · 사건형 '+(topicData.summary&&topicData.summary.composite||0)"></span>
            </div>
            <div class="panel-bd">
              <!-- 추천: 떠오르는 엔티티 + 자동 사건 묶음 → 클릭으로 폼 프리필(reactive→proactive) -->
              <div class="tbox" x-show="topicGenTab==='manual' && (((topicData.trending)||[]).length || ((topicData.composite)||[]).length)" style="padding:12px 14px;margin-bottom:14px">
                <div class="text-xs" style="font-weight:700;margin-bottom:8px">추천 <span class="text-muted" style="font-weight:400">지금 데이터에서 뜨는 것들 · 누르면 아래 폼에 채워집니다</span></div>
                <div class="flexrow" style="flex-wrap:wrap;gap:6px;align-items:center" x-show="((topicData.trending)||[]).length">
                  <span class="text-xs text-muted" style="width:100px">떠오르는 엔티티</span>
                  <template x-for="t in (topicData.trending||[])" x-bind:key="'tr'+t.id">
                    <button type="button" class="srcfilter__chip" x-on:click="suggestKeyword(t.name)" x-bind:data-tip="'최근 48시간 ' + t.recent + '건 언급 (그 전 ' + t.prev + '건) · 누르면 키워드로 추가'" data-tip-pos="top" x-text="t.name + ' ↑' + (t.recent - t.prev)"></button>
                  </template>
                </div>
                <div class="flexrow" style="flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px" x-show="((topicData.composite)||[]).length">
                  <span class="text-xs text-muted" style="width:100px">자동 사건 묶음</span>
                  <template x-for="p in (topicData.composite||[]).slice(0,5)" x-bind:key="'pc'+p.cluster_id">
                    <button type="button" class="srcfilter__chip" x-on:click="promoteCluster(p)" x-bind:data-tip="'콘텐츠 ' + p.count + '건 · 누르면 이 사건을 수동 토픽 폼에 채웁니다'" data-tip-pos="top" x-text="p.name + ' (' + p.count + ')'"></button>
                  </template>
                </div>
              </div>
              <!-- 말로 만들기(기본): 문장 → 해석 칩 + 매칭 건수 + 표본 → 문장 보태 다듬기 → 저장 · 칩 나열은 '직접' 토글 뒤(스펙 132112) -->
              <div class="talk" x-show="topicGenTab==='manual' && !studioManual">
              <template x-for="(t,i) in talk.turns" x-bind:key="'t'+i">
              <div>
              <div class="talk__me"><span class="talk__who">나</span><span x-text="t.text"></span></div>
              <div class="talk__sys">
              <div class="talk__hd"><b x-text="i?'바꿨어요':'이렇게 이해했어요'"></b><span class="meta" x-show="i===talk.turns.length-1">칩을 누르면 뺄 수 있어요 · 테두리는 이번에 바뀐 것 · ★는 필수</span><span class="meta" x-show="t.via" x-text="t.via==='llm'?('해석 '+(t.model||'기본 모델')):'해석 규칙(모델 응답 없음)'"></span></div>
              <div class="flex flex-wrap gap-1.5" style="margin-top:6px">
              <template x-for="c in t.chips" x-bind:key="c.key">
              <button type="button" class="tbchip" x-bind:class="{neg:c.neg, 'new':c.new, req:c.req}" x-bind:disabled="i!==talk.turns.length-1" x-on:click="talkDrop(c)" data-tip="누르면 이 조건을 뺍니다" data-tip-pos="top"><span class="tbchip__k" x-text="c.k"></span> <span x-text="c.v"></span><span class="talk__x" x-show="i===talk.turns.length-1">×</span></button>
              </template>
              <span class="tbchip dim" x-show="!t.chips.length">조건을 찾지 못했어요 · 다른 말로 해 보세요</span>
              </div>
              <div class="talk__warn" x-show="t.miss" x-text="t.miss"></div>
              <div class="talk__n"><b class="tnum" x-text="t.n"></b><span>건</span><span class="meta tnum" x-show="t.prev!=null" x-text="t.prev+' → '+t.n"></span><span class="meta tnum" x-show="t.neg_n" x-text="'제외로 빠짐 '+t.neg_n"></span><span class="meta tnum" x-show="t.feed_n" x-text="'원천 조건으로 빠짐 '+t.feed_n"></span></div>
              <table class="ds-table talk__tbl" x-show="t.samples.length"><tbody>
              <template x-for="s in t.samples" x-bind:key="'s'+(s.hash||s.title)"><tr><td x-text="s.title"></td><td class="text-muted" x-text="s.service||''"></td><td class="text-muted tnum" x-text="s.grade||''"></td></tr></template>
              </tbody></table>
              </div>
              </div>
              </template>
              <div class="talk__in">
              <textarea class="field" rows="2" style="resize:vertical" x-model="talk.input" x-on:keydown.enter.prevent="talkSend()" x-bind:placeholder="talk.turns.length?'더 말하기 · 예: 야구는 빼줘 · 쇼츠랑 라이브는 빼고 사진 있는 것만':'무엇을 묶을지 말해 주세요 · 예: 스포츠 경기 리뷰랑 전술 분석 위주로. 팬 응원은 빼고, 브런치 글도 빼줘. 최근 2주.'"></textarea>
              <div class="talk__row">
              <x-modelpick key="tk" value="studioModel" set="studioModel=$v" groups="textGroups" first-label="기본 실행 모델" first-value="" width="212px" tip="문장을 조건으로 푸는 모델 · 기본 실행 모델은 /config 실행 설정"></x-modelpick>
              <button type="button" class="ds-btn ds-btn--primary" x-on:click="talkSend()" x-bind:disabled="talk.busy || !talk.input.trim()" x-text="talk.busy?'해석 중…':'보내기'"></button>
              <button type="button" class="ds-btn ds-btn--outline" x-show="talk.turns.length" x-on:click="talkReset()">처음부터</button>
              <span class="meta" x-show="studioMsg" x-text="studioMsg"></span>
              </div>
              <div class="talk__save" x-show="talk.turns.length">
              <label class="meta">이름</label><input class="field" style="max-width:280px" x-model="studio.name" placeholder="토픽 이름 · 첫 문장에서 제안">
              <span style="margin-left:auto"></span>
              <button type="button" class="ds-btn ds-btn--secondary" x-on:click="talkSave('draft')" x-bind:disabled="studioSaving">초안 저장</button>
              <button type="button" class="ds-btn ds-btn--primary" x-on:click="talkSave('active')" x-bind:disabled="studioSaving || !talkN()" x-bind:data-tip="talkN()?'저장하고 바로 활성':'0건이면 활성화할 수 없어요 · 초안으로 저장'" data-tip-pos="top" x-text="studio.editId?'수정 저장':'활성화'"></button>
              </div>
              </div>
              </div>
              <div class="ds-steps ds-steps--labeled" x-show="topicGenTab==='manual' && studioManual">

                <!-- STEP 1 · 이름 -->
                <div class="ds-step" x-bind:class="{'ds-step--done': !!studio.name.trim(), 'ds-step--active': tActive()===1}">
                  <div class="ds-step__rail"><span class="ds-step__pill"><span class="n">STEP 1</span><span class="c">✓</span></span><span class="ds-step__line"></span></div>
                  <div class="ds-step__body">
                    <div class="ds-step__head"><b>이름 짓기</b><span class="ds-step__guide">이 묶음을 뭐라고 부를까요?</span></div>
                    <input class="field" x-model="studio.name" placeholder="예) 경제 심층분석 큐레이션">
                  </div>
                </div>

                <!-- STEP 2 · 자연어 -->
                <div class="ds-step" x-bind:class="{'ds-step--done': !!studio.prompt.trim(), 'ds-step--active': tActive()===2}">
                  <div class="ds-step__rail"><span class="ds-step__pill"><span class="n">STEP 2</span><span class="c">✓</span></span><span class="ds-step__line"></span></div>
                  <div class="ds-step__body">
                    <div class="ds-step__head"><b>말로 설명하기</b><span class="ds-step__guide">원하는 묶음을 문장으로 · ‘조건값 자동생성’을 누르면 아래 조건이 채워집니다</span></div>
                    <textarea class="field" rows="2" style="resize:vertical" x-model="studio.prompt" x-on:input="schedulePreview()" placeholder="예) 경제·산업 심층분석만 모으고 속보는 빼줘"></textarea>
                    <div class="tairow">
                      <button type="button" class="ds-btn ds-btn--primary ds-btn--s-sm" x-on:click="studioSuggest()" x-bind:disabled="studioSuggesting || !studio.prompt.trim()" data-tip="설명을 읽고 아래 조건값을 자동으로 만듭니다" data-tip-pos="top" x-text="studioSuggesting ? '생성 중…' : '✨ 조건값 자동생성'"></button>
                      <span class="tmodel">
                        <span class="tmodel__lbl">모델</span>
                        <x-modelpick key="st" value="studioModel" set="studioModel=$v" groups="textGroups" first-label="기본 실행 모델" first-value="" width="212px" tip="조건값 생성에 쓸 모델 · 직접(Solar)·라우터 선택 가능 · 미연결 제공자 모델은 키 등록 후 선택" tip-pos="top"></x-modelpick>
                      </span>
                    </div>
                    <div class="text-xs" style="color:var(--ds-muted);margin-top:7px" aria-live="polite" x-text="studioMsg"></div>
                  </div>
                </div>

                <!-- STEP 3 · 조건 -->
                <div class="ds-step" x-bind:class="{'ds-step--done': !!(studio.cats.length||studio.intents.length||studio.keywords.length||studio.eattrs.length), 'ds-step--active': tActive()===3}">
                  <div class="ds-step__rail"><span class="ds-step__pill"><span class="n">STEP 3</span><span class="c">✓</span></span><span class="ds-step__line"></span></div>
                  <div class="ds-step__body">
                    <div class="ds-step__head"><b>조건 확인·조정</b><span class="ds-step__guide">필수는 모든 묶음의 뼈대(반드시), 선택은 각각이 관련 묶음이 됩니다 · 칩을 누를수록 후보→선택→필수</span></div>
                    <div class="tfilter"><span class="tfilter__badge">✨ 묶음</span><span class="tfilter__text" x-html="bundleSummaryText()"></span></div>
                    <div class="tlegend"><span class="sw sw--off"></span>회색=후보 · <span class="sw sw--sel"></span>색=선택(관련 묶음) · <span class="sw sw--req"></span><b>★필수</b>=반드시(모든 묶음 공통) · <span class="sw sw--neg"></span><b>✖제외</b>=걸리면 탈락(모든 묶음) · <span class="tauto">✨</span>=자동 선택 · <span style="color:var(--ds-muted)">칩을 누를수록 후보→선택→필수→제외→후보</span></div>
                    <div class="tcond__g">
                      <div class="tcond__lbl">카테고리 <span x-text="'· 선택 '+studio.cats.length+(studio.req.cats.length?(' (필수 '+studio.req.cats.length+')'):'')"></span></div>
                      <div class="flex flex-wrap gap-1.5">
                        <template x-for="c in studioCatChips()" x-bind:key="'cat'+c.k"><span class="ds-badge" style="cursor:pointer" x-bind:class="chipCls('cats',c.k,'ds-badge--category')" x-on:click="studioCycle('cats',c.k)" data-tip="누를수록 후보→선택→필수→제외"><span x-show="studioState('cats',c.k)==='req'" class="treq">★필수</span><span x-show="studioState('cats',c.k)==='neg'" class="tneg">✖제외</span><span x-show="isAuto('cats',c.k)" class="tauto">✨</span><span x-text="catBoth(c.k)+' ('+c.v+')'"></span></span></template>
                        <span x-show="!studioCatChips().length" class="text-xs text-muted">데이터에 카테고리가 없습니다</span>
                      </div>
                    </div>
                    <div class="tcond__g">
                      <div class="tcond__lbl">인텐트 <span x-text="'· 선택 '+studio.intents.length+(studio.req.intents.length?(' (필수 '+studio.req.intents.length+')'):'')"></span></div>
                      <div class="flex flex-wrap gap-1.5">
                        <template x-for="c in studioIntentChips()" x-bind:key="'int'+c.k"><span class="ds-badge" style="cursor:pointer" x-bind:class="chipCls('intents',c.k,'ds-badge--intent')" x-on:click="studioCycle('intents',c.k)" data-tip="누를수록 후보→선택→필수→제외"><span x-show="studioState('intents',c.k)==='req'" class="treq">★필수</span><span x-show="studioState('intents',c.k)==='neg'" class="tneg">✖제외</span><span x-show="isAuto('intents',c.k)" class="tauto">✨</span><span x-text="c.k+' ('+c.v+')'"></span></span></template>
                        <span x-show="!studioIntentChips().length" class="text-xs text-muted">데이터에 인텐트가 없습니다</span>
                        </div>
                        </div>
                        <div class="tcond__g">
                        <div class="tcond__lbl">출처 <span x-text="'· 선택 '+studio.srcs.length+(studio.req.srcs.length?(' (필수 '+studio.req.srcs.length+')'):'')"></span><span class="meta" style="cursor:help" data-tip="서비스 · 매체명 · 적재 때 붙는 값(LLM 추출 없음)">?</span></div>
                        <div class="flex flex-wrap gap-1.5">
                        <template x-for="c in studioSrcChips()" x-bind:key="'src'+c.k"><span class="ds-badge" style="cursor:pointer" x-bind:class="chipCls('srcs',c.k,'ds-badge--entity')" x-on:click="studioCycle('srcs',c.k)" data-tip="누를수록 후보→선택→필수→제외" data-tip-pos="top" x-text="c.k"></span></template>
                        <span x-show="!studioSrcChips().length" class="text-xs text-muted">데이터에 출처가 없습니다</span>
                        </div>
                        </div>
                        <div class="tcond__g">
                        <div class="tcond__lbl">원천 조건 <span class="meta" style="cursor:help" data-tip="메타 축이 아닌 조건 · 행에 그 필드가 없으면 빠지고 미리보기에 '필드 없음'으로 집계">?</span></div>
                        <div class="feedg">
                        <label>기간 <input class="field" type="number" min="0" style="width:80px" x-model.number="studio.feed.days" x-on:change="schedulePreview()" placeholder="일"> <select class="field" style="width:auto" x-model="studio.feed.basis" x-on:change="schedulePreview()"><option value="org">발행일</option><option value="ingest">적재일</option></select></label>
                        <label>사진 <select class="field" style="width:auto" x-model="studio.feed.image" x-on:change="schedulePreview()"><option value="">무관</option><option value="yes">있음</option><option value="no">없음</option></select></label>
                        <label>영상 <select class="field" style="width:auto" x-model="studio.feed.video" x-on:change="schedulePreview()"><option value="">무관</option><option value="yes">있음</option><option value="no">없음</option></select></label>
                        <label>길이 <input class="field" type="number" min="0" style="width:80px" x-model.number="studio.feed.min_len" x-on:change="schedulePreview()" placeholder="이상"> ~ <input class="field" type="number" min="0" style="width:80px" x-model.number="studio.feed.max_len" x-on:change="schedulePreview()" placeholder="이하"></label>
                        <label>열독률 <input class="field" type="number" min="0" max="1" step="0.05" style="width:80px" x-model.number="studio.feed.min_dri" x-on:change="schedulePreview()" placeholder="이상"></label>

              </template>
              <template x-for="t in (topicData?topicData.composite:[])" x-bind:key="t.cluster_id">
                <tr x-show="topicView!=='manual' && topicRowOk(t)" style="cursor:pointer" role="button" tabindex="0" x-on:click="topicDrill(t)" x-on:keydown.enter="topicDrill(t)" data-tip="묶인 콘텐츠 보기" data-tip-pos="left">
                  <td style="white-space:nowrap" x-on:click.stop><button type="button" role="switch" class="tsw" x-bind:aria-checked="t.status!=='paused'" x-bind:class="{on:t.status!=='paused'}" x-bind:disabled="!topicAdmin || topicBusy===t.cluster_id" x-on:click.stop="topicToggle(t)" x-bind:data-tip="topicSwTip(t)" data-tip-pos="top" x-bind:aria-label="topicSwTip(t)"></button></td>
                  <td style="white-space:nowrap"><span class="ds-badge ds-badge--neutral">자동 · 사건형</span> <span class="ds-badge ds-badge--neutral" x-show="t.status==='paused'">일시정지</span></td>
                  <td class="text-ink" x-text="t.cluster_id"></td>
                  <td x-text="(t.rep_entities||t.entities||[]).join(' · ')"></td>
                  <td class="tnum" x-text="(t.n_contents || t.count || (t.content_ids?t.content_ids.length:0)) + (t.nondist_n?(' · 편입 '+t.nondist_n):'') + (t.excluded_n?(' · 제외 '+t.excluded_n):'')"></td>
                  <td class="tnum" x-text="t.today||0"></td><td class="tnum" x-text="t.d7||0"></td>
                  <td style="white-space:nowrap"><span class="ds-badge" x-bind:class="(t.signal||'').indexOf('급감')===0?'ds-badge--error':'ds-badge--status'" x-show="t.signal" x-text="t.signal"></span></td>
                  <td></td>
                </tr>
              </template>
              <tr x-show="topicView!=='auto' && !(topicData.custom||[]).length"><td colspan="9" class="text-muted">아직 만든 토픽이 없습니다 · 위 토픽 생성하기에서 정의해 저장하세요</td></tr>
              <tr x-show="topicView!=='manual' && !((topicData.single||[]).length||(topicData.composite||[]).length)"><td colspan="9" class="text-muted">자동 생성 토픽 없음 · 데이터가 많을수록 · 자동으로 묶기 기준을 낮추면 더 형성됩니다</td></tr>
            </tbody></table></div>
          </div>

          <!-- 토픽에서 제외한 콘텐츠: 큐레이션 오버레이 관리(자동·사용자 토픽 공통) -->
          <div class="panel" x-show="exclusionRows().length">
            <div class="panel-hd"><b>토픽에서 제외한 콘텐츠</b><span class="meta tnum" x-text="exclusionRows().length+'건'"></span><span class="meta">매칭 조건은 그대로 · 개별 편집 판단으로 뺀 목록 · 복구하면 다시 묶입니다</span></div>
            <div class="overflow-auto"><table class="ds-table"><thead><tr><th>토픽</th><th>콘텐츠</th><th></th></tr></thead><tbody>
              <template x-for="e in exclusionRows()" x-bind:key="e.tid+e.h">
                <tr><td x-text="e.topic || e.tid"></td><td class="text-ink" x-text="e.title || e.h"></td>
                <td style="text-align:right"><button type="button" class="copybtn" x-show="topicAdmin" x-on:click="topicRestore(e.tid, e.h)">복구</button></td></tr>
              </template>
            </tbody></table></div>
          </div>
        </div>
      </div>
      </template>
