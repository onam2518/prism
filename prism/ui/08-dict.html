                  </select></span>
                <!-- ①·②·④ 는 서비스와 무관한 단일 프롬프트 · ③ 인텐트만 서비스별 분기절이 달라 그때만 노출 -->
                <span class="selctl" x-show="pvCall==='intent'" data-tip="③ 인텐트만 콘텐츠 서비스에 따라 '[서비스 카테고리 분류값]' 절이 달라집니다 · 나머지 호출은 서비스와 무관" data-tip-pos="top"><span class="selctl__lbl">서비스</span>
                  <select class="field" x-model="pvService" x-on:change="loadPreview()"><template x-for="g in groups" x-bind:key="'pg'+g"><option x-bind:value="g" x-text="g"></option></template></select></span>
                <span class="text-xs text-muted" x-text="pvSrc ? (pvStored ? ('v' + pvStored.version + ' · ' + fmtTs(pvStored.ts)) : pvMsg) : (pvData ? ('계열 ' + pvData.family) : '')"></span>
                <button type="button" class="ds-btn ds-btn--secondary ds-btn--s-sm" style="margin-left:auto" x-on:click="downloadPrompt(pvSrcParams())" data-tip="선택한 원천의 4호출 system·user 템플릿을 호출마다 파일로 나눠 zip 으로 · ③ 인텐트는 서비스별 파일" data-tip-pos="top">내려받기(zip)</button>
              </div>
              <div class="codeblock"><div class="codeblock__bar"><span class="codeblock__dots"><i></i><i></i><i></i></span>system<span class="codeblock__stage" x-text="pvStageModel"></span></div><textarea readonly spellcheck="false" x-bind:value="pvSystem"></textarea></div>
              <div class="codeblock" style="margin-top:10px"><div class="codeblock__bar"><span class="codeblock__dots"><i></i><i></i><i></i></span>user<span class="codeblock__stage">입력 템플릿</span></div><textarea readonly spellcheck="false" style="min-height:90px" x-bind:value="pvData ? pvData.user : ''"></textarea></div>
            </div></section>
          <section class="panel"><div class="panel-hd"><b>추론 강도</b><span class="meta">전 단계 공통 · 선택 시 즉시 저장</span></div>
            <div class="panel-bd">
              <div class="ds-segmented" style="max-width:300px">
                <template x-for="o in reasoningOpts" x-bind:key="o.id"><button type="button" class="ds-segmented__item" x-bind:disabled="reasoningBusy" x-bind:aria-pressed="reasoning === o.id ? 'true' : 'false'" x-on:click="setReasoning(o.id)" x-text="o.label"></button></template>
              </div>
              <div class="text-xs text-muted" style="margin-top:7px" x-show="reasoningMsg" x-text="reasoningMsg"></div>
            </div></section>
        </div>
      </div>
      </template>
