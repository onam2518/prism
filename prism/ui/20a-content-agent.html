      <!-- ═══ 모듈: 실험실 · 콘텐츠 에이전트 (사용자향 · 스코프 격리 .ca-) ═══ -->
      <!-- 사용자향 뉴스 홈 프로토타입(위젯 은유). 관리자 앱과 CSS/JS 격리: 모든 클래스 .ca- 접두,
           서브탭만 Alpine 로컬 x-data(cav). 상세 설계는 docs/CONTENT_DASHBOARD_HANDOFF.md -->
      <template x-if="mod === 'lab' && labTab === 'ca'">
      <div class="w-full ca-root" x-data="{ cav: 'home' }">
        <style>
          .ca-root{ --caBg:#f5f7fa; --caSurf:#fff; --caSurf2:#eef1f6; --caInk:#141a22; --caInk2:#4a5462; --caInk3:#8b94a3;
            --caLine:#e2e6ec; --caLine2:#d3d9e2; --caPh:#dfe3e9; --caAcc:#2f57e6; --caAccSf:#e9eeff; --caGood:#148a5a; --caGoodSf:#def0e6; --caHot:#c25a2c;
            --caF:#2f62d8; --caT:#159a83; --caO:#a86a12; --caW:#b13a78;
            font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; color:var(--caInk); }
          @media (prefers-color-scheme:dark){ .ca-root{ --caBg:#0c0f14; --caSurf:#151b25; --caSurf2:#1c2430; --caInk:#eef2f8; --caInk2:#a9b3c1; --caInk3:#69737f; --caLine:#252e3b; --caLine2:#313b49; --caPh:#2a323f; --caAcc:#6a8bff; --caAccSf:#1b2340; --caGood:#3bb87e; --caGoodSf:#0e2a1e; --caHot:#e0785e; --caF:#6a92f2; --caT:#33b79e; --caO:#d19a3e; --caW:#dd6aa5; } }
          [data-theme="dark"] .ca-root, .dark .ca-root{ --caBg:#0c0f14; --caSurf:#151b25; --caSurf2:#1c2430; --caInk:#eef2f8; --caInk2:#a9b3c1; --caInk3:#69737f; --caLine:#252e3b; --caLine2:#313b49; --caPh:#2a323f; --caAcc:#6a8bff; --caAccSf:#1b2340; --caGood:#3bb87e; --caGoodSf:#0e2a1e; --caHot:#e0785e; --caF:#6a92f2; --caT:#33b79e; --caO:#d19a3e; --caW:#dd6aa5; }
          .ca-root *{ box-sizing:border-box; }
          .ca-hint{ background:var(--caAccSf); border:1px solid var(--caAcc); border-radius:10px; padding:10px 14px; font-size:12.5px; color:var(--caInk2); margin-bottom:14px; line-height:1.5; }
          .ca-hint b{ color:var(--caInk); }
          .ca-seg{ display:inline-flex; background:var(--caSurf2); border:1px solid var(--caLine); border-radius:999px; padding:4px; gap:3px; margin-bottom:16px; }
          .ca-seg button{ border:0; background:transparent; color:var(--caInk2); font:700 13px/1 inherit; padding:8px 16px; border-radius:999px; cursor:pointer; }
          .ca-seg button.on{ background:var(--caAcc); color:#fff; }
          .ca-stage{ background:var(--caBg); border:1px solid var(--caLine); border-radius:16px; padding:18px; position:relative; overflow:hidden; }
          .ca-board{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
          .ca-wgt{ background:var(--caSurf); border:1px solid var(--caLine); border-radius:12px; padding:12px 13px; position:relative; }
          .ca-wgt.span2{ grid-column:1 / -1; }
          .ca-wh{ display:flex; align-items:center; gap:7px; margin-bottom:9px; }
          .ca-dot{ width:9px; height:9px; border-radius:3px; flex:none; }
          .ca-wn{ font-size:13px; font-weight:800; flex:1; }
          .ca-live{ font:600 10px/1 var(--caMono,ui-monospace); color:var(--caT); display:inline-flex; align-items:center; gap:4px; }
          .ca-live::before{ content:""; width:6px; height:6px; border-radius:50%; background:var(--caT); }
          .ca-thumb{ background:var(--caPh); border-radius:6px; }
          .ca-nrow{ display:flex; gap:9px; align-items:flex-start; padding:7px 0; border-top:1px solid var(--caLine); }
          .ca-nrow:first-of-type{ border-top:0; }
          .ca-nrow .th{ width:44px; height:32px; border-radius:5px; background:var(--caPh); flex:none; }
          .ca-nt{ font-size:12px; font-weight:700; color:var(--caInk); line-height:1.4; }
          .ca-src{ font-size:10.5px; color:var(--caInk3); margin-top:2px; }
          .ca-badge{ display:inline-flex; align-items:center; gap:3px; font:600 9px/1 ui-monospace; padding:2px 6px; border-radius:4px; border:1px solid var(--caT); color:var(--caT); }
          .ca-badge.pin{ border-color:var(--caAcc); color:var(--caAcc); }
          .ca-why{ background:var(--caAccSf); border:1px solid var(--caAcc); border-radius:7px; padding:7px 9px; margin-top:8px; font-size:10.5px; color:var(--caInk2); }
          .ca-why b{ color:var(--caAcc); }
          .ca-fbs{ display:inline-flex; gap:5px; margin-left:5px; }
          .ca-fb{ font:700 9.5px/1 inherit; border-radius:999px; padding:3px 8px; border:1px solid var(--caLine2); color:var(--caInk3); background:var(--caSurf); cursor:pointer; }
          .ca-fb.up{ border-color:var(--caAcc); color:var(--caAcc); }
          .ca-fab{ position:absolute; right:14px; bottom:14px; display:inline-flex; align-items:center; gap:8px; background:var(--caAcc); color:#fff; border-radius:999px; padding:10px 15px 10px 12px; font:700 12px/1 inherit; box-shadow:0 6px 18px rgba(20,40,90,.3); }
          .ca-fab .av{ width:20px; height:20px; border-radius:50%; background:rgba(255,255,255,.32); }
          .ca-add{ border:1.5px dashed var(--caAcc); border-radius:12px; background:var(--caAccSf); color:var(--caAcc); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; min-height:64px; }
          /* 위젯 만들기 */
          .ca-two{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
          .ca-nl{ border:1.5px solid var(--caAcc); border-radius:12px; padding:12px 14px; background:var(--caSurf); }
          .ca-nl .said{ font-size:14px; font-weight:700; color:var(--caInk); line-height:1.5; }
          .ca-lab{ font:700 10px/1 ui-monospace; letter-spacing:.05em; text-transform:uppercase; color:var(--caInk3); margin:14px 0 8px; }
          .ca-grp{ margin-bottom:10px; }
          .ca-gl{ font-size:11px; font-weight:800; color:var(--caInk2); margin-bottom:6px; display:flex; align-items:center; gap:5px; }
          .ca-chips{ display:flex; gap:6px; flex-wrap:wrap; }
          .ca-ch{ display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:5px 8px 5px 11px; font-size:12px; font-weight:700; border:1px solid var(--caLine); background:var(--caSurf); color:var(--caInk); }
          .ca-ch .x{ color:var(--caInk3); font-size:11px; }
          .ca-ch.inc{ border-color:var(--caGood); color:var(--caGood); background:var(--caGoodSf); }
          .ca-ch.exc{ border-color:var(--caHot); color:var(--caHot); } .ca-ch.exc .p{ text-decoration:line-through; }
          .ca-ch.add{ border-style:dashed; color:var(--caInk3); font-weight:600; }
          .ca-prev{ border:1px solid var(--caLine); border-radius:12px; background:var(--caSurf); padding:13px; }
          .ca-prow{ display:flex; gap:9px; padding:7px 0; border-top:1px solid var(--caLine); }
          .ca-prow:first-of-type{ border-top:0; }
          .ca-prow.out{ opacity:.5; } .ca-prow.out .ca-nt{ text-decoration:line-through; }
          .ca-pwhy{ font-size:10px; font-weight:700; color:var(--caGood); margin-top:3px; }
          .ca-prow.out .ca-pwhy{ color:var(--caHot); }
          .ca-btn{ display:inline-flex; align-items:center; justify-content:center; width:100%; background:var(--caAcc); color:#fff; border:0; border-radius:8px; padding:10px; font:700 12px/1 inherit; margin-top:12px; cursor:pointer; }
          /* 크기/편집 */
          .ca-size{ display:inline-flex; border:1px solid var(--caLine); border-radius:6px; overflow:hidden; margin-left:auto; }
          .ca-size span{ font:700 9px/1 inherit; padding:5px 8px; color:var(--caInk3); }
          .ca-size span.on{ background:var(--caAcc); color:#fff; }
          .ca-wgt.edit{ border-style:dashed; border-color:var(--caAcc); }
          .ca-rm{ position:absolute; top:-8px; left:-8px; width:20px; height:20px; border-radius:50%; background:var(--caInk); color:var(--caSurf); font:700 12px/20px inherit; text-align:center; }
          @media (max-width:720px){ .ca-board,.ca-two{ grid-template-columns:1fr; } }
        </style>

        <div class="ca-hint">사용자향 <b>콘텐츠 에이전트</b> 화면 미리보기입니다(실험실). 위젯 은유 · 자연어로 위젯 만들기 · 왜?+피드백. 상세 설계는 <b>docs/CONTENT_DASHBOARD_HANDOFF.md</b>.</div>

        <div class="ca-seg">
          <button type="button" x-bind:class="cav==='home'?'on':''" x-on:click="cav='home'">홈</button>
          <button type="button" x-bind:class="cav==='make'?'on':''" x-on:click="cav='make'">위젯 만들기</button>
          <button type="button" x-bind:class="cav==='edit'?'on':''" x-on:click="cav='edit'">홈 편집</button>
        </div>

        <!-- 홈 -->
        <div x-show="cav==='home'" x-cloak class="ca-stage">
          <div class="ca-board">
            <div class="ca-wgt span2">
              <div class="ca-wh"><span class="ca-dot" style="background:var(--caInk3)"></span><span class="ca-wn">지금 뜨는 소식</span></div>
              <div class="ca-thumb" style="height:64px"></div>
              <div class="ca-nrow" style="border-top:0;padding-top:8px"><div><div class="ca-nt">李대통령 "서울 15억 중과 땐 엄청난 조세저항"</div><div class="ca-src">경제데스크 · 12분 전</div></div></div>
            </div>
            <div class="ca-wgt">
              <div class="ca-wh"><span class="ca-dot" style="background:var(--caW)"></span><span class="ca-wn">손흥민 소식</span><span class="ca-live">자동</span></div>
              <div class="ca-nrow"><span class="th"></span><div><div class="ca-nt">개막전 풀타임 소화하며 호평</div><div><span class="ca-badge pin">고정</span></div></div></div>
              <div class="ca-nrow"><span class="th"></span><div><div class="ca-nt">소속팀 프리시즌 원정 일정 확정</div></div></div>
              <div class="ca-why"><b>왜 이 소식?</b> 팔로우한 손흥민 · 요즘 자주 봄<span class="ca-fbs"><button type="button" class="ca-fb up">좋아요</button><button type="button" class="ca-fb">관심없음</button></span></div>
            </div>
            <div class="ca-wgt">
              <div class="ca-wh"><span class="ca-dot" style="background:var(--caO)"></span><span class="ca-wn">금리 이야기</span><span class="ca-live">자동</span></div>
              <div class="ca-nrow"><span class="th"></span><div><div class="ca-nt">한국은행 기준금리 동결…하반기 인하 주목</div></div></div>
              <div class="ca-nrow"><span class="th"></span><div><div class="ca-nt">물가 상승률 석 달째 둔화</div></div></div>
            </div>
            <div class="ca-add">＋ 위젯 추가</div>
          </div>
          <div class="ca-fab"><span class="av"></span>내 콘텐츠 매니저</div>
        </div>

        <!-- 위젯 만들기 -->
        <div x-show="cav==='make'" x-cloak class="ca-stage">
          <div class="ca-lab" style="margin-top:0">어떤 소식을 모을까요?</div>
          <div class="ca-nl"><div class="said">손흥민 나오는 토트넘 경기 소식 위주로, 이적 루머는 빼고 깊이 있는 리뷰로</div></div>
          <div class="ca-two" style="margin-top:14px">
            <div>
              <div class="ca-lab" style="margin-top:0">이렇게 이해했어요</div>
              <div class="ca-grp"><div class="ca-gl"><span class="ca-dot" style="background:var(--caW)"></span>모을 것 (인물·팀)</div><div class="ca-chips"><span class="ca-ch"><span class="p">손흥민</span><span class="x">✕</span></span><span class="ca-ch"><span class="p">토트넘</span><span class="x">✕</span></span><span class="ca-ch add">＋ 더</span></div></div>
              <div class="ca-grp"><div class="ca-gl"><span class="ca-dot" style="background:var(--caGood)"></span>꼭 이런 내용</div><div class="ca-chips"><span class="ca-ch inc"><span class="p">경기 결과</span><span class="x">✕</span></span><span class="ca-ch inc"><span class="p">경기 리뷰</span><span class="x">✕</span></span></div></div>
              <div class="ca-grp"><div class="ca-gl"><span class="ca-dot" style="background:var(--caHot)"></span>이런 건 빼고</div><div class="ca-chips"><span class="ca-ch exc"><span class="p">이적 루머</span><span class="x">✕</span></span></div></div>
              <div class="ca-grp" style="margin-bottom:0"><div class="ca-gl"><span class="ca-dot" style="background:var(--caT)"></span>읽는 방식</div><div class="ca-chips"><span class="ca-ch">깊이 있는 글</span></div></div>
            </div>
            <div>
              <div class="ca-lab" style="margin-top:0">이 조건이면 이런 소식</div>
              <div class="ca-prev">
                <div class="ca-prow"><span class="th ca-thumb" style="width:40px;height:30px;flex:none"></span><div><div class="ca-nt">토트넘 개막전 3-1 완승, 손흥민 멀티골</div><div class="ca-pwhy">✓ 토트넘 · 경기 결과</div></div></div>
                <div class="ca-prow"><span class="th ca-thumb" style="width:40px;height:30px;flex:none"></span><div><div class="ca-nt">손흥민 시즌 첫 도움…경기 리뷰</div><div class="ca-pwhy">✓ 손흥민 · 경기 리뷰</div></div></div>
                <div class="ca-prow out"><span class="th ca-thumb" style="width:40px;height:30px;flex:none"></span><div><div class="ca-nt">손흥민 이적설 재점화</div><div class="ca-pwhy">✕ 이적 루머라 빠짐</div></div></div>
                <button type="button" class="ca-btn">홈에 위젯 만들기</button>
              </div>
            </div>
          </div>
        </div>

        <!-- 홈 편집 -->
        <div x-show="cav==='edit'" x-cloak class="ca-stage">
          <div class="ca-board">
            <div class="ca-wgt edit span2"><span class="ca-rm">−</span><div class="ca-wh"><span class="ca-dot" style="background:var(--caInk3)"></span><span class="ca-wn">지금 뜨는 소식</span><span class="ca-size"><span>작게</span><span>보통</span><span class="on">크게</span></span></div><div class="ca-thumb" style="height:44px"></div></div>
            <div class="ca-wgt edit"><span class="ca-rm">−</span><div class="ca-wh"><span class="ca-dot" style="background:var(--caW)"></span><span class="ca-wn">손흥민 소식</span><span class="ca-size"><span>작게</span><span class="on">보통</span><span>크게</span></span></div></div>
            <div class="ca-wgt edit"><span class="ca-rm">−</span><div class="ca-wh"><span class="ca-dot" style="background:var(--caF)"></span><span class="ca-wn">경제</span><span class="ca-size"><span class="on">작게</span><span>보통</span><span>크게</span></span></div></div>
            <div class="ca-add">＋ 위젯 추가</div>
          </div>
          <div style="text-align:right;margin-top:12px"><button type="button" class="ca-btn" style="width:auto;padding:10px 20px">저장</button></div>
        </div>
      </div>
      </template>
