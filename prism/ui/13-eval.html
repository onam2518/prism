      <template x-if="mod === 'evaluate'">

                <div class="evaluation-field"><span>현재 프롬프트</span><b class="tnum" x-text="verTxt"></b><small x-show="esPreview && esPreview.prompt" x-text="esPreview && esPreview.prompt ? ('메타 '+esPreview.prompt.item_version+' · 품질 '+esPreview.prompt.quality_version) : ''"></small><button type="button" class="ds-btn ds-btn--secondary ds-btn--s-sm" x-on:click="downloadPrompt({model:esModels[0]})">현재 프롬프트 내려받기</button></div>
                <label class="evaluation-field"><span>평가 방식·검수 환경</span><select class="field" x-model="esEnvironmentId" x-on:change="esSelectEnvironment()" x-bind:disabled="esBusy"><option value="">기본 평가 · 정답셋 비교</option><template x-for="environment in esEnvironments" x-bind:key="environment.id"><option x-bind:value="environment.id" x-bind:selected="esEnvironmentId===environment.id" x-text="environment.name"></option></template></select><small>점수 정의는 기본 평가와 같습니다. 저장 환경의 판정 모델은 추가 진단의 기본값입니다.</small></label>
                <label class="evaluation-field"><span>최대 호출 수</span><input type="number" class="field" min="1" max="100000" step="1" required x-model.number="esMaxCalls" x-bind:disabled="esBusy"><small>실제 모델 호출 단위로 제한합니다. 비용 추정은 미확인입니다.</small></label>
              </div>
              <details class="evaluation-disclosure" x-show="assignAdmin"><summary>검수 환경 저장</summary><div class="evaluation-form-grid">
                <label class="evaluation-field"><span>환경 이름</span><input class="field" maxlength="100" x-model="esEnvironmentName" x-bind:disabled="esBusy || esEnvironmentBusy"></label>
                <div class="evaluation-field"><span>추가 진단 판정 모델</span><x-modelpick key="evaluation-environment-judge" value="esEnvironmentJudge" set="esEnvironmentJudge=$v" groups="textGroups" first-label="판정 모델 선택" first-value="" width="0px"></x-modelpick></div>
              </div><p class="text-xs">현재 호출 한도를 함께 저장합니다. 저장만으로 모델을 호출하지 않습니다.</p><button type="button" class="ds-btn ds-btn--secondary ds-btn--s-sm" x-bind:disabled="esBusy || esEnvironmentBusy" x-on:click="esSaveEnvironment()">검수 환경 저장</button></details>
              <p role="alert" class="text-xs evaluation-message" x-text="esEnvironmentError"></p>
              <fieldset class="evaluation-models" x-bind:disabled="esBusy"><legend>평가 대상 모델</legend>
                <template x-for="(slot,index) in esSlots" x-bind:key="slot.key"><div class="evaluation-model-row">
                  <div class="evaluation-field"><span x-text="'대상 ' + (index+1)"></span><x-modelpick key="evaluation-slot" value="slot.model" set="slot.model=$v; esSyncReference()" groups="textGroups" first-label="모델 선택" first-value="" width="0px"></x-modelpick></div>
                  <button type="button" class="ds-btn ds-btn--secondary ds-btn--s-sm" x-show="esSlots.length > 1" x-bind:aria-label="'대상 ' + (index+1) + ' 제거'" x-on:click="esRemoveSlot(slot.key)">제거</button>
                </div></template>
                <button type="button" class="ds-btn ds-btn--secondary ds-btn--s-sm" x-bind:disabled="esSlots.length>=6" x-on:click="esAddSlot()">모델 추가</button>
              </fieldset>
              <label class="evaluation-field" x-show="esModels.length > 1"><span>비교 기준 대상</span><select class="field" x-model="esReference" x-bind:disabled="esBusy"><template x-for="model in esModels" x-bind:key="model"><option x-bind:value="model" x-bind:selected="esReference===model" x-text="model"></option></template></select></label>
              <p class="text-xs" x-text="esSetupSummary"></p><p class="text-xs" role="status" x-show="esPreviewBusy">자료 범위를 확인하는 중…</p><p class="text-xs" x-show="esPreview && esPreview.truncated" x-text="esPreview ? ('현재 자료 '+esPreview.available_total+'건 중 최대 '+esPreview.total+'건 평가') : ''"></p><p class="text-xs evaluation-message" role="alert" x-text="esPreviewError"></p>
              <div class="control-row"><button type="submit" class="ds-btn ds-btn--primary" x-bind:disabled="esBusy || !assignAdmin" x-text="esBusy ? '평가 진행 중' : '평가 실행'"></button><span class="text-xs text-muted">실행 시 모델 호출 비용이 발생합니다.</span></div>
              <p role="alert" class="evaluation-message" x-text="esError"></p>
            </form>
          </section>
          <section class="panel" x-show="esRun" aria-labelledby="evaluation-progress-title">
            <div class="panel-hd"><b id="evaluation-progress-title">실행 진행</b><span role="status" aria-live="polite" x-text="esStatus(esRun)"></span></div>
            <div class="panel-bd space-y-4">
              <p class="ds-statusdot" x-text="esStage(esRun)"></p><p class="evaluation-note tnum" x-text="esCost(esRun)"></p>
              <div class="overflow-auto" tabindex="0" role="region" aria-label="대상별 평가 진행"><table class="ds-table"><thead><tr><th>평가 대상</th><th>성공</th><th>실패</th><th>미처리</th></tr></thead><tbody><template x-for="row in esProgressRows(esRun)" x-bind:key="row.model"><tr><th x-text="row.model"></th><td x-text="row.success"></td><td x-text="row.failed"></td><td x-text="row.pending"></td></tr></template></tbody></table></div>
              <p class="text-xs" x-show="esRun && esRun.status==='cancel_requested'">중단 요청됨 · 진행 중 호출이 끝날 때까지 비용이 발생할 수 있습니다.</p>
              <p role="alert" class="evaluation-message" x-text="esRun && (esRun.error || esRun.run_error) || ''"></p>
              <div class="control-row"><button type="button" class="ds-btn ds-btn--secondary" x-on:click="esOpenRun(esRun.id)">결과 보기</button><button type="button" class="ds-btn ds-btn--secondary" x-show="esIsActive(esRun) && esRun.status!=='cancel_requested' && assignAdmin" x-bind:disabled="esActionBusy" x-on:click="esCancel(esRun.id)">중단 요청</button><button type="button" class="ds-btn ds-btn--secondary" x-show="esCanResume(esRun) && assignAdmin" x-bind:disabled="esActionBusy" x-on:click="esResume(esRun.id)">같은 조건으로 재개</button></div>
            </div>
          </section>
          </div>
          <div id="eval-panel-results" role="tabpanel" aria-labelledby="eval-tab-results" x-show="evalTab==='results'" class="space-y-4">
          <section class="panel"><div class="panel-hd"><b>평가 이력</b><span class="meta">종류와 관계없이 상세 보기에서 저장된 지표와 건별 결과를 확인합니다</span>
            <button type="button" class="ds-iconbtn ds-iconbtn--bordered ml-auto" x-on:click="loadEvalRuns()" data-tip="새로고침" data-tip-pos="bottom" aria-label="평가 이력 새로고침"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 11a8 8 0 1 0-.9 4.5M20 5v6h-6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
            <div class="panel-bd space-y-4">
              <div class="control-row">
                <label class="selctl"><span class="selctl__lbl">종류</span><select class="field" x-model="evalHistoryFilter"><option value="all">전체</option><option value="evaluation">통합 평가</option><option value="eval">과거 일반 평가</option><option value="pilot">오토파일럿</option><option value="compare">모델 비교</option></select></label>
                <span role="alert" class="text-xs text-muted" x-text="evalHistoryError"></span>
              </div>
              <div class="text-xs text-muted" x-show="!evalHistoryRows.length && !evalHistoryError">표시할 평가가 없습니다. 실행 탭에서 평가를 시작하세요.</div>
              <template x-if="evalHistoryRows.length">
                <div class="overflow-auto" style="max-height:300px"><table class="ds-table ds-table--compact" style="min-width:960px"><thead><tr><th style="width:64px">#</th><th style="width:104px">시각</th><th style="width:100px">종류</th><th>모델</th><th style="width:104px">범위</th><th style="width:100px">상태</th><th style="width:76px">일치율</th><th style="width:220px">작업</th></tr></thead><tbody>
                  <template x-for="r in evalHistoryRows" x-bind:key="r.kind+'|'+r.id">
                    <tr x-bind:class="evalSelected && evalSelected.kind===r.kind && evalSelected.id===r.id ? 'is-sel' : ''">
                      <td class="tnum" x-bind:title="String(r.id)" x-text="r.kind==='pilot' ? ('#'+r.pilot_id+' · '+r.round+'R') : (r.kind==='compare' ? '·' : r.kind==='evaluation' ? String(r.id).slice(0,8) : r.id)"></td>
                      <td class="tnum" x-text="fmtTs(r.ts)"></td>
                      <td><span class="ds-badge" x-bind:class="r.kind==='pilot' ? 'ds-badge--intent' : (r.kind==='compare' ? 'ds-badge--category' : 'ds-badge--neutral')" x-text="r.kind==='pilot' ? '오토파일럿' : (r.kind==='compare' ? '모델별 비교' : '평가 실행')"></span></td>
                      <td x-text="r.kind==='evaluation' ? (r.model_names || []).join(', ') : (r.model || '과거 기록')"></td>
                      <td x-text="r.kind==='pilot' ? ('고정 정답셋 ' + r.golden_n + '건') : ((r.scope === 'eval' ? '평가용만' : '전체 정답셋') + (r.kind==='compare' && r.golden_n ? ' ' + r.golden_n + '건' : ''))"></td>
                      <td>
                        <span class="ds-badge" x-show="(r.kind==='eval' || r.kind==='evaluation')" x-bind:class="r.status==='done' ? 'ds-badge--success' : (r.status==='failed' ? 'ds-badge--error' : (r.stalled ? 'ds-badge--warning' : 'ds-badge--neutral'))" x-text="evalRunStatusTxt(r)"></span>
                        <span class="ds-badge" x-show="r.kind==='pilot'" x-bind:class="r.status==='reverted' ? 'ds-badge--warning' : 'ds-badge--success'" style="cursor:help" x-bind:data-tip="r.status==='reverted' ? '이 라운드 보정은 점수를 낮춰 반영하지 않았습니다' : '이 라운드 보정이 반영됐습니다'" data-tip-pos="top" x-text="r.status==='reverted' ? '원복' : '반영'"></span>
                        <span class="ds-badge ds-badge--success" x-show="r.kind==='compare'">완료</span>
                      </td>
                      <td class="tnum" x-text="r.grade_accuracy != null ? Math.round(r.grade_accuracy*100)+'%' : '·'"></td>
                      <td><div class="control-row control-row--compact">
                        <button type="button" class="ds-btn ds-btn--secondary ds-btn--s-sm" x-on:click="openEvalHistory(r)" x-bind:aria-label="evalKindLabel(r.kind) + ' ' + fmtTs(r.ts) + ' 상세 보기'">상세 보기</button>
                        <button type="button" class="ds-btn ds-btn--secondary ds-btn--s-sm" x-show="r.kind!=='evaluation' && (r.kind==='eval' || r.version)" data-tip="이 평가에 저장된 프롬프트(zip · 호출별 파일) 내려받기" data-tip-pos="top" x-on:click="downloadPrompt(r.kind==='eval' ? { run: r.id } : { v: r.version })" x-text="r.kind==='eval' ? '프롬프트' : '프롬프트 v' + r.version"></button>
                        <span class="text-xs text-muted" x-show="r.kind==='pilot' && !r.version">프롬프트 기록 없음</span>
                        <button type="button" class="ds-btn ds-btn--secondary ds-btn--s-sm" x-show="r.kind==='evaluation' && esIsActive(r) && r.status!=='cancel_requested' && assignAdmin" x-bind:disabled="esActionBusy" x-on:click="esCancel(r.id)">중단 요청</button>
                        <button type="button" class="ds-btn ds-btn--secondary ds-btn--s-sm" x-show="r.kind==='evaluation' && esCanResume(r) && assignAdmin" x-bind:disabled="esActionBusy" x-on:click="esResume(r.id)">같은 조건으로 재개</button>
                        <button type="button" class="ds-btn ds-btn--secondary ds-btn--s-sm" x-show="r.kind==='eval' && r.status==='running' && !r.stalled" x-on:click="cancelEvalRun(r.id)">중단</button>
                        <button type="button" class="ds-btn ds-btn--secondary ds-btn--s-sm" x-show="r.kind==='eval' && (r.stalled || r.status==='failed')" data-tip="저장된 건을 빼고 남은 건만 이어서 실행합니다" data-tip-pos="top" x-on:click="resumeEvalRun(r.id)">재개</button>
                        <button type="button" class="ds-btn ds-btn--secondary ds-btn--s-sm" x-show="r.kind==='eval' && r.status==='done'" x-bind:class="cmpRunA===r.id ? 'is-on' : ''" data-tip="이 런을 비교 기준(개선 전)으로 지정합니다" data-tip-pos="top" x-on:click="setCmpBase(r.id)" x-text="cmpRunA===r.id ? '기준 ✓' : '기준'"></button>
                        <button type="button" class="ds-btn ds-btn--secondary ds-btn--s-sm" x-show="r.kind==='eval' && r.status==='done' && cmpRunA && cmpRunA!==r.id" x-bind:disabled="evalCmpBusy" data-tip="기준 런 대비 이 런의 개선/회귀를 판정합니다" data-tip-pos="top" x-on:click="compareRuns(r.id)">비교</button>
                      </div></td>
                    </tr>
                  </template>
                </tbody></table></div>
              </template>
              <div class="text-xs text-muted" style="margin-top:8px" x-show="evalRuns.filter(r=>r.kind==='eval' && r.status==='done').length > 1 && !cmpRunA">런 비교: 완주한 런에서 <b>기준</b>(개선 전)을 고른 뒤 다른 런의 <b>비교</b>를 누르세요 · 프롬프트를 고친 전후를 재는 용도입니다</div>
              <span class="text-xs text-muted" x-show="evalCmp && !evalCmp.ok" x-text="evalCmp ? evalCmp.error : ''"></span>
              <!-- 비교 결과: 회귀 가드(학습배치와 동일 기준) · 회귀 발견 시 적용 보류 권고 -->
              <template x-if="evalCmp && evalCmp.ok">
                <div class="tile" style="margin-top:10px">
                  <div class="t" style="margin:0 0 8px">런 비교 · <span class="tnum" x-text="'#' + evalCmp.a.id + ' (기준) → #' + evalCmp.b.id + ' (대상)'"></span>
                    <span class="ds-badge" style="margin-left:8px;cursor:help" data-tip-pos="top"
                      x-bind:class="esLegacyComparisonState(evalCmp)==='regressed' ? 'ds-badge--error' : (esLegacyComparisonState(evalCmp)==='improved' ? 'ds-badge--success' : 'ds-badge--neutral')"
                      x-bind:data-tip="evalCmp.verdict==='regressed' ? '점수가 낮아지면 채택하지 않습니다(보수 채택 · 학습 일배치의 자동 원복과 동일 기준)' : '대응 표본과 지표별 차이를 확인하세요. 개선 후보는 통계적으로 입증된 우위를 뜻하지 않습니다'"
                      x-text="esLegacyComparisonLabel(evalCmp)"></span>
                  </div>
                  <ul class="ds-bullets" x-show="(evalCmp.regressions||[]).length" style="margin:0 0 8px">
                    <template x-for="(g,gi) in evalCmp.regressions" x-bind:key="'rg'+gi"><li x-text="g"></li></template>
                  </ul>
                  <div class="overflow-auto"><table class="ds-table"><thead><tr><th style="width:150px">항목</th><th>기준 <span class="tnum" x-text="'#'+evalCmp.a.id"></span></th><th>대상 <span class="tnum" x-text="'#'+evalCmp.b.id"></span></th><th style="width:90px">변화</th></tr></thead><tbody>
                    <template x-for="row in evalCmpRows" x-bind:key="'cmr'+row.k">
                      <tr><td class="text-ink" x-text="row.k"></td><td class="tnum" x-text="row.a"></td><td class="tnum" x-text="row.b"></td>
                        <td><b class="tnum" x-bind:style="row.cls==='down' ? 'color:var(--ds-error-deep)' : (row.cls==='up' ? 'color:var(--ds-success-deep)' : '')" x-text="row.dTxt"></b></td></tr>
                    </template>
                  </tbody></table></div>
                  <template x-if="evalCmp.paired"><details><summary>대응 차이와 95% 신뢰구간</summary><p x-text="evalCmp.paired.reason"></p><template x-for="metric in evalPairMetrics(evalCmp.paired)" x-bind:key="metric.key"><p class="text-xs" x-text="metric.label + ' · ' + evalPairText(metric)"></p></template></details></template>
                  <div class="text-xs text-muted" style="margin-top:6px">저장된 원문·정답·표본의 대응 관계와 지표별 신뢰구간을 확인하세요. 작은 표본이나 불명확한 차이에서는 결론을 보류합니다.</div>
                </div>
              </template>
            </div>
          </section>
          <!-- 오토파일럿: 자동 개선 루프(Atelier 이식) · 라운드=학습 반영→재평가 · 악화 자동 원복 -->
          <p class="text-muted" x-show="!evalSelected">이력에서 상세 보기를 선택하세요.</p>
          <p role="status" aria-live="polite" x-show="evalDetailBusy">평가 상세를 불러오는 중…</p>
          <div role="alert" x-show="evalDetailError"><span x-text="evalDetailError"></span> <button type="button" class="ds-btn ds-btn--secondary" x-on:click="openEvalHistory(evalSelected)">다시 시도</button></div>
          <template x-if="evalDetail">
            <div class="content-section-stack">
              <section class="panel" aria-labelledby="eval-detail-title">
                <div class="panel-hd"><b id="eval-detail-title" x-ref="evalDetailTitle" x-text="evalKindLabel(evalDetail.kind) + ' 상세'" tabindex="-1"></b><span class="meta" x-text="fmtTs(evalDetail.ts)"></span>
                  <button type="button" class="ds-iconbtn ds-iconbtn--bordered ml-auto" x-on:click="openEvalHistory(evalSelected, true)" data-tip="새로고침" data-tip-pos="bottom" aria-label="평가 상세 새로고침"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 11a8 8 0 1 0-.9 4.5M20 5v6h-6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
                <div class="panel-bd space-y-4">
                  <p class="evaluation-verdict" role="status" x-text="esVerdict(evalDetail)"></p>
                  <h3 class="evaluation-subtitle">평가 기준과 처리 현황</h3>
                  <dl class="ds-deflist evaluation-basis"><template x-for="row in esBasisRows(evalDetail)" x-bind:key="row[0]"><div class="ds-fieldrow"><dt class="ds-fieldrow__label" x-text="row[0]"></dt><dd class="ds-fieldrow__value" x-text="row[1]"></dd></div></template></dl>

                  </tbody></table></div>
                  <ul class="result-notes">

                  <ul class="ds-bullets" x-show="evalDetail.detail_mode!=='all'"><li><span x-text="sents(evalDetail.detail_mode==='mismatches' ? '이 과거 회차에는 등급 불일치 건만 저장되어 있습니다. 나머지 건과 메타 상세는 기록이 없습니다.' : '이 과거 회차에는 건별 결과가 저장되지 않았습니다. 위 요약 지표만 확인할 수 있습니다.')[0]"></span><ul x-show="sents(evalDetail.detail_mode==='mismatches' ? '이 과거 회차에는 등급 불일치 건만 저장되어 있습니다. 나머지 건과 메타 상세는 기록이 없습니다.' : '이 과거 회차에는 건별 결과가 저장되지 않았습니다. 위 요약 지표만 확인할 수 있습니다.').length > 1"><template x-for="(s,i) in sents(evalDetail.detail_mode==='mismatches' ? '이 과거 회차에는 등급 불일치 건만 저장되어 있습니다. 나머지 건과 메타 상세는 기록이 없습니다.' : '이 과거 회차에는 건별 결과가 저장되지 않았습니다. 위 요약 지표만 확인할 수 있습니다.').slice(1)" x-bind:key="i"><li x-text="s"></li></template></ul></li></ul>

                    <label class="selctl"><span class="selctl__lbl">콘텐츠 검색</span><input type="search" class="field" x-model="evalItemSearch" x-on:input="evalItemLimit=50" placeholder="제목 또는 해시"></label>
                    <span class="text-xs text-muted" x-text="evalFilteredItems.length + '건'"></span>

                  <p class="text-xs" x-show="evalExpectedCoverage" x-text="evalExpectedCoverage"></p>
                  <ul class="ds-bullets"><li>위 건수와 점수는 평가 당시 저장된 결과 기준입니다<ul><li>이후 원본에서 복구한 정답은 별도 표시하며, 당시 점수에는 반영하지 않습니다</li><li>정답이 없거나 재확정이 필요한 항목은 해당 메타 점수에서 제외됩니다</li><li>등급 일치는 메타의 정확성을 뜻하지 않습니다</li></ul></li></ul>
                  <div class="overflow-auto"><table class="ds-table item-compare-table item-compare-table--metadata" x-bind:style="'--compare-model-count:' + evalCols.length"><colgroup><col class="item-compare-content"><col><template x-for="m in evalCols" x-bind:key="m.model"><col></template></colgroup><thead><tr><th>콘텐츠</th><th>정답 · 복구 내역</th><template x-for="m in evalCols" x-bind:key="m.model"><th x-text="m.model"></th></template></tr></thead><tbody>
                    <template x-for="it in evalItems" x-bind:key="it.hash"><tr>

                          <span class="text-xs text-muted" x-text="'모델이 맞음 ' + ((it.judgment.judge||{}).adopt||0) + ' · 정답 유지 ' + ((it.judgment.judge||{}).reject||0)"></span>
                        </div></template>
                      </td>
                      <template x-for="cell in evalItemCells(it)" x-bind:key="cell.model"><td>
                        <span class="text-xs" x-text="evalCellStatus(cell.data)"></span>
                        <p class="text-xs text-muted" x-show="cell.data.error" x-text="cell.data.error"></p>

                          <dl><template x-for="field in evalItemFields" x-bind:key="field[0]"><div><dt class="text-xs text-muted" x-text="field[1]"></dt><dd style="margin:0 0 var(--ds-space-2);white-space:pre-wrap;overflow-wrap:anywhere"><span x-text="evalMetaText(cell.data, field[0], cell.expected)"></span><div class="text-xs text-muted" x-show="cell.expected && evalExpectedNote(cell.status[field[0]])" x-text="evalExpectedNote(cell.status[field[0]])"></div></dd></div></template></dl>
                          <template x-for="record in evalEvidenceFor(it.hash, cell.expected ? null : cell.model)" x-bind:key="record.slot"><details>
                            <summary x-text="({reference:'정답 원문 검토',fact:'산출 원문 검토',coverage:'정답 정보 보존'}[record.stage] || record.stage) + (record.ok ? '' : ' · 판정 실패')"></summary>

                          </details></template>
                          <p class="text-xs text-muted" x-show="cell.data.rubric && cell.data.rubric.note" x-text="cell.data.rubric ? cell.data.rubric.note : ''"></p>

                  </tbody></table></div>

              <section class="panel" aria-labelledby="eval-assessment-title">

                  <template x-if="evalDetail.kind==='eval'"><div>

                      <button type="button" class="ds-btn ds-btn--secondary ds-btn--s-sm" x-show="evalDetail.rubric_status==='running'" x-on:click="cancelRubric()">채점 중단</button>
                      <button type="button" class="ds-btn ds-btn--secondary ds-btn--s-sm" x-show="evalDetail.status==='done' && !['running','done'].includes(evalDetail.rubric_status)" x-on:click="startRubric()">루브릭 채점 실행</button>
                    </div>
                    <ul class="ds-bullets"><li>루브릭 실행 시 LLM 호출 비용이 발생합니다</li></ul>

                    <template x-if="evalDetail.rubric && evalDetail.rubric.n"><p class="text-xs" x-text="'채점 ' + evalDetail.rubric.n + '건 · ' + [['정확성','accuracy'],['형식','format'],['정책','policy'],['간결성','conciseness']].map(a => a[0] + ' ' + evalDetail.rubric[a[1]] + '/5').join(' · ')"></p></template>
                  </div></template>
                  <p class="text-xs" x-show="evalDetail.kind==='evaluation'">통합 평가의 루브릭 채점은 아직 지원하지 않습니다. 원문 근거·누락 진단은 아래에서 명시적으로 실행합니다.</p>
                  <p class="text-xs">맥락 유사도는 정답과의 의미 유사성입니다. AI 원문 지지율·정답 정보 보존율은 사람 검수로 보정하기 전의 진단값이며, 자동 적용 점수에 합산하지 않습니다.</p>
                  <div class="overflow-auto"><table class="ds-table"><thead><tr><th>항목</th><template x-for="m in evalCols" x-bind:key="m.model"><th x-text="m.model"></th></template></tr></thead><tbody>

                  </tbody></table></div>
                  <template x-for="m in evalCols" x-bind:key="m.model"><p class="text-xs text-muted" x-text="m.model + ' · ' + evalEligibility(m)"></p></template>

                  <div class="control-row">
                    <b>원문 근거·누락 진단</b><span role="status" x-text="evalGroundingStatus()"></span>
                    <label class="selctl" x-show="assignAdmin"><span class="selctl__lbl">평가 모델</span><input class="field" x-model="evalJudgeModel" aria-label="원문 근거 평가 모델" x-bind:disabled="!!((evalDetail.snapshot||{}).environment) || (evalGrounding && evalGrounding.status!=='not_started')"></label>
                    <label class="selctl" x-show="assignAdmin && evalDetail.kind==='evaluation'"><span class="selctl__lbl">진단 호출 한도</span><input class="field" type="number" min="1" max="100000" step="1" x-model.number="esMaxCalls" aria-label="진단 최대 호출 수" x-bind:disabled="evalGrounding && evalGrounding.status!=='not_started'"></label>
                    <button type="button" class="ds-btn ds-btn--secondary ds-btn--s-sm" x-show="assignAdmin && (!evalGrounding || evalGrounding.status!=='done') && !(evalGrounding && ['running','cancel_requested'].includes(evalGrounding.status) && !evalGrounding.stalled)" x-bind:disabled="evalGroundingBusy || evalDetail.detail_mode!=='all' || !['completed','done','applied','reverted'].includes(evalDetail.status) || !(evalDetail.items||[]).some(i => i.source)" x-on:click="runEvalGrounding()">유료 진단 실행·재개</button>
                    <button type="button" class="ds-btn ds-btn--secondary ds-btn--s-sm" x-show="assignAdmin && evalGrounding && evalGrounding.status==='running' && !evalGrounding.stalled" x-bind:disabled="evalGroundingBusy" x-on:click="runEvalGrounding(true)">중단</button>

                  <p class="text-xs text-muted" x-show="(evalDetail.snapshot||{}).environment">판정 모델은 저장된 검수 환경에 고정됩니다. 진단 호출 한도는 처음 실행하기 전에 조정할 수 있으며, 재개할 때는 유지됩니다.</p>

                    <template x-for="metric in evalPairMetrics(pair)" x-bind:key="metric.key"><p class="text-xs" x-text="metric.label + ' · ' + evalPairText(metric)"></p></template>
                  </details></template>
                </div>

              <section class="panel" aria-labelledby="evaluation-next-title"><div class="panel-hd"><b id="evaluation-next-title">프롬프트 개선·다운로드</b><span class="meta">평가 결과로 개선 후보를 만들고, 운영 반영은 별도로 결정합니다</span></div><div class="panel-bd space-y-4">

                <button type="button" class="ds-btn ds-btn--secondary" x-show="evalDetail.kind==='evaluation' && evalDetail.can_rerun!==false" x-bind:disabled="!assignAdmin || esBusy || esActionBusy" x-on:click="esRerun(evalDetail.id)">동일 조건으로 다시 평가</button>
                <p class="text-xs text-muted" x-show="evalDetail.kind==='evaluation' && evalDetail.can_rerun!==false">저장된 원문·정답·프롬프트로 새 실행을 만듭니다. 모델 호출 비용이 다시 발생합니다.</p>
                <button type="button" class="ds-btn ds-btn--secondary" x-bind:disabled="!assignAdmin || evalDetail.kind!=='evaluation' || evalDetail.status!=='completed'" x-on:click="esFindCandidates()">프롬프트 개선 설정</button>
                <p class="evaluation-note" x-show="evalDetail.kind==='evaluation' && evalDetail.status!=='completed'">완료된 평가에서 개선 후보를 만들 수 있습니다. 중단된 평가는 실행 탭에서 같은 조건으로 재개하세요.</p>
                <p class="text-xs text-muted" x-show="evalDetail.kind!=='evaluation'">과거 이력은 조회할 수 있습니다. 후보 탐색은 통합 평가를 새로 실행한 뒤 시작하세요.</p>
                <form x-show="esCandidateForm" class="space-y-4" x-on:submit.prevent="esStartCandidate()">
                  <label class="evaluation-field"><span>개선 목표</span><textarea class="field" rows="3" required x-model="esCandidateGoal" x-ref="esCandidateGoal"></textarea></label>
                  <label class="evaluation-field"><span>허용 변경 범위</span><select class="field" x-model="esCandidateChanges"><template x-for="option in esCandidateChangeOptions" x-bind:key="option.value"><option x-bind:value="option.value" x-bind:selected="esCandidateChanges===option.value" x-text="option.label"></option></template></select></label>
                  <div class="evaluation-form-grid"><label class="evaluation-field"><span>호출 한도</span><input class="field" type="number" min="1" max="1000" required x-model.number="esCandidateMaxCalls"></label><label class="evaluation-field"><span>반복 한도</span><input class="field" type="number" min="1" max="20" required x-model.number="esCandidateMaxRounds"></label></div>
                  <p class="text-xs">개발·최종 평가 자료는 서버가 원본 스냅샷에서 분리해 고정합니다.</p>
                  <p class="text-xs">후보 생성·평가에 호출 비용이 발생합니다. 비용 추정은 미확인입니다.</p><button type="submit" class="ds-btn ds-btn--primary" x-bind:disabled="esCandidateBusy || esIsActive(esCandidate) || !esCandidateChangeOptions.length">후보 탐색 실행</button>
                </form>
                <div x-show="esCandidate" class="evaluation-candidates">
                  <p class="evaluation-note" role="status" aria-live="polite" x-text="esCandidateSummary"></p>
                  <p class="evaluation-message" x-text="esCandidate && esCandidate.error || ''"></p>
                  <button type="button" class="ds-btn ds-btn--secondary ds-btn--s-sm" x-show="esIsActive(esCandidate) && esCandidate.status!=='cancel_requested'" x-bind:disabled="esCandidateBusy" x-on:click="esCancelCandidate()">후보 탐색 중단 요청</button>
                  <template x-for="candidate in (esCandidate && esCandidate.candidates || [])" x-bind:key="candidate.round">
                    <article class="evaluation-candidate">
                      <header class="control-row"><h3 class="evaluation-subtitle" x-text="'후보 '+candidate.round"></h3><span class="ds-badge ds-badge--neutral">운영 미반영</span></header>
                      <p class="evaluation-note" x-text="'개발 자료 · '+esCandidateDecision(candidate.development_comparison)"></p>
                      <p class="evaluation-note" x-text="esCandidateFinalLabel(candidate)"></p>
                      <details class="evaluation-disclosure"><summary>프롬프트 변경 전후</summary>
                        <p class="evaluation-note" x-show="!esCandidatePromptChanges(candidate).length">원본과 달라진 프롬프트가 없습니다.</p>
                        <template x-for="change in esCandidatePromptChanges(candidate)" x-bind:key="change.path"><section class="evaluation-prompt-change">
                          <h4 class="evaluation-subtitle" x-text="(esCandidateChangeOptions.find(o=>o.value===change.path)||{}).label || change.path"></h4>
                          <div class="evaluation-form-grid"><div><p class="evaluation-note">변경 전</p><pre class="evaluation-prompt" x-text="change.before"></pre></div><div><p class="evaluation-note">개선 후보</p><pre class="evaluation-prompt" x-text="change.after"></pre></div></div>
                        </section></template>
                      </details>
                      <div class="control-row"><button type="button" class="ds-btn ds-btn--secondary ds-btn--s-sm" x-bind:disabled="!assignAdmin || !esCandidatePromptChanges(candidate).length" x-on:click="downloadPrompt({candidate:esCandidate.id,round:candidate.round})">후보 프롬프트 ZIP 다운로드</button><button type="button" class="ds-btn ds-btn--secondary ds-btn--s-sm" x-show="candidate.development && candidate.development.run_id" x-on:click="esOpenRun(candidate.development.run_id)">개발 평가 사례 보기</button></div>
                      <p class="evaluation-note evaluation-message" x-text="esCandidateCaseSummary(candidate.development_comparison)"></p>
                    </article>
                  </template>
                  <p class="evaluation-note" x-show="esCandidate && esCandidate.candidates && esCandidate.candidates.length">ZIP에는 변경한 프롬프트의 전체 본문, 변경 내역과 검증 상태가 담깁니다. 다운로드로 운영에 반영되지는 않습니다. 미검증·보류 후보는 검토 후 사용하세요.</p>
                </div>
                <div x-show="esCandidate && esCandidate.final_result"><p class="text-xs evaluation-message" x-text="esCandidateCaseSummary(esCandidate && esCandidate.final_comparison)"></p><button type="button" class="ds-btn ds-btn--secondary ds-btn--s-sm" x-on:click="esOpenRun(esCandidate.final_result.run_id)">최종 평가 사례 보기</button></div>
                <p role="alert" class="evaluation-message" x-text="esCandidateError"></p>
              </div></section>
            </div>
          </template>
          <details class="panel"><summary class="panel-hd"><b>학습 회차 추이</b></summary><div class="panel-hd"><b>최근 회차</b><span class="meta">학습 반영 회차별 정합성 추이 · 최근 5회</span></div>
            <div class="panel-bd">
              <div class="text-xs text-muted" x-show="!(learnTrend||[]).length">아직 쌓인 회차 리포트가 없습니다 · 학습 반영(일배치·오토파일럿) 뒤부터 표시됩니다</div>
              <template x-if="(learnTrend||[]).length">
                <div class="overflow-auto"><table class="ds-table"><thead><tr><th style="width:70px">버전</th><th style="width:130px">일시</th><th style="width:70px">표본</th><th style="width:120px">등급 일치율</th><th style="width:90px">종합</th></tr></thead><tbody>
                  <template x-for="t in learnTrend" x-bind:key="'lt'+t.version">
                    <tr x-bind:class="t.n && t.n < 20 ? 'text-muted' : ''">
                      <td class="text-ink tnum" x-text="'v'+t.version"></td>
                      <td class="tnum text-xs" x-text="fmtTs(t.ts)"></td>
                      <td class="tnum" x-text="t.n || '·'"></td>
                      <td class="tnum" x-text="pctTxt(t.grade_accuracy)"></td>
                      <td class="tnum" x-text="pctTxt(t.overall)"></td>
                    </tr>
                  </template>
                </tbody></table></div>
              </template>
              <div class="text-xs text-muted" style="margin-top:6px">종합 = 모델별 비교·오토파일럿과 같은 가중(등급 0.4 · 메타 4항목 각 0.15) · 표본 20건 미만 회차는 회색(참고용)</div>
            </div>
          </details>
          </div>
        </div>
      </template>
