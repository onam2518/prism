                      x-text="evalCmp.verdict==='regressed' ? '회귀 발견 · 적용 보류 권고' : (evalCmp.verdict==='improved' ? '개선 · 적용 가능' : '동등 · 큰 차이 없음')"></span>

                  </tbody></table></div>

              </template>
            </div>
          </section>

          <template x-if="evalDetail">
            <div class="content-section-stack">
              <section class="panel" aria-labelledby="eval-detail-title">

                  <button type="button" class="ds-iconbtn ds-iconbtn--bordered ml-auto" x-on:click="openEvalHistory(evalSelected, true)" data-tip="새로고침" data-tip-pos="bottom" aria-label="평가 상세 새로고침"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 11a8 8 0 1 0-.9 4.5M20 5v6h-6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>

                    <span class="ds-badge ds-badge--neutral" x-text="evalDetail.status==='reverted' ? '원복' : evalDetail.status==='applied' ? '반영' : evalRunStatusTxt(evalDetail)"></span>

                  </div>
                  <p role="status" class="text-xs text-muted" x-show="evalDetail.run_error" x-text="evalDetail.run_error"></p>
                  <div class="overflow-auto"><table class="ds-table model-compare-table" x-bind:style="'--compare-model-count:' + evalCols.length"><colgroup><col class="model-compare-label"><template x-for="m in evalCols" x-bind:key="m.model"><col></template></colgroup><thead><tr><th>요약 지표</th>
                    <template x-for="m in evalCols" x-bind:key="m.model"><th><span x-text="m.model"></span> <span class="ds-badge ds-badge--success" x-show="m.model===evalDetail.best">추천</span> <span class="ds-badge ds-badge--neutral" x-show="m.model===evalDetail.cheapest_passing">합격 최저 비용</span></th></template>
                  </tr></thead><tbody>
                    <template x-for="row in evalMetricRows" x-bind:key="row[1]"><tr><th x-text="row[0]"></th><template x-for="m in evalCols" x-bind:key="m.model"><td class="tnum" x-text="evalMetricText(m, row)"></td></template></tr></template>
                    <tr x-show="evalCols.some(m => m.grade_accuracy != null)"><th>등급 신뢰구간(95%)</th><template x-for="m in evalCols" x-bind:key="m.model"><td x-text="ciOf(m.grade_accuracy, m.grade_n == null ? m.n : m.grade_n)"></td></template></tr>
                    <tr x-show="evalCols.some(m => m.passed != null)"><th>목표 달성</th><template x-for="m in evalCols" x-bind:key="m.model"><td x-text="m.passed == null ? '·' : m.passed ? '게이트 통과' : '미달: ' + (m.gate_fails||[]).map(cmpFieldKo).join(', ')"></td></template></tr>
                    <tr x-show="evalDetail.kind==='compare'"><th>호출</th><template x-for="m in evalCols" x-bind:key="m.model"><td x-text="m.real ? (m.route || '실호출') : '모의 응답'"></td></template></tr>
                    <tr x-show="evalDetail.kind==='compare' && assignAdmin"><th>최종 선정</th><template x-for="m in evalCols" x-bind:key="m.model"><td><button type="button" class="ds-btn ds-btn--secondary ds-btn--s-sm" x-bind:disabled="applyBusy || cfgModel===m.model" x-on:click="applyModel(m.model)" x-text="cfgModel===m.model ? '현재 기본 모델' : '이 모델로 확정'"></button></td></template></tr>

                  <ul class="result-notes">
                    <li>표본이 없는 항목은 ·로 표시합니다. 신뢰구간이 겹치는 결과는 우열 판단을 보류하세요.</li>
                    <li x-show="evalDetail.concurrent_models > 1">여러 모델을 동시에 실행한 결과입니다. 호출 자원을 공유하므로 응답 시간이 단독 실행보다 길 수 있습니다.</li>
                    <li x-show="(evalDetail.skipped||[]).length" x-text="'비교 제외: ' + (evalDetail.skipped||[]).map(s => s.model + ' (' + s.reason + ')').join(', ')"></li>
                  </ul>
                  <template x-for="m in evalCols" x-bind:key="m.model"><details x-show="Object.keys(m.by_service||{}).length || Object.keys(m.by_reason_bucket||{}).length">

                      <template x-for="(v,k) in (m.by_service||{})" x-bind:key="'s'+k"><tr><td x-text="'서비스 · '+k"></td><td x-text="v.n"></td><td x-text="pctTxt(v.grade_acc)"></td></tr></template>

                    </tbody></table></div>
                  </details></template>

                      <button type="button" class="ds-btn ds-btn--secondary ds-btn--s-sm" x-show="evalDetail.status==='done' && !['running','done'].includes(evalDetail.rubric_status)" x-on:click="startRubric()">루브릭 채점 실행</button>
                    </div>
                    <p class="text-xs text-muted">루브릭 실행 시 LLM 호출 비용이 발생합니다.</p>

                    <template x-if="evalDetail.rubric && evalDetail.rubric.n"><p class="text-xs" x-text="'채점 ' + evalDetail.rubric.n + '건 · ' + [['정확성','accuracy'],['형식','format'],['정책','policy'],['간결성','conciseness']].map(a => a[0] + ' ' + evalDetail.rubric[a[1]] + '/5').join(' · ')"></p></template>
                  </div></template>
                </div>
              </section>
              <section class="panel" aria-labelledby="eval-items-title">

                <div class="panel-bd space-y-4">
                  <p class="text-xs text-muted" x-show="evalDetail.detail_mode!=='all'" x-text="evalDetail.detail_mode==='mismatches' ? '이 과거 회차에는 등급 불일치 건만 저장되어 있습니다. 나머지 건과 메타 상세는 기록이 없습니다.' : '이 과거 회차에는 건별 결과가 저장되지 않았습니다. 위 요약 지표만 확인할 수 있습니다.'"></p>
                  <div class="control-row">
                    <label class="selctl"><span class="selctl__lbl">필터</span><select class="field" x-model="evalItemFilter" x-on:change="evalItemLimit=50"><option value="all">전체</option><option value="miss">등급 불일치·산출 실패</option><option value="expected">메타 정답 보완 필요</option><option value="split" x-bind:disabled="evalCols.length < 2">모델 간 등급 차이</option></select></label>

                  <div class="overflow-auto"><table class="ds-table item-compare-table item-compare-table--metadata" x-bind:style="'--compare-model-count:' + evalCols.length"><colgroup><col class="item-compare-content"><col><template x-for="m in evalCols" x-bind:key="m.model"><col></template></colgroup><thead><tr><th>콘텐츠</th><th>평가 당시 정답</th><template x-for="m in evalCols" x-bind:key="m.model"><th x-text="m.model"></th></template></tr></thead><tbody>
                    <template x-for="it in evalItems" x-bind:key="it.hash"><tr>
                      <td><span x-text="it.title || it.hash"></span><div class="text-xs text-muted" x-text="it.hash.slice(0,12)"></div>

                        <template x-if="it.judgment"><div class="control-row control-row--compact">
                          <button type="button" class="verdictbtn verdictbtn--good" x-bind:class="myEvalVote(it.judgment)==='adopt' ? 'is-on' : ''" x-on:click="evalJudge(it.judgment, 'adopt')">모델이 맞음</button>

                          <span class="text-xs text-muted" x-text="'모델이 맞음 ' + ((it.judgment.judge||{}).adopt||0) + ' · 정답 유지 ' + ((it.judgment.judge||{}).reject||0)"></span>
                        </div></template>
                      </td>
                      <template x-for="cell in evalItemCells(it)" x-bind:key="cell.model"><td>

                  </tbody></table></div>
                  <button type="button" class="ds-btn ds-btn--secondary" x-show="evalItems.length < evalFilteredItems.length" x-on:click="evalItemLimit+=50">50건 더 보기</button>

              <template x-if="evalDetail.kind==='compare'">

                    <div class="control-row content-section__actions"><label class="selctl"><span class="selctl__lbl">모델</span>

                    <template x-for="it in cmpIssues" x-bind:key="'is'+it.id">

                        <td><span class="ds-badge ds-badge--neutral" x-text="cmpFieldKo(it.field)"></span><div class="text-xs text-muted" x-text="it.stage"></div></td>
                        <td><span x-text="it.why"></span></td>
                        <td x-text="it.directive"></td>
                        <td>
                          <span class="ds-badge ds-badge--success" x-show="it.applied">반영됨</span>
                          <button type="button" class="ds-btn ds-btn--secondary ds-btn--s-sm" x-show="!it.applied && assignAdmin" x-bind:disabled="cookBusy" x-on:click="applyRecipe(it)" x-text="cookBusy ? '반영 중…' : '프롬프트에 반영'"></button>

                      </tr>
                    </template>
                    <tr x-show="!cmpIssues.length"><td colspan="4" class="text-muted text-xs">눈에 띄는 문제점이 없습니다 · 표본이 3건 미만인 항목은 진단하지 않습니다</td></tr>
                  </tbody></table></div>
                  <ul class="result-notes">
                    <li>반영 뒤 ‘비교 실행’을 다시 눌러 지표가 오르는지 확인합니다.</li>
                    <li>지표가 내려가면 사전·정책 › 메타 프롬프트에서 해당 문장을 지웁니다.</li>
                  </ul>
                  </section>
              </template>
            </div>
          </template>
          <details class="panel"><summary class="panel-hd"><b>학습 회차 추이</b></summary><div class="panel-hd"><b>최근 회차</b><span class="meta">학습 반영 회차별 정합성 추이 · 최근 5회</span></div>

              <template x-if="(learnTrend||[]).length">

                      <td class="tnum" x-text="pctTxt(t.grade_accuracy)"></td>
                      <td class="tnum" x-text="pctTxt(t.overall)"></td>

                  </template>
                </tbody></table></div>
              </template>

            </div>
          </details>
          </div>
        </div>
      </template>
