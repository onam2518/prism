              <ul class="ds-bullets" style="margin:11px 0 0">
                <li><b>평가용</b> 콘텐츠는 <b>콘텐츠 관리 · STEP 1</b>에서 지정합니다 · 검수 목록에서 제외되어 오염 없이 평가에만 쓰입니다.</li>
                <li>평가는 항상 <b>현재 프롬프트 버전</b>으로 실행됩니다 · 버전 간 추이는 학습 반영을 거듭하며 재평가로 비교하세요.</li>
              </ul>
            </div>
          </section>
          <section class="panel"><div class="panel-hd"><b>평가 실행</b><span class="meta">위 기준으로 정답셋과 비교 · 요약과 건별 판정</span></div>
            <div class="panel-bd">
              <button type="button" class="ds-btn ds-btn--primary" x-bind:disabled="goldenBusy" x-on:click="runGolden()" x-text="goldenBusy ? ('평가 중… ' + (goldenResult && goldenResult.total ? ((goldenResult.cursor||0) + '/' + goldenResult.total) : '(전건 추출)')) : '평가 실행'"></button>

                <div class="ds-progress" style="margin-top:10px"><div class="ds-progress__track"><div class="ds-progress__fill ds-progress__fill--primary" x-bind:style="'width:' + Math.max(((goldenResult.cursor||0)/goldenResult.total)*100, 3) + '%'"></div></div></div>
              </template>
              <template x-if="goldenResult && goldenResult.ok">
                <div>

                  <div class="text-xs text-muted" style="margin-top:12px" x-show="goldenResult.basis">기준: <b class="text-ink" x-text="goldenResult.basis ? (goldenResult.basis.model || '현재 설정 모델') : ''"></b> · <span class="tnum" x-text="goldenResult.basis ? ('v' + goldenResult.basis.version) : ''"></span> · <span x-text="goldenResult.basis && goldenResult.basis.scope === 'eval' ? '평가용 콘텐츠' : '전체 정답셋'"></span></div>
                  <div class="tiles" style="grid-template-columns:repeat(4,1fr);margin-top:10px">
                    <div class="tile tile--hero"><div class="n tnum" x-text="Math.round((goldenResult.grade_accuracy||0)*100)+'%'"></div><div class="t">등급 일치율<span class="tnum" x-text="goldenResult.grade_ci ? (' · 신뢰구간 ' + pctTxt(goldenResult.grade_ci.lo) + '~' + pctTxt(goldenResult.grade_ci.hi)) : ''"></span></div></div>
                    <div class="tile"><div class="n tnum" x-text="Math.round((goldenResult.reason_jaccard||0)*100)+'%'"></div><div class="t">사유 일치</div></div>
                    <div class="tile"><div class="n tnum" x-text="Math.round((goldenResult.harm_miss_rate||0)*100)+'%'"></div><div class="t">유해 놓침</div></div>
                    <div class="tile"><div class="n tnum" x-text="goldenResult.evaluated"></div><div class="t">평가 건수</div></div>
                  </div>
                  <div class="tile" style="margin-top:10px">
                    <div class="t" style="margin:0 0 8px">유형별 일치율 · 어디가 약한지(수정 우선순위)</div>
                    <template x-for="(v,k) in (goldenResult.by_reason_bucket||{})" x-bind:key="k">
                      <div class="ds-progress" style="margin:7px 0"><div class="ds-progress__head"><span class="ds-progress__label"><span class="ds-badge ds-badge--reason" style="cursor:help" x-bind:data-tip="k==='normal' ? '문제 사유 없는 일반 콘텐츠' : termDef('reason', k)" data-tip-pos="top" x-text="reasonBoth(k)"></span> <span class="tnum text-muted" x-text="'('+v.n+')'"></span></span><span class="ds-progress__pct tnum" x-text="Math.round(v.grade_acc*100)+'%'"></span></div><div class="ds-progress__track"><div class="ds-progress__fill ds-progress__fill--primary" x-bind:style="'width:'+Math.max(v.grade_acc*100,3)+'%'"></div></div></div>
                    </template>
                  </div>
                  <!-- 루브릭 진단(Atelier rubric-judge 이식): 4축 평균 · 낮은 축 = 프롬프트 개선 우선순위 -->
                  <div class="tile" style="margin-top:10px">
                    <div class="t" style="margin:0 0 8px">루브릭 진단(4축 · LLM 심사) · 낮은 축이 프롬프트 개선 우선순위</div>
                    <template x-if="goldenResult.rubric && goldenResult.rubric.n">
                      <div>
                        <div class="tiles" style="grid-template-columns:repeat(4,1fr)">
                          <div class="tile"><div class="n tnum" x-text="(goldenResult.rubric.accuracy||0)+'/5'"></div><div class="t" style="cursor:help" data-tip="기대 정답(등급·사유)과 의미가 일치하는가" data-tip-pos="top">정확성</div></div>
                          <div class="tile"><div class="n tnum" x-text="(goldenResult.rubric.format||0)+'/5'"></div><div class="t" style="cursor:help" data-tip="등급 라벨·사유 코드·요약 구조를 지켰는가" data-tip-pos="top">형식</div></div>
                          <div class="tile"><div class="n tnum" x-text="(goldenResult.rubric.policy||0)+'/5'"></div><div class="t" style="cursor:help" data-tip="유해(R) 콘텐츠를 놓치지 않았는가" data-tip-pos="top">정책</div></div>
                          <div class="tile"><div class="n tnum" x-text="(goldenResult.rubric.conciseness||0)+'/5'"></div><div class="t" style="cursor:help" data-tip="요약이 군더더기 없이 필요한 만큼만인가" data-tip-pos="top">간결성</div></div>
                        </div>
                        <div class="text-xs text-muted" style="margin-top:6px" x-text="'채점 ' + goldenResult.rubric.n + '건 · 가장 낮은 축부터 프롬프트를 손보세요'"></div>
                      </div>
                    </template>
                    <div x-show="goldenResult.rubric_status==='running'" class="text-xs text-muted">채점 중… <span class="tnum" x-text="(goldenResult.rubric_cursor||0)+'/'+(goldenResult.evaluated||0)"></span>
                      <button type="button" class="copybtn" style="margin-left:8px" data-tip="채점을 멈춥니다 · 이미 채점된 건은 유지됩니다" data-tip-pos="top" x-on:click="cancelRubric()">중단</button>
                    </div>
                    <span class="text-xs text-muted" x-show="goldenResult.rubric_status==='failed'">채점 실패 · 모델 설정 확인 후 다시 실행하세요</span>
                    <button type="button" class="ds-btn ds-btn--secondary ds-btn--s-sm" style="margin-top:6px" x-show="goldenResult.status==='done' && goldenResult.rubric_status!=='running' && goldenResult.rubric_status!=='done'" data-tip="건별 산출을 LLM 심사관이 4축(1~5점)으로 채점합니다 · 실모델 호출 비용" data-tip-pos="top" x-on:click="startRubric()">루브릭 채점 실행</button>
                  </div>
                  <div class="subhd" style="margin:16px 0 8px">평가 상세 · 불일치 건별 판정 <span class="meta">모델이 맞음=정답 교정 후보 · 정답 유지=모델 오답 확정</span></div>
                  <template x-if="(goldenResult.detail||[]).length">
                    <div class="overflow-auto" style="max-height:340px"><table class="ds-table"><thead><tr><th>콘텐츠</th><th style="width:64px">정답</th><th style="width:84px">모델 결과</th><th style="width:160px">판정</th><th style="width:190px">합의</th></tr></thead><tbody>
                      <template x-for="d in goldenResult.detail" x-bind:key="'ej'+d.hash">
                        <tr>
                          <td class="text-ink"><span x-text="d.title || '(제목 없음)'"></span><div class="text-xs text-muted" x-show="d.rubric_note" x-text="'심사: ' + d.rubric_note"></div></td>
                          <td><span class="ds-badge" style="cursor:help" x-bind:class="d.expected==='G' ? 'ds-badge--success' : 'ds-badge--neutral'" x-bind:data-tip="termDef('grade', d.expected)" data-tip-pos="top" x-text="d.expected"></span></td>
                          <td><span class="ds-badge" style="cursor:help" x-bind:class="d.got==='G' ? 'ds-badge--success' : 'ds-badge--neutral'" x-bind:data-tip="termDef('grade', d.got)" data-tip-pos="top" x-text="d.got"></span></td>
                          <td><span style="display:inline-flex;gap:6px">
                            <button type="button" class="verdictbtn verdictbtn--good" style="height:26px;padding:0 10px;font-size:11px" x-bind:class="myEvalVote(d)==='adopt' ? 'is-on' : ''" data-tip="모델 결과가 맞아요 · 정답을 고칠 후보로 올립니다" data-tip-pos="top" x-on:click="evalJudge(d, 'adopt')">모델이 맞음</button>
                            <button type="button" class="verdictbtn verdictbtn--bad" style="height:26px;padding:0 10px;font-size:11px" x-bind:class="myEvalVote(d)==='reject' ? 'is-on' : ''" data-tip="기존 정답이 맞아요 · 모델 오답으로 확정합니다" data-tip-pos="top" x-on:click="evalJudge(d, 'reject')">정답 유지</button>
                          </span></td>
                          <td><span class="text-xs text-muted tnum" x-text="'모델이 맞음 ' + ((d.judge&&d.judge.adopt)||0) + ' · 정답 유지 ' + ((d.judge&&d.judge.reject)||0)"></span>
                            <span class="ds-badge ds-badge--warning" style="cursor:help;margin-left:6px" x-show="evalConsensus(d)==='adopt'" data-tip="'모델이 맞음' 합의 · 정답 교정 필요(정답셋 관리 · 정답셋 목록에 '교정 필요'로 표시)" data-tip-pos="top">교정 필요</span>
                            <span class="ds-badge ds-badge--error" style="cursor:help;margin-left:6px" x-show="evalConsensus(d)==='reject'" data-tip="'정답 유지' 합의 · 모델 오답 확정(프롬프트 개선 우선순위 근거)" data-tip-pos="top">모델 오답</span>
                          </td>
                        </tr>
                      </template>
                    </tbody></table></div>
                  </template>
                  <div x-show="!(goldenResult.detail||[]).length" class="text-xs text-muted">불일치 없음 · 건별 판정할 항목이 없습니다</div>
                  <button type="button" class="ds-btn ds-btn--secondary" style="margin-top:12px" x-on:click="selectMod('prompt')">원천 프롬프트 수정하러 가기 →</button>
                </div>
              </template>
            </div>
          </section>
          <!-- 평가 이력: 런 단위 영속(Atelier 이식) · 다시 열기 · 중단 런 재개 -->
          <section class="panel"><div class="panel-hd"><b>평가 이력</b><span class="meta">평가는 런 단위로 저장됩니다 · 다시 열어 리포트 확인 · 중단된 런은 재개</span></div>

              <div class="text-xs text-muted" x-show="!evalRuns.length">아직 실행한 평가가 없습니다 · 위에서 평가를 실행하면 이력이 쌓입니다</div>
              <template x-if="evalRuns.length">
                <div class="overflow-auto" style="max-height:300px"><table class="ds-table"><thead><tr><th style="width:54px">#</th><th style="width:110px">시각</th><th>모델</th><th style="width:90px">범위</th><th style="width:150px">상태</th><th style="width:90px">일치율</th><th style="width:170px"></th></tr></thead><tbody>
                  <template x-for="r in evalRuns" x-bind:key="'er'+r.id">

                      <td x-text="r.model || '현재 설정 모델'"></td>

                      <td class="tnum" x-text="r.grade_accuracy != null ? Math.round(r.grade_accuracy*100)+'%' : '·'"></td>
                      <td><span style="display:inline-flex;gap:6px">

                        <button type="button" class="ds-btn ds-btn--secondary ds-btn--s-sm" x-show="r.stalled || r.status==='failed'" data-tip="저장된 건을 빼고 남은 건만 이어서 실행합니다" data-tip-pos="top" x-on:click="resumeEvalRun(r.id)">재개</button>
                        <button type="button" class="ds-btn ds-btn--secondary ds-btn--s-sm" x-show="r.status==='done'" x-bind:class="cmpRunA===r.id ? 'is-on' : ''" data-tip="이 런을 비교 기준(개선 전)으로 지정합니다" data-tip-pos="top" x-on:click="setCmpBase(r.id)" x-text="cmpRunA===r.id ? '기준 ✓' : '기준'"></button>
                        <button type="button" class="ds-btn ds-btn--primary ds-btn--s-sm" x-show="r.status==='done' && cmpRunA && cmpRunA!==r.id" x-bind:disabled="evalCmpBusy" data-tip="기준 런 대비 이 런의 개선/회귀를 판정합니다" data-tip-pos="top" x-on:click="compareRuns(r.id)">비교</button>

                    </tr>

                </tbody></table></div>

              <span class="text-xs text-muted" x-show="evalCmp && !evalCmp.ok" x-text="evalCmp ? evalCmp.error : ''"></span>

                  <div class="t" style="margin:0 0 8px">런 비교 · <span class="tnum" x-text="'#' + evalCmp.a.id + ' (기준) → #' + evalCmp.b.id + ' (대상)'"></span>
                    <span class="ds-badge" style="margin-left:8px;cursor:help" data-tip-pos="top"

                      x-text="evalCmp.verdict==='regressed' ? '회귀 발견 · 적용 보류 권고' : (evalCmp.verdict==='improved' ? '개선 · 적용 가능' : '동등 · 큰 차이 없음')"></span>

          <!-- 오토파일럿: 자동 개선 루프(Atelier 이식) · 라운드=학습 반영→재평가 · 악화 자동 원복 -->
          <section class="panel"><div class="panel-hd"><b>오토파일럿 · 자동 개선 루프</b><span class="meta">목표 달성까지 학습 반영 → 재평가 반복 · 악화 라운드는 자동 원복</span></div>
            <div class="panel-bd">
              <ul class="ds-bullets" style="margin-bottom:11px">
                <li>한 라운드 = <b>학습 반영</b>(검수 피드백 → 프롬프트 보정) 후 같은 정답셋으로 <b>재평가</b> · 점수가 나빠지면 그 라운드 보정은 반영하지 않습니다(자동 원복).</li>
                <li>종료 조건: <b>목표 달성</b> · <b>개선 정체</b>(2라운드 연속 향상 없음) · <b>최대 라운드</b> · 수동 중지 · 라운드마다 실모델 호출 비용이 듭니다.</li>
              </ul>
              <div x-show="!(pilot && pilot.status==='running')" class="flexrow" style="gap:10px;align-items:center;flex-wrap:wrap">
                <span class="selctl"><span class="selctl__lbl">목표 일치율</span>
                  <select class="field" x-model="pilotTarget"><option value="0.8">80%</option><option value="0.85">85%</option><option value="0.9">90%</option><option value="0.95">95%</option></select></span>
                <span class="selctl"><span class="selctl__lbl">최대 라운드</span>
                  <select class="field" x-model="pilotRounds"><option value="3">3</option><option value="5">5</option><option value="8">8</option></select></span>
                <button type="button" class="ds-btn ds-btn--primary" x-bind:disabled="pilotBusy" x-on:click="startPilot()">오토파일럿 시작</button>
                <span class="text-xs text-muted" x-show="pilotMsg" x-text="pilotMsg"></span>
              </div>
              <template x-if="pilot">
                <div style="margin-top:10px">
                  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
                    <span class="ds-badge" x-bind:class="pilot.status==='running' ? (pilot.stalled ? 'ds-badge--warning' : 'ds-badge--intent') : (pilot.status==='done' ? 'ds-badge--success' : (pilot.status==='failed' ? 'ds-badge--error' : 'ds-badge--neutral'))"
                      x-text="pilot.status==='running' ? (pilot.stalled ? '중단됨(서버 재시작)' : ('라운드 ' + pilot.round + '/' + pilot.max_rounds + ' 진행 중')) : ({done:'완료',stopped:'중지',failed:'실패'}[pilot.status] || pilot.status)"></span>
                    <span class="text-xs text-muted tnum" x-text="'목표 ' + Math.round((pilot.target||0)*100) + '%'"></span>
                    <button type="button" class="ds-btn ds-btn--secondary ds-btn--s-sm" x-show="pilot.status==='running' && !pilot.stalled" x-on:click="stopPilot()">중지</button>
                  </div>
                  <div class="tiles" style="grid-template-columns:repeat(3,1fr);margin-top:10px">
                    <div class="tile"><div class="n tnum" x-text="pilot.start_accuracy!=null ? Math.round(pilot.start_accuracy*100)+'%' : '·'"></div><div class="t">시작 일치율</div></div>
                    <div class="tile"><div class="n tnum" x-text="pilot.last_accuracy!=null ? Math.round(pilot.last_accuracy*100)+'%' : '·'"></div><div class="t">현재 일치율</div></div>
                    <div class="tile tile--hero"><div class="n tnum" x-text="pilot.best_accuracy!=null ? Math.round(pilot.best_accuracy*100)+'%' : '·'"></div><div class="t">최고 일치율</div></div>
                  </div>
                  <template x-if="(pilot.history||[]).length">
                    <div class="overflow-auto" style="margin-top:10px"><table class="ds-table"><thead><tr><th style="width:70px">라운드</th><th style="width:80px">버전</th><th>전 → 후</th><th style="width:90px">변화</th><th style="width:110px">반영</th></tr></thead><tbody>
                      <template x-for="hh in pilot.history" x-bind:key="'ph'+hh.round">
                        <tr>
                          <td class="tnum" x-text="hh.round"></td>
                          <td class="tnum" x-text="hh.version ? ('v'+hh.version) : '·'"></td>
                          <td class="tnum" x-text="(hh.pre!=null ? Math.round(hh.pre*100)+'%' : '·') + ' → ' + Math.round(hh.accuracy*100)+'%'"></td>
                          <td><b class="tnum" x-bind:style="(hh.delta||0) > 0 ? 'color:var(--ds-success-deep)' : ((hh.delta||0) < 0 ? 'color:var(--ds-error-deep)' : '')" x-text="hh.delta!=null ? ((hh.delta>0?'+':'') + Math.round(hh.delta*100) + '%p') : '·'"></b></td>
                          <td><span class="ds-badge" x-bind:class="hh.reverted ? 'ds-badge--warning' : 'ds-badge--success'" x-bind:data-tip="hh.reverted ? '이 라운드 보정은 점수를 낮춰 반영하지 않았습니다(이전 프롬프트 유지)' : '이 라운드 보정이 반영됐습니다'" data-tip-pos="top" style="cursor:help" x-text="hh.reverted ? '원복' : '반영'"></span></td>
                        </tr>
                      </template>
                    </tbody></table></div>
                  </template>
                  <div class="text-xs text-muted" style="margin-top:8px" x-show="pilot.stop_reason" x-text="'종료: ' + pilot.stop_reason"></div>
                  <span class="text-xs text-muted" x-show="pilot.error" x-text="pilot.error"></span>
                </div>
              </template>
            </div>
          </section>
          <!-- 모델별 비교: 같은 정답셋을 여러 모델에 실호출 -->
          <section class="panel"><div class="panel-hd"><b>모델별 비교</b><span class="meta">같은 정답셋으로 A·B 모델을 실호출 비교</span></div>
            <div class="panel-bd">
              <div class="filterbar" style="margin:0 0 12px">
                <span class="selctl selctl--a abslot"><span class="selctl__tag">A</span><span class="selctl__lbl">모델</span>
                  <x-modelpick key="ca" value="cmpA" set="cmpA=$v" options="availableModels" first-label="선택…" first-value="" width="200px"></x-modelpick></span>
                <span class="abvs">VS</span>
                <span class="selctl selctl--b abslot"><span class="selctl__tag">B</span><span class="selctl__lbl">모델</span>
                  <x-modelpick key="cb" value="cmpB" set="cmpB=$v" options="availableModels" first-label="선택…" first-value="" width="200px"></x-modelpick></span>
                <button type="button" class="ds-btn ds-btn--primary ds-btn--s-md" x-bind:disabled="cmpBusy || !cmpA || !cmpB || cmpA===cmpB" x-on:click="runCompare()" x-text="cmpBusy ? '비교 중… (모델별 전건 추출)' : '비교 실행'"></button>
                <span class="text-xs text-muted" x-show="cmpResult && !cmpResult.ok" x-text="cmpResult ? cmpResult.error : ''"></span>
              </div>
              <template x-if="cmpResult && cmpResult.ok && cmpCols.length">
                <div>
                  <div class="overflow-auto"><table class="ds-table"><thead><tr><th style="width:150px">항목</th>
                    <template x-for="(m,mi) in cmpCols" x-bind:key="'ch'+mi"><th><span class="selctl__tag" x-bind:style="mi ? 'background:var(--ds-warning)' : 'background:var(--ds-primary)'" x-text="mi ? 'B' : 'A'"></span> <span x-text="m.model"></span> <span class="ds-badge ds-badge--success" x-show="m.model===cmpResult.best">★ best</span> <span class="ds-badge ds-badge--intent" style="cursor:help" x-show="m.model===cmpResult.cheapest_passing" x-bind:data-tip="'등급 일치율 ' + pctTxt(cmpResult.eval_gate) + ' 이상 합격 모델 중 비용이 가장 낮아요'" data-tip-pos="top">합격 최저 비용</span></th></template>
                  </tr></thead><tbody>
                    <tr><td class="text-ink">호출</td><template x-for="(m,mi) in cmpCols" x-bind:key="'cr'+mi"><td><span class="ds-badge" x-bind:class="m.real ? 'ds-badge--neutral' : 'ds-badge--warning'" x-bind:data-tip="m.real ? '실제 API 호출 결과' : '모의 응답 · API 키를 설정하면 실호출됩니다'" data-tip-pos="top" style="cursor:help" x-text="m.real ? (m.route||'실호출') : 'mock'"></span></td></template></tr>
                    <tr><td class="text-ink">등급 일치율 <span class="text-xs text-muted">(신뢰구간)</span></td><template x-for="(m,mi) in cmpCols" x-bind:key="'cg'+mi"><td>
                      <span class="abbar" x-bind:class="mi ? 'abbar--b' : ''">
                        <span class="abbar__track"><span class="abbar__fill" x-bind:style="'width:' + Math.max((m.grade_accuracy||0)*100, 3) + '%'"></span></span>
                        <b class="tnum" x-text="pctTxt(m.grade_accuracy)"></b><span class="abwin" x-show="cmpWin('grade_accuracy', mi)">▲</span>
                      </span>
                      <div class="text-xs text-muted tnum" style="margin-top:3px" x-text="'(' + ciOf(m.grade_accuracy, m.n) + ')'"></div></td></template></tr>
                    <tr><td class="text-ink">사유 일치</td><template x-for="(m,mi) in cmpCols" x-bind:key="'cj'+mi"><td><b class="tnum" x-text="pctTxt(m.reason_jaccard)"></b> <span class="abwin" x-show="cmpWin('reason_jaccard', mi)">▲</span></td></template></tr>
                    <tr><td class="text-ink">빈 결과</td><template x-for="(m,mi) in cmpCols" x-bind:key="'ce'+mi"><td class="tnum" x-text="pctTxt(m.empty_rate)"></td></template></tr>
                    <tr><td class="text-ink">비용($)</td><template x-for="(m,mi) in cmpCols" x-bind:key="'cc'+mi"><td class="tnum" x-text="m.cost_usd!=null ? ('$'+(Math.round(m.cost_usd*10000)/10000)) : '·'"></td></template></tr>
                    <tr><td class="text-ink">응답 속도 <span class="text-xs text-muted">(보통 · 느릴 때)</span></td><template x-for="(m,mi) in cmpCols" x-bind:key="'cl'+mi"><td class="tnum" style="cursor:help" data-tip="콘텐츠 1건 추출에 걸린 시간 · 보통=중간값(p50) · 느릴 때=상위 5% 경계(p95)" data-tip-pos="top" x-text="latTxt(m.latency_p50_ms) + ' · ' + latTxt(m.latency_p95_ms)"></td></template></tr>
                  </tbody></table></div>
                  <div class="text-xs text-muted" style="margin-top:8px" x-show="(cmpResult.skipped||[]).length">비교 제외: <span x-text="(cmpResult.skipped||[]).map(s => s.model + ' (' + s.reason + ')').join(' · ')"></span></div>
                  <!-- 원클릭 승격: 합격 최저 비용 모델 → 기본 모델(다음 실행 초안 생성 모델) -->
                  <div class="flexrow" style="margin-top:10px;align-items:center;gap:10px;flex-wrap:wrap" x-show="assignAdmin && cmpResult.cheapest_passing">
                    <button type="button" class="ds-btn ds-btn--secondary ds-btn--s-sm" x-bind:disabled="applyBusy || cfgModel===cmpResult.cheapest_passing" x-on:click="applyModel(cmpResult.cheapest_passing)" x-text="cfgModel===cmpResult.cheapest_passing ? '이미 기본 모델입니다 · ' + cmpResult.cheapest_passing : (applyBusy ? '적용 중…' : '기본 모델로 적용 · ' + cmpResult.cheapest_passing)"></button>
                    <span class="text-xs text-muted">합격 기준 = 등급 일치율 <span class="tnum" x-text="pctTxt(cmpResult.eval_gate)"></span> 이상 · 그중 비용이 가장 낮은 모델을 추천합니다</span>
                  </div>
                  <div class="text-xs text-muted" style="margin-top:4px">신뢰구간이 겹치면 우열 판단 보류 · 정답셋이 쌓일수록 오차가 줄어듭니다</div>
                </div>
              </template>
            </div>
          </section>
        </div>
      </template>
