      <!-- ═══ 모듈: 엔티티 사전 · 개체 고유키·타입(NER 6종)·속성 관리 (사전·정책 · 엔티티 탭) ═══ -->
      <template x-if="mod === 'dict'">
        <div x-show="dictTab === 'entity'" x-cloak class="w-full space-y-4">
        <div class="panel"><div class="panel-bd flex items-center justify-between gap-3 flex-wrap">
          <ul class="ds-bullets">
            <li>콘텐츠 적재 시 엔티티가 <b>개체 사전에 자동 등재</b>됩니다 · 개체당 고유키 1개, 타입·속성은 등록 시 1회 부여(재판정 없음).</li>
            <li>타입·속성(성별·국적·직업·소속 등)은 <b>위키데이터로 자동 보강</b>하고, 사람이 <b>직접 수정(확정)</b>할 수 있습니다 · 확정 필드는 재보강이 덮어쓰지 않습니다.</li>
            <li>속성은 토픽 스튜디오의 <b>엔티티 속성 조건</b>이 됩니다 · 예) 성별=여성 ∧ 직업=스포츠인 → "여성 스포츠인" 토픽.</li>
          </ul>
          <div class="flex items-center gap-2">
            <button type="button" class="ds-btn ds-btn--secondary ds-btn--s-sm" x-on:click="entBackfill()" data-tip="적재된 콘텐츠의 엔티티를 사전에 색인(기존 데이터 소급)" data-tip-pos="top">기존 콘텐츠 색인</button>
            <button type="button" class="ds-btn ds-btn--primary ds-btn--s-sm" x-on:click="entEnrichAll()" data-tip="아직 조회 안 한 개체만 보강(나무위키 → 위키데이터)" data-tip-pos="top">미조회 일괄 보강</button>
            <button type="button" class="ds-btn ds-btn--outline ds-btn--s-sm" x-on:click="entEnrichAll('all')" data-tip="전체 개체를 나무위키 우선으로 다시 조회 · 수동 확정 필드는 보존" data-tip-pos="top">전체 재보강</button>
          </div>
        </div></div>

        <div class="panel" x-show="entData"><div class="panel-bd"><div class="ds-stat-grid" style="grid-template-columns:repeat(6,1fr)">
          <div class="ds-stat"><div class="ds-stat__value ds-stat__value--accent tnum" x-text="(entData && entData.stats.total) || 0"></div><div class="ds-stat__label">총 개체</div></div>
          <div class="ds-stat"><div class="ds-stat__value tnum" x-text="entData ? ((entData.stats.total || 0) - (((entData.stats.byType || {})['(보류)']) || 0)) : 0"></div><div class="ds-stat__label">타입 부여</div></div>
          <div class="ds-stat"><div class="ds-stat__value tnum" x-text="(entData && entData.stats.pending) || 0"></div><div class="ds-stat__label" style="cursor:help" data-tip="타입 미부여 · 미조회 또는 동음이의 = 보강·수동 확정 대기" data-tip-pos="top">보강 대기(보류)</div></div>
          <div class="ds-stat"><div class="ds-stat__value tnum" x-text="(entData && entData.stats.unlisted) || 0"></div><div class="ds-stat__label" style="cursor:help" data-tip="나무위키·위키데이터 모두 미스 · 복합명사구·개념어(TM 후보) — 개체는 사전에 남고 속성 축에서만 빠짐" data-tip-pos="top">미등재(소스 없음)</div></div>
          <div class="ds-stat"><div class="ds-stat__value tnum" x-text="(entData && entData.stats.enriched) || 0"></div><div class="ds-stat__label">소스 매칭</div></div>
          <div class="ds-stat"><div class="ds-stat__value tnum" x-text="(entData && entData.stats.links) || 0"></div><div class="ds-stat__label">콘텐츠 링크</div></div>
        </div></div></div>

        <div class="panel">
          <div class="panel-hd"><b>개체 목록</b>
            <span class="meta" aria-live="polite" x-text="entMsg"></span>
          </div>
          <div class="panel-bd">
            <div class="flex items-center gap-2 flex-wrap" style="margin-bottom:10px">
              <input type="text" class="field" style="width:220px" placeholder="이름·별칭 검색" x-model="entQ" x-on:keydown.enter="loadEntdict()">
              <select class="field" style="width:auto" x-model="entType" x-on:change="loadEntdict()">
                <option value="">타입 전체</option>
                <template x-for="(ko,t) in (entData ? entData.meta.types : {})" x-bind:key="t"><option x-bind:value="t" x-text="ko + ' (' + t + ')'"></option></template>
              </select>
              <select class="field" style="width:auto" x-model="entStatus" x-on:change="loadEntdict()">
                <option value="">기본(미등재 제외)</option><option value="active">확정(active)</option><option value="pending">보류(pending)</option>
                <option value="unlisted">미등재(unlisted)</option><option value="all">전체(미등재 포함)</option>
              </select>
              <button type="button" class="ds-btn ds-btn--secondary ds-btn--s-sm" x-on:click="loadEntdict()">검색</button>
              <button type="button" class="ds-btn ds-btn--outline ds-btn--c-danger ds-btn--s-sm" x-show="entStatus === 'unlisted'" x-cloak x-on:click="entPurgeUnlisted()" data-tip="미등재 개체를 링크·별칭 포함 일괄 삭제 · 다빈도(진짜 개체 후보)는 먼저 수동 확정하세요" data-tip-pos="top">미등재 정리</button>
              <span style="flex:1"></span>
              <input type="text" class="field" style="width:180px" placeholder="수동 등재 · 개체 이름" x-model="entAddName" x-on:keydown.enter="entAdd()">
              <button type="button" class="ds-btn ds-btn--outline ds-btn--s-sm" x-on:click="entAdd()">등재</button>
            </div>
            <div class="overflow-auto" style="max-height:560px"><table class="ds-table"><thead><tr>
              <th style="width:160px">개체</th><th style="width:120px">타입</th><th>속성</th>
              <th style="width:100px">출처</th><th style="width:64px" class="tnum">콘텐츠</th><th style="width:170px"></th>
            </tr></thead><tbody>
              <template x-for="e in ((entData && entData.items) || [])" x-bind:key="e.entity_id">
                <tr>
                  <td class="text-ink" style="font-weight:600;cursor:pointer" role="button" tabindex="0" x-on:click="openEntEdit(e)" x-on:keydown.enter="openEntEdit(e)" data-tip="클릭해 상세·수정" data-tip-pos="top" x-text="e.name"></td>
                  <td><span class="ds-badge" x-bind:class="e.type ? 'ds-badge--entity' : 'ds-badge--neutral'" x-text="entTypeLabel(e.type)"></span></td>
                  <td class="text-muted" x-text="entAttrSummary(e) || '—'"></td>
                  <td><a x-show="entSrc(e) === 'namuwiki'" x-bind:href="'https://namu.wiki/w/' + encodeURIComponent((e.external_ids && e.external_ids.namuwiki) || e.name)" target="_blank" rel="noopener" class="text-violet" data-tip="나무위키 · POC 전용(통검 연동 시 폐기)" data-tip-pos="top">나무위키</a><a x-show="entSrc(e) === 'wikidata'" x-bind:href="'https://www.wikidata.org/wiki/' + (e.external_ids && e.external_ids.wikidata)" target="_blank" rel="noopener" class="text-violet" x-text="e.external_ids && e.external_ids.wikidata"></a><span x-show="!entSrc(e)" class="text-xs text-muted" x-text="(e.attr_meta && e.attr_meta._enrich && e.attr_meta._enrich.result === 'miss') ? '미등재' : ((e.attr_meta && e.attr_meta._enrich && e.attr_meta._enrich.result === 'ambiguous') ? '동음이의(보류)' : '미조회')"></span></td>
                  <td class="tnum" x-text="e.n_contents || 0"></td>
                  <td><div class="flex items-center gap-1.5">
                    <button type="button" class="copybtn" x-on:click="openEntEdit(e)">편집</button>
                    <button type="button" class="copybtn" x-on:click="entEnrich(e)" data-tip="위키데이터 조회로 타입·속성 채우기" data-tip-pos="top">보강</button>
                    <button type="button" class="copybtn" style="color:var(--ds-error)" x-on:click="entDelete(e)">삭제</button>
                  </div></td>
                </tr>
              </template>
              <tr x-show="!((entData && entData.items) || []).length"><td colspan="6" class="text-xs text-muted" style="text-align:center;padding:24px">등재된 개체가 없습니다 · 콘텐츠를 적재하거나 "기존 콘텐츠 색인"을 실행하세요</td></tr>
            </tbody></table></div>
          </div>
        </div>
      </div>
      </template>
