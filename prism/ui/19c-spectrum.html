      <!-- ═══ 모듈: 스펙트럼(실험실) · 사내 MCP 허브 프로토타입 ═══
           기획 문서 "13. Spectrum" 기반 · 동작·상태는 vendor/app-14-spectrum.js · 백엔드 GET/POST /spectrum.
           구성(시안 B · 카탈로그 허브형): 첫 화면은 커넥터 카드 목록 · 카드를 누르면 상세로 들어가
           거기서 접속 키 발급과 도구 연결까지 이어진다. 관문 체험 · 사용 기록 · 접속 키 관리는
           위쪽 작은 버튼으로 옮긴 보조 화면이다.
           파일명이 20-ingest-policy.html 보다 앞이어야 x-data 스코프 안에 든다(ARCHITECTURE 주의 ①). -->
      <template x-if="mod === 'lab'">
        <div x-show="labTab === 'spectrum'" x-cloak class="w-full space-y-4">

        <ul class="ds-bullets hintbox" style="padding:var(--ds-space-3) var(--ds-space-4)">
          <li><b>스펙트럼</b>은 우리 데이터와 AI 도구를 이어 주는 사내 연결 통로(MCP 허브) 시험판입니다 · 쓰고 싶은 데이터 창구를 골라 그 자리에서 바로 연결합니다.</li>
          <li>지금 오가는 값은 모의 데이터지만, 연결 자체는 실제로 됩니다 · 붙고 나면 쓰던 AI 도구의 기능 목록에 그대로 나타납니다.</li>
        </ul>

        <!-- 요약 한 줄 + 보조 화면 이동(카탈로그가 주인공이라 탭 대신 작은 버튼으로 둔다) -->
        <div class="flex items-center gap-2 flex-wrap">
          <span class="text-xs text-muted tnum">
            <span x-text="'커넥터 ' + spCounts.all + '개 · 바로 쓸 수 있음 ' + spCounts.live + '개'"></span>
            <span x-show="spMetrics.weekCalls != null" x-text="' · 이번 주 조회 ' + spNum(spMetrics.weekCalls || 0) + '회'"></span>
            <span x-show="spMetrics.weekUsers != null" x-text="' · 쓴 사람 ' + spNum(spMetrics.weekUsers || 0) + '명'"></span>
            <span x-show="spMetrics.activeKeys != null" x-text="' · 살아 있는 키 ' + spNum(spMetrics.activeKeys || 0) + '개'"></span>
            <span x-show="spMetrics.failRate != null" x-text="' · 실패율 ' + spPct(spMetrics.failRate || 0)"></span>
          </span>
          <span class="ml-auto flex items-center gap-1.5">
            <button type="button" class="ds-btn ds-btn--s-sm" x-bind:class="spTab==='catalog' ? 'ds-btn--primary' : 'ds-btn--secondary'" x-on:click="spGo('catalog')">카탈로그</button>
            <button type="button" class="ds-btn ds-btn--s-sm" x-bind:class="spTab==='try' ? 'ds-btn--primary' : 'ds-btn--secondary'" x-on:click="spGo('try')">관문 체험</button>
            <button type="button" class="ds-btn ds-btn--s-sm" x-bind:class="spTab==='usage' ? 'ds-btn--primary' : 'ds-btn--secondary'" x-on:click="spGo('usage')">사용 기록</button>
            <button type="button" class="ds-btn ds-btn--s-sm" x-bind:class="spTab==='keys' ? 'ds-btn--primary' : 'ds-btn--secondary'" x-on:click="spGo('keys')">접속 키</button>
          </span>
        </div>

        <!-- ─────────────── 카탈로그 · 커넥터 고르기 ─────────────── -->
        <div x-show="spTab==='catalog' && !spSel" x-cloak class="space-y-4">
          <div class="panel"><div class="panel-hd"><b>어떤 데이터를 붙일까요</b>
              <span class="meta">쓰고 싶은 창구를 고르면 연결 방법까지 이어집니다</span></div>
            <div class="panel-bd">
              <div class="flex flex-wrap gap-2" style="align-items:flex-end">
                <div style="flex:1;min-width:240px"><label class="lbl">찾기</label>
                  <input x-model="spQ" class="field" placeholder="예) 클릭 · 체류시간 · 카테고리 · 벨루가"></div>
                <div class="flex flex-wrap gap-1.5" style="padding-bottom:5px">
                  <button type="button" class="ds-btn ds-btn--s-sm" x-bind:class="spFilter==='all' ? 'ds-btn--primary' : 'ds-btn--secondary'" x-on:click="spFilter='all'" x-text="'전체 ' + spCounts.all"></button>
                  <button type="button" class="ds-btn ds-btn--s-sm" x-bind:class="spFilter==='live' ? 'ds-btn--primary' : 'ds-btn--secondary'" x-on:click="spFilter='live'" x-text="'바로 쓸 수 있음 ' + spCounts.live"></button>
                  <button type="button" class="ds-btn ds-btn--s-sm" x-bind:class="spFilter==='preparing' ? 'ds-btn--primary' : 'ds-btn--secondary'" x-on:click="spFilter='preparing'" x-text="'준비중 ' + spCounts.preparing"></button>
                </div>
              </div>

              <div x-show="spCatalogShown.length" style="margin-top:14px">
                <!-- 카드 격자: x-show 는 위 래퍼가 맡는다(격자 요소에 직접 걸면 display 가 지워진다) -->
                <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:12px">
                  <template x-for="c in spCatalogShown" x-bind:key="'spc'+c.id">
                    <div class="tbox" style="cursor:pointer" x-on:click="spOpen(c)">
                      <div class="flex items-center gap-1.5 flex-wrap">
                        <b class="text-ink text-sm" x-text="c.name || c.id"></b>
                        <span class="ds-badge" x-bind:class="c.status==='live' ? 'ds-badge--success' : 'ds-badge--neutral'"><span class="ds-badge__dot"></span><span x-text="c.status==='live' ? '바로 쓸 수 있음' : '준비중'"></span></span>
                        <span class="meta tnum ml-auto" x-show="c.version" x-text="'v' + (c.version || '')"></span>
                      </div>
                      <div class="text-xs text-muted" style="margin-top:5px;line-height:1.55" x-text="spDesc(c)"></div>
                      <div class="flex flex-wrap gap-1.5" style="margin-top:8px">
                        <span x-show="spWhTag(c)" class="ds-badge ds-badge--intent" x-text="spWhTag(c)"></span>
                        <span x-show="(c.tools || []).length" class="ds-badge ds-badge--category tnum" x-text="'기능 ' + (c.tools || []).length + '개'"></span>
                      </div>
                      <div class="text-xs text-muted" style="margin-top:8px" x-show="(c.useCases || []).length">
                        <template x-for="(u, ui) in (c.useCases || []).slice(0, 2)" x-bind:key="'spuc'+c.id+ui">
                          <div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" x-text="'· ' + u"></div>
                        </template>
                      </div>
                      <div class="text-xs text-muted" style="margin-top:8px;border-top:1px solid var(--ds-hairline-soft);padding-top:7px">
                        <span x-text="spTeam(c)"></span><span x-show="c.dataBasis" x-text="' · ' + (c.dataBasis || '')"></span>
                      </div>
                    </div>
                  </template>
                </div>
              </div>
              <div class="empty" x-show="!spCatalogShown.length" style="margin-top:14px">
                <span x-show="spCatalog.length">찾는 커넥터가 없습니다 · 검색어나 좁히기를 바꿔 보세요</span>
                <span x-show="!spCatalog.length">아직 등록된 커넥터가 없습니다 · 잠시 뒤 다시 열어보세요</span>
              </div>
            </div></div>
        </div>

        <!-- ─────────────── 커넥터 상세 · 보고 바로 연결하기 ─────────────── -->
        <template x-if="spTab==='catalog' && spSel">
          <div class="space-y-4">
            <div class="flex items-center gap-2">
              <button type="button" class="ds-btn ds-btn--secondary ds-btn--s-sm" x-on:click="spBackToList()">← 커넥터 목록</button>
              <span class="text-xs text-muted" x-text="spSel.name || spSel.id"></span>
            </div>

            <div class="panel"><div class="panel-hd"><b x-text="spSel.name || spSel.id"></b>
                <span class="ds-badge" x-bind:class="spSel.status==='live' ? 'ds-badge--success' : 'ds-badge--neutral'"><span class="ds-badge__dot"></span><span x-text="spSel.status==='live' ? '바로 쓸 수 있음' : '준비중'"></span></span>
                <span class="ds-badge ds-badge--intent">MCP Registry 표준 호환</span>
                <span class="meta tnum ml-auto" x-text="spTeam(spSel) + (spSel.version ? (' · v' + spSel.version) : '')"></span></div>
              <div class="panel-bd">
                <ul class="ds-bullets hintbox" style="padding:var(--ds-space-3) var(--ds-space-4);margin-bottom:12px" x-show="spSel.status!=='live'">
                  <li>아직 준비 중인 창구입니다 · <b>협의 후 공개 예정</b>이라 지금은 소개만 보여줍니다.</li>
                  <li x-show="spSel.note" x-text="spSel.note"></li>
                </ul>
                <div class="text-sm text-body" style="padding:0 18px 4px" x-text="spDesc(spSel)"></div>
                <div style="margin-top:10px">
                  <div class="drow"><div class="k">담당팀</div><div class="v text-sm text-body" x-text="spTeam(spSel)"></div></div>
                  <div class="drow"><div class="k">데이터 기준</div><div class="v text-sm text-body" x-text="spSel.dataBasis || '·'"></div></div>
                  <div class="drow"><div class="k">연결 방식</div><div class="v text-sm text-body" x-text="(spSel.transport || 'http') + (spSel.endpoint ? (' · ' + spSel.endpoint) : '')"></div></div>
                  <template x-if="spWh(spSel)">
                    <div class="drow"><div class="k">데이터 창고</div><div class="v">
                      <div class="flex flex-wrap gap-1.5">
                        <span class="ds-badge ds-badge--intent" x-text="spWhTag(spSel)"></span>
                        <span x-show="spWh(spSel).storage" class="ds-badge ds-badge--neutral" x-text="'저장소 ' + spWh(spSel).storage"></span>
                        <span x-show="spWh(spSel).timeTravel" class="ds-badge ds-badge--category">과거 시점 조회 가능</span>
                      </div>
                      <div class="text-xs text-muted" style="margin-top:6px;line-height:1.6" x-show="spWh(spSel).desc" x-text="spWh(spSel).desc"></div>
                    </div></div>
                  </template>
                </div>
              </div></div>

            <div class="panel" x-show="(spSel.tools || []).length" x-cloak>
              <div class="panel-hd"><b>이 커넥터가 열어 주는 기능</b><span class="meta">AI 도구가 이 이름으로 물어봅니다</span></div>
              <div class="overflow-auto"><table class="ds-table"><thead><tr>
                  <th style="width:186px">기능</th><th>설명</th><th style="width:240px">파라미터</th><th style="width:120px"></th></tr></thead><tbody>
                <template x-for="t in (spSel.tools || [])" x-bind:key="'spt'+(t.name || '')">
                  <tr>
                    <td><code class="text-violet" style="font-size:12px" x-text="t.name || ''"></code>
                      <div class="text-xs text-muted" x-show="t.title" x-text="t.title"></div></td>
                    <td class="text-body" x-text="spDesc(t)"></td>
                    <td><div class="flex flex-wrap gap-1.5">
                        <template x-for="p in spToolParams(t)" x-bind:key="'spp'+(t.name||'')+(p.name||'')">
                          <span class="ds-badge ds-badge--category" style="cursor:help" x-bind:data-tip="p.desc || ''" data-tip-pos="top" x-text="spParamTxt(p)"></span>
                        </template>
                        <span x-show="!spToolParams(t).length" class="text-xs text-muted">없음</span>
                      </div></td>
                    <td>
                      <span x-show="t.restricted" class="ds-badge ds-badge--warning"><span class="ds-badge__dot"></span>권한 제한</span>
                      <button type="button" x-show="!t.restricted && spSel.status==='live'" class="copybtn" x-on:click="spTryTool(t.name)">눌러보기</button>
                    </td>
                  </tr>
                </template>
              </tbody></table></div>
            </div>

            <div class="panel" x-show="(spSel.useCases || []).length" x-cloak>
              <div class="panel-hd"><b>이렇게 씁니다</b></div>
              <div class="panel-bd">
                <ul class="ds-bullets">
                  <template x-for="(u, ui) in (spSel.useCases || [])" x-bind:key="'spu'+ui">
                    <li x-text="u"></li>
                  </template>
                </ul>
                <details style="margin-top:12px" x-show="spHasJson(spSel.serverJson)">
                  <summary class="text-xs text-muted" style="cursor:pointer">server.json 미리보기 (MCP Registry 등록 형식)</summary>
                  <pre class="tbox" style="white-space:pre-wrap;font-size:12px;margin:6px 0 0;max-height:320px;overflow:auto" x-text="spJson(spSel.serverJson || {})"></pre>
                </details>
              </div>
            </div>

            <!-- 허브형의 핵심: 찾았으면 여기서 바로 붙인다 -->
            <div class="panel" x-show="spSel.status==='live'" x-cloak>
              <div class="panel-hd"><b>이 커넥터에 연결하기</b><span class="meta">키를 받아 쓰는 도구에 넣으면 끝입니다</span></div>
              <div class="panel-bd">
                <div class="flex items-center gap-2" style="margin-bottom:8px"><b class="text-ink" style="display:inline-flex;align-items:center;gap:8px"><span class="stepline__no">1</span>접속 키 받기</b></div>
                <div class="text-xs text-muted" style="margin-bottom:8px">키는 AI 도구가 관문에 들어올 때 쓰는 열쇠입니다 · 발급 직후 한 번만 전체 값이 보입니다.</div>
                <div class="flex flex-wrap gap-2" style="align-items:flex-end">
                  <div style="flex:1;min-width:200px"><label class="lbl">라벨 (선택)</label>
                    <input x-model="spKeyForm.label" class="field" maxlength="40" placeholder="예) 내 노트북 Claude Code" x-on:keydown.enter="spIssueKey()"></div>
                  <div style="min-width:140px"><label class="lbl">유효기간</label>
                    <select x-model="spKeyForm.ttlDays" class="field">
                      <option value="30">30일</option><option value="90">90일</option>
                      <option value="180">180일</option><option value="365">365일</option></select></div>
                  <div><button type="button" class="ds-btn ds-btn--primary ds-btn--s-sm" x-bind:disabled="spBusy" x-on:click="spIssueKey()" x-text="spBusy ? '발급 중…' : '키 발급'"></button></div>
                </div>
                <div class="text-xs" style="color:var(--ds-error);margin-top:4px" x-show="spMsg" x-text="spMsg"></div>

                <div class="tbox" x-show="spNewKey" x-cloak style="margin-top:10px;border-color:var(--ds-primary)">
                  <div class="flex items-center gap-1.5 flex-wrap">
                    <b class="text-ink text-sm">새 접속 키</b>
                    <span class="ds-badge ds-badge--warning"><span class="ds-badge__dot"></span>지금만 보입니다</span>
                    <span class="text-xs text-muted tnum ml-auto" x-show="spNewKey && spNewKey.expiresAt" x-text="spNewKey ? ('만료 ' + spDate(spNewKey.expiresAt)) : ''"></span>
                  </div>
                  <pre style="white-space:pre-wrap;font-size:13px;margin:8px 0 0" x-text="spNewKey ? (spNewKey.key || '') : ''"></pre>
                  <div class="flex items-center gap-2" style="margin-top:8px">
                    <button type="button" class="ds-btn ds-btn--primary ds-btn--s-sm" x-on:click="copyText(spNewKey && spNewKey.key, '접속 키')">키 복사</button>
                    <span class="text-xs text-muted">창을 닫으면 다시 볼 수 없습니다 · 아래 설정에는 이 키가 이미 들어가 있습니다.</span>
                    <span class="text-xs" style="color:var(--ds-primary)" x-text="copyMsg"></span>
                  </div>
                </div>
                <div class="text-xs text-muted" style="margin-top:8px" x-show="!spNewKey && spLiveKeys.length">
                  이미 받아 둔 키가 <span class="tnum" x-text="spLiveKeys.length"></span>개 있습니다 · 값을 잊었다면 새로 발급하세요(전체 값은 발급 때만 보입니다).
                </div>

                <div class="flex items-center gap-2" style="border-top:1px solid var(--ds-hairline);margin-top:16px;padding-top:13px;margin-bottom:8px"><b class="text-ink" style="display:inline-flex;align-items:center;gap:8px"><span class="stepline__no">2</span>쓰는 도구에 붙이기</b></div>
                <div class="text-xs text-muted" style="margin-bottom:10px">
                  붙는 주소는 <code class="text-violet" x-text="spGwUrl"></code> 하나입니다 ·
                  <span x-show="spNewKey">아래 설정에는 방금 발급한 키가 들어가 있어 그대로 복사하면 됩니다.</span>
                  <span x-show="!spNewKey"><b>&lt;접속 키&gt;</b> 자리에는 위에서 발급한 키를 넣으세요.</span>
                </div>
                <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px">
                  <template x-for="g in spGuides" x-bind:key="'spg'+g.id">
                    <div class="tbox">
                      <div class="flex items-center gap-1.5">
                        <b class="text-ink text-sm" x-text="g.name"></b>
                        <button type="button" class="copybtn ml-auto" x-on:click="copyText(g.code, g.name + ' 설정')">복사</button>
                      </div>
                      <div class="text-xs text-muted" style="margin-top:2px" x-text="g.desc"></div>
                      <pre style="white-space:pre-wrap;font-size:11.5px;margin:8px 0 0;max-height:190px;overflow:auto" x-text="g.code"></pre>
                    </div>
                  </template>
                </div>
                <div class="text-xs text-muted" style="margin-top:10px">붙이고 나면 그 도구의 기능 목록에 위 기능들이 그대로 보입니다 · 먼저 눌러보고 싶으면 <b>관문 체험</b>에서 확인하세요.</div>
              </div>
            </div>
          </div>
        </template>

        <!-- ─────────────── 보조 · 관문 체험 ─────────────── -->
        <div x-show="spTab==='try'" x-cloak class="space-y-4">
          <ul class="ds-bullets hintbox" style="padding:var(--ds-space-3) var(--ds-space-4)">
            <li>도구 없이 화면에서 <b>같은 관문</b>을 눌러 봅니다 · 아래 결과가 AI 도구가 받는 응답과 같습니다.</li>
            <li>붙는 주소는 <code class="text-violet" x-text="spGwUrl"></code> 하나입니다.</li>
          </ul>

          <div class="panel"><div class="panel-hd"><b>관문 호출해 보기</b><span class="meta">키를 고르고 기능을 골라 실행합니다</span>
              <button type="button" class="ds-btn ds-btn--secondary ds-btn--s-sm ml-auto" x-on:click="copyText(spGwUrl, '관문 주소')">관문 주소 복사</button></div>
            <div class="panel-bd">
              <div class="flex flex-wrap gap-2" style="align-items:flex-end">
                <div style="min-width:230px"><label class="lbl">접속 키</label>
                  <select x-model="spTry.keyId" class="field">
                    <option value="">키를 고르세요</option>
                    <template x-for="k in spLiveKeys" x-bind:key="'spsk'+k.id">
                      <option x-bind:value="k.id" x-text="(k.masked || k.id) + (k.label ? (' · ' + k.label) : '')"></option>
                    </template>
                  </select></div>
                <div style="min-width:280px"><label class="lbl">기능 (tool)</label>
                  <select class="field" x-model="spTry.tool" x-on:change="spTry.out=null">
                    <template x-for="t in spToolDefs" x-bind:key="'spst'+t.id">
                      <option x-bind:value="t.id" x-text="t.label"></option>
                    </template>
                  </select></div>
                <template x-for="f in (spToolDef(spTry.tool).fields || [])" x-bind:key="'spf'+spTry.tool+f.k">
                  <div style="min-width:150px"><label class="lbl" x-text="f.label + ' · ' + f.k"></label>
                    <input class="field" x-model="spTry.params[f.k]" x-bind:placeholder="f.ph || ''" x-on:keydown.enter="spGwTry()"></div>
                </template>
                <div><button type="button" class="ds-btn ds-btn--primary ds-btn--s-sm" x-bind:disabled="spTry.busy || !spTry.keyId" x-on:click="spGwTry()" x-text="spTry.busy ? '호출 중…' : '실행'"></button></div>
              </div>
              <div class="text-xs text-muted" style="margin-top:8px" x-show="!spLiveKeys.length">쓸 수 있는 키가 없습니다 · 커넥터 상세나 <b>접속 키</b> 화면에서 먼저 하나 발급하세요.</div>
              <div class="text-xs text-muted" style="margin-top:8px" x-show="spToolDef(spTry.tool).restricted">이 기능은 권한이 막혀 있습니다 · 거절(403)이 나오는 것이 정상이며, 그게 이 화면에서 보여 주려는 정책입니다.</div>
              <div class="text-xs text-muted" style="margin-top:8px" x-show="spTry.tool==='query_logs'"><b>기준 날짜</b>를 넣으면 그날 시점의 표를 그대로 다시 읽습니다 · 비우면 지금 시점입니다.</div>
            </div></div>

          <div class="panel" x-show="spTry.out" x-cloak><div class="panel-hd"><b>호출 결과</b>
              <span class="ds-badge" x-bind:class="spStatusCls(spTry.out && spTry.out.status)"><span class="ds-badge__dot"></span><span x-text="spStatusTxt(spTry.out && spTry.out.status)"></span></span>
              <span class="meta tnum" x-text="(spTry.out && spTry.out.ms != null) ? ('소요 ' + spTry.out.ms + 'ms') : ''"></span>
              <span class="meta ml-auto" x-text="spTry.tool"></span></div>
            <div class="panel-bd">
              <ul class="ds-bullets hintbox" style="padding:var(--ds-space-3) var(--ds-space-4);margin-bottom:12px" x-show="spTry.out && spTry.out.permitted === false">
                <li><b>이 요청은 거절됐습니다</b> · 사유: <b x-text="(spTry.out && (spTry.out.detail || spTry.out.error)) || '권한 없음'"></b></li>
                <li>키가 있어도 기능마다 열람 범위가 따로 정해집니다 · 필요한 범위는 담당팀과 협의해 넓힙니다.</li>
              </ul>
              <div class="flex items-center gap-1.5 flex-wrap" style="margin-bottom:10px" x-show="spSnap()">
                <span class="ds-badge" x-bind:class="(spSnap() && spSnap().timeTravel) ? 'ds-badge--category' : 'ds-badge--neutral'" x-text="(spSnap() && spSnap().timeTravel) ? '과거 시점 조회' : '지금 시점'"></span>
                <span class="text-xs text-muted tnum" x-text="spSnap() ? ('스냅샷 ' + (spSnap().id || '') + (spSnap().asOf ? (' · 기준 ' + spSnap().asOf) : '')) : ''"></span>
                <span class="text-xs text-muted" x-show="spSnap() && spSnap().desc" x-text="spSnap() ? ('· ' + spSnap().desc) : ''"></span>
              </div>
              <div x-show="spResultRows().length" style="margin-bottom:12px">
                <div class="text-xs text-muted" style="margin:0 0 4px">받은 데이터 (앞 <span class="tnum" x-text="spResultRows().length"></span>줄)</div>
                <div class="overflow-auto" style="max-height:300px"><table class="ds-table"><thead><tr>
                    <template x-for="c in spResultCols()" x-bind:key="'sprc'+c"><th x-text="c"></th></template>
                  </tr></thead><tbody>
                  <template x-for="(row, ri) in spResultRows()" x-bind:key="'sprr'+ri">
                    <tr><template x-for="c in spResultCols()" x-bind:key="'sprd'+ri+c">
                      <td class="text-body" x-text="spCell(row, c)"></td>
                    </template></tr>
                  </template>
                </tbody></table></div>
              </div>
              <div class="text-xs text-muted" style="margin:0 0 4px">응답 원문 (JSON)</div>
              <pre class="tbox" style="white-space:pre-wrap;font-size:12px;margin:0;max-height:360px;overflow:auto" x-text="spJson(spTry.out && (spTry.out.result != null ? spTry.out.result : (spTry.out.error != null ? { error: spTry.out.error, detail: spTry.out.detail || '' } : spTry.out)))"></pre>
            </div></div>
        </div>

        <!-- ─────────────── 보조 · 사용 기록 ─────────────── -->
        <div x-show="spTab==='usage'" x-cloak class="space-y-4">
          <div class="panel"><div class="panel-hd"><b>이번 주 사용 현황</b>
              <span class="meta tnum" x-show="spMetrics.avgMs != null" x-text="'평균 응답 ' + spNum(spMetrics.avgMs) + 'ms'"></span></div>
            <div class="panel-bd">
              <div class="ds-stat-grid tnum" style="padding:0 18px">
                <div class="ds-stat"><div class="ds-stat__value ds-stat__value--accent" x-text="spNum(spMetrics.weekCalls || 0)"></div><div class="ds-stat__label">주간 조회 수</div></div>
                <div class="ds-stat"><div class="ds-stat__value" x-text="spNum(spMetrics.weekUsers || 0)"></div><div class="ds-stat__label">주간 사용자</div></div>
                <div class="ds-stat"><div class="ds-stat__value" x-text="spNum(spMetrics.activeKeys || 0)"></div><div class="ds-stat__label">활성 키</div></div>
                <div class="ds-stat"><div class="ds-stat__value" x-text="spPct(spMetrics.failRate || 0)"></div><div class="ds-stat__label">실패율</div></div>
              </div>
            </div></div>

          <div class="panel"><div class="panel-hd"><b>호출 기록</b><span class="meta tnum" x-text="spUsage.length ? (spUsage.length + '건 · 최신순') : ''"></span>
              <button type="button" class="ds-btn ds-btn--secondary ds-btn--s-sm ml-auto" x-bind:disabled="spBusy" x-on:click="spReset()" data-tip="시험판 시연용 · 바로 지웁니다" data-tip-pos="bottom">기록 초기화</button></div>
            <div class="overflow-auto" style="max-height:460px"><table class="ds-table"><thead><tr>
                <th style="width:110px">시각</th><th style="width:130px">사용자</th><th style="width:150px">커넥터</th>
                <th style="width:180px">기능</th><th>결과</th><th style="width:80px">소요</th></tr></thead><tbody>
              <template x-for="(u, ui) in spUsage" x-bind:key="'spuse'+ui">
                <tr>
                  <td class="text-xs text-muted tnum" x-text="spWhen(u.ts)"></td>
                  <td class="text-body" x-text="u.user || '·'"></td>
                  <td class="text-body" x-text="u.connector || '·'"></td>
                  <td><code class="text-violet" style="font-size:12px" x-text="u.tool || ''"></code></td>
                  <td><span class="ds-badge" x-bind:class="u.ok ? 'ds-badge--success' : 'ds-badge--error'"><span class="ds-badge__dot"></span><span x-text="u.ok ? '성공' : '실패'"></span></span>
                    <span class="text-xs text-muted" style="margin-left:6px" x-show="u.note" x-text="u.note"></span></td>
                  <td class="text-xs text-muted tnum" x-text="u.ms != null ? (u.ms + 'ms') : '·'"></td>
                </tr>
              </template>
              <template x-if="!spUsage.length"><tr><td colspan="6" class="text-muted">아직 호출 기록이 없습니다 · <b>관문 체험</b>에서 한 번 실행해 보세요</td></tr></template>
            </tbody></table></div>
          </div>
        </div>

        <!-- ─────────────── 보조 · 접속 키 관리 ─────────────── -->
        <div x-show="spTab==='keys'" x-cloak class="space-y-4">
          <ul class="ds-bullets hintbox" style="padding:var(--ds-space-3) var(--ds-space-4)">
            <li>키 발급은 <b>커넥터 상세</b>의 연결 단계에서도 할 수 있습니다 · 여기서는 이미 받아 둔 키를 확인하고 폐기합니다.</li>
            <li>키는 비밀번호와 같습니다 · 메신저나 문서에 그대로 붙여 두지 마세요.</li>
          </ul>

          <div class="panel" x-show="spNewKey" x-cloak style="border-color:var(--ds-primary)">
            <div class="panel-hd"><b>새 접속 키가 만들어졌습니다</b>
              <span class="ds-badge ds-badge--warning"><span class="ds-badge__dot"></span>이 키는 지금만 표시됩니다</span>
              <button type="button" class="ds-btn ds-btn--secondary ds-btn--s-sm ml-auto" x-on:click="spNewKey=null">닫기</button></div>
            <div class="panel-bd">
              <pre class="tbox" style="white-space:pre-wrap;font-size:13px;margin:0" x-text="spNewKey ? (spNewKey.key || '') : ''"></pre>
              <div class="flex items-center gap-2" style="margin-top:10px">
                <button type="button" class="ds-btn ds-btn--primary ds-btn--s-sm" x-on:click="copyText(spNewKey && spNewKey.key, '접속 키')">키 복사</button>
                <span class="text-xs text-muted tnum" x-show="spNewKey && spNewKey.expiresAt" x-text="spNewKey ? ('만료일 ' + spDate(spNewKey.expiresAt)) : ''"></span>
                <span class="text-xs" style="color:var(--ds-primary)" x-text="copyMsg"></span>
              </div>
            </div></div>

          <div class="panel"><div class="panel-hd"><b>내 접속 키</b>
              <span class="meta">AI 도구가 관문에 들어올 때 쓰는 열쇠입니다</span>
              <span class="meta tnum ml-auto" x-text="spKeys.length ? (spKeys.length + '개') : ''"></span></div>
            <div class="overflow-auto"><table class="ds-table"><thead><tr>
                <th style="width:190px">키</th><th style="width:140px">라벨</th><th style="width:110px">발급일</th>
                <th style="width:170px">만료</th><th style="width:120px">마지막 사용</th><th style="width:92px">상태</th><th style="width:80px"></th></tr></thead><tbody>
              <template x-for="k in spKeys" x-bind:key="'spk'+k.id">
                <tr>
                  <td><code class="text-violet" style="font-size:12px" x-text="k.masked || ''"></code></td>
                  <td class="text-body" x-text="k.label || '·'"></td>
                  <td class="text-xs text-muted tnum" x-text="spDate(k.issuedAt || k.createdAt)"></td>
                  <td><span class="text-xs text-muted tnum" x-text="spDate(k.expiresAt)"></span>
                    <span class="ds-badge" x-bind:class="spExpCls(k)" style="margin-left:6px" x-text="spExpTxt(k)"></span></td>
                  <td class="text-xs text-muted tnum" x-text="k.lastUsedAt ? spWhen(k.lastUsedAt) : '쓴 적 없음'"></td>
                  <td><span class="ds-badge" x-bind:class="k.revoked ? 'ds-badge--neutral' : 'ds-badge--success'"><span class="ds-badge__dot"></span><span x-text="k.revoked ? '폐기됨' : '활성'"></span></span></td>
                  <td><button type="button" class="copybtn" x-show="!k.revoked" x-bind:disabled="spBusy" x-on:click="spRevokeKey(k.id)">폐기</button></td>
                </tr>
              </template>
              <template x-if="!spKeys.length"><tr><td colspan="7" class="text-muted">아직 발급한 키가 없습니다 · 아래에서 하나 만들어 보세요</td></tr></template>
            </tbody></table></div>
          </div>

          <div class="panel"><div class="panel-hd"><b>접속 키 발급</b><span class="meta">라벨은 나중에 어디에 쓴 키인지 알아보기 위한 메모입니다</span></div>
            <div class="panel-bd">
              <div class="flex flex-wrap gap-2" style="align-items:flex-end">
                <div style="flex:1;min-width:220px"><label class="lbl">라벨 (선택)</label>
                  <input x-model="spKeyForm.label" class="field" maxlength="40" placeholder="예) 내 노트북 Claude Code" x-on:keydown.enter="spIssueKey()"></div>
                <div style="min-width:150px"><label class="lbl">유효기간</label>
                  <select x-model="spKeyForm.ttlDays" class="field">
                    <option value="30">30일</option><option value="90">90일</option>
                    <option value="180">180일</option><option value="365">365일</option></select></div>
                <div><button type="button" class="ds-btn ds-btn--primary ds-btn--s-sm" x-bind:disabled="spBusy" x-on:click="spIssueKey()" x-text="spBusy ? '발급 중…' : '키 발급'"></button></div>
              </div>
              <div class="text-xs text-muted" style="margin-top:8px">발급 즉시 전체 키가 한 번만 화면에 뜹니다 · 그 뒤에는 앞뒤 몇 자만 보입니다.</div>
              <div class="text-xs" style="color:var(--ds-error);margin-top:4px" x-show="spMsg" x-text="spMsg"></div>
            </div></div>
        </div>

      </div>
      </template>
