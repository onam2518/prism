             드롭다운은 x-modelpick 한 줄 · 이름·비용 등급은 page.py 가 펼쳐 준다.
             (주석 안에서도 그 태그를 그대로 쓰면 합성기가 펼쳐 버리므로 꺾쇠는 뺀다) -->
        <section class="panel" data-fn><div class="panel-hd"><b>검수 보조 에이전트 모델</b><span class="meta">검수 보조가 답할 때 쓰는 모델 · 팀 전체 공유</span><span class="ds-badge ds-badge--neutral ml-auto">운영 관리자</span></div>
