      <!-- ═══ 모듈: 실험실 · 콘텐츠 에이전트 (사용자향 시연 · Anchor Design System 차용) ═══ -->
      <!-- 화면 스타일은 Anchor(axz 디자인 시스템) semantic 토큰을 .ca- 스코프 변수로 옮겨 사용한다.
           (Pretendard · Radius 4/8/12/16/24/100 · Shadow high/medium/low · 카테고리 식별색
            스포츠=Indigo 연예=Violet 카페=Coral 관심사=Orange 뉴스=Blue)
           시연 흐름: 기존 홈 화면 → 플로팅 버튼 → 매니저(위젯 만들기·홈 편집) · PC/모바일 전환.
           로직 vendor/app-11-contentagent.js · 자연어 이해는 /ca-understand(LLM · 규칙 폴백)
           설계안 docs/CONTENT_DASHBOARD_HANDOFF.md -->
      <style>
        .ca-root{
          --caBase:#f4f5f7; --caSurf:#ffffff; --caSurfOn:#f4f5f7; --caThumb:#f4f5f7;
          --caTxt:#000000; --caTxt2:rgba(0,0,0,.88); --caTxt3:rgba(0,0,0,.72); --caTxtSub:rgba(0,0,0,.48);
          --caDivItem:rgba(0,0,0,.04); --caDivSec:rgba(0,0,0,.08); --caCard:rgba(0,0,0,.08); --caInput:rgba(0,0,0,.1);
          --caPrimary:#1e84ff; --caPrimarySub:rgba(30,132,255,.16); --caAccent:#ff4e33; --caAccentSub:rgba(255,78,51,.16);
          --caSports:#5c77ff; --caEnt:#a05cff; --caCafe:#ff5c66; --caInterest:#ff9429; --caNews:#1e84ff;
          --caShadowM:0 1px 10px 0 rgba(0,0,0,.08); --caShadowH:0 2px 16px 0 rgba(0,0,0,.16);
          --caR4:4px; --caR8:8px; --caR12:12px; --caR16:16px; --caR24:24px; --caR100:100px;
          font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
          color:var(--caTxt); -webkit-font-smoothing:antialiased;
        }
        @media (prefers-color-scheme:dark){ .ca-root{
          --caBase:#161718; --caSurf:#202122; --caSurfOn:#303233; --caThumb:#303233;
          --caTxt:#ffffff; --caTxt2:rgba(255,255,255,.88); --caTxt3:rgba(255,255,255,.72); --caTxtSub:rgba(255,255,255,.48);
          --caDivItem:rgba(255,255,255,.04); --caDivSec:rgba(255,255,255,.08); --caCard:rgba(255,255,255,.08); --caInput:rgba(255,255,255,.1);
          --caShadowM:0 1px 10px 0 rgba(0,0,0,.16); --caShadowH:0 2px 16px 0 rgba(0,0,0,.32); } }
        [data-theme="dark"] .ca-root{
          --caBase:#161718; --caSurf:#202122; --caSurfOn:#303233; --caThumb:#303233;
          --caTxt:#ffffff; --caTxt2:rgba(255,255,255,.88); --caTxt3:rgba(255,255,255,.72); --caTxtSub:rgba(255,255,255,.48);
          --caDivItem:rgba(255,255,255,.04); --caDivSec:rgba(255,255,255,.08); --caCard:rgba(255,255,255,.08); --caInput:rgba(255,255,255,.1);
          --caShadowM:0 1px 10px 0 rgba(0,0,0,.16); --caShadowH:0 2px 16px 0 rgba(0,0,0,.32); }
        [data-theme="light"] .ca-root{
          --caBase:#f4f5f7; --caSurf:#ffffff; --caSurfOn:#f4f5f7; --caThumb:#f4f5f7;
          --caTxt:#000000; --caTxt2:rgba(0,0,0,.88); --caTxt3:rgba(0,0,0,.72); --caTxtSub:rgba(0,0,0,.48);
          --caDivItem:rgba(0,0,0,.04); --caDivSec:rgba(0,0,0,.08); --caCard:rgba(0,0,0,.08); --caInput:rgba(0,0,0,.1);
          --caShadowM:0 1px 10px 0 rgba(0,0,0,.08); --caShadowH:0 2px 16px 0 rgba(0,0,0,.16); }
        .ca-root *{ box-sizing:border-box; }

        /* 실험실 셸 */
        .ca-hint{ background:var(--caPrimarySub); border-radius:var(--caR12); padding:10px 14px; font-size:14px; line-height:1.4; color:var(--caTxt2); margin-bottom:12px; }
        .ca-hint b{ color:var(--caTxt); font-weight:700; }
        .ca-hint a{ color:var(--caPrimary); font-weight:700; text-decoration:none; }
        .ca-bar{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
        .ca-seg{ display:inline-flex; background:var(--caSurfOn); border-radius:var(--caR100); padding:4px; gap:2px; }
        .ca-seg button{ border:0; background:transparent; color:var(--caTxt3); font-size:15px; font-weight:600; padding:8px 18px; border-radius:var(--caR100); cursor:pointer; font-family:inherit; }
        .ca-seg button.sel{ background:var(--caPrimary); color:#fff; font-weight:700; }
        .ca-ghost{ border:1px solid var(--caCard); background:var(--caSurf); color:var(--caTxt2); border-radius:var(--caR8); padding:8px 14px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; text-decoration:none; display:inline-block; }
        .ca-note{ font-size:14px; color:var(--caTxtSub); }

        /* 디바이스 프레임 */
        .ca-stage{ display:flex; justify-content:center; }
        .ca-view{ background:var(--caBase); border-radius:var(--caR24); box-shadow:var(--caShadowH); overflow:hidden; position:relative; width:420px; max-width:100%; }
        .ca-view.pc{ width:100%; max-width:1000px; border-radius:var(--caR16); }
        .ca-appbar{ display:flex; align-items:center; gap:10px; padding:14px 16px 10px; background:var(--caSurf); }
        .ca-logo{ width:28px; height:28px; border-radius:var(--caR8); background:linear-gradient(135deg,var(--caPrimary),var(--caEnt)); flex:none; }
        .ca-search{ flex:1; height:36px; border-radius:var(--caR100); background:var(--caSurfOn); display:flex; align-items:center; padding:0 14px; color:var(--caTxtSub); font-size:15px; }
        .ca-appicon{ width:28px; height:28px; border-radius:var(--caR100); background:var(--caSurfOn); flex:none; }
        .ca-tabs{ display:flex; gap:16px; padding:0 16px; background:var(--caSurf); border-bottom:1px solid var(--caDivSec); overflow-x:auto; }
        .ca-tabs button{ border:0; background:transparent; font-family:inherit; font-size:15px; font-weight:700; color:var(--caTxtSub); padding:10px 0 9px; white-space:nowrap; border-bottom:2px solid transparent; margin-bottom:-1px; cursor:pointer; }
        .ca-tabs button.on{ color:var(--caTxt); border-bottom-color:var(--caPrimary); }
        .ca-feed{ padding:12px; display:flex; flex-direction:column; gap:12px; max-height:540px; overflow-y:auto; }
        .ca-view.pc .ca-feed{ display:grid; grid-template-columns:1fr 1fr; align-items:start; max-height:600px; }
        .ca-view.pc .ca-w.wide{ grid-column:1 / -1; }

        /* 위젯 카드 */
        .ca-w{ background:var(--caSurf); border-radius:var(--caR16); box-shadow:var(--caShadowM); overflow:hidden; }
        .ca-wh{ display:flex; align-items:center; gap:8px; padding:14px 16px 10px; }
        .ca-wt{ font-size:18px; font-weight:700; line-height:1.2; color:var(--caTxt); }
        .ca-cat{ font-size:12px; font-weight:700; line-height:1.2; padding:4px 8px; border-radius:var(--caR4); white-space:nowrap; }
        .ca-cat.news{ color:var(--caNews); background:rgba(30,132,255,.16); }
        .ca-cat.sports{ color:var(--caSports); background:rgba(92,119,255,.16); }
        .ca-cat.ent{ color:var(--caEnt); background:rgba(160,92,255,.16); }
        .ca-cat.cafe{ color:var(--caCafe); background:rgba(255,92,102,.16); }
        .ca-cat.shop{ color:var(--caAccent); background:var(--caAccentSub); }
        .ca-cat.interest{ color:var(--caInterest); background:rgba(255,148,41,.16); }
        .ca-auto{ margin-left:auto; font-size:12px; font-weight:700; color:var(--caTxtSub); }
        .ca-item{ display:flex; gap:12px; padding:12px 16px; border-top:1px solid var(--caDivItem); align-items:flex-start; }
        .ca-item:first-of-type{ border-top:0; }
        .ca-ttl{ font-size:17px; font-weight:400; line-height:1.4; color:var(--caTxt2); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
        .ca-meta{ font-size:14px; line-height:1.32; color:var(--caTxtSub); margin-top:6px; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
        .ca-pin{ font-size:12px; font-weight:700; color:var(--caPrimary); }
        .ca-th{ width:76px; height:76px; border-radius:var(--caR8); background:var(--caThumb); flex:none; border:1px solid var(--caDivItem); }
        .ca-why{ margin:0 16px 12px; background:var(--caSurfOn); border-radius:var(--caR8); padding:10px 12px; font-size:14px; line-height:1.4; color:var(--caTxt3); }
        .ca-why b{ color:var(--caPrimary); font-weight:700; }
        .ca-fbs{ display:flex; gap:6px; margin-top:8px; }
        .ca-fb{ border:1px solid var(--caCard); background:var(--caSurf); color:var(--caTxt2); border-radius:var(--caR100); padding:6px 12px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; }
        .ca-fb.on{ border-color:var(--caPrimary); color:var(--caPrimary); }
        .ca-empty{ padding:20px 16px; text-align:center; font-size:15px; color:var(--caTxtSub); }
        .ca-addw{ border:1px dashed var(--caPrimary); border-radius:var(--caR16); background:transparent; color:var(--caPrimary); padding:16px; text-align:center; font-size:15px; font-weight:700; cursor:pointer; }
        .ca-nav{ display:flex; background:var(--caSurf); border-top:1px solid var(--caDivSec); padding:8px 0 12px; }
        .ca-nav div{ flex:1; text-align:center; font-size:12px; font-weight:700; color:var(--caTxtSub); }
        .ca-nav div.on{ color:var(--caPrimary); }
        .ca-nav i{ display:block; width:22px; height:22px; margin:0 auto 4px; border-radius:var(--caR8); background:currentColor; opacity:.85; }

        /* 플로팅 진입 버튼 */
        .ca-fab{ position:absolute; right:16px; bottom:74px; z-index:5; display:inline-flex; align-items:center; gap:8px; background:var(--caPrimary); color:#fff; border:0; border-radius:var(--caR100); padding:13px 18px 13px 14px; font-size:15px; font-weight:700; box-shadow:var(--caShadowH); cursor:pointer; font-family:inherit; }
        .ca-fab .av{ width:20px; height:20px; border-radius:var(--caR100); background:rgba(255,255,255,.32); }
        .ca-view.pc .ca-fab{ bottom:16px; }

        /* 매니저 시트(진입 후) */
        .ca-sheet{ position:absolute; inset:0; z-index:10; background:var(--caBase); display:flex; flex-direction:column; }
        .ca-shd{ display:flex; align-items:center; gap:10px; padding:14px 16px; background:var(--caSurf); border-bottom:1px solid var(--caDivSec); }
        .ca-shd b{ font-size:18px; font-weight:700; }
        .ca-shd .x{ margin-left:auto; border:0; background:transparent; color:var(--caTxt3); font-size:18px; cursor:pointer; font-family:inherit; }
        .ca-shb{ padding:14px 16px 18px; overflow-y:auto; flex:1; }
        .ca-mtabs{ display:inline-flex; background:var(--caSurfOn); border-radius:var(--caR100); padding:4px; gap:2px; margin-bottom:14px; }
        .ca-mtabs button{ border:0; background:transparent; color:var(--caTxt3); font-size:14px; font-weight:600; padding:7px 14px; border-radius:var(--caR100); cursor:pointer; font-family:inherit; }
        .ca-mtabs button.sel{ background:var(--caPrimary); color:#fff; font-weight:700; }

        /* 만들기 */
        .ca-lab{ font-size:14px; font-weight:700; color:var(--caTxt3); margin:0 0 8px; }
        .ca-in{ width:100%; border:1px solid var(--caInput); border-radius:var(--caR12); padding:12px 14px; font-size:17px; line-height:1.4; color:var(--caTxt); background:var(--caSurf); font-family:inherit; resize:vertical; min-height:60px; }
        .ca-in:focus{ outline:none; border-color:var(--caPrimary); }
        .ca-btn{ width:100%; background:var(--caPrimary); color:#fff; border:0; border-radius:var(--caR8); padding:13px; font-size:15px; font-weight:700; cursor:pointer; font-family:inherit; }
        .ca-btn.sm{ width:auto; padding:10px 18px; }
        .ca-btn:disabled{ opacity:.5; cursor:default; }
        .ca-grp{ margin-bottom:12px; }
        .ca-gl{ font-size:14px; font-weight:700; color:var(--caTxt3); margin-bottom:7px; }
        .ca-chips{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
        .ca-ch{ display:inline-flex; align-items:center; gap:6px; border-radius:var(--caR100); padding:7px 10px 7px 13px; font-size:15px; font-weight:600; border:1px solid var(--caCard); background:var(--caSurf); color:var(--caTxt2); }
        .ca-ch .x{ color:var(--caTxtSub); cursor:pointer; font-size:13px; }
        .ca-ch.inc{ border-color:var(--caPrimary); color:var(--caPrimary); background:var(--caPrimarySub); }
        .ca-ch.exc{ border-color:var(--caAccent); color:var(--caAccent); background:var(--caAccentSub); }
        .ca-ch.exc .p{ text-decoration:line-through; }
        .ca-mini{ border:1px solid var(--caInput); border-radius:var(--caR8); padding:7px 10px; font-size:15px; background:var(--caSurf); color:var(--caTxt); font-family:inherit; width:120px; }
        .ca-tone{ display:inline-flex; gap:6px; flex-wrap:wrap; }
        .ca-tone button{ border:1px solid var(--caCard); background:var(--caSurf); color:var(--caTxt2); border-radius:var(--caR100); padding:7px 13px; font-size:15px; font-weight:600; cursor:pointer; font-family:inherit; }
        .ca-tone button.on{ border-color:var(--caPrimary); color:var(--caPrimary); background:var(--caPrimarySub); }
        .ca-wrow{ display:flex; gap:6px; align-items:center; font-size:14px; color:var(--caTxt3); margin-bottom:5px; flex-wrap:wrap; }
        .ca-wrow .said{ background:var(--caPrimarySub); color:var(--caTxt); border-radius:var(--caR4); padding:3px 8px; font-weight:700; }
        .ca-two{ display:grid; grid-template-columns:1fr; gap:14px; }
        .ca-view.pc .ca-two{ grid-template-columns:1fr 1fr; }
        .ca-panel{ background:var(--caSurf); border-radius:var(--caR16); box-shadow:var(--caShadowM); padding:14px; }
        .ca-prow{ display:flex; gap:10px; padding:10px 0; border-top:1px solid var(--caDivItem); align-items:flex-start; }
        .ca-prow:first-of-type{ border-top:0; }
        .ca-prow .pth{ width:56px; height:44px; border-radius:var(--caR8); background:var(--caThumb); flex:none; }
        .ca-prow.out{ opacity:.44; }
        .ca-prow.out .ca-ttl{ text-decoration:line-through; }
        .ca-pwhy{ font-size:14px; font-weight:600; color:var(--caPrimary); margin-top:4px; }
        .ca-prow.out .ca-pwhy{ color:var(--caAccent); }
        .ca-via{ font-size:13px; font-weight:700; color:var(--caPrimary); margin-left:8px; }

        /* 편집 */
        .ca-erow{ display:flex; align-items:center; gap:10px; background:var(--caSurf); border-radius:var(--caR12); box-shadow:var(--caShadowM); padding:12px 14px; margin-bottom:10px; flex-wrap:wrap; }
        .ca-en{ flex:1; min-width:120px; }
        .ca-esz{ display:inline-flex; border:1px solid var(--caCard); border-radius:var(--caR8); overflow:hidden; }
        .ca-esz span{ font-size:14px; font-weight:600; padding:7px 11px; color:var(--caTxt3); cursor:pointer; }
        .ca-esz span.on{ background:var(--caPrimary); color:#fff; font-weight:700; }
        .ca-ico{ border:1px solid var(--caCard); background:var(--caSurf); color:var(--caTxt3); border-radius:var(--caR8); width:32px; height:30px; font-size:14px; cursor:pointer; font-family:inherit; }
        .ca-ico:disabled{ opacity:.3; cursor:default; }
        /* 배치 모드: 핸드폰 홈처럼 흔들림 + 드래그 */
        .ca-w.arr{ border:1px dashed var(--caPrimary); cursor:grab; }
        .ca-w.arr:active{ cursor:grabbing; }
        .ca-w.drag{ opacity:.45; }
        .ca-w.over{ outline:2px solid var(--caPrimary); outline-offset:2px; }
        @media (prefers-reduced-motion:no-preference){
          .ca-w.arr{ animation:caWig 1.6s ease-in-out infinite; transform-origin:50% 50%; }
          @keyframes caWig{ 0%,100%{ transform:rotate(-.28deg); } 50%{ transform:rotate(.28deg); } }
        }
        .ca-wtools{ display:flex; align-items:center; gap:6px; padding:0 16px 12px; flex-wrap:wrap; }
        .ca-wtools .ca-esz{ display:inline-flex; border:1px solid var(--caCard); border-radius:var(--caR8); overflow:hidden; }
        .ca-wtools .ca-esz span{ font-size:13px; font-weight:600; padding:6px 10px; color:var(--caTxt3); cursor:pointer; }
        .ca-wtools .ca-esz span.on{ background:var(--caPrimary); color:#fff; font-weight:700; }
        .ca-wbtn{ border:1px solid var(--caCard); background:var(--caSurf); color:var(--caTxt2); border-radius:var(--caR8); padding:6px 11px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; }
        .ca-wbtn.danger{ color:var(--caAccent); border-color:var(--caAccentSub); }
        .ca-grip{ color:var(--caTxtSub); font-size:15px; cursor:grab; }
        .ca-arrbtn{ position:absolute; right:16px; bottom:132px; z-index:5; border:0; background:var(--caSurf); color:var(--caTxt2); border-radius:var(--caR100); padding:11px 16px; font-size:14px; font-weight:700; box-shadow:var(--caShadowH); cursor:pointer; font-family:inherit; }
        .ca-view.pc .ca-arrbtn{ bottom:74px; }
        .ca-toast{ position:fixed; left:50%; bottom:28px; transform:translateX(-50%); background:#303233; color:#fff; padding:13px 20px; border-radius:var(--caR12); font-size:15px; font-weight:600; z-index:60; box-shadow:var(--caShadowH); }
      </style>

      <!-- 상단 바: PC/모바일 · 설계안 -->
      <div x-show="mod === 'lab' && labTab === 'ca'" x-cloak class="w-full ca-root" x-init="caBoot()">
        <div class="ca-hint">
          사용자향 <b>콘텐츠 에이전트</b> 시연입니다 · <b>실제 등록된 콘텐츠</b>로 동작하고, 자연어 이해는 <b>실제 모델</b>을 씁니다(키 없으면 기본 규칙) ·
          홈 화면 오른쪽 아래 <b>플로팅 버튼</b>에서 시작하세요 ·
          <a href="https://claude.ai/code/artifact/627cc308-1a63-4137-86ce-cf96b267fd6e" target="_blank" rel="noopener">설계안 열기 ↗</a>
        </div>
        <div class="ca-bar">
          <div class="ca-seg">
            <button type="button" x-bind:class="caDevice==='mobile'?'sel':''" x-on:click="caDevice='mobile'">모바일</button>
            <button type="button" x-bind:class="caDevice==='pc'?'sel':''" x-on:click="caDevice='pc'">PC</button>
          </div>
          <span class="ca-note" x-text="caLoading ? '콘텐츠를 불러오는 중…' : caLoadMsg"></span>
          <button type="button" class="ca-ghost" style="margin-left:auto" x-on:click="caReset(); caEntered=false">처음 상태로</button>
        </div>
      </div>

      <!-- 시연 무대: 홈 화면(+플로팅) → 매니저 시트 -->
      <div x-show="mod === 'lab' && labTab === 'ca'" x-cloak class="w-full ca-root ca-stage">
        <div class="ca-view" x-bind:class="caDevice==='pc'?'pc':''">
          <!-- 홈 -->
          <div class="ca-appbar">
            <span class="ca-logo"></span>
            <span class="ca-search">뉴스·인물·주제 검색</span>
            <span class="ca-appicon"></span>
          </div>
          <div class="ca-tabs">
            <button type="button" class="on">홈</button>
            <template x-for="w in caWidgets" x-bind:key="'tab'+w.id"><button type="button" x-text="w.name"></button></template>
          </div>
          <div class="ca-feed">
            <template x-if="!caWidgets.length">
              <div class="ca-w"><div class="ca-empty">위젯이 없습니다 · 오른쪽 아래 <b>내 콘텐츠 매니저</b>에서 만들어 보세요</div></div>
            </template>
            <template x-for="w in caWidgets" x-bind:key="w.id">
              <div class="ca-w"
                   x-bind:class="(w.size==='lg'?'wide ':'') + (caArrange?'arr ':'') + (caDragId===w.id?'drag ':'') + (caOverId===w.id?'over':'')"
                   x-bind:draggable="caArrange ? 'true' : 'false'"
                   x-on:dragstart="caDragStart(w, $event)"
                   x-on:dragover="caDragOver(w, $event)"
                   x-on:drop.prevent="caDragEnd()"
                   x-on:dragend="caDragEnd()">
                <div class="ca-wh">
                  <span class="ca-grip" x-show="caArrange" x-cloak>⠿</span>
                  <span class="ca-cat" x-bind:class="caWidgetCat(w)" x-text="caLabel('topic', (w.cond.topics||[])[0] || (w.cond.fields||[])[0] || '내 소식')"></span>
                  <span class="ca-wt" x-text="w.name"></span>
                  <span class="ca-auto" x-text="caSizeLabel(w.size)"></span>
                </div>
                <div class="ca-wtools" x-show="caArrange" x-cloak>
                  <span class="ca-esz">
                    <span x-bind:class="w.size==='sm'?'on':''" x-on:click="caSetSize(w,'sm')">작게</span>
                    <span x-bind:class="w.size==='md'?'on':''" x-on:click="caSetSize(w,'md')">보통</span>
                    <span x-bind:class="w.size==='lg'?'on':''" x-on:click="caSetSize(w,'lg')">크게</span>
                  </span>
                  <button type="button" class="ca-wbtn" x-on:click="caEditWidget(w)">수정</button>
                  <button type="button" class="ca-wbtn danger" x-on:click="caRemove(w)">삭제</button>
                </div>
                <template x-for="r in caWidgetRows(w)" x-bind:key="w.id + '-' + r.a.id">
                  <div class="ca-item">
                    <div style="flex:1;min-width:0">
                      <div class="ca-ttl" x-text="r.a.t"></div>
                      <div class="ca-meta">
                        <span x-text="r.a.src"></span>
                        <span class="ca-pin" x-show="caIsPinned(w, r.a.id)" x-cloak>고정</span>
                      </div>
                    </div>
                    <span class="ca-th"></span>
                  </div>
                </template>
                <template x-if="!caWidgetRows(w).length"><div class="ca-empty">조건에 맞는 소식이 아직 없어요</div></template>
                <div class="ca-why" x-show="caWidgetRows(w).length">
                  <b>왜 이 소식?</b> <span x-text="caWidgetWhy(w)"></span>
                  <div class="ca-fbs">
                    <button type="button" class="ca-fb on" x-on:click="caTogglePin(w, caWidgetRows(w)[0].a.id)" x-text="caIsPinned(w, caWidgetRows(w)[0].a.id) ? '고정 해제' : '좋아요 · 고정'"></button>
                    <button type="button" class="ca-fb" x-on:click="caDislike(w, caWidgetRows(w)[0].a.id)">관심없음</button>
                  </div>
                </div>
              </div>
            </template>
          </div>
          <div class="ca-nav">
            <div class="on"><i></i>홈</div><div><i></i>탐색</div><div><i></i>구독</div><div><i></i>내정보</div>
          </div>

          <!-- 배치 · 플로팅 진입 -->
          <button type="button" class="ca-arrbtn" x-show="!caEntered" x-on:click="caToggleArrange()" x-text="caArrange ? '배치 완료' : '위젯 배치'"></button>
          <button type="button" class="ca-fab" x-show="!caEntered" x-on:click="caEntered=true; caTab='make'; caEditId=''; caDraft=null"><span class="av"></span>내 콘텐츠 매니저</button>

          <!-- 매니저 시트 -->
          <div class="ca-sheet" x-show="caEntered" x-cloak>
            <div class="ca-shd">
              <b>내 콘텐츠 매니저</b>
              <button type="button" class="x" x-on:click="caEntered=false">✕ 홈으로</button>
            </div>
            <div class="ca-shb">
              <div class="ca-mtabs">
                <button type="button" x-bind:class="caTab==='make'?'sel':''" x-on:click="caTab='make'">위젯 만들기</button>
                <button type="button" x-bind:class="caTab==='edit'?'sel':''" x-on:click="caTab='edit'">홈 편집</button>
              </div>

              <!-- 위젯 만들기 -->
              <div x-show="caTab==='make'">
                <div class="ca-lab" x-text="caEditId ? '이 위젯을 어떻게 바꿀까요?' : '어떤 소식을 모을까요?'"></div>
                <div class="ca-wrow" x-show="caEditId" x-cloak style="margin-bottom:8px">
                  <span class="said">수정 중</span><span x-text="caDraft ? caDraft.name : ''"></span>
                  <button type="button" class="ca-ghost" style="padding:5px 10px" x-on:click="caCancelEdit()">새로 만들기로</button>
                </div>
                <textarea class="ca-in" x-model="caText" placeholder="원하는 소식을 한 문장으로 · 예) 경제 소식 깊이 있게, 광고는 빼고"></textarea>
                <div style="display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap">
                  <button type="button" class="ca-btn sm" x-bind:disabled="caThinking" x-on:click="caUnderstand()" x-text="caThinking ? '이해하는 중…' : '이해하기'"></button>
                  <template x-for="ex in caExamples()" x-bind:key="ex">
                    <button type="button" class="ca-ghost" x-on:click="caText=ex; caUnderstand()" x-text="ex"></button>
                  </template>
                  <span class="ca-via" x-show="caVia" x-cloak x-text="caVia"></span>
                </div>

                <div class="ca-two" style="margin-top:14px" x-show="caDraft" x-cloak>
                  <div class="ca-panel">
                    <div class="ca-lab">이렇게 이해했어요</div>
                    <div class="ca-grp" x-show="caDraft && caDraft.cond.ents.length">
                      <div class="ca-gl">모을 것 · 인물·팀</div>
                      <div class="ca-chips">
                        <template x-for="v in (caDraft?caDraft.cond.ents:[])" x-bind:key="'e'+v">
                          <span class="ca-ch"><span class="p" x-text="v"></span><span class="x" x-on:click="caChipDel('ents', v)">✕</span></span>
                        </template>
                      </div>
                    </div>
                    <div class="ca-grp" x-show="caDraft && (caDraft.cond.topics.length || (caDraft.cond.fields||[]).length)">
                      <div class="ca-gl">모을 것 · 주제·분야</div>
                      <div class="ca-chips">
                        <template x-for="v in (caDraft?caDraft.cond.topics:[])" x-bind:key="'t'+v">
                          <span class="ca-ch"><span class="p" x-text="caLabel('topic', v)"></span><span class="x" x-on:click="caChipDel('topics', v)">✕</span></span>
                        </template>
                        <template x-for="v in (caDraft&&caDraft.cond.fields?caDraft.cond.fields:[])" x-bind:key="'f'+v">
                          <span class="ca-ch"><span class="p" x-text="caLabel('field', v)"></span><span class="x" x-on:click="caChipDel('fields', v)">✕</span></span>
                        </template>
                      </div>
                    </div>
                    <div class="ca-grp">
                      <div class="ca-gl">꼭 이런 내용</div>
                      <div class="ca-chips">
                        <template x-for="v in (caDraft?caDraft.cond.kinds:[])" x-bind:key="'k'+v">
                          <span class="ca-ch inc"><span class="p" x-text="caLabel('kind', v)"></span><span class="x" x-on:click="caChipDel('kinds', v)">✕</span></span>
                        </template>
                        <input class="ca-mini" x-model="caNew.kind" placeholder="＋ 추가" x-on:keydown.enter="caChipAdd('kinds', caNew.kind)">
                      </div>
                    </div>
                    <div class="ca-grp">
                      <div class="ca-gl">이런 건 빼고</div>
                      <div class="ca-chips">
                        <template x-for="v in (caDraft?caDraft.cond.excl:[])" x-bind:key="'x'+v">
                          <span class="ca-ch exc"><span class="p" x-text="caLabel('kind', v)"></span><span class="x" x-on:click="caChipDel('excl', v)">✕</span></span>
                        </template>
                        <input class="ca-mini" x-model="caNew.excl" placeholder="＋ 뺄 내용" x-on:keydown.enter="caChipAdd('excl', caNew.excl)">
                      </div>
                    </div>
                    <div class="ca-grp">
                      <div class="ca-gl">읽는 방식</div>
                      <div class="ca-tone">
                        <button type="button" x-bind:class="caDraft&&caDraft.cond.tone==='깊게'?'on':''" x-on:click="caSetTone('깊게')">깊이 있는 글</button>
                        <button type="button" x-bind:class="caDraft&&caDraft.cond.tone==='빠르게'?'on':''" x-on:click="caSetTone('빠르게')">빠르게 훑기</button>
                        <button type="button" x-bind:class="caDraft&&caDraft.cond.tone==='가볍게'?'on':''" x-on:click="caSetTone('가볍게')">가볍게</button>
                      </div>
                    </div>
                    <div class="ca-grp" style="margin-bottom:0" x-show="caDraft && caDraft.why.length">
                      <div class="ca-gl">왜 이렇게 이해했어요?</div>
                      <template x-for="w in (caDraft?caDraft.why:[])" x-bind:key="w.said+w.to">
                        <div class="ca-wrow"><span class="said" x-text="w.said"></span><span>→</span><span x-text="w.to"></span></div>
                      </template>
                    </div>
                  </div>

                  <div class="ca-panel">
                    <div class="ca-lab" x-text="'이 조건이면 이런 소식 · ' + caPreviewOkN() + '건'"></div>
                    <template x-for="r in caPreview()" x-bind:key="'p'+r.a.id">
                      <div class="ca-prow" x-bind:class="r.ok?'':'out'">
                        <div style="flex:1;min-width:0">
                          <div class="ca-ttl" x-text="r.a.t"></div>
                          <div class="ca-pwhy" x-text="(r.ok?'✓ ':'✕ ') + r.why"></div>
                        </div>
                        <span class="pth"></span>
                      </div>
                    </template>
                    <template x-if="!caPreview().length"><div class="ca-empty">조건에 맞는 소식이 없어요 · 조건을 줄여보세요</div></template>
                    <div style="margin-top:14px;border-top:1px solid var(--caDivSec);padding-top:14px">
                      <div class="ca-lab">위젯 이름</div>
                      <input class="ca-mini" style="width:100%" x-model="caDraft.name" x-show="caDraft" x-cloak>
                      <div class="ca-lab" style="margin-top:12px">크기</div>
                      <div class="ca-tone">
                        <button type="button" x-bind:class="caDraft&&caDraft.size==='sm'?'on':''" x-on:click="caDraft.size='sm'">작게</button>
                        <button type="button" x-bind:class="caDraft&&caDraft.size==='md'?'on':''" x-on:click="caDraft.size='md'">보통</button>
                        <button type="button" x-bind:class="caDraft&&caDraft.size==='lg'?'on':''" x-on:click="caDraft.size='lg'">크게</button>
                      </div>
                      <button type="button" class="ca-btn" style="margin-top:14px" x-on:click="caCreate(); caEntered=false" x-text="caEditId ? '수정 저장' : '홈에 위젯 만들기'"></button>
                    </div>
                  </div>
                </div>
              </div>

              <!-- 홈 편집 -->
              <div x-show="caTab==='edit'" x-cloak>
                <div class="ca-lab">위젯 크기·순서·삭제 · 바꾸면 홈에 바로 반영됩니다</div>
                <template x-for="(w, i) in caWidgets" x-bind:key="'e'+w.id">
                  <div class="ca-erow">
                    <span class="ca-cat" x-bind:class="caWidgetCat(w)" x-text="caLabel('topic', (w.cond.topics||[])[0] || (w.cond.fields||[])[0] || '내 소식')"></span>
                    <div class="ca-en">
                      <div class="ca-wt" x-text="w.name"></div>
                      <div class="ca-meta"><span x-text="caWidgetWhy(w)"></span></div>
                    </div>
                    <button type="button" class="ca-ico" x-bind:disabled="i===0" x-on:click="caMove(w,-1)">▲</button>
                    <button type="button" class="ca-ico" x-bind:disabled="i===caWidgets.length-1" x-on:click="caMove(w,1)">▼</button>
                    <span class="ca-esz">
                      <span x-bind:class="w.size==='sm'?'on':''" x-on:click="caSetSize(w,'sm')">작게</span>
                      <span x-bind:class="w.size==='md'?'on':''" x-on:click="caSetSize(w,'md')">보통</span>
                      <span x-bind:class="w.size==='lg'?'on':''" x-on:click="caSetSize(w,'lg')">크게</span>
                    </span>
                    <button type="button" class="ca-ico" x-on:click="caRemove(w)">✕</button>
                  </div>
                </template>
                <div class="ca-addw" x-on:click="caTab='make'">＋ 위젯 추가</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="ca-root"><div class="ca-toast" x-show="caMsg" x-cloak x-text="caMsg"></div></div>
