      <!-- 실험실 › AI 초안 판정(운영자 전용) · 서브탭 labTab==='auto' · 06-quality-lab 탭 바에 의존 -->
      <template x-if="mod === 'lab'">
        <div x-show="labTab === 'auto'" x-cloak class="w-full space-y-4">

        <section class="panel">
          <div class="panel-hd"><b>AI 초안 판정</b><span class="meta">심판 모델이 대기 콘텐츠를 미리 채점 · 확정은 내가</span><span class="ds-badge ds-badge--neutral ml-auto">운영자 전용</span></div>
          <div class="panel-bd">
            <ul class="ds-bullets" style="margin-bottom:11px">
              <li>대기(YELLOW) 콘텐츠에 <b>별도 심판 모델</b>이 정확/수정 초안 + 근거 + 확신도를 채웁니다 · <b>골드 문항은 대상이 아닙니다</b>(측정 독립성 유지).</li>
              <li>자동으로 기록하지 않습니다 · <b>확정/뒤집기는 내가 눌러야</b> 반영됩니다(평소 검수와 같은 경로) · <b>저확신 건은 강조</b>되니 그것만이라도 직접 보세요.</li>
              <li>심판 모델은 <b>콘텐츠를 만든 모델과 다른 고지능 모델</b>을 쓰세요 · 같으면 '자기 채점'이라 신뢰가 낮고 화면에서 '같은 모델' 배지로 표시됩니다.</li>
            </ul>

            <div class="flexrow" style="align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap">
              <span class="lbl" style="margin:0">심판 모델</span>
              <x-modelpick key="drj" value="arModel" set="arModel=$v; saveDraftJudgeModel()" options="arModels" width="240px" tip="콘텐츠 만든 모델과 다른 고지능 모델을 쓰세요(자기 채점 방지)" tip-pos="top"></x-modelpick>
              <button type="button" class="ds-btn ds-btn--solid ds-btn--c-primary ds-btn--s-sm" x-bind:disabled="arBusy" x-on:click="arRun()" x-text="arBusy ? '판정 중…' : 'AI 초안 판정 실행'"></button>
              <span class="meta" x-text="arMsg" x-show="arMsg"></span>
            </div>

            <div x-show="arItems.length" x-cloak class="w-full" style="overflow-x:auto">
              <table class="ds-table w-full">
                <thead><tr><th>콘텐츠</th><th>AI 초안</th><th>확신도</th><th>근거</th><th style="width:150px">확정</th></tr></thead>
                <tbody>
                  <template x-for="(it,i) in arItems" x-bind:key="i">
                    <tr x-bind:class="arLow(it) && !it._done ? 'is-sel' : ''">
                      <td class="text-ink"><span x-text="it.title"></span> <span class="uid" x-text="it.service"></span><span class="ds-badge ds-badge--warning" x-show="it.sameModel" data-tip="콘텐츠를 만든 모델과 심판 모델이 같음 · 자기 채점이라 신뢰 낮음" data-tip-pos="top" style="cursor:help">같은 모델</span></td>
                      <td><span class="ds-badge" x-bind:class="it.ai.verdict==='good' ? 'ds-badge--success' : it.ai.verdict==='bad' ? 'ds-badge--error' : 'ds-badge--neutral'" x-text="it.ai.verdict==='good' ? '정확' : it.ai.verdict==='bad' ? '수정' : '판정 못함'"></span> <span class="uid" x-show="it.ai.elements && it.ai.elements.length" x-text="'· ' + it.ai.elements.join('·')"></span></td>
                      <td class="tnum" x-text="arConf(it.ai) + '%'" x-bind:style="arLow(it) ? 'color:var(--ds-danger)' : ''"></td>
                      <td class="text-muted" style="max-width:280px" x-text="it.ai.reason"></td>
                      <td>
                        <span class="flexrow" style="gap:6px" x-show="!it._done && it.ai.verdict" x-cloak>
                          <button type="button" class="ds-btn ds-btn--outline ds-btn--c-primary ds-btn--s-sm" x-on:click="arConfirm(it, it.ai.verdict)" x-text="it.ai.verdict==='good' ? '정확 확정' : '수정 확정'"></button>
                          <button type="button" class="ds-btn ds-btn--ghost ds-btn--s-sm" x-on:click="arConfirm(it, it.ai.verdict==='good' ? 'bad' : 'good')" data-tip="AI와 반대로 판정" data-tip-pos="top">뒤집기</button>
                        </span>
                        <span class="meta" x-show="!it._done && !it.ai.verdict" x-cloak>직접 검수</span>
                        <span class="ds-badge ds-badge--success" x-show="it._done" x-cloak x-text="(it._done==='good'?'정확':'수정')+' 반영됨'"></span>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
              <p class="meta" style="margin-top:8px" x-text="arDoneN() + ' / ' + arItems.length + '건 확정'"></p>
            </div>
          </div>
        </section>

        </div>
      </template>
