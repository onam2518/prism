      <!-- 실험실 › AI 초안 판정(운영자 전용) · 서브탭 labTab==='auto' · 06-quality-lab 탭 바에 의존 -->
      <!-- 상시 적재 인박스: 검수(진척 스트립·정확/수정 배지·확신도 막대·확정 버튼·저확신 강조) +
           콘텐츠 관리(등급 dot·서비스·세그먼트 필터·서브헤더) 요소를 버무림 · 영역은 .ar-body gap 으로 띄움 -->
      <template x-if="mod === 'lab'">
        <div x-show="labTab === 'auto'" x-cloak class="w-full">

        <section class="panel">
          <div class="panel-hd"><b>AI 초안 판정</b><span class="meta">심판 모델이 내 배정 콘텐츠를 미리 채점 · 확정은 내가</span><span class="ds-badge ds-badge--neutral ml-auto">운영자 전용</span></div>
          <div class="panel-bd">
           <div class="ar-body">

            <!-- 안내 불릿(유지) -->
            <ul class="ds-bullets">
              <li><b>나에게 배정된</b> 미검수 콘텐츠 전부에 <b>별도 심판 모델</b>이 정확/수정 초안 + 근거 + 확신도를 채웁니다(배정이 없으면 대기 큐) · <b>골드 문항은 대상이 아닙니다</b>(측정 독립성 유지).</li>
              <li>초안은 <b>콘텐츠 검수처럼 상시 저장</b>됩니다 · 페이지를 나갔다 와도·배포돼도 그대로이고, 재실행은 <b>이미 초안 있는 건 건너뜁니다</b>.</li>
              <li>자동으로 기록하지 않습니다 · <b>확정/뒤집기는 내가 눌러야</b> 반영됩니다(평소 검수와 같은 경로) · <b>저확신 건은 강조</b>되니 그것만이라도 직접 보세요 · 심판 모델은 <b>콘텐츠를 만든 모델과 다른 고지능 모델</b>을 쓰세요(같으면 '같은 모델' 배지).</li>
            </ul>

            <!-- 진척 스트립: 검수 '내 담당 N중 M검수' 를 초안 축으로 확장 -->
            <div class="ar-prog" x-show="arItems.length || arAssigned" x-cloak>
              <div class="ar-stat"><b class="tnum" x-text="arAssigned || arItems.length"></b><span>내 배정</span></div>
              <div class="ar-stat ar-stat--accent"><b class="tnum" x-text="arItems.length"></b><span>초안 완료</span></div>
              <div class="ar-stat"><b class="tnum" x-text="arDoneN()"></b><span>내가 확정</span></div>
              <div class="ar-stat ar-stat--warn"><b class="tnum" x-text="arPendingN()"></b><span>미확정</span></div>
              <div class="ar-progbar">
                <div class="top"><span x-text="'확정 ' + arDoneN() + ' · 초안대기 ' + arPendingN() + (arAssigned > arItems.length ? (' · 미채점 ' + (arAssigned - arItems.length)) : '')"></span>
                  <span class="tnum" x-text="Math.round(arDoneN() / (arAssigned || arItems.length || 1) * 100) + '%'"></span></div>
                <div class="ar-track">
                  <i class="done" x-bind:style="'width:' + (arDoneN() / (arAssigned || arItems.length || 1) * 100) + '%'"></i>
                  <i class="draft" x-bind:style="'width:' + (arPendingN() / (arAssigned || arItems.length || 1) * 100) + '%'"></i>
                </div>
              </div>
            </div>

            <!-- 판정 실행(별도 영역): 심판 모델 + 실행 + 안내 + 진척을 한 박스로 묶음 -->
            <div class="ar-run">
              <div class="ar-run__hd">판정 실행 <span class="meta" x-show="!arRunning" x-cloak>내 배정 콘텐츠를 심판 모델이 미리 채웁니다</span></div>
              <div class="flexrow" style="align-items:center;gap:10px;flex-wrap:wrap">
                <span class="lbl" style="margin:0">심판 모델</span>
                <x-modelpick key="drj" value="arModel" set="arModel=$v; saveDraftJudgeModel()" options="arModels" width="240px" tip="콘텐츠 만든 모델과 다른 고지능 모델을 쓰세요(자기 채점 방지)" tip-pos="top"></x-modelpick>
                <button type="button" class="ds-btn ds-btn--solid ds-btn--c-primary ds-btn--s-sm" x-bind:disabled="arRunning" x-on:click="arRun()" x-text="arRunning ? '채점 중…' : (arItems.length ? '미채점분 판정 실행' : 'AI 초안 판정 실행')"></button>
                <button type="button" class="ds-btn ds-btn--outline ds-btn--c-danger ds-btn--s-sm" x-show="!arRunning && arFailedN() > 0" x-cloak x-on:click="arRun()" data-tip="라우터 실패로 판정 못한 건을 다시 판정합니다" data-tip-pos="top" x-text="'판정 실패 ' + arFailedN() + '건 다시 판정'"></button>
                <button type="button" class="ds-btn ds-btn--outline ds-btn--c-primary ds-btn--s-sm" x-show="!arRunning && arTruncated > 0" x-cloak x-on:click="arRun()" data-tip="상한을 넘어 못 채점한 나머지를 이어서" data-tip-pos="top" x-text="'이어서 실행 (남은 ' + arTruncated + '건)'"></button>
                <span class="meta" x-text="arMsg" x-show="arMsg"></span>
              </div>
              <p class="meta" style="margin:0" x-show="!arRunning && arFailedN() > 0" x-cloak>심판 모델(라우터) 연결 실패로 <b class="text-ink" x-text="arFailedN() + '건'"></b>이 '직접 검수'로 남았습니다 · 라우터가 정상이면 <b>다시 판정</b>으로 재시도하세요.</p>
              <p class="meta" style="margin:0" x-show="arRunning" x-cloak>채점은 백그라운드로 돕니다 · <b>페이지를 나갔다 와도 이어집니다</b>(다시 실행 안 해도 됨).</p>

              <!-- 실행 중 진척 + 예상 시간(백그라운드 잡 폴링) -->
              <div x-show="arRunning || (arTotal > 0 && arDone < arTotal)" x-cloak style="max-width:520px">
                <div class="flexrow" style="align-items:baseline;gap:10px;font-size:13px">
                  <span class="tnum" style="font-weight:700" x-text="arDone + ' / ' + arTotal + '건'"></span>
                  <span class="meta" x-show="arRunning && arEta" x-text="'예상 ' + arEta + ' 남음'"></span>
                  <span class="meta" x-show="arRunning && !arEta">채점 중…</span>
                  <span class="meta" x-show="!arRunning">완료</span>
                  <span class="meta" style="margin-left:auto" x-text="Math.round((arPct||0)*100) + '%'"></span>
                </div>
                <div class="ar-track" style="margin-top:6px">
                  <i class="draft solo" style="opacity:1" x-bind:style="'width:' + Math.round((arPct||0)*100) + '%'"></i>
                </div>
              </div>
            </div>

            <!-- 세그먼트 필터: 콘텐츠 관리 evaltabs 차용 -->
            <div class="evaltabs evaltabs--sub" x-show="arItems.length" x-cloak style="margin-bottom:0">
              <button type="button" x-bind:class="arFilter==='all'?'sel':''" x-on:click="arSetFilter('all')">전체 <span class="cnt" x-text="arCounts().all"></span></button>
              <button type="button" x-bind:class="arFilter==='pending'?'sel':''" x-on:click="arSetFilter('pending')">미확정 <span class="cnt" x-text="arCounts().pending"></span></button>
              <button type="button" x-bind:class="arFilter==='low'?'sel':''" x-on:click="arSetFilter('low')">저확신 <span class="cnt" x-text="arCounts().low"></span></button>
              <button type="button" x-bind:class="arFilter==='bad'?'sel':''" x-on:click="arSetFilter('bad')">수정 제안 <span class="cnt" x-text="arCounts().bad"></span></button>
              <button type="button" x-show="arCounts().failed > 0" x-cloak x-bind:class="arFilter==='failed'?'sel':''" x-on:click="arSetFilter('failed')">판정 실패 <span class="cnt" x-text="arCounts().failed"></span></button>
              <button type="button" x-bind:class="arFilter==='done'?'sel':''" x-on:click="arSetFilter('done')">확정됨 <span class="cnt" x-text="arCounts().done"></span></button>
            </div>

            <!-- 인박스(서브헤더 + 표 + 요약 + 범례) -->
            <div class="flexcol" x-show="arItems.length" x-cloak style="gap:12px">
              <div class="subhd" style="margin:2px 2px 0">초안 인박스 <span class="meta">미확정 먼저 · 확정분은 흐리게 · 저확신은 주황 강조</span></div>
              <div class="overflow-auto">
                <table class="ds-table w-full">
                  <thead><tr><th style="width:52px">등급</th><th>콘텐츠</th><th style="width:120px">AI 초안</th><th style="width:150px">확신도</th><th>근거</th><th style="width:168px">확정</th></tr></thead>
                  <tbody>
                    <template x-for="it in arPaged()" x-bind:key="it.hash">
                      <tr x-bind:class="(arLow(it) && !it._done) ? 'ar-low' : (it._done ? 'ar-fin' : '')">
                        <td><span class="argdot" x-bind:class="arGradeCls(it.grade)" x-text="it.grade || '·'"></span></td>
                        <td class="text-ink"><span x-text="it.title"></span><span class="uid" x-text="it.service"></span><span class="ds-badge ds-badge--warning" x-show="it.sameModel" data-tip="콘텐츠를 만든 모델과 심판 모델이 같음 · 자기 채점이라 신뢰 낮음" data-tip-pos="top" style="cursor:help;margin-left:6px">같은 모델</span></td>
                        <td><span class="ds-badge" x-bind:class="it.ai.verdict==='good' ? 'ds-badge--success' : it.ai.verdict==='bad' ? 'ds-badge--error' : 'ds-badge--neutral'" x-text="it.ai.verdict==='good' ? '정확' : it.ai.verdict==='bad' ? '수정' : '판정 못함'"></span> <span class="uid" x-show="it.ai.elements && it.ai.elements.length" x-text="'· ' + it.ai.elements.join('·')"></span></td>
                        <td><span class="abbar abbar--conf" x-bind:class="(!it.ai.verdict || arLow(it)) ? 'abbar--low' : 'abbar--good'"><span class="abbar__track"><span class="abbar__fill" x-bind:style="'width:' + Math.max(arConf(it.ai), 3) + '%'"></span></span><b class="abbar__num" x-text="arConf(it.ai) + '%'"></b></span></td>
                        <td class="text-muted" style="max-width:300px" x-text="it.ai.reason"></td>
                        <td>
                          <span class="flexrow" style="gap:6px" x-show="!it._done && it.ai.verdict" x-cloak>
                            <button type="button" class="ds-btn ds-btn--outline ds-btn--c-primary ds-btn--s-sm" x-on:click="arConfirm(it, it.ai.verdict)" x-text="it.ai.verdict==='good' ? '정확 확정' : '수정 확정'"></button>
                            <button type="button" class="ds-btn ds-btn--ghost ds-btn--s-sm" x-on:click="arConfirm(it, it.ai.verdict==='good' ? 'bad' : 'good')" data-tip="AI와 반대로 판정" data-tip-pos="top">뒤집기</button>
                          </span>
                          <span class="meta" x-show="!it._done && !it.ai.verdict" x-cloak>직접 검수</span>
                          <span class="ar-donebadge" x-show="it._done" x-cloak><svg viewBox="0 0 24 24" fill="none"><path d="M5 12l5 5L20 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span x-text="(it._done==='good'?'정확':'수정')+' 반영됨'"></span></span>
                        </td>
                      </tr>
                    </template>
                    <template x-if="!arView().length">
                      <tr><td colspan="6" class="text-muted" style="text-align:center;padding:18px">이 필터에 해당하는 초안이 없습니다</td></tr>
                    </template>
                  </tbody>
                </table>
              </div>
              <!-- 페이지네이션: 현재 페이지만 렌더(목록이 길어도 DOM 절약) -->
              <div class="ar-pager" x-show="arView().length > arPageSize" x-cloak>
                <button type="button" class="ds-btn ds-btn--outline ds-btn--c-ghost ds-btn--s-sm" x-bind:disabled="arPageNow() <= 1" x-on:click="arGoto(arPageNow()-1)">이전</button>
                <span class="meta tnum" x-text="arPageNow() + ' / ' + arPages() + ' 페이지 · 전체 ' + arView().length + '건'"></span>
                <button type="button" class="ds-btn ds-btn--outline ds-btn--c-ghost ds-btn--s-sm" x-bind:disabled="arPageNow() >= arPages()" x-on:click="arGoto(arPageNow()+1)">다음</button>
              </div>
              <div class="flexrow" style="align-items:center;gap:10px;flex-wrap:wrap">
                <span class="meta"><b class="tnum text-ink" x-text="arDoneN()"></b> / <span class="tnum" x-text="arItems.length"></span>건 확정</span>
                <span class="ds-badge ds-badge--status">확정은 평소 검수와 같은 경로(사람 행위) · 자동 반영 없음</span>
              </div>
              <div class="ar-legend">
                <span><i style="background:var(--ds-success)"></i> 확정 완료</span>
                <span><i style="background:var(--ds-primary);opacity:.55"></i> 초안 대기(확정 전)</span>
                <span><i style="background:var(--ds-warning)"></i> 저확신 · 꼭 직접 확인</span>
                <span><i style="background:var(--ds-hairline)"></i> 아직 미채점</span>
              </div>
            </div>

            <!-- 초안 없음: 첫 실행 유도 -->
            <div x-show="!arItems.length && !arRunning" x-cloak class="text-muted" style="font-size:13px;padding:6px 2px">
              아직 저장된 초안이 없습니다 · 위 <b class="text-ink">AI 초안 판정 실행</b>을 누르면 내 배정 콘텐츠를 채워 여기에 상시로 쌓입니다.
            </div>

           </div>
          </div>
        </section>

        </div>
      </template>
