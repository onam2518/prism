      <!-- ═══ 검수 보조(트랙 A · 내부 검수 보조) ═══════════════════════════════
           검수 상세 우측(검수 판정 바로 위)에 붙는 접이식 패널. 동작·상태는
           vendor/app-17-assist.js · 서버 계약은 POST /assist {tool,args}.

           마크업이 여기 따로 있고 화면에는 텔레포트로 꽂는 이유: 검수 상세 마크업은
           20-ingest-policy.html 꼬리(=Alpine x-data 루트를 닫는 조각)에 있어 여러 세션이
           가장 자주 부딪히는 자리다. 그 파일에는 자리표(#asxSlot) 한 줄만 두고 본문은
           이 조각에 모아 둔다(같은 기법: page.py 의 모델 선택 메뉴 x-teleport).

           독립성 원칙(훼손 금지)
           · 판정 전: 3줄 요약 · 모델 판정 근거 · 이 콘텐츠에 걸린 분류 기준.
           · 판정 후: 위 + 선례 + 다른 검수자 의견 + 비슷한 교정 사례.
             선례와 다른 검수자 의견은 남이 내린 판정이라 판정 전에는 x-if 로 **그리지 않는다**
             (숨기는 게 아니다 · 호출도 하지 않는다). 먼저 보면 그 값이 기준점이 되고,
             검수자끼리의 일치도로 계산하는 신뢰도 지표가 조용히 부푼다.
           · 골드 문항도 패널이 똑같이 붙는다 — 패널이 사라지면 그게 골드 신호가 된다.
           · **콘텐츠 해시로 서버가 만든 텍스트는 그리지 않는다.** 골드는 큐가 등급을 뒤집어
             보여주므로(reviewops._inject_gold) 서버가 저장된 참값으로 만든 요약을 그리면
             화면과 어긋나고, 그 어긋남만으로 뒤집힌 문항이 드러난다. 요약은 화면 값으로,
             기준은 공용 사전으로 만든다(둘 다 골드든 아니든 같은 경로).
           · 섹션 뼈대는 자료 유무와 무관하게 고정이다(빈 상태 문구로 자리를 지킨다).
             섹션이 있다 없다 하면 그 자체가 콘텐츠에 대한 힌트가 된다. -->
      <template x-teleport="#asxSlot">
        <div class="dve__sec asx" x-show="asxAvail()" x-cloak x-effect="asxWatch()">
          <div class="flexrow" style="align-items:center;gap:8px;flex-wrap:wrap">
            <button type="button" class="copybtn" x-on:click="asxToggle()"
                    x-bind:aria-expanded="asxOpen ? 'true' : 'false'"
                    data-tip="검수를 대신하지 않습니다 · 판정 전에는 이 콘텐츠에서 나오는 것만 보이고, 남이 내린 판정과 수정 제안은 판정을 낸 뒤에 나옵니다" data-tip-pos="top"
                    x-text="asxOpen ? '검수 보조 닫기' : '검수 보조 열기'"></button>
            <span class="text-xs text-muted" x-show="asxOpen && asxBusy">불러오는 중…</span>
            <!-- 배지는 '지금 이 패널이 그리고 있는 단계'를 말한다(그리기 기준 = asxAfter).
                 서버가 다르게 처리했으면 아래 어긋남 안내가 따로 뜬다. -->
            <span class="ds-badge ds-badge--neutral" x-show="asxOpen && !asxBusy && !asxOff && !asxAfter()"
                  style="cursor:help" data-tip="아직 판정을 내지 않았습니다 · 이 콘텐츠에서 나오는 근거와 기준만 보여 드립니다" data-tip-pos="top">판정 전 · 근거와 기준</span>
            <span class="ds-badge ds-badge--success" x-show="asxOpen && !asxBusy && !asxOff && asxAfter()"
                  style="cursor:help" data-tip="판정을 낸 뒤라 선례와 다른 검수자 의견, 비슷한 교정 사례까지 함께 보여 드립니다" data-tip-pos="top">판정 후 · 선례와 사례 포함</span>
          </div>

          <div class="asx__body" x-show="asxOpen" x-cloak>
            <!-- 백엔드 미제공(404): 조용히 비활성 · 검수 흐름에 끼어들지 않는다 -->
            <div class="text-xs text-muted" x-show="asxOff">검수 보조는 아직 준비 중입니다 · 검수는 그대로 진행하시면 됩니다</div>
            <div class="text-xs" style="color:var(--ds-error)" x-show="!asxOff && asxErr" x-text="asxErr"></div>

            <template x-if="!asxOff && !asxErr">
              <div>
                <!-- 보낸 stage 와 서버가 처리한 stage 가 어긋나면 알린다.
                     조용히 before 로 떨어지면 검수자는 '제안이 없다'로 잘못 읽는다. -->
                <div class="text-xs" style="color:var(--ds-error);padding:8px 0" x-show="asxStageEcho()"
                     x-text="'요청한 단계 ' + asxStageLabel(asxSent) + ' · 서버가 처리한 단계 ' + asxStageLabel(asxStageEcho()) + ' · 아래 내용은 서버가 처리한 단계 기준입니다'"></div>

                <!-- 3줄 요약: 화면에 그려진 값으로 조립한다(서버가 해시로 만든 요약을 쓰지 않는다).
                     골드 문항은 큐가 등급을 뒤집어 보여주므로 서버 요약과 화면이 어긋나고,
                     그 어긋남만으로 뒤집힌 문항을 골라낼 수 있다(= 정답 유출). -->
                <div class="asx__sec">
                  <div class="dve__lbl">3줄 요약</div>
                  <ul class="ds-bullets" x-show="asxSummary().length">
                    <template x-for="(s, si) in asxSummary()" x-bind:key="'asxsum'+si"><li x-text="s"></li></template>
                  </ul>
                  <div class="text-xs text-muted" x-show="!asxSummary().length">요약 없음</div>
                </div>

                <!-- 모델 판정 근거: 근거 필드 신설 이전 데이터는 실제로 비어 있다.
                     없으면 없다고 그대로 쓴다(빈 자리를 지어내지 않는다). -->
                <div class="asx__sec">
                  <div class="dve__lbl">모델 판정 근거</div>
                  <div class="tbox" x-show="asxBrief && asxBrief.has_evidence" x-text="asxBrief ? asxBrief.evidence : ''"></div>
                  <div class="text-xs text-muted" x-show="!(asxBrief && asxBrief.has_evidence)">저장된 근거 없음</div>
                </div>

                <!-- 이 콘텐츠에 걸린 분류 기준: 정의문 원천은 /dict(서버 도구 get_taxonomy 와 동일).
                     고르는 기준도 화면에 그려진 인텐트·품질 사유라 콘텐츠 해시가 서버로 가지 않는다. -->
                <div class="asx__sec">
                  <div class="dve__lbl">이 콘텐츠에 걸린 분류 기준</div>
                  <template x-for="c in asxCriteria()" x-bind:key="'asxcri'+c.key">
                    <div class="asx__kv"><span class="asx__k" x-text="c.key"></span><span class="asx__v" x-text="c.desc"></span></div>
                  </template>
                  <div class="text-xs text-muted" x-show="!asxCriteria().length">기준 없음</div>
                </div>

                <!-- ── 여기부터는 판정을 낸 뒤에만 그린다(x-show 가 아니라 x-if = DOM 에 없다) ── -->
                <template x-if="asxAfter()">
                  <div>
                    <!-- 선례: 확정된 비슷한 판정 · 몇 사람이 그렇게 봤는지가 무게를 다는 근거다 -->
                    <div class="asx__sec">
                      <div class="dve__lbl">선례</div>
                      <template x-for="(p, pi) in asxPrecItems()" x-bind:key="'asxprec'+pi+(p.hash||'')">
                        <div class="asx__row">
                          <div class="asx__row-hd">
                            <span class="ds-badge" x-bind:class="asxVerdictClass(p.verdict)" x-text="asxVerdictLabel(p.verdict)"></span>
                            <span class="ds-badge ds-badge--neutral" x-show="asxWho(p.n)" x-text="asxWho(p.n)"></span>
                            <!-- 제목·사유는 비어 올 수 있다. 선례가 정답셋 원본이면 서버가 식별자를
                                 지운다(hash·title·reason) — 검수자가 큐의 골드 문항과 제목을 이어
                                 붙이면 답을 알게 되기 때문. 빈 자리를 '(제목 없음)' 같은 문구로 채우면
                                 고장처럼 읽히므로 그냥 그리지 않는다. 판단 재료는 아래 '비슷한 이유'다. -->
                            <b class="asx__ttl" x-show="p.title" x-text="p.title"></b>
                            <span class="text-xs text-muted tnum" x-show="p.ts" x-text="fmtTs(p.ts)"></span>
                          </div>
                          <div class="text-xs text-muted" x-show="p.reason" x-text="p.reason"></div>
                          <div class="text-xs" style="color:var(--ds-placeholder)" x-show="p.why_similar" x-text="'비슷한 이유 · ' + p.why_similar"></div>
                        </div>
                      </template>
                      <div class="text-xs text-muted" x-show="!asxPrecItems().length">선례 없음</div>
                      <!-- 잘렸으면 잘렸다고 쓴다 · 조용히 자르면 '다 봤다'로 읽힌다 -->
                      <span class="ds-badge ds-badge--warning" x-show="asxCut(asxPrec)" x-text="asxCut(asxPrec)"></span>
                    </div>

                    <!-- ── 여기부터 섹션 하나는 통째로 떼어 쓸 수 있게 둔다 ──────────────
                         다음 단계에서 이 패널이 대화창이 되고 이 섹션은 말풍선 하나가 된다.
                         그래서 바깥 상태(asxOpen·asxAfter 같은 것)를 안에서 읽지 않는다 —
                         asxDisLines()·asxDisN()·asxDisCut()·asxDis.split 넷만 쓰면 그려진다. -->
                    <!-- 다른 검수자 의견: 사람별 나열이 아니라 3줄 요약(위 '3줄 요약'과 같은 리듬).
                         사람 이름과 사유 원문을 사람 수만큼 그리면 읽는 데 시간이 걸리고 특정
                         사람의 문장에 판단이 끌려간다. 서버가 조립한 줄을 그대로 쓰고 화면이
                         다시 가공하지 않는다. 이름·사유는 응답에서 빠지지만 남아 와도 그리지 않는다.
                         대신 몇 명 것을 모았는지는 남긴다 — 무게를 가늠할 근거까지 사라지면 안 된다. -->
                    <div class="asx__sec">
                      <div class="dve__lbl">다른 검수자 의견
                        <span class="ds-badge ds-badge--reason" x-show="asxDis && asxDis.split" style="margin-left:4px">의견 갈림</span></div>
                      <ul class="ds-bullets" x-show="asxDisLines().length">
                        <template x-for="(s, di) in asxDisLines()" x-bind:key="'asxdis'+di"><li x-text="s"></li></template>
                      </ul>
                      <div class="text-xs text-muted" style="margin-top:4px" x-show="asxDisLines().length && asxDisN()" x-text="asxDisN() + '명 의견을 모았습니다'"></div>
                      <div class="text-xs text-muted" x-show="!asxDisLines().length">다른 의견 없음</div>
                      <span class="ds-badge ds-badge--warning" x-show="asxDisCut()" x-text="asxDisCut()"></span>
                    </div>

                    <!-- 수정 제안: 같은 값을 같게 고친 과거 교정을 센 것이다. 권장도 정답도 아니라서
                         강조하지 않는다 — 건수를 그대로 보여 주고 판단은 검수자가 한다. -->
                    <div class="asx__sec" x-show="asxSuggestOn()">
                      <div class="dve__lbl">비슷한 교정 사례</div>
                      <template x-for="(s, gi) in asxSuggest()" x-bind:key="'asxsug'+gi">
                        <div class="asx__row">
                          <div class="asx__row-hd"><b class="asx__ttl" x-text="s.field"></b></div>
                          <div class="text-xs"><span class="asx__from" x-text="s.from || '(비어 있음)'"></span> → <span class="asx__to" x-text="s.to"></span></div>
                          <div class="text-xs text-muted" x-show="s.basis" x-text="s.basis"></div>
                        </div>
                      </template>
                      <div class="text-xs text-muted" x-show="!asxSuggest().length">비슷한 교정 사례 없음 · 같은 교정이 2건 이상 쌓인 필드만 올라옵니다</div>
                    </div>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </div>
      </template>
