      <!-- ═══ 검수 보조(트랙 A · 내부 검수 보조) ═══════════════════════════════
           검수 상세 우측(검수 판정 바로 위)에 붙는 접이식 패널. 동작·상태는
           vendor/app-17-assist.js · 서버 계약은 POST /assist {tool,args}.

           마크업이 여기 따로 있고 화면에는 텔레포트로 꽂는 이유: 검수 상세 마크업은
           20-ingest-policy.html 꼬리(=Alpine x-data 루트를 닫는 조각)에 있어 여러 세션이
           가장 자주 부딪히는 자리다. 그 파일에는 자리표(#asxSlot) 한 줄만 두고 본문은
           이 조각에 모아 둔다(같은 기법: page.py 의 모델 선택 메뉴 x-teleport).

           독립성 원칙(훼손 금지): 판정 전에는 근거와 기준만 보인다. 추천·수정 제안은
           검수자가 판정을 낸 뒤에만 나타난다. 골드 문항에는 패널 자체가 붙지 않는다.
           보조를 켜지 않아도 검수는 그대로 된다 — 기본은 접힘이고 펼 때만 호출한다. -->
      <template x-teleport="#asxSlot">
        <div class="dve__sec asx" x-show="asxAvail()" x-cloak x-effect="asxWatch()">
          <div class="flexrow" style="align-items:center;gap:8px;flex-wrap:wrap">
            <button type="button" class="copybtn" x-on:click="asxToggle()"
                    x-bind:aria-expanded="asxOpen ? 'true' : 'false'"
                    data-tip="검수를 대신하지 않습니다 · 판정 전에는 근거와 기준만 보이고, 수정 제안은 판정을 낸 뒤에 나옵니다" data-tip-pos="top"
                    x-text="asxOpen ? '검수 보조 닫기' : '검수 보조 열기'"></button>
            <span class="text-xs text-muted" x-show="asxOpen && asxBusy">불러오는 중…</span>
            <span class="ds-badge ds-badge--neutral" x-show="asxOpen && !asxBusy && !asxOff && asxStage()==='before'"
                  style="cursor:help" data-tip="아직 판정을 내지 않았습니다 · 근거와 기준만 보여 드립니다" data-tip-pos="top">판정 전 · 근거와 기준</span>
            <span class="ds-badge ds-badge--success" x-show="asxOpen && !asxBusy && !asxOff && asxStage()==='after'"
                  style="cursor:help" data-tip="판정을 낸 뒤라 수정 제안까지 함께 보여 드립니다" data-tip-pos="top">판정 후 · 수정 제안 포함</span>
          </div>

          <div class="asx__body" x-show="asxOpen" x-cloak>
            <!-- 백엔드 미제공(404): 조용히 비활성 · 검수 흐름에 끼어들지 않는다 -->
            <div class="text-xs text-muted" x-show="asxOff">검수 보조는 아직 준비 중입니다 · 검수는 그대로 진행하시면 됩니다</div>
            <div class="text-xs" style="color:var(--ds-error)" x-show="!asxOff && asxErr" x-text="asxErr"></div>

            <template x-if="!asxOff && !asxErr">
              <div>
                <!-- 3줄 요약 -->
                <div class="asx__sec">
                  <div class="dve__lbl">3줄 요약</div>
                  <ul class="ds-bullets" x-show="asxSummary().length">
                    <template x-for="(s, si) in asxSummary()" x-bind:key="'asxsum'+si"><li x-text="s"></li></template>
                  </ul>
                  <div class="text-xs text-muted" x-show="!asxSummary().length">요약 없음</div>
                </div>

                <!-- 모델 판정 근거: 근거 필드 신설 이전 데이터는 실제로 비어 있다.
                     없으면 없다고 그대로 쓴다(빈 자리를 지어내지 않는다). -->
                <div class="asx__sec">
                  <div class="dve__lbl">모델 판정 근거</div>
                  <div class="tbox" x-show="asxBrief && asxBrief.has_evidence" x-text="asxBrief ? asxBrief.evidence : ''"></div>
                  <div class="text-xs text-muted" x-show="asxBrief && !asxBrief.has_evidence">저장된 근거 없음</div>
                </div>

                <!-- 초안 값: 도구가 준 필드값 묶음을 그대로 편다(화면이 해석해 꾸미지 않는다) -->
                <div class="asx__sec" x-show="asxValues().length" x-cloak>
                  <div class="dve__lbl">초안 값</div>
                  <template x-for="row in asxValues()" x-bind:key="'asxval'+row.k">
                    <div class="asx__kv"><span class="asx__k" x-text="row.k"></span><span class="asx__v" x-text="row.v || '·'"></span></div>
                  </template>
                </div>

                <!-- 이 서비스의 분류 기준 -->
                <div class="asx__sec">
                  <div class="dve__lbl">이 서비스의 분류 기준</div>
                  <template x-for="c in asxCriteria()" x-bind:key="'asxcri'+c.key">
                    <div class="asx__kv"><span class="asx__k" x-text="c.key"></span><span class="asx__v" x-text="c.desc"></span></div>
                  </template>
                  <div class="text-xs text-muted" x-show="!asxCriteria().length">기준 없음</div>
                </div>

                <!-- 선례: 비슷한 콘텐츠에 이미 내려진 판정 -->
                <div class="asx__sec">
                  <div class="dve__lbl">선례</div>
                  <div class="text-xs text-muted" style="margin-bottom:6px" x-show="asxStage()==='before' && asxPrecItems().length">남이 내린 판정입니다 · 내 판단을 먼저 정한 뒤 참고하세요</div>
                  <template x-for="(p, pi) in asxPrecItems()" x-bind:key="'asxprec'+pi+(p.hash||'')">
                    <div class="asx__row">
                      <div class="asx__row-hd">
                        <span class="ds-badge" x-bind:class="asxVerdictClass(p.verdict)" x-text="asxVerdictLabel(p.verdict)"></span>
                        <b class="asx__ttl" x-text="p.title || '(제목 없음)'"></b>
                        <span class="text-xs text-muted tnum" x-show="p.ts" x-text="fmtTs(p.ts)"></span>
                      </div>
                      <div class="text-xs text-muted" x-show="p.reason" x-text="p.reason"></div>
                      <div class="text-xs" style="color:var(--ds-placeholder)" x-show="p.why_similar" x-text="'비슷한 이유 · ' + p.why_similar"></div>
                    </div>
                  </template>
                  <div class="text-xs text-muted" x-show="!asxPrecItems().length">선례 없음</div>
                  <!-- 잘렸으면 잘렸다고 쓴다 · 조용히 자르면 '다 봤다'로 읽힌다 -->
                  <span class="ds-badge ds-badge--warning" x-show="asxCut(asxPrec)" x-text="asxCut(asxPrec)"></span>
                </div>

                <!-- 다른 검수자 의견 -->
                <div class="asx__sec">
                  <div class="dve__lbl">다른 검수자 의견
                    <span class="ds-badge ds-badge--reason" x-show="asxDis && asxDis.split" style="margin-left:4px">의견 갈림</span></div>
                  <template x-for="(v, vi) in asxDisItems()" x-bind:key="'asxdis'+vi">
                    <div class="asx__row">
                      <div class="asx__row-hd">
                        <span class="ds-badge" x-bind:class="asxVerdictClass(v.verdict)" x-text="asxVerdictLabel(v.verdict)"></span>
                        <b class="asx__ttl" x-text="v.reviewer || '(이름 없음)'"></b>
                        <span class="text-xs text-muted tnum" x-show="v.ts" x-text="fmtTs(v.ts)"></span>
                      </div>
                      <div class="text-xs text-muted" x-show="v.reason" x-text="v.reason"></div>
                    </div>
                  </template>
                  <div class="text-xs text-muted" x-show="!asxDisItems().length">다른 의견 없음</div>
                </div>

                <!-- 수정 제안: 판정을 낸 뒤에만 · 서버도 stage=after 에만 싣고 화면도 한 번 더 막는다 -->
                <div class="asx__sec" x-show="asxStage()==='after'" x-cloak>
                  <div class="dve__lbl">수정 제안 <span class="text-xs text-muted" style="font-weight:400">· 판정을 낸 뒤에만 보입니다</span></div>
                  <template x-for="(s, gi) in asxSuggest()" x-bind:key="'asxsug'+gi">
                    <div class="asx__row">
                      <div class="asx__row-hd"><b class="asx__ttl" x-text="s.field"></b></div>
                      <div class="text-xs"><span class="asx__from" x-text="s.from || '(비어 있음)'"></span> → <span class="asx__to" x-text="s.to"></span></div>
                      <div class="text-xs text-muted" x-show="s.basis" x-text="'근거 · ' + s.basis"></div>
                    </div>
                  </template>
                  <div class="text-xs text-muted" x-show="!asxSuggest().length">수정 제안 없음</div>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>
