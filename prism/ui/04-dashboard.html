      <!-- ═══ 모듈: 콘텐츠 관리 · STEP 2 모델 실행(처리 대기) ═══ -->
      <template x-if="mod === 'content'">
        <div class="w-full" style="margin:18px 0 12px">
        <div class="stepline"><span class="stepline__no">STEP 2</span><b>모델 실행</b><span class="meta">모은 콘텐츠에 모델을 실행해 초안을 만듭니다</span></div>
      </div>
      </template>
      <template x-if="mod === 'content'">
        <div class="w-full space-y-4">
        <ul class="ds-bullets hintbox" style="padding:14px 16px">
          <li>추가된 콘텐츠(자동·수동 불문)에 <b>모델을 실행</b>해 검수용 초안을 만듭니다(수동 실행).</li>
          <li>실행 결과는 버전 <b class="text-ink tnum" x-text="verTxt"></b> 로 기록됩니다(버전 = 학습 반영 회차 + 1).</li>
        </ul>
        <!-- 사용 모델: 리드문·메타 추출과 단건·일괄 실행의 기본값(제공자 불문 전 모델 노출) -->
        <section class="panel" data-fn><div class="panel-hd"><b>사용 모델</b><span class="meta">기본 실행 모델 · 리드문·메타 추출과 실행의 기본값</span></div>
          <div class="panel-bd">
            <div class="filterbar" style="margin:0">
              <span class="selctl"><span class="selctl__lbl">사용 모델</span>
                <x-modelpick key="text" value="textValue" set="onTextPick($v)" groups="textGroups" width="264px" tip="모델을 지정하지 않은 실행에 쓰이는 기본 모델 · 미연결 제공자 모델은 키 등록 후 선택 가능"></x-modelpick></span>
              <button type="button" class="srcfilter__chip" x-bind:class="bulkScope==='pending' ? 'sel' : ''" x-on:click="bulkScope='pending'" x-text="'미실행만 (' + pendingCount + '건)'"></button>
              <button type="button" class="srcfilter__chip" x-bind:class="bulkScope==='all' ? 'sel' : ''" x-bind:disabled="questActive" x-bind:style="questActive ? 'opacity:.45;cursor:not-allowed' : ''" x-on:click="!questActive && (bulkScope='all')" x-bind:data-tip="questActive ? '퀘스트 진행 중에는 전체 재실행이 차단됩니다(검수 중 초안 교체 방지) · 반영 후 가능' : null" data-tip-pos="top" x-text="'전체 재실행 (' + contentsCount + '건)'"></button>
              <button type="button" class="ds-btn ds-btn--primary ds-btn--s-md" x-bind:disabled="bulkBusy || (bulkScope==='pending' && !pendingCount)" x-on:click="runBulk()" x-text="bulkBusy ? '실행 중…' : ('실행 (' + (bulkScope==='pending' ? pendingCount : contentsCount) + '건)')"></button>
              <span class="text-xs text-muted" x-text="bulkMsg || modelsMsg"></span>
            </div>
            <ul class="ds-bullets" style="margin:10px 0 0"><li><b>미실행만</b> = 추가만 된 콘텐츠(기본) · <b>전체 재실행</b> = 기존 초안을 이력에 남기고 덮어씁니다 · 건당 비용 발생 · 진행은 STEP 3 실행 큐.</li></ul>
          </div>
        </section>
        <!-- 처리 대기 화면: Processing(캐릭터) + Steps (디자인 시스템) -->
        <div x-show="bulkBusy" x-cloak class="ds-pilot mt-6 panel" style="border-color:var(--ds-hairline)">
          <div class="panel-bd">
            <!-- Processing -->
            <div class="ds-processing">
              <span class="ds-processing__char"><span class="ds-character ds-character--bob" style="width:96px;height:96px"><img src="/vendor/yonghee-pitcher.svg" alt="용희 (투수)"></span></span>
              <div>
                <div class="ds-processing__title">일괄 실행 중</div>
                <div class="ds-processing__msg"><span class="ds-processing__dots">콘텐츠마다 초안을 만들고 있어요 · 진행률은 STEP 3 실행 큐</span></div>
              </div>
              <div style="width:100%;max-width:340px">
                <div class="ds-progress ds-progress--indeterminate"><div class="ds-progress__track" role="progressbar"><div class="ds-progress__fill ds-progress__fill--primary"></div></div></div>
              </div>
            </div>
            <!-- Steps -->
            <div class="ds-steps mt-5" style="max-width:420px">
              <div class="ds-step ds-step--done"><div class="ds-step__rail"><span class="ds-step__marker"><svg class="ds-step__check" viewBox="0 0 12 12" fill="none"><path d="M2.5 6.2 5 8.5 9.5 3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="ds-step__line"></span></div><div class="ds-step__body"><div class="ds-step__title">입력 수집</div><div class="ds-step__detail">대상 콘텐츠 선별</div></div></div>
              <div class="ds-step ds-step--done"><div class="ds-step__rail"><span class="ds-step__marker"></span><span class="ds-step__line"></span></div><div class="ds-step__body"><div class="ds-step__title">이미지 이해</div><div class="ds-step__detail">텍스트는 건너뜀</div></div></div>
              <div class="ds-step ds-step--active"><div class="ds-step__rail"><span class="ds-step__marker"></span><span class="ds-step__line"></span></div><div class="ds-step__body"><div class="ds-step__title">메타 추출</div><div class="ds-step__detail">리드문 · 엔티티 · 인텐트 · 카테고리</div></div></div>
              <div class="ds-step ds-step--pending"><div class="ds-step__rail"><span class="ds-step__marker"></span><span class="ds-step__line"></span></div><div class="ds-step__body"><div class="ds-step__title">품질 판정</div><div class="ds-step__detail">G / R</div></div></div>
              <div class="ds-step ds-step--pending"><div class="ds-step__rail"><span class="ds-step__marker"></span></div><div class="ds-step__body"><div class="ds-step__title">완료</div></div></div>
            </div>
          </div>
        </div>


      </div>
      </template>
