<template x-if="mod === 'lab'">
  <div x-init="cmInit()" x-show="labTab === 'cleanmeta'" x-cloak class="w-full dc-body">
    <section class="panel">
      <div class="panel-hd"><b>클린메타</b><span class="meta">공통 기준을 선별하고 사실·맥락·근거를 확인하는 실험</span><span class="ds-badge ds-badge--neutral ml-auto">운영자 전용</span></div>
      <div class="panel-bd dc-body">
        <ul class="ds-bullets">
          <li>전사 공통 초안은 <b>15개 정책군</b>을 확인하고, 회사 공통·법령·연령·서비스 결과를 구분합니다</li>
          <li><b>1차 선별 → 필요한 상세 확인 → 규칙 적용</b> 순서입니다<ul><li>1차는 21문항이며 100문항을 넘는 단계는 나누어 요청합니다</li><li>미검사 매체는 따로 표시하며 실제 제재에는 연결하지 않습니다</li></ul></li>
        </ul>
      </div>
    </section>
    <div class="stepline"><span class="stepline__no">STEP 1</span><b>테스트 방식·모델</b><span class="meta">검사 기준과 실행 방식을 선택합니다</span></div>
    <section class="panel"><div class="panel-bd dc-body">
      <fieldset class="dc-body min-w-0" style="border:0;padding:0;margin:0" x-bind:disabled="cmBusy"><legend class="sr-only">테스트 설정</legend>
        <div class="control-row"><label class="selctl"><span class="selctl__lbl">검사 기준</span><select id="cm-policy" class="field" x-model="cmPolicySet" x-on:change="cmResult=null"><option value="common_v1">전사 공통 정책 초안</option><option value="vl13">기존 VL-01~13 실험 · 88문항</option></select></label></div>
        <div class="ds-segmented flex-wrap" role="group" aria-label="실행 방식">
          <button type="button" class="ds-segmented__item" x-bind:aria-pressed="cmMode==='cascade'" x-on:click="cmMode='cascade'">선별 후 상세</button>
          <button type="button" class="ds-segmented__item" x-bind:aria-pressed="cmMode==='all'" x-on:click="cmMode='all'">전체 질문</button>
          <button type="button" class="ds-segmented__item" x-bind:aria-pressed="cmMode==='compare'" x-on:click="cmMode='compare'">두 방식 비교</button>
        </div>
        <p class="ds-hint" x-text="cmMode==='compare' ? '같은 원문·모델·프롬프트로 전체 질문과 선별 방식을 각각 실행합니다.' : cmMode==='all' ? '선별 여부와 관계없이 모든 질문을 확인합니다.' : '관련 신호가 있거나 판단이 불명확한 정책군을 상세 확인합니다.'"></p>
        <div class="overflow-auto"><table class="ds-table ds-table--compact w-full"><thead><tr><th scope="col">설정 항목</th><th scope="col">적용 값</th></tr></thead><tbody>
          <tr><th scope="row">실행 모델</th><td><div class="control-row"><x-modelpick key="cm" value="cmModel" set="cmModel=$v" options="cmModels" width="280px" tip="솔라 디사이드 또는 연결된 텍스트 모델 · 두 단계에 동일 모델 적용"></x-modelpick></div><p class="ds-hint" x-text="cmModel === 'solar-decide' ? '솔라 디사이드의 JEV 선택 확률을 사용합니다.' : '텍스트 모델의 자기보고 점수이며 JEV 확률과 직접 비교할 수 없습니다.'"></p></td></tr>
          <tr><th scope="row"><label for="cm-gate">선택 점수 기준</label></th><td><div class="control-row"><input id="cm-gate" class="field dc-num" type="number" min="0.5" max="0.99" step="0.01" x-model="cmGate"><span class="meta">실험값 · 운영 기준과 별도</span></div></td></tr>
          <tr><th scope="row"><label for="cm-price">입력 단가 · 선택</label></th><td><div class="control-row"><input id="cm-price" class="field dc-num" type="number" min="0" max="1000" step="any" x-model="cmPrice" placeholder="계약 단가"><span class="meta">$ / 100만 토큰</span></div></td></tr>
        </tbody></table></div>
        <ul class="ds-bullets"><li>전사 공통 기준은 필수 고위험 신호와 검수 확인값도 상세 검사에 반영합니다</li><li>요청 수와 문항 수를 함께 비교하며, 단가 입력 시 입력 토큰 비용만 추산합니다</li></ul>
      </fieldset>
    </div></section>
    <template x-if="cmPolicySet === 'common_v1'"><div class="dc-body">
      <div class="stepline"><span class="stepline__no">STEP 2</span><b>단계별 프롬프트</b><span class="meta">이번 실험에 적용할 지침을 확인합니다</span></div>
      <div class="layout-grid--two">
        <section class="panel"><div class="panel-hd"><b>1차 공통 선별</b><span class="ds-badge ml-auto" x-bind:class="cmDefaults && cmScreenPrompt !== cmDefaults.prompts.screen ? 'ds-badge--warning' : 'ds-badge--neutral'" x-text="cmDefaults && cmScreenPrompt !== cmDefaults.prompts.screen ? '수정한 프롬프트' : '기본 프롬프트'"></span></div>
          <div class="panel-bd dc-body"><div><label class="ds-label" for="cm-screen-prompt">1차 공통 선별 프롬프트</label><textarea id="cm-screen-prompt" class="field" rows="14" maxlength="8000" x-model="cmScreenPrompt" x-bind:disabled="cmBusy || !cmDefaults"></textarea><p class="ds-hint tnum" x-text="cmScreenPrompt.length + '자 · 8,000자 이하'"></p></div>
          <div class="control-row"><button type="button" class="ds-btn ds-btn--ghost ds-btn--s-sm" x-on:click="cmResetPrompt('screen')" x-bind:disabled="cmBusy || !cmDefaults">기본 프롬프트로 되돌리기</button></div></div>
        </section>
        <section class="panel"><div class="panel-hd"><b>2차 상세·근거 확인</b><span class="ds-badge ml-auto" x-bind:class="cmDefaults && cmDetailPrompt !== cmDefaults.prompts.detail ? 'ds-badge--warning' : 'ds-badge--neutral'" x-text="cmDefaults && cmDetailPrompt !== cmDefaults.prompts.detail ? '수정한 프롬프트' : '기본 프롬프트'"></span></div>
          <div class="panel-bd dc-body"><div><label class="ds-label" for="cm-detail-prompt">2차 상세·근거 확인 프롬프트</label><textarea id="cm-detail-prompt" class="field" rows="14" maxlength="8000" x-model="cmDetailPrompt" x-bind:disabled="cmBusy || !cmDefaults"></textarea><p class="ds-hint tnum" x-text="cmDetailPrompt.length + '자 · 8,000자 이하'"></p></div>
          <div class="control-row"><button type="button" class="ds-btn ds-btn--ghost ds-btn--s-sm" x-on:click="cmResetPrompt('detail')" x-bind:disabled="cmBusy || !cmDefaults">기본 프롬프트로 되돌리기</button></div></div>
        </section>
      </div>
      <ul class="ds-bullets"><li>질문 항목·선택지·결과 검증·정책 규칙은 유지됩니다</li><li>수정한 프롬프트는 이번 실행에 적용하며 결과 JSON에 함께 기록합니다</li></ul>
      <p role="status" class="ds-hint" x-show="cmLoadingDefaults">기본 프롬프트를 불러오고 있습니다.</p><div x-show="!cmDefaults && !cmLoadingDefaults"><button type="button" class="ds-btn ds-btn--outline ds-btn--s-sm" x-on:click="cmInit()">기본값 다시 불러오기</button></div>
    </div></template>
    <div class="stepline"><span class="stepline__no" x-text="cmPolicySet === 'common_v1' ? 'STEP 3' : 'STEP 2'"></span><b>콘텐츠·확인 자료</b><span class="meta">제목·본문과 검사 범위를 입력합니다</span></div>
    <section class="panel"><div class="panel-bd dc-body"><fieldset class="dc-body min-w-0" style="border:0;padding:0;margin:0" x-bind:disabled="cmBusy"><legend class="sr-only">검사할 콘텐츠</legend>
          <div><label class="ds-label" for="cm-title">제목 (선택)</label><input id="cm-title" class="field" maxlength="500" x-model="cmTitle"></div>
          <div><label class="ds-label" for="cm-body">본문 · 최대 16,000자</label><textarea id="cm-body" class="field" rows="7" maxlength="16000" x-model="cmBody"></textarea><p class="ds-hint">입력한 본문 전체를 검사하며 요약하거나 앞부분만 자르지 않습니다.</p></div>
          <div><label class="ds-label" for="cm-context">확인 자료 (선택)</label><textarea id="cm-context" class="field" rows="3" maxlength="3000" x-model="cmContext" placeholder="게시 채널·동의·사실 확인·원저작물·권리·게시 이력·첨부물 확인 내용과 출처"></textarea><p class="ds-hint">자료가 없으면 공개 범위·동의 여부·진실·허위·이용 권리를 추정하지 않습니다.</p></div>
          <template x-if="cmPolicySet === 'common_v1'">
            <div class="dc-body">
              <div><label class="ds-label">텍스트 외에 포함된 부분</label><div class="dc-row"><template x-for="part in ['image','video','audio','link','history']" x-bind:key="part"><label><input type="checkbox" x-model="cmParts" x-bind:value="part"> <span x-text="cmPartLabel(part)"></span></label></template></div><p class="ds-hint">체크한 부분은 미검사로 기록합니다. 선택하지 않은 부분까지 검사했다고 가정하지 않습니다.</p></div>
              <details><summary>검수로 확인한 외부 사실</summary><div class="dc-body" >
                <p class="ds-hint">동의·연령·권리·진위는 위 자유 입력과 구분합니다. 실제 확인한 대상·사건과 출처를 적으세요. 출처를 자동 검증하는 기능은 없습니다.</p>
                <div><label class="ds-label" for="cm-case">확인 자료의 대상·사건</label><input id="cm-case" class="field" maxlength="300" x-model="cmCaseRef" placeholder="예: 본문의 대상 A와 게시물 X"></div>
                <template x-for="(fact,index) in cmFacts" x-bind:key="index"><div class="dc-body">
                  <div class="dc-row"><select aria-label="확인한 사실" class="field" x-model="fact.atom_id"><template x-for="option in (cmDefaults?.external_facts || [])" x-bind:key="option.id"><option x-bind:value="option.id" x-bind:selected="fact.atom_id === option.id" x-text="option.name"></option></template></select><select aria-label="확인 결과" class="field" x-model="fact.value"><option value="unknown">판단 불가</option><option value="present">존재 확인</option><option value="absent">부재 확인</option></select><button type="button" class="ds-btn ds-btn--s-sm" x-on:click="cmFacts.splice(index,1)">삭제</button></div>
                  <input aria-label="확인 자료 출처" class="field" maxlength="1000" x-model="fact.source" placeholder="확인한 문서·URL·검수 기록과 근거">
                </div></template>
                <div><button type="button" class="ds-btn ds-btn--s-sm" x-on:click="cmAddFact()" x-bind:disabled="!cmDefaults || cmFacts.length >= cmDefaults.external_facts.length">확인값 추가</button></div>
              </div></details>
            </div>
          </template>
    </fieldset></div></section>
    <div class="stepline"><span class="stepline__no" x-text="cmPolicySet === 'common_v1' ? 'STEP 4' : 'STEP 3'"></span><b>실행·결과 확인</b></div>
    <section class="panel"><div class="panel-bd dc-body">
      <div class="control-row"><button type="button" class="ds-btn ds-btn--solid ds-btn--c-primary" x-bind:disabled="cmBusy || cmLoadingDefaults || !cmBody.trim()" x-on:click="cmTry()" x-text="cmBusy ? '검사 중…' : cmMode === 'compare' ? '두 방식 비교 실행' : '검사 실행'"></button><span class="meta" x-text="cmMode === 'compare' ? '같은 콘텐츠로 두 방식 실행' : '콘텐츠 1건 검사'"></span></div>
      <p role="status" class="ds-hint" x-show="cmBusy">선택한 방식으로 검사 중입니다. 완료 후 실제 요청 수와 문항 수를 표시합니다.</p>
      <p role="alert" class="ds-hint ds-hint--error" x-show="cmError" x-text="cmError"></p>
      <ul class="ds-bullets" x-show="!cmResult && !cmBusy"><li>실행 결과에서 관찰값·정책별 후보·미검사 범위·사용한 프롬프트를 확인할 수 있습니다</li><li>현재 화면의 결과는 JSON으로 내려받을 수 있습니다</li></ul>
    </div></section>
    <template x-if="cmResult">
      <div class="dc-body">
        <section class="panel"><div class="panel-hd"><b>실행 결과</b><button type="button" class="ds-btn ds-btn--s-sm ml-auto" x-on:click="cmDownload()">결과 JSON 다운로드</button></div>
          <div class="panel-bd dc-body">
            <p class="ds-hint" x-text="'선택 모델: ' + cmResult.requested_model + ' · 연결: ' + cmResult.route + ' · 검사 유형 ' + cmResult.type_count + '종'"></p>
            <p class="ds-hint ds-hint--error" x-show="cmResult.mock">모의 응답입니다. 모델 성능 검증에 사용할 수 없습니다.</p>
            <p class="ds-hint" x-show="cmResult.engine === 'chat'">판단 점수는 텍스트 모델의 자기보고 값입니다. 실제 정확도나 보정된 확률을 뜻하지 않습니다.</p>
            <p class="ds-hint" x-text="cmResult.runs.length === 1 ? '선택한 방식의 실행 결과입니다.' : cmResult.disagreement ? '유형별 후보 불일치: ' + cmResult.differing_types.join(' · ') : '실행한 방식 사이에 유형별 후보 불일치가 없습니다.'"></p>
            <p class="ds-hint" x-show="!cmResult.model_consistent">응답 모델이 다르거나 모델 정보가 누락되었습니다. 같은 조건의 비교인지 확인하세요.</p>
            <div class="overflow-auto"><table class="ds-table ds-table--compact w-full"><thead><tr><th>방식</th><th>검사 상태</th><th>후보</th><th>요청</th><th>문항</th><th>입력 토큰</th><th>시간</th><th>입력 비용</th></tr></thead><tbody>
              <template x-for="run in cmResult.runs" x-bind:key="run.mode"><tr><td x-text="run.mode_label"></td><td x-text="cmLabel(run.status)"></td><td x-text="cmLabel(run.recommendation)"></td><td x-text="run.trace.requests + '회'"></td><td x-text="run.trace.questions + '개'"></td><td x-text="run.trace.input_tokens == null ? '미제공' : run.trace.input_tokens.toLocaleString()"></td><td x-text="(run.trace.latency_ms / 1000).toFixed(2) + '초'"></td><td x-text="run.trace.estimated_input_cost_usd == null ? '산정 안 함' : '$' + run.trace.estimated_input_cost_usd"></td></tr></template>
            </tbody></table></div>
            <p class="ds-hint">현재 화면에서만 결과를 보관합니다. JSON에는 원문 구간·확률 또는 판단 점수·선택 모델·요청 기록·입력 해시·버전이 포함됩니다. 정상 후보는 제공된 자료에서 검사한 범위의 결과입니다.</p>
          </div>
        </section>
        <template x-for="run in cmResult.runs" x-bind:key="run.mode">
          <section class="panel"><div class="panel-hd"><b x-text="run.mode_label"></b><span class="meta" x-text="run.calls.map(c => c.model || '모델 정보 없음').join(' · ')"></span></div>
            <div class="panel-bd dc-body">
              <div class="ds-stat-grid">
                <div class="ds-stat"><div class="ds-stat__value tnum" x-text="run.trace.requests+'회'"></div><div class="ds-stat__label">실제 모델 요청</div></div>
                <div class="ds-stat"><div class="ds-stat__value tnum" x-text="run.trace.questions+'개'"></div><div class="ds-stat__label">확인 문항</div></div>
                <div class="ds-stat"><div class="ds-stat__value tnum" x-text="(run.trace.latency_ms/1000).toFixed(2)+'초'"></div><div class="ds-stat__label">전체 처리 시간</div></div>
              </div>
              <template x-if="run.policy_set === 'common_v1'"><div class="dc-body">
                <div class="control-row"><b class="fn__title" x-text="cmLabel(run.common_status)"></b><span class="ds-badge ds-badge--neutral">실험 초안</span><span class="meta" x-text="run.policy_version"></span></div>
                <p class="ds-hint" x-text="'검사: ' + run.coverage.assessed_parts.map(p => cmPartLabel(p)).join(' · ') + ' / 미검사: ' + (run.coverage.missing_parts.map(p => cmPartLabel(p)).join(' · ') || '요청 범위 내 없음')"></p>
                <p class="ds-hint" x-text="run.coverage.scope"></p>
                <template x-for="layer in ['common','legal','age','service']" x-bind:key="layer"><details class="content-section" open><summary><b class="fn__title" x-text="cmLabel(layer)"></b><span class="meta" x-text="' · ' + cmPolicies(run,layer).length + '개 규칙'"></span></summary><div class="overflow-auto"><table class="ds-table ds-table--compact w-full"><thead><tr><th>정책</th><th>실험 결과</th><th>검토 후보</th><th>근거·부족 조건</th></tr></thead><tbody><template x-for="policy in cmPolicies(run,layer)" x-bind:key="policy.id"><tr><td x-text="policy.label"></td><td><span class="ds-badge" x-bind:class="policy.status === 'not_matched' ? 'ds-badge--neutral' : 'ds-badge--warning'" x-text="cmLabel(policy.status)"></span></td><td x-text="cmLabel(policy.action_candidate)"></td><td x-text="policy.reason"></td></tr></template></tbody></table></div></details></template>
                <details><summary>공통 관찰값과 원문 근거</summary><div class="overflow-auto"><table class="ds-table ds-table--compact w-full"><thead><tr><th>관찰 항목</th><th>값</th><th>근거·출처</th><th>확인 상태</th></tr></thead><tbody><template x-for="atom in run.observations" x-bind:key="atom.id"><tr><td x-text="atom.name"></td><td x-text="cmLabel(atom.value)"></td><td class="ds-code" x-text="atom.evidence ? (atom.evidence.text || atom.evidence.source || '') : '근거 미확인 또는 미요청'"></td><td x-text="atom.reason"></td></tr></template></tbody></table></div></details>
                <details><summary>실행한 프롬프트</summary><p class="ds-hint" x-text="run.custom_prompts ? '사용자 수정 프롬프트' : '기본 프롬프트'"></p><b>1차 공통 선별</b><pre class="ds-code" x-text="run.prompts.screen"></pre><b>2차 상세·근거 확인</b><pre class="ds-code" x-text="run.prompts.detail"></pre></details>
                <ul class="ds-bullets ds-hint--error"><template x-for="entry in Object.entries(run.errors)" x-bind:key="entry[0]"><li x-text="entry[0] + ': ' + entry[1]"></li></template></ul>
              </div></template>
              <template x-for="item in run.results" x-bind:key="item.type">
                <details><summary><b x-text="item.code + ' ' + item.name"></b> · <span x-text="cmLabel(item.recommendation)"></span> · <span x-text="cmLabel(item.detail_status)"></span></summary>
                  <div class="dc-body" >
                    <p x-text="item.route ? '선별: ' + item.route.label + ' · ' + cmScoreLabel(run) + ' ' + cmProbability(item.route.selected_probability) : '선별 응답 없음'"></p>
                    <ul class="ds-bullets"><template x-for="reason in item.reasons" x-bind:key="reason"><li x-text="reason"></li></template></ul>
                    <div class="overflow-auto"><table class="ds-table ds-table--compact w-full" x-show="item.details.length"><thead><tr><th>항목</th><th>선택 결과</th><th x-text="cmScoreLabel(run)"></th></tr></thead><tbody><template x-for="detail in item.details" x-bind:key="detail.id"><tr><td x-text="detail.name"></td><td x-text="detail.label"></td><td x-text="cmProbability(detail.selected_probability)"></td></tr></template></tbody></table></div>
                    <template x-if="item.evidence"><div class="hintbox"><b x-text="'근거 후보 · ' + item.evidence.id + ' · ' + (item.evidence.field === 'title' ? '제목' : '본문')"></b><p class="tbox" x-text="item.evidence.text"></p><p class="ds-hint">원문 구간의 일부입니다. 주변 문맥과 실제 관련성을 함께 확인하세요.</p></div></template>
                    <ul class="ds-bullets ds-hint--error"><template x-for="entry in Object.entries(item.errors)" x-bind:key="entry[0]"><li x-text="entry[0] + ': ' + entry[1]"></li></template></ul>
                  </div>
                </details>
              </template>
              <details><summary>요청 기록</summary><ul class="ds-bullets"><template x-for="call in run.calls" x-bind:key="call.stage + ':' + (call.batch || 1)"><li x-text="call.stage + ' · 배치 ' + (call.batch || 1) + ' · ' + call.questions + '문항 · ' + call.latency_ms + 'ms · ' + call.status"></li></template></ul></details>
            </div>
          </section>
        </template>
      </div>
    </template>
  </div>
</template>
