t-anchor="middle" dominant-baseline="central">사기·허위 정보</text><rect x="390" y="525" width="290" height="88" rx="12" fill="#eef5ff" stroke="#bdc9d8"/><text x="535.0" y="553.0" font-size="20" font-weight="400" text-anchor="middle" dominant-baseline="central">VL-10</text><text x="535.0" y="585.0" font-size="20" font-weight="400" text-anchor="middle" dominant-baseline="central">선거 관련 위반</text><rect x="720" y="525" width="290" height="88" rx="12" fill="#eef5ff" stroke="#bdc9d8"/><text x="865.0" y="553.0" font-size="20" font-weight="400" text-anchor="middle" dominant-baseline="central">VL-11</text><text x="865.0" y="585.0" font-size="20" font-weight="400" text-anchor="middle" dominant-baseline="central">기만적 광고</text><rect x="1050" y="525" width="290" height="88" rx="12" fill="#eef5ff" stroke="#bdc9d8"/><text x="1195.0" y="553.0" font-size="20" font-weight="400" text-anchor="middle" dominant-baseline="central">VL-12</text><text x="1195.0" y="585.0" font-size="20" font-weight="400" text-anchor="middle" dominant-baseline="central">사행성 조장</text><rect x="555" y="635" width="290" height="88" rx="12" fill="#eef5ff" stroke="#bdc9d8"/><text x="700.0" y="663.0" font-size="20" font-weight="400" text-anchor="middle" dominant-baseline="central">VL-13</text><text x="700.0" y="695.0" font-size="20" font-weight="400" text-anchor="middle" dominant-baseline="central">마약류·무기 제조 정보</text><polyline points="700.0,235 700.0,285" fill="none" stroke="#61758f" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="310" y="815" width="780" height="90" rx="12" fill="#e9f4ee" stroke="#bdc9d8"/><text x="700.0" y="843.0" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central">코드 검증 · 추가 모델 호출 없음</text><text x="700.0" y="877.0" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central">응답 형식·확률 또는 판단 점수·누락·충돌 확인</text><polyline points="700.0,755 700.0,815" fill="none" stroke="#61758f" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="80" y="965" width="