<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1060" viewBox="0 0 1400 1060"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#61758f"/></marker></defs><rect width="1400" height="1060" fill="white"/><g font-family="Apple SD Gothic Neo, sans-serif" fill="#172b4d"><text x="700.0" y="55.0" font-size="34" font-weight="700" text-anchor="middle" dominant-baseline="central">클린 메타 · 전사 공통 판단 단위</text><text x="700.0" y="105.0" font-size="19" font-weight="400" text-anchor="middle" dominant-baseline="central">텍스트 실험 · 관찰 사실과 정책 결과의 분리 · 동일 근거 재사용</text><rect x="300" y="150" width="800" height="80" rx="12" fill="#eaf1fb" stroke="#bdc9d8"/><text x="700.0" y="173.0" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central">제목·본문 텍스트 + 출처가 확인된 보조 자료</text><text x="700.0" y="207.0" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central">이미지·영상·음성 검증은 별도 API 체계</text><rect x="300" y="300" width="800" height="120" rx="12" fill="#eef5ff" stroke="#bdc9d8"/><text x="700.0" y="326.0" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central">공통 관찰값</text><text x="700.0" y="360.0" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central">텍스트에 무엇이 있는가 + 원문 구간 + 확인 범위</text><text x="700.0" y="394.0" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central">존재 / 부재 / 판단 불가 · 근거 위치·버전</text><polyline points="700.0,230 700.0,300" fill="none" stroke="#61758f" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="50" y="510" width="410" height="140" rx="12" fill="#e9f4ee" stroke="#bdc9d8"/><text x="255.0" y="546.0" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central">전사 공통 정책</text><text x="255.0" y="580.0" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central">법령 검토·공통 안전·권리 보호</text><text x="255.0" y="614.0" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central">동일 관찰값 + 공통 규칙</text><rect x="495" y="510" width="410" height="140" rx="12" fill="#fff3db" stroke="#bdc9d8"/><text x="700.0" y="546.0" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central">연령·노출 조건</text><text x="700.0" y="580.0" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central">성인 주제·잔혹성 등</text><text x="700.0" y="614.0" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central">금지 여부와 별도 판단</text><rect x="940" y="510" width="410" height="140" rx="12" fill="#f3f6fa" stroke="#bdc9d8"/><text x="1145.0" y="546.0" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central">서비스·품질·광고 정책</text><text x="1145.0" y="580.0" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central">추천 적합성·광고 게재 등</text><text x="1145.0" y="614.0" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central">별도 정책과 결과</text><polyline points="700,420 700,460 255,460 255,510" fill="none" stroke="#61758f" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="700,420 700,460 700,460 700,510" fill="none" stroke="#61758f" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="700,420 700,460 1145,460 1145,510" fill="none" stroke="#61758f" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="300" y="750" width="800" height="125" rx="12" fill="#eaf1fb" stroke="#bdc9d8"/><text x="700.0" y="777.5" font-size="23" font-weight="400" text-anchor="middle" dominant-baseline="central">텍스트 관찰·정책 결과 제공</text><text x="700.0" y="812.5" font-size="23" font-weight="400" text-anchor="middle" dominant-baseline="central">공통 정책 결과 / 별도 연령·서비스 결과 / 검사 범위</text><text x="700.0" y="847.5" font-size="23" font-weight="400" text-anchor="middle" dominant-baseline="central">비텍스트 검증 결과와 분리 · 실제 조치 자동 실행 없음</text><polyline points="255,650 255,700 700,700 700,750" fill="none" stroke="#61758f" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="700,650 700,700 700,700 700,750" fill="none" stroke="#61758f" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="1145,650 1145,700 700,700 700,750" fill="none" stroke="#61758f" stroke-width="2.5" marker-end="url(#arrow)"/><text x="700.0" y="954.5" font-size="19" font-weight="400" text-anchor="middle" dominant-baseline="central">기존 VL-01~13 대응 유지 + 아동 안전·자해·폭력·위험행위·사이버 악용·스팸 등의 보완</text><text x="700.0" y="985.5" font-size="19" font-weight="400" text-anchor="middle" dominant-baseline="central">경쟁 서비스 홍보 금지·단순 정치 언급·광고 부적합을 전사 공통 금지로 전용하지 않는 구조</text></g></svg>