<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1280" viewBox="0 0 1400 1280"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#61758f"/></marker></defs><rect width="1400" height="1280" fill="white"/><g font-family="Apple SD Gothic Neo, sans-serif" fill="#172b4d"><text x="700.0" y="55.0" font-size="34" font-weight="700" text-anchor="middle" dominant-baseline="central">클린 메타 · JEV 호출 구조</text><text x="700.0" y="105.0" font-size="19" font-weight="400" text-anchor="middle" dominant-baseline="central">텍스트 실험 · 논리 단계와 실제 요청 횟수의 구분</text><rect x="300" y="150" width="800" height="95" rx="12" fill="#eaf1fb" stroke="#bdc9d8"/><text x="700.0" y="180.5" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central">제목·본문 텍스트·선택 모델·프롬프트 검증</text><text x="700.0" y="214.5" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central">이미지·영상·음성은 별도 검증 · 이번 요청에 포함하지 않음</text><rect x="300" y="310" width="800" height="110" rx="12" fill="#eef5ff" stroke="#bdc9d8"/><text x="700.0" y="331.0" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central">1단계 · 공통 선별 + 필수 고위험 신호</text><text x="700.0" y="365.0" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central">초안: 정책군 15문항 + 필수 신호 6문항 = 21문항</text><text x="700.0" y="399.0" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central">단일 배치일 때 요청 1회</text><polyline points="700.0,245 700.0,310" fill="none" stroke="#61758f" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="300" y="485" width="800" height="90" rx="12" fill="#fff3db" stroke="#bdc9d8"/><text x="700.0" y="513.0" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central">관련 있음·판단 불가·기준 미달의 텍스트 신호</text><text x="700.0" y="547.0" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central">필요한 공통 관찰값과 근거만 추가 확인</text><polyline points="700.0,420 700.0,485" fill="none" stroke="#61758f" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="300" y="640" width="800" height="115" rx="12" fill="#eef5ff" stroke="#bdc9d8"/><text x="700.0" y="663.5" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central">2단계 · 조건부 상세·맥락·근거 선택</text><text x="700.0" y="697.5" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central">정책들이 요구하는 질문의 합집합 · 같은 질문 1회</text><text x="700.0" y="731.5" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central">외부 사실은 확인된 자료 필요 · 자료 부재 시 보류</text><polyline points="700.0,575 700.0,640" fill="none" stroke="#61758f" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="300" y="835" width="800" height="110" rx="12" fill="#e9f4ee" stroke="#bdc9d8"/><text x="700.0" y="856.0" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central">코드 검증 + 정책 규칙 적용</text><text x="700.0" y="890.0" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central">정책별 해당 / 비해당 / 판단 불가 · 검사 범위 별도</text><text x="700.0" y="924.0" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central">최종 판정을 위한 고정 3차 모델 호출 없음</text><polyline points="700.0,755 700.0,835" fill="none" stroke="#61758f" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="300,530 70,530 70,890 300,890" fill="none" stroke="#61758f" stroke-width="2.5" marker-end="url(#arrow)"/><text x="190.0" y="700.0" font-size="18" font-weight="400" text-anchor="middle" dominant-baseline="central">추가 확인 불필요</text><text x="190.0" y="730.0" font-size="18" font-weight="400" text-anchor="middle" dominant-baseline="central">검사 범위 충족 시</text><rect x="300" y="1010" width="800" height="85" rx="12" fill="#eaf1fb" stroke="#bdc9d8"/><text x="700.0" y="1036.0" font-size="21" font-weight="400" text-anchor="middle" dominant-baseline="central">텍스트 관찰값·정책별 후보·근거 제공</text><text x="700.0" y="1069.0" font-size="21" font-weight="400" text-anchor="middle" dominant-baseline="central">자료 미확인 시 보류 · 비텍스트 자료 미제공만으로 보류하지 않음</text><polyline points="700.0,945 700.0,1010" fill="none" stroke="#61758f" stroke-width="2.5" marker-end="url(#arrow)"/><text x="700.0" y="1169.0" font-size="20" font-weight="400" text-anchor="middle" dominant-baseline="central">선별 방식 1~3회 · 전체 질문 2회 · 요청당 100문항 · 자동 재시도 없음</text><text x="700.0" y="1201.0" font-size="20" font-weight="400" text-anchor="middle" dominant-baseline="central">JEV 문항별 원문 처리량도 비용에 포함 · 호출 수 감소만으로 비용 절감 단정 금지</text></g></svg>