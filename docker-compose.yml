# Prism 운영 서버 — Supabase 전용(상시 클라우드·ID/PW·팀 공유). docker compose up -d
# 로컬·오프라인으로 돌리려면 PRISM_BACKEND=sqlite + prism-data 볼륨(아래 주석 참고).
services:
  prism:
    build: .
    image: prism:latest
    ports:
      - "8765:8765"
    environment:
      # ── 운영 백엔드: Supabase(필수) ── 미설정/오설정이면 시작이 실패한다(조용한 로컬 폴백 없음)
      - PRISM_BACKEND=supabase
      - SUPABASE_URL=${SUPABASE_URL:-https://yujinhcdbllcnnfvcmfp.supabase.co}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY:?service_role 키 필요 (.env 또는 호스트 env)}
      # ── 추출 모델(Upstage) ──
      - UPSTAGE_API_KEY=${UPSTAGE_API_KEY:-}
      - PRISM_MODEL=${PRISM_MODEL:-solar-pro3}
    restart: unless-stopped
    # 로컬 SQLite 모드로 쓰려면 위 SUPABASE_* 제거 + PRISM_BACKEND=sqlite + 아래 볼륨 사용:
    # volumes: ["prism-data:/data"]
    # environment 에 PRISM_DB=/data/prism.db

# volumes:
#   prism-data:
